capabilities:
- name: sparse_reconstruction
  category: reconstruction
  backend: 'COLMAP 4.2.0 (subprocess: feature_extractor/exhaustive_matcher/mapper/model_converter)'
  inputs:
  - image set
  - optional intrinsics
  outputs:
  - camera poses (camera-to-world
  - wxyz quat)
  - sparse 3D points
  - registration_status
  license: BSD-3-Clause (COLMAP) — verify at binding time
  hardware_requirements: CUDA build now installed (2026-09-15, colmap/colmap release
    4.2.0 colmap-x64-windows-cuda.zip; RTX 4050, driver 616.56 verified via nvidia-smi);
    GPU feature extraction confirmed genuinely working (SIFT GPU extractor ran on
    synthetic images). Old CPU-only build kept at colmap-extracted-nocuda-backup.
  accuracy: not measured formally; observed 25/28 cameras on room capture (measured
    on the prior CPU build; not re-run on CUDA build yet)
  runtime: observed ~23 s on 4 images (CPU build; CUDA build not yet timed)
  maturity: IMPLEMENTED
  limitations:
  - one 4-image scene + one room capture exercised, not a stress test
  - CUDA build's sparse pipeline not yet re-run end-to-end (only GPU feature extraction
    smoke-tested)
  fallback: deterministic fake backend (REALITY_TEST_BACKEND, tests only — never production)
- name: metric_scale_anchoring
  category: reconstruction
  backend: reconstruction/scale.py (in-house, measured-baseline math)
  inputs:
  - reconstruction
  - ScaleReference (measured camera baseline)
  outputs:
  - scaled result in meters
  - scale_state
  - meters_per_unit
  - diagnostics
  license: project-internal
  hardware_requirements: none
  accuracy: exact for the anchor pair (ratio); rigidity gate guards degenerate pairs
  runtime: negligible
  maturity: IMPLEMENTED
  limitations: single-baseline scale; no multi-baseline least squares yet
  fallback: honest RELATIVE state (never invented scale)
- name: monocular_depth
  category: depth
  backend: MiDaS DPT_Hybrid via torch.hub (perception/depth/midAS_backend.py)
  inputs:
  - evidence items (photos/frames)
  outputs:
  - relative DepthMap per view
  license: MiDaS Apache-2.0; torch BSD-style — verify at binding time
  hardware_requirements: CPU works (slow); CUDA better; weights download on first
    use
  accuracy: relative only — metricized per-view against sparse cloud (documented approximation,
    residual reported)
  runtime: model-load dominated; seconds per view CPU
  maturity: IMPLEMENTED
  limitations:
  - torch-hub network/cache fragility (env)
  - relative depth, never metric until alignment
  fallback: RGB-D sidecar path when the capture carries device depth; honest skip
    otherwise
- name: depth_sidecar_ingestion
  category: evidence
  backend: evidence/depth_frames.py (Pillow-based 16-bit PNG decoder)
  inputs:
  - depth/*.png
  - depth/manifest.json (depth_scale
  - invalid_value
  - units)
  outputs:
  - DepthFrame (raw + explicit scale)
  - meters via iter_meters/meters_at
  license: project-internal (Pillow HPND-style license — verify at binding time)
  hardware_requirements: none
  accuracy: exact to device depth; scale inherited from manifest
  runtime: negligible
  maturity: IMPLEMENTED
  limitations:
  - 16-bit PNG only (Decision 020 ladder); EXR and device-raw are open adapters
  - requires explicit depth_scale — refuses otherwise (by design)
  fallback: none by design (DepthScaleUnavailable is the honest refusal)
- name: rgbd_dense_unprojection
  category: dense_geometry
  backend: engine/pipeline/vertical_slice.py::_sidecar_depth_stage + reconstruction/depth_to_points.py
  inputs:
  - DepthFrames
  - registered cameras
  - trusted intrinsics
  - METRIC scale state
  outputs:
  - device-metric dense points ('depth-' track ids)
  - per-view facts
  license: project-internal
  hardware_requirements: none
  accuracy: exact camera math (PinholeCamera unproject); verified on synthetic wall
    at z=2.0 m
  runtime: negligible at test scale
  maturity: IMPLEMENTED (synthetic-verified; real-device capture is the VERIFIED gate)
  limitations:
  - requires METRIC-anchored world (scale coherence gate)
  - frame matching by filename stem
  fallback: MiDaS relative-depth path; honest skip in RELATIVE worlds
- name: depth_fusion_monocular
  category: dense_geometry
  backend: reconstruction/depth_to_points.py metricize_all + reconstruction/fusion/
  inputs:
  - relative depth maps
  - sparse cloud
  - intrinsics
  - poses
  outputs:
  - fused metric point cloud (metric-by-alignment)
  license: project-internal
  hardware_requirements: none
  accuracy: residual_median_m + inlier_fraction reported per view; not benchmarked
  runtime: observed 121k-point fused cloud from room capture
  maturity: IMPLEMENTED
  limitations: per-view scale fit (not global optimization); camera-envelope filter
    required for depth outliers
  fallback: sparse-only world (mesh stage skips honestly)
- name: surface_reconstruction
  category: meshing
  backend: COLMAP poisson_mesher (subprocess) via reconstruction/meshing/surface.py
  inputs:
  - oriented point cloud (scipy PCA normals
  - camera-oriented)
  outputs:
  - MeshData (vertices/faces)
  - artifact via ArtifactStore
  license: BSD-3-Clause (COLMAP) — verify at binding time
  hardware_requirements: CPU
  accuracy: not measured formally; observed 240,735 verts / 482,142 faces on room
    capture
  runtime: observed 1.6 s for 40k points (depth-adaptive, trim retry)
  maturity: IMPLEMENTED
  limitations:
  - Poisson depth bounded by point density (auto-retry logic)
  - trim defaults to 0 (dense-cloud trim=10 empties sparse clouds)
  fallback: honest skip with reason (never a placeholder mesh; AABB fallback only
    in viewer, labeled)
- name: mesh_quality_validation
  category: meshing
  backend: reconstruction/meshing/validation.py (pure-python measured counts)
  inputs:
  - MeshData
  - optional declared expected_extent_m + scale_tolerance
  outputs:
  - MeshQualityReport (degenerate/non-manifold/bad-normal/hole/component counts
  - self-intersection proxy candidates
  - extent
  - per-axis scale ratios + verdict)
  license: project-internal
  hardware_requirements: CPU (O(n^2) bbox-overlap proxy; BVH noted if meshes grow)
  accuracy: measured counts, deterministic; scale check is declared-expectation only
  runtime: sub-second on validation-sized meshes
  maturity: IMPLEMENTED — bad-scale check landed 2026-09-15; report recorded into
    Geometry.quality_metrics at mesh-stage export time (vertical_slice seam)
  limitations:
  - self-intersection is a documented bbox-overlap PROXY (necessary-not-sufficient)
  - scale verdict requires a caller-declared expected extent; never inferred
  - validation measures only; mesh REPAIR out of scope by design
  fallback: report is always computable; absent expectation -> scale fields None (honest
    absence)
- name: reconstruction_cross_validation
  category: reconstruction
  backend: reconstruction/validation.py (cKDTree-indexed nearest-point match)
  inputs:
  - ReconstructionResult
  - ReconstructionResult
  - distance_threshold_m
  outputs:
  - ValidationReport (agreements
  - PointDisagreement list
  - unmatched_a/b)
  license: project-internal
  hardware_requirements: CPU (scipy cKDTree; same dependency as consistency/fusion/quality)
  accuracy: exact nearest-neighbor matching, deterministic; semantics pinned by a
    brute-force oracle test on shuffled non-trivial data (agreement ordering, b-side
    consumption on disagreement, unmatched_b track_id set-collapse)
  runtime: 60k-vs-60k point validation completes in seconds (was O(N*M) pure-python,
    >300s killed at that scale); bounded-time test enforces the gate
  maturity: IMPLEMENTED — large-set scale gate landed 2026-09-19 (large image-set
    robustness, mission priority P1); report semantics unchanged for callers (evidence/promote_reconstruction.py
    consumes it unchanged)
  limitations:
  - exact-tie nearest candidates resolve deterministically but may differ from a naive
    first-min scan (documented; report stays deterministic either way)
  - validates POINT sets only; pose Trajectory comparison is a separate concern
  fallback: empty-b short-circuit reports all of a as unmatched_a (unchanged semantics)
- name: dense_mvs
  category: dense_geometry
  backend: 'CUDA COLMAP (colmap/colmap release 4.2.0, colmap-x64-windows-cuda.zip).
    PYTHON-INTEGRATED 2026-09-21: reconstruction/dense_pipeline.run_dense_mvs runs the
    canonical chain (image_undistorter -> patch_match_stereo -> stereo_fusion) as a
    deterministic stage; ColmapReconstructionBackend(dense_mvs=True) continues its own
    sparse model IN THE SAME WORKSPACE and attaches the parsed fused cloud + observed
    facts to ReconstructionResult.dense_points/dense_report. The cloud is ingested
    through reconstruction/dense_ingest.ingest_fused_ply into the content-addressed
    ArtifactStore -> canonical WorldIR POINTCLOUD geometry with dense provenance
    (never an orphaned artifact). CLI-drift discipline: each dense stage''s --help is
    PROBED and only accepted options are passed (the installed 4.2 build rejects
    --PatchMatchStereo.use_gpu and uses bare --input_type/--output_path); what was
    applied is recorded (gpu_flag_applied). Real GPU run on the committed 32-photo
    south-building dataset recorded 2026-09-21 (see datasets/south_building/runs/).
    OpenMVS slot still open.'
  inputs:
  - calibrated images (or the backend''s own ingested evidence)
  - poses (the mapper''s sparse model — produced in-run when dense_mvs=True)
  - intrinsics
  outputs:
  - dense depth maps per view
  - fused point cloud parsed into canonical ReconstructedPoints (track ids
    dense:<i>, provenance = registered evidence ids)
  - persisted WorldIR POINTCLOUD geometry (content-addressed artifact + hash)
  license: n/a until a backend binds
  hardware_requirements: RTX 4050 present and CUDA-capable (compute 8.9, driver 616.56)
    — previously believed unavailable; that was a software-build gap (CPU-only COLMAP),
    not a hardware gap. Resolved and exercised.
  accuracy: not measured against ground truth; output geometry is coherent (tight
    point-cloud mean/std, real sampled texture colors) but in COLMAP's own uncalibrated
    SfM scale, not yet metric-anchored
  runtime: ~6.9 min patch_match_stereo (GPU, geom_consistency on) + ~6s stereo_fusion,
    17 views, RTX 4050 laptop GPU
  maturity: IMPLEMENTED (Python-integrated dense chain + canonical ingestion, real
    GPU runs on synthetic room 2026-09-15 and committed real photos 2026-09-21; see
    docs/future/dense-reconstruction/DENSE_MVS.md)
  limitations: scale not metric-anchored in these runs (COLMAP SfM scale, recorded
    honestly); dense coverage bounded by patch_match's texture dependence; CLI drift
    handled by probing, not version pinning
  fallback: monocular depth + RGB-D sidecars (labeled as such, never passed off as
    MVS)
- name: object_detection
  category: perception
  backend: torchvision Mask R-CNN (perception/detection/maskrcnn_backend.py)
  inputs:
  - evidence items
  outputs:
  - per-view instance masks + scores
  license: torchvision BSD-style; weights per torchvision docs — verify at binding
    time
  hardware_requirements: CPU works; weights download on first use
  accuracy: not measured (score threshold 0.5 default)
  runtime: seconds per view CPU
  maturity: IMPLEMENTED
  limitations: weights acquisition needed; 2D only — 3D lift needs metric depth
  fallback: honest skip (perception stage refuses without metric depth)
- name: image_segmentation
  category: perception
  backend: SAM via segment-anything pip package (sam_model_registry) + checkpoint
    file
  inputs:
  - images
  - prompt boxes/masks
  outputs:
  - masks
  license: SAM Apache-2.0 — verify at binding time
  hardware_requirements: CPU/GPU; checkpoint download (~375 MB for vit_b)
  accuracy: not measured in-repo
  runtime: real-model load + inference verified on CPU (vit_b, 320x240, ~90 s with
    points_per_side=32)
  maturity: IMPLEMENTED — real-model integration test passes; torch.hub.load("facebookresearch/segment-anything")
    removed (upstream repo has no hubconf.py — 0 commits touching it — so source="github"
    loads were structurally broken)
  limitations: checkpoint resolved in order explicit path -> torch-hub cache -> direct
    download; offline environments must pre-cache weights; confidence clamped at conversion
    boundary because SAM's predicted_iou can exceed 1.0 by float round-off
  fallback: Mask R-CNN detection path
- name: calibration_frames
  category: calibration
  backend: reconstruction/calibration/transforms.py (RigidTransform + CalibrationChain
    + SensorRig + WGS84/ENU conversions + reprojection_residual_stats; rotation math
    = engine.physics.math3, camera types reused verbatim)
  inputs:
  - declared rig transforms (sensor frame -> rig frame)
  - GNSS anchor (geodetic reference)
  - camera + (world point
  - observed pixel) observations
  outputs:
  - frame-validated transform chains
  - geodetic<->ECEF<->ENU points
  - per-camera pixel residual stats
  license: project-internal
  hardware_requirements: none
  accuracy: exact known-answer math (sub-mm geodetic roundtrip; pixel stats are measured
    facts of the given observations; ENU triad proven orthonormal)
  runtime: negligible
  maturity: IMPLEMENTED (P2-02; 45 tests in tests/test_calibration_transforms.py;
    ENU matrix bug caught by known-answer test and fixed, triad structurally proven)
  limitations:
  - declared/assumed calibration only -- no estimation (fit) procedures yet
  - height is ellipsoidal; geoid separation models are a caller concern (recorded,
    not modeled)
  - no real-device calibration evidence yet (synthetic known answers only)
  fallback: absent calibration is recorded as absent (rig members without a pose raise
    on chain requests, never guess); unprojectable points counted, never given fabricated
    residuals
- name: time_synchronization
  category: temporal
  backend: 'evidence/clocks.py (in-house linear clock model; preference-ordered backend
    registry: metadata_alignment, gnss_pps, trigger, signal_correlation, optimization)

    '
  inputs:
  - SensorStream
  - clock_id
  - capture metadata (shared_clock / clock_offset_s / clock_drift / gnss_anchor_pairs
    / trigger_pairs / reference+observed event trains / cross_stream_constraints)
  outputs:
  - TimeAlignment (per-sample original_t + global_t)
  - SynchronizationDiagnostics (measured residual_max_s
  - backend attempts
  - rejection notes)
  - ClockModel
  consumers: 'trajectories/backend/sync.py (apply_clock_model + estimate_trajectory:
    canonical Trajectory stamps carry clock_id/sync_state/sync_method; model_unit
    is explicit -- ''s'' for stream-fitted models, ''ns'' canonical)'
  license: project-internal
  hardware_requirements: none (GNSS/PPS consumed from declared anchors or already-GNSS-time
    streams; no timing hardware required)
  accuracy: exact for the declared model; estimated methods carry measured max-correspondence-residual
    as estimate quality (construction-only methods report None, never a fabricated
    zero)
  runtime: negligible (correlation grid is O(drifts x offsets x events))
  maturity: IMPLEMENTED (P2-01 complete; all six spec methods with deterministic known-answer
    fixtures; 56 tests in tests/test_clocks.py); consumers wired via trajectories/backend/sync.py,
    16 tests in tests/test_sync_consumers.py
  limitations:
  - estimated methods require trusted correspondences from metadata or the stream
    itself; none are inferred from raw signal content (e.g. no audio waveform correlation
    yet)
  - clock identity resolves from declared sensor identity when present (P1-02), else
    caller-supplied
  fallback: honest UNSYNCHRONIZED samples with reasons (never a guessed offset); correlation
    declines unless alignment meets an event-spacing plausibility gate
- name: sensor_identity
  category: evidence
  backend: evidence/sensors.py (SensorDescriptor + load_sensor_identity + attach_sensor_identities;
    <component>/sensor_identity.json sidecar)
  inputs:
  - capture component directory
  - optional sensor_identity.json
  outputs:
  - SensorDescriptor attached to SensorStream/samples/CalibrationRecord/DepthFrame
    (sensor_id
  - source_id
  - capture_id
  - clock_id
  - frame
  - coordinate_system
  - units
  - quality
  - intrinsics
  - extrinsics
  - provenance)
  license: project-internal
  hardware_requirements: none
  accuracy: exact for what is declared; absent fields recorded as None (never defaulted,
    never inferred from contents)
  runtime: negligible (one JSON file per component)
  maturity: IMPLEMENTED (P1-02; 22 tests in tests/test_sensor_identity.py; attachment
    wired through MultiSourceSession sensor_streams/calibrations/depth_frames; clock_id
    feeds evidence.clocks)
  limitations:
  - declared metadata only -- quality is what the capture declared, not measured diagnostics
  - no real-device capture with a sensor_identity.json exercised yet (synthetic fixtures
    only)
  fallback: identity None (undeclared) -- evidence stays parseable; no identity is
    ever guessed
- name: vio_localization
  category: localization
  backend: ORB-SLAM3 / OpenVINS / Basalt subprocess adapters bound behind trajectories.backend.ITrajectoryBackend
    (P3-02); none of the three binaries are installed on this machine (verified via
    shutil.which), so estimate() honestly raises TrajectoryBackendUnavailableError
    -- no real VIO run has been exercised yet
  inputs:
  - image directory or video
  - optional IMU log
  - caller-supplied argv (tool CLIs are build-specific
  - not guessed)
  outputs:
  - Trajectory (P3-01): TrajectoryFrame sequence
  - monotonic global-ns timestamps
  - frame_source
  - drift_estimate
  license: GPL-3.0 (ORB-SLAM3), GPL-3.0-with-exceptions (OpenVINS, verify), AGPL-3.0
    (Basalt, verify) — all subprocess-only, recorded in LICENSES.yaml federation_candidates;
    nothing vendored/linked
  hardware_requirements: backend-dependent (none installed here)
  accuracy: not measured — no real backend run yet
  runtime: n/a
  maturity: PARTIAL (P3-02; adapter interface + TUM-format parser + try-in-order selection
    landed, 21 tests in tests/test_trajectory_backend.py, including a real subprocess
    adapter-contract test against a fake binary; real backend run when a binary is
    present is the named VERIFIED gate, per spec)
  limitations: no VIO binary installed on this machine; exact CLI invocation is left
    to the caller (options["command"]) since none of the three tools expose one stable
    CLI across builds
  fallback: per-session SfM camera poses (labeled per-session, not a continuous trajectory)
- name: provenance_graph
  category: provenance
  backend: 'provenance.graph: ProvenanceGraph over the content-addressed ArtifactStore
    (nodes keyed by sha256 digest, derived_from edges added-only, cycle-rejecting)'
  inputs:
  - artifact digests from any ArtifactStore backend (memory/file)
  outputs:
  - parents/children/ancestors/descendants walks
  - why_exists stage chain
  - verify_all tamper report
  - tombstones
  license: project-internal
  hardware_requirements: none
  accuracy: exact (digest equality is content equality)
  runtime: linear in graph size per walk; verify_all is O(nodes) store reads
  maturity: IMPLEMENTED (P10-01; 11 tests on a compiled-style fixture; CLI `reality
    provenance` surface remains with the commands layer)
  limitations: CLI query command not yet exposed; cross-session lineage (multi-store)
    not yet joined
  fallback: absent graph = per-artifact provenance records still stand
- name: cross_source_registration
  category: registration
  backend: 'registration.registration: point-to-plane ICP (spec''s named algorithm;
    caller-supplied normals, 6-DOF linearized solve) + point-to-point ICP + translation-only
    GNSS anchors, orchestrated by RegistrationEngine (confidence-ordered, every attempt
    recorded)'
  inputs:
  - two point-cloud Vec3 lists (+ optional caller-supplied normals)
  - or paired anchor position lists
  - optional prior RigidTransform
  outputs:
  - RegistrationResult: RigidTransform or None
  - status accepted/blocked+reason
  - rmse
  - inlier_fraction
  - ResidualStats (measured median/p95/max/rmse)
  - per-method AttemptRecord trail
  license: n/a (numpy/scipy, already-declared runtime deps)
  hardware_requirements: none
  accuracy: exact recovery on synthetic known-offset fixtures (trihedral-corner scenes)
    within cloud-scale offsets (tests/test_registration.py); real multi-source capture
    not exercised
  runtime: not measured
  maturity: 'IMPLEMENTED (P4-01 complete: engine orchestration, point-to-plane ICP,
    contact pre-flight, prior seeding; residual stats recorded; covariance propagation
    and the landmark/correspondence method remain PENDING in the ledger)

    '
  limitations: covariance not yet propagated (residual stats are); landmark method
    needs a cross-source co-observation resolver (P7-01); no orchestration wiring
    into world compilation yet; ICP remains a local optimizer (prior/contact gate
    refuses guesses)
  fallback: none -- separate worlds stay separate and labeled
- name: world_compilation
  category: worldir
  backend: engine/compiler/world_compiler.py + engine/pipeline/vertical_slice.py
  inputs:
  - ReconstructionResult
  - options
  - ArtifactStore
  outputs:
  - WorldIR v1 (entities/measurements/metadata)
  - compile diagnostics
  license: project-internal
  hardware_requirements: none
  accuracy: validation gate enforced (validate_world_ir)
  runtime: negligible at test scale
  maturity: IMPLEMENTED
  limitations: v1 schema (topology/temporal history/representations open — P9-01)
  fallback: none (compile failure fails loudly)
- name: artifact_storage
  category: persistence
  backend: world_ir/artifact_store.py (content-addressed sha256)
  inputs:
  - bytes
  outputs:
  - data_uri
  - data_hash
  license: project-internal
  hardware_requirements: none
  accuracy: hash-exact
  runtime: negligible
  maturity: IMPLEMENTED
  limitations: local filesystem; no remote object storage yet (WorldStore P11-01)
  fallback: none
- name: export_gltf
  category: compilers
  backend: exporters/gltf/exporter.py
  inputs:
  - WorldIR + resolvable artifacts
  outputs:
  - glTF 2.0 (TRIANGLES mesh
  - POINTS entities)
  license: project-internal (glTF spec, royalty-free)
  hardware_requirements: none
  accuracy: verified on real 240k-vertex mesh (uint32 indices)
  runtime: negligible at test scale
  maturity: IMPLEMENTED
  limitations: material/texture export minimal
