- name: one_command_compile
  category: product
  backend: apps/cli/main.py `reality compile` (also scripts/run_vertical_slice.py)
  inputs:
  - capture dataset directory
  outputs:
  - worldir.json
  - points.ply
  - cameras.json
  - exports/
  - report.json
  license: project-internal
  hardware_requirements: backend-dependent (COLMAP for real runs)
  accuracy: inherits stages; report.json records every stage's honest status
  runtime: COLMAP-dominated on real captures
  maturity: IMPLEMENTED
  limitations: orchestrator->compile only; session/source management CLI open
  fallback: deterministic backend injection (REALITY_TEST_BACKEND) for offline tests
- name: world_store
  category: persistence
  backend: 'worldstore.store: filesystem-backed versioned store (WorldStore)'
  maturity: IMPLEMENTED
  notes: Content-addressed ArtifactStore underneath; save_world persists an immutable
    snapshot + metadata (parents, message); load_world restores any version; versions()/parents()/ancestors()
    expose the DAG; list() preserves save order. Observed reality is recoverable across
    process restarts.
  tests: tests/test_world_store.py
- name: incremental_compilation
  category: engine
  backend: 'engine.incremental: dependency-graph invalidation compiler'
  maturity: IMPLEMENTED
  notes: Stages declare dependencies; compiler re-runs ONLY stages whose transitive
    inputs changed (content hashes), preserves unaffected artifacts across versions,
    detects cycles at registration, and resumes from a prior CompilationState.
  tests: tests/test_incremental.py
- name: uncertainty_propagation
  category: uncertainty
  backend: 'perception.instances.measurement: measured-spread precision; registration.registration:
    6-DOF covariance'
  maturity: IMPLEMENTED
  notes: 'Measurements carry precision from MEASURED inter-view disagreement (RMS
    spread, leave-one-out 5-sigma conflict detection, n=2 honestly undecidable, single-view
    falls back to the documented heuristic -- every measurement names its precision
    source via precision_note). ICP results carry 6x6 covariance from correspondences.
    Fusion precision is inverse-variance (existing). EXPANSION 2026-09-16 (P10-02):
    uncertainty/ package — Uncertain scalar (value/sigma/basis; sigma=None honest
    unknown, never zero) and first-order propagation operators (sum/difference/scale,
    J Sigma J^T linear, R Sigma R^T point transform, 6x6 pose composition via central-difference
    Jacobians of the exact RigidTransform.compose). UNKNOWN propagates as UNKNOWN
    through every operator. COMPLETION 2026-09-18: the module now carries BOTH halves
    -- the numeric-Jacobian operators above PLUS the analytic per-point chain (Covariance3,
    depth_to_world_covariance, propagate_point_through_pose, propagate_chain): closed-form
    Jacobians for depth -> unprojection -> pose verified against finite differences
    of the REAL PinholeCamera model; directional rotation levers; partial calibration
    yields UNKNOWN naming the missing stage; the pinhole-only analytic path REFUSES
    distorted cameras; sigma is never collapsed into confidence.'
  tests: tests/test_object_measurement.py, tests/test_registration.py, tests/test_uncertainty_propagation.py
- name: room_building_graph
  category: perception
  backend: 'perception.architecture.room_graph: build_room_graph / build_building_graph'
  inputs:
  - classify_planes output (plane evidence with inliers)
  outputs: RoomGraph (rooms as floor+ceiling+walls with measured dimensions, doorway
    openings, adjacency via shared walls) and BuildingGraph (storeys grouped by ceiling
