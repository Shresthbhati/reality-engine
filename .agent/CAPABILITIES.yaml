- name: city_evidence_ingestion_boundary
  category: evidence
  backend: evidence/city_import.py import_osm_xml + import_geojson (canonical EvidenceAssets
    kind=OTHER, provenance OBSERVED, content-hash dedup, CorruptEvidenceError on malformed
    input, unresolved node refs recorded)
  inputs:
  - OSM XML extract
  - GeoJSON FeatureCollection/Feature
  outputs:
  - one asset per OSM way / GeoJSON feature with verbatim geometry, tags/properties,
    element ids; node-collection asset
  status: DONE
  verification: tests/test_city_import.py 9/9 on the committed REAL OSM fixture (datasets/city_osm/south_building_campus.osm,
    733 nodes / 137 ways, ODbL)
  limitations:
  - no OSM API fetcher (fixture + acquisition recipe in MANIFEST.json)
  - no reprojection (geometry verbatim by design)
- name: adaptive_detail_subdivision
  category: perception/detail
  backend: perception/detail/subdivision.py subdivide_adaptive (measured score from
    the shared PCA eigensolver + optional caller importance; density as support gate;
    bounded max_cells; deterministic highest-score-first frontier; machine-readable
    stop reasons)
  inputs:
  - point region (Vec3/tuples)
  - threshold/depth/min_points/max_cells
  - optional importance_fn
  outputs:
  - 'SubdivisionReport: per-cell measured score, depth, stop reason; work accounting'
  status: DONE
  verification: tests/test_detail_subdivision.py 9/9 including REAL south-building
    sparse points (all scores finite, work bounded)
  limitations:
  - importance defaults to 0 (no fabricated semantics)
  - score components measured per cell at visit time
- name: production_pipeline_measurement
  category: benchmarks
  backend: benchmarks/pipeline_measurement.py (per-stage tracemalloc + runtime over
    the REAL dataset through run_batch with REAL COLMAP; BACKEND_UNAVAILABLE recorded
    honestly when absent)
  inputs:
  - datasets/south_building/images (committed REAL photos)
  - datasets/city_osm (REAL OSM fixture)
  outputs:
  - measured record JSON in datasets/south_building/runs/
  status: DONE
  verification: 'pipeline_measurement_20260920T104919.json: ingest 0.82s/7.5MB; admission
    30 accepted/2 degraded (measured clipping); REAL COLMAP 24.3s/20.3MB 32 frames
    -> 4446 points, partial/degraded honest; uncertainty mean 0.827 min 0.2506; city
    137 features'
  limitations:
  - single-session dataset (cross-session registration measured in unit tests with
    the ring double)
