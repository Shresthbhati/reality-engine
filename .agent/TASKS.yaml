      check is implemented as a DECLARED-expectation measurement --
      validate_mesh(expected_extent_m=..., scale_tolerance=...) computes
      per-axis measured/expected ratios plus scale_within_tolerance and
      records the tolerance actually used (same reproducibility
      discipline as degenerate_area_eps); it never infers scale when no
      expectation is declared and never converts units silently.
      Known-answer tests cover half-scale (0.5), mm-vs-m mixup (1000),
      per-axis failure, custom tolerance, dict roundtrip, and loud
      rejection of invalid expectations. Quality metrics are recorded at
      export time: the mesh stage (engine/pipeline/vertical_slice.py)
      computes the report at production time and stores it on the WorldIR
      Geometry's new additive quality_metrics field (world_ir/schema_v1.py,
      v1-dict compatible like Entity.statement_state) -- metadata for the
      content-addressed artifact, queryable without decoding the PLY.
    verification: ['DONE: validation test matrix on known-bad meshes (16 tests incl. 8 bad-scale)', 'DONE: quality metrics recorded at export into Geometry.quality_metrics (vertical_slice seam; meshing-pipeline tests green)', 'DONE: additive-field compat: default None, roundtrip, v1 dict without the key loads unchanged']
