      across randomized worlds and multiple chunk_size choices
      (tests/test_spatial_index_grid_correctness.py) -- this caught
      two real bugs during development: (1) grid-cell enumeration for
      a query box was combinatorial in box_size/chunk_size, not
      bounded by populated cells, causing catastrophic blowup when
      chunk_size is small relative to the query radius (fixed by
      _chunks_in_box() filtering only populated chunks -- also applied
      to SpatialTiling.query_region, which had the same latent bug);
      (2) nearest()'s "fewer than k candidates" early-return fired on
      exactly k candidates before their completeness was proven,
      returning a wrong k-th neighbor. engine/scene_graph/
      spatial_common.py holds the shared grid/geometry primitives both
      modules now depend on (avoids the circular import SpatialIndex
      calling into SpatialTiling would otherwise create).
