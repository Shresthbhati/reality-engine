# Reality Engine — Canonical Task Queue

ROADMAP_VERSION: "RE-2026-CORE-V1"
RATIFIED: 2026-09-15

# THE work queue (constitution Article II/VI). Order is priority:
# consume top-down; do not reorder; finish one, start the next.
# Statuses: NOW | NEXT | PARTIAL | MISSING | BLOCKED | DONE (with evidence).
# Every DONE needs the named verification to have actually run
# (constitution Article IV).

north_star:
  name: "Reality Compiler + WorldOS"
  objective: >
    Convert heterogeneous real-world evidence into a persistent,
    evidence-backed, semantically rich, uncertain, provenance-aware
    world representation that can be incrementally updated and
    compiled into BIM, GIS, robotics, simulation, procedural worlds,
    and real-time engines.

rules:
  strategic_priority_is_authoritative: true
  continue_after_task: true
  verify_before_complete: true
  use_specialist_backends: true
  do_not_reimplement_without_reason: true
  disaster_is_not_core: true

