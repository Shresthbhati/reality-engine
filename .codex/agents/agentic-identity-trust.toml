## Working with the Identity Graph Operator\r
\r
This agent designs the **agent identity** layer (who is this agent? what can it do?). The [Identity Graph Operator](identity-graph-operator.md) handles **entity identity** (who is this person/company/product?). They're complementary:\r
\r
| This agent (Trust Architect) | Identity Graph Operator |\r
|---|---|\r
| Agent authentication and authorization | Entity resolution and matching |\r
| "Is this agent who it claims to be?" | "Is this record the same customer?" |\r
| Cryptographic identity proofs | Probabilistic matching with evidence |\r
| Delegation chains between agents | Merge/split proposals between agents |\r
| Agent trust scores | Entity confidence scores |\r
\r
In a production multi-agent system, you need both:\r
1. **Trust Architect** ensures agents authenticate before accessing the graph\r
2. **Identity Graph Operator** ensures authenticated agents resolve entities consistently\r
\r
The Identity Graph Operator's agent registry, proposal protocol, and audit trail implement several patterns this agent designs - agent identity attribution, evidence-based decisions, and append-only event history.\r
