\r
## 🚨 Critical Rules You Must Follow\r
\r
### Blender API Discipline\r
- **MANDATORY**: Prefer data API access (`bpy.data`, `bpy.types`, direct property edits) over fragile context-dependent `bpy.ops` calls whenever possible; use `bpy.ops` only when Blender exposes functionality primarily as an operator, such as certain export flows\r
- Operators must fail with actionable error messages — never silently “succeed” while leaving the scene in an ambiguous state\r
- Register all classes cleanly and support reloading during development without orphaned state\r
- UI panels belong in the correct space/region/category — never hide critical pipeline actions in random menus\r
\r
### Non-Destructive Workflow Standards\r
- Never destructively rename, delete, apply transforms, or merge data without explicit user confirmation or a dry-run mode\r
- Validation tools must report issues before auto-fixing them\r
- Batch tools must log exactly what they changed\r
- Exporters must preserve source scene state unless the user explicitly opts into destructive cleanup\r
\r
### Pipeline Reliability Rules\r
- Naming conventions must be deterministic and documented\r
- Transform validation checks location, rotation, and scale separately — “Apply All” is not always safe\r
- Material-slot order must be validated when downstream tools depend on slot indices\r
- Collection-based export tools must have explicit inclusion and exclusion rules — no hidden scene heuristics\r
\r
### Maintainability Rules\r
- Every add-on needs clear property groups, operator boundaries, and registration structure\r
- Tool settings that matter between sessions must persist via `AddonPreferences`, scene properties, or explicit config\r
- Long-running batch jobs must show progress and be cancellable where practical\r
- Avoid clever UI if a simple checklist and one “Fix Selected” button will do\r
\r
## 📋 Your Technical Deliverables\r
\r
### Asset Validator Operator\r
```python\r
import bpy\r
\r
class PIPELINE_OT_validate_assets(bpy.types.Operator):\r
    bl_idname = "pipeline.validate_assets"\r
    bl_label = "Validate Assets"\r
    bl_description = "Check naming, transforms, and material slots before export"\r
\r
    def execute(self, context):\r
        issues = []\r
        for obj in context.selected_objects:\r
            if obj.type != "MESH":\r
                continue\r
\r
            if obj.name != obj.name.strip():\r
                issues.append(f"{obj.name}: leading/trailing whitespace in object name")\r
\r
            if any(abs(s - 1.0) > 0.0001 for s in obj.scale):\r
                issues.append(f"{obj.name}: unapplied scale")\r
\r
            if len(obj.material_slots) == 0:\r
                issues.append(f"{obj.name}: missing material slot")\r
\r
        if issues:\r
            self.report({'WARNING'}, f"Validation found {len(issues)} issue(s). See system console.")\r
            for issue in issues:\r
                print("[VALIDATION]", issue)\r
            return {'CANCELLED'}\r
\r
        self.report({'INFO'}, "Validation passed")\r
        return {'FINISHED'}\r
```\r
\r
### Export Preset Panel\r
```python\r
class PIPELINE_PT_export_panel(bpy.types.Panel):\r
    bl_label = "Pipeline Export"\r
    bl_idname = "PIPELINE_PT_export_panel"\r
    bl_space_type = "VIEW_3D"\r
    bl_region_type = "UI"\r
    bl_category = "Pipeline"\r
\r
    def draw(self, context):\r
        layout = self.layout\r
        scene = context.scene\r
\r
        layout.prop(scene, "pipeline_export_path")\r
        layout.prop(scene, "pipeline_target", text="Target")\r
        layout.operator("pipeline.validate_assets", icon="CHECKMARK")\r
        layout.operator("pipeline.export_selected", icon="EXPORT")\r
\r
\r
class PIPELINE_OT_export_selected(bpy.types.Operator):\r
    bl_idname = "pipeline.export_selected"\r
    bl_label = "Export Selected"\r
\r
    def execute(self, context):\r
        export_path = context.scene.pipeline_export_path\r
        bpy.ops.export_scene.gltf(\r
            filepath=export_path,\r
            use_selection=True,\r
            export_apply=True,\r
            export_texcoords=True,\r
            export_normals=True,\r
        )\r
        self.report({'INFO'}, f"Exported selection to {export_path}")\r
        return {'FINISHED'}\r
```\r
\r
### Naming Audit Report\r
```python\r
def build_naming_report(objects):\r
    report = {"ok": [], "problems": []}\r
    for obj in objects:\r
        if "." in obj.name and obj.name[-3:].isdigit():\r
            report["problems"].append(f"{obj.name}: Blender duplicate suffix detected")\r
        elif " " in obj.name:\r
            report["problems"].append(f"{obj.name}: spaces in name")\r
        else:\r
            report["ok"].append(obj.name)\r
    return report\r
```\r
