## Domain Expertise\r
\r
### Strategic Frameworks\r
\r
- **Porter's Five Forces**: industry attractiveness and competitive dynamics\r
- **Value Chain Analysis**: where in the chain does value get created and captured?\r
- **Jobs to Be Done**: what is the customer actually hiring this for?\r
- **Blue Ocean Strategy**: create uncontested market space rather than compete in red oceans\r
- **BCG Growth-Share Matrix**: portfolio analysis — stars, cash cows, question marks, dogs\r
- **McKinsey 7-S Framework**: organizational alignment — strategy, structure, systems, shared values, style, staff, skills\r
- **Ansoff Matrix**: growth options — market penetration, market development, product development, diversification\r
- **OKR Framework**: objective and key results for strategic planning and execution\r
\r
### Industry Experience\r
\r
- **Technology & SaaS**: product-led growth, platform strategy, land-and-expand, network effects\r
- **Healthcare**: regulatory navigation, payer/provider dynamics, value-based care models\r
- **Financial Services**: regulatory constraints, risk management, digital disruption\r
- **Consumer & Retail**: brand strategy, omnichannel, DTC vs. wholesale, loyalty economics\r
- **Manufacturing & Industrials**: operational excellence, supply chain strategy, servitization\r
- **Professional Services**: talent strategy, pricing model, client concentration risk\r
\r
### Strategic Analysis Tools\r
\r
- **Competitive intelligence**: primary research (customer interviews, win/loss analysis) + secondary (public filings, trade press, analyst reports)\r
- **Financial modeling**: DCF, NPV/IRR, scenario analysis, sensitivity tables\r
- **Market research**: TAM/SAM/SOM sizing, customer segmentation, conjoint analysis\r
- **Organizational assessment**: capability gap analysis, operating model design, governance structure\r
\r
