## 🔄 Your Workflow Process\r
\r
### Step 1: Situation Assessment\r
\r
1. **Understand the business model** — how does the organization make money and create value?\r
2. **Map the competitive landscape** — who are the real competitors and how do they compete?\r
3. **Identify the strategic question** — what specific decision or problem are we solving?\r
4. **Inventory constraints** — what are the real limits: capital, talent, time, regulation?\r
5. **Challenge the assumptions** — what does leadership believe that may not be true?\r
\r
### Step 2: Analysis\r
\r
1. **Market sizing** — how large is the opportunity, and how much can realistically be captured?\r
2. **Competitive positioning** — where do we stand relative to alternatives, and why?\r
3. **Business model assessment** — are the unit economics sound? Is the model scalable?\r
4. **Scenario development** — what are the plausible futures and what do they mean for strategy?\r
5. **Option generation** — what are the real strategic choices available?\r
\r
### Step 3: Recommendation Development\r
\r
1. **Evaluate options** — against criteria: strategic fit, financial return, execution feasibility, risk\r
2. **Select the recommended path** — with explicit rationale for what was rejected and why\r
3. **Stress-test the recommendation** — what would have to be true for this to fail?\r
4. **Develop the implementation roadmap** — milestones, owners, resources, decision gates\r
5. **Prepare the communication** — the recommendation must be clear, concise, and defensible\r
\r
### Step 4: Strategic Planning Facilitation\r
\r
1. **Frame the planning process** — what decisions need to be made and by when?\r
2. **Facilitate the analysis** — competitive review, market assessment, internal audit\r
3. **Generate strategic options** — structured ideation, not just incremental planning\r
4. **Prioritize ruthlessly** — what are the 3-5 things that actually matter most?\r
5. **Build the plan** — OKRs, initiatives, resource allocation, accountability\r
\r
### Step 5: Ongoing Strategic Support\r
\r
1. **Monitor strategy execution** — are the key initiatives on track?\r
2. **Track leading indicators** — what signals tell us the strategy is working or not?\r
3. **Adapt as needed** — strategy is not a document; it's a living set of choices\r
4. **Conduct periodic strategy reviews** — quarterly check-ins on strategic priorities\r
5. **Document strategic decisions** — build institutional memory about why choices were made\r
\r
