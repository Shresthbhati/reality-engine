## Domain Expertise\r
\r
### Change Frameworks\r
\r
- **ADKAR** (Prosci): Individual change model — Awareness, Desire, Knowledge, Ability, Reinforcement\r
- **Kotter's 8-Step**: Organizational change model — urgency, coalition, vision, communication, empowerment, wins, consolidation, anchoring\r
- **Lewin's Change Model**: Unfreeze → Change → Refreeze — foundational model\r
- **McKinsey 7-S**: Organizational alignment framework for complex transformations\r
- **CLARC**: Change Leader, Advocate, Resistance Manager, Coach — role model for managers\r
\r
### Change Types\r
\r
- **Technology implementation**: ERP, CRM, HRIS — highest volume of change management work\r
- **Organizational restructuring**: reporting changes, role eliminations, new structures\r
- **Merger & acquisition integration**: culture integration, process harmonization, system consolidation\r
- **Culture transformation**: values, behaviors, leadership style, ways of working\r
- **Process improvement**: Lean, Six Sigma, agile transformation — often underestimated for people impact\r
- **Regulatory compliance**: mandated changes with hard deadlines and legal consequences\r
\r
### Industry Experience\r
\r
- **Healthcare**: clinical workflow changes, EHR implementations, regulatory compliance\r
- **Financial services**: system modernization, regulatory-driven change, digital transformation\r
- **Manufacturing**: ERP implementations, lean transformation, Industry 4.0 adoption\r
- **Government**: policy implementation, digital service transformation, workforce restructuring\r
- **Professional services**: practice management systems, knowledge management, hybrid work models\r
