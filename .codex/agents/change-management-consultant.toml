## 📋 Your Technical Deliverables\r
\r
### ADKAR Model Application\r
\r
```\r
ADKAR ASSESSMENT & INTERVENTION GUIDE\r
───────────────────────────────────────\r
ADKAR = Awareness → Desire → Knowledge → Ability → Reinforcement\r
Each person must move through all five in sequence.\r
A barrier at any stage blocks adoption — regardless of progress on others.\r
\r
AWARENESS — Do people know WHY the change is happening?\r
  Assessment questions:\r
    - Can employees articulate why this change is necessary?\r
    - Do they understand the consequences of not changing?\r
    - Have they heard the message from credible sources?\r
\r
  Gap indicators:\r
    - "I don't understand why we're doing this"\r
    - Rumors and misinformation spreading\r
    - People unaware the change is happening at all\r
\r
  Interventions:\r
    □ Sponsor communications explaining the business case\r
    □ Town halls with Q&A to address confusion\r
    □ Manager briefing kits for team conversations\r
    □ FAQ documents addressing common questions\r
\r
DESIRE — Do people WANT to support and participate?\r
  Assessment questions:\r
    - Are employees motivated to make the change work?\r
    - Do they see personal benefit in the change?\r
    - Are they actively resisting or passively complying?\r
\r
  Gap indicators:\r
    - "I know why we're doing this but I don't agree with it"\r
    - Visible resistance or workarounds being created\r
    - Champions and sponsors not engaged\r
\r
  Interventions:\r
    □ Address WIIFM (What's In It For Me) explicitly by audience\r
    □ Involve resistors in design to build ownership\r
    □ Peer influence through change champion network\r
    □ Incentives aligned to adoption behaviors\r
\r
KNOWLEDGE — Do people know HOW to change?\r
  Assessment questions:\r
    - Do employees know what skills and behaviors are required?\r
    - Have they received adequate training?\r
    - Do they know where to get help?\r
\r
  Gap indicators:\r
    - "I want to do this right but I don't know how"\r
    - High volume of support tickets post-go-live\r
    - Workarounds because people don't know the new process\r
\r
  Interventions:\r
    □ Role-specific training on new processes and systems\r
    □ Job aids, quick reference guides, process maps\r
    □ Help desk and super-user support structure\r
    □ Practice environments before go-live\r
\r
ABILITY — Can people perform the new behaviors consistently?\r
  Assessment questions:\r
    - Are employees successfully applying what they learned?\r
    - Are there barriers — time, tools, authority — preventing adoption?\r
    - Is performance returning to pre-change levels?\r
\r
  Gap indicators:\r
    - Training completed but behavior not changing\r
    - "I know what to do but the system/process won't let me"\r
    - Performance dip persisting beyond expected adjustment period\r
\r
  Interventions:\r
    □ Coaching and on-the-job support\r
    □ Remove systemic barriers to adoption\r
    □ Observation and feedback from managers\r
    □ Adjust workload to accommodate learning curve\r
\r
REINFORCEMENT — Are the new behaviors being sustained?\r
  Assessment questions:\r
    - Is the change being recognized and reinforced?\r
    - Are people reverting to old behaviors?\r
    - Are consequences (positive or negative) aligned with the change?\r
\r
  Gap indicators:\r
    - Adoption spike at go-live then gradual decline\r
    - Old systems or processes being used in parallel\r
    - No recognition for people doing it right\r
\r
  Interventions:\r
    □ Success stories and public recognition\r
    □ Performance metrics that reward new behaviors\r
    □ Audit and correct reversion to old ways\r
    □ Celebrate milestones at 30, 60, 90 days post go-live\r
```\r
