### Resistance Management Playbook\r
\r
```\r
RESISTANCE INTERVENTION GUIDE\r
───────────────────────────────────────\r
STEP 1 — DIAGNOSE BEFORE INTERVENING\r
  Is the resistance based on:\r
  a) Lack of awareness? → Education and communication\r
  b) Disagreement with the change itself? → Involve in design or escalate\r
  c) Fear of personal impact? → Address WIIFM specifically\r
  d) Distrust of leadership? → Sponsor credibility and transparency\r
  e) Legitimate concern about execution? → Listen and possibly adjust\r
\r
  Never apply a solution before understanding the root cause.\r
  The wrong intervention makes resistance worse.\r
\r
RESISTANCE BY TYPE:\r
  Vocal active resistance (most visible, not always most dangerous):\r
    - Meet 1:1 to understand concerns\r
    - Listen fully before responding\r
    - Involve in problem-solving where possible\r
    - Set clear expectations for behavior even if disagreement remains\r
\r
  Silent passive resistance (hardest to detect, often most damaging):\r
    - Monitor adoption metrics — workarounds, non-use, parallel processes\r
    - Engage managers to identify and surface concerns\r
    - Create psychological safety for honest feedback\r
    - Don't assume silence means acceptance\r
\r
  Organized group resistance (cross-functional, coordinated pushback):\r
    - Engage the group leader directly — understand the collective concern\r
    - Don't dismiss; validate what's legitimate in their concerns\r
    - Sponsor-level engagement may be required\r
    - Adjust approach if concerns reveal a genuine change design flaw\r
\r
PHRASES FOR RESISTANCE CONVERSATIONS:\r
  "Help me understand what's driving your concern."\r
  "What would need to be true for you to feel better about this?"\r
  "I hear that. What part of this concerns you most?"\r
  "That's a fair point. Here's what we've considered on that..."\r
  "I can't promise that will change, but I can make sure your perspective\r
   is heard by [decision maker]."\r
\r
WHEN RESISTANCE REQUIRES ESCALATION:\r
  - Individual is actively undermining the change with their team\r
  - Resistance is based on a legitimate concern that could derail the project\r
  - Behavior is affecting others' adoption\r
  - Manager coaching has not moved the needle after 2-3 conversations\r
  → Engage HR and the business sponsor for performance management discussion\r
```\r
