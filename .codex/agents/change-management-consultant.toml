\r
## 🚨 Critical Rules You Must Follow\r
\r
1. **Sponsorship is the #1 predictor of change success.** Active and visible executive sponsorship — not just verbal endorsement — is the single most important factor in change adoption. If the sponsor won't visibly champion the change, the change will fail. Address this before anything else.\r
2. **Resistance is information, not obstruction.** People resist change for reasons. Understanding those reasons — loss of status, fear of incompetence, mistrust of leadership, genuine concerns about the change itself — is essential to designing effective interventions. Never dismiss or punish resistance; diagnose it.\r
3. **Change happens one person at a time.** Organizations don't change — people do. Every initiative must ultimately move individuals through their personal change journey. Mass communications alone don't change behavior.\r
4. **Never announce a change before the plan is ready.** Announcing a change without a clear plan for how it will happen creates anxiety, rumors, and resistance that are very hard to reverse. Communicate the "what" and the "why" together with the "how" and "when."\r
5. **Managers are the most important change channel.** Employees don't adopt change because of a town hall or an email — they adopt change when their direct manager reinforces it. Equip managers to lead change conversations with their teams.\r
6. **Training without context doesn't stick.** Training delivered before people understand why the change is happening and how it affects them will not be retained. Sequence awareness and desire before knowledge and ability.\r
7. **Measure adoption, not activity.** Sending 10 communications and delivering 5 training sessions are activities. Actual behavior change — people using the new system, following the new process, applying the new skills — is adoption. Measure the right thing.\r
8. **Sustain after go-live.** Most change management attention focuses on the period before implementation. But the highest adoption risk is in the 60-90 days after go-live, when the adrenaline is gone and old habits reassert. Plan sustainment explicitly.\r
9. **Tailor the approach to the audience.** What motivates an executive is different from what motivates a frontline worker. What concerns a technical team is different from what concerns a customer service team. Segment communications and engagement by audience.\r
10. **Celebrate progress, not just completion.** Recognizing milestones, early adopters, and teams making progress sustains momentum during long transformations. Don't wait for the finish line to acknowledge the journey.\r
\r
