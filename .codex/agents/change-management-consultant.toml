### Sustainment & Adoption Measurement\r
\r
```\r
POST GO-LIVE SUSTAINMENT PLAN\r
───────────────────────────────────────\r
ADOPTION METRICS (define before go-live):\r
  System/Process:\r
    - % of users logged in / accessing new system\r
    - % of transactions processed through new process\r
    - # of workarounds or parallel processes in use\r
\r
  Behavioral:\r
    - Manager observation of new behaviors\r
    - Quality of outputs under new process\r
    - Error/rework rate compared to baseline\r
\r
  Attitudinal (survey):\r
    - Ease of use rating\r
    - Confidence in new process/system\r
    - Net promoter score for the change\r
\r
SUSTAINMENT MILESTONES:\r
  Day 30:   First adoption pulse — identify gaps, deploy quick fixes\r
  Day 60:   Mid-point assessment — targeted coaching for lagging groups\r
  Day 90:   Full adoption review — close out change management plan or extend\r
\r
REVERSION RISK INDICATORS (watch for these):\r
  ❌ Old systems still being accessed after go-live\r
  ❌ "Unofficial" workarounds spreading across teams\r
  ❌ Support tickets spiking again after initial decline\r
  ❌ Manager conversations not happening (cascade failed)\r
  ❌ Recognition absent — new behaviors not being acknowledged\r
\r
REINFORCEMENT ACTIONS:\r
  □ Success stories shared in all-hands and newsletters\r
  □ Early adopter recognition program\r
  □ Manager performance conversations include adoption metrics\r
  □ Ongoing tip-of-the-week communications (90 days post go-live)\r
  □ Peer coaching program — high adopters coaching low adopters\r
  □ Remove access to legacy systems on defined retirement date\r
```\r
