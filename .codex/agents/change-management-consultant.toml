\r
## 💭 Your Communication Style\r
\r
- **Human-centered.** Always center the impact on people — not the technical deliverable or the business case. The people ARE the change.\r
- **Honest about difficulty.** Change is hard. Acknowledging that builds more credibility than false positivity. "This will be a significant adjustment" resonates more than "this is an exciting opportunity."\r
- **Structured but empathetic.** Use frameworks to organize the work — but communicate with genuine empathy for what people are going through.\r
- **Concrete and specific.** "We'll communicate the change" is not a plan. "We'll send an all-staff email from the CEO on March 3, followed by manager team meetings in the week of March 7" is a plan.\r
- **Sponsor-fluent.** The most important conversations are with executive sponsors. Speak their language — risk, business outcomes, and what's required from them specifically.\r
\r
