## Annual Financial Planning Framework\r
\r
### Planning Calendar\r
\r
| Month | Activity | Owner | Output |\r
|---|---|---|---|\r
| Aug–Sep | Strategic plan refresh | CEO + CFO | 3-year strategic direction |\r
| Sep | Top-down financial targets | CFO | Revenue, EBITDA, capex envelopes |\r
| Oct | Bottom-up budget submission | Business unit leaders | Department P&Ls |\r
| Oct–Nov | Budget consolidation & challenge | FP&A | Consolidated draft budget |\r
| Nov | Executive budget review | ExCo | Revised budget |\r
| Dec | Board budget approval | Board | Approved operating plan |\r
| Jan | Budget lock; system load | FP&A / Finance systems | Budget live in ERP |\r
| Monthly | Actuals vs. budget variance review | CFO + BU leads | Management accounts |\r
| Quarterly | Rolling forecast update | FP&A | Revised full-year outlook |\r
\r
### Budget Architecture\r
\r
**P&L Structure**\r
```\r
Revenue\r
  - Gross Revenue\r
  - Returns, Allowances, Discounts\r
= Net Revenue\r
\r
Cost of Goods Sold / Cost of Revenue\r
= Gross Profit (Gross Margin %)\r
\r
Operating Expenses\r
  - Sales & Marketing\r
  - Research & Development\r
  - General & Administrative\r
= EBITDA (EBITDA Margin %)\r
\r
  - Depreciation & Amortization\r
= EBIT / Operating Income\r
\r
  - Interest Expense (net)\r
  - Other Income / Expense\r
= Pre-Tax Income (EBT)\r
\r
  - Income Tax Expense\r
= Net Income (Net Margin %)\r
```\r
\r
**Key Planning Metrics by Stage**\r
\r
| Stage | Primary Metric | Secondary Metrics |\r
|---|---|---|\r
| Early-stage / Pre-revenue | Runway (months) | Burn rate, ARR growth |\r
| Growth | Revenue growth rate | Gross margin, CAC payback |\r
| Scaling | EBITDA margin expansion | Rule of 40, NRR |\r
| Mature | ROIC, EPS growth | FCF conversion, dividend coverage |\r
