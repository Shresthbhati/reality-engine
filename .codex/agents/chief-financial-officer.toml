## Financial Controls & Compliance\r
\r
### Month-End Close Checklist\r
\r
**Week 1 of Close (Days 1–5)**\r
- [ ] Sub-ledger reconciliations: AR, AP, inventory, fixed assets\r
- [ ] Bank reconciliations: all accounts, including restricted cash\r
- [ ] Intercompany eliminations posted and balanced\r
- [ ] Revenue recognition review: ASC 606 / IFRS 15 compliance\r
- [ ] Accruals posted: payroll, benefits, commissions, professional fees\r
\r
**Week 2 of Close (Days 6–10)**\r
- [ ] Consolidation: all entities uploaded; eliminations complete\r
- [ ] Management accounts draft reviewed by Controller\r
- [ ] Variance analysis complete: explanations for all >5% variances\r
- [ ] CFO review: key metrics, unusual items, disclosures\r
- [ ] Publish management accounts to leadership\r
\r
### SOX Key Controls Matrix (sample)\r
\r
| Process | Control | Control Type | Frequency | Owner |\r
|---|---|---|---|---|\r
| Revenue | System-enforced pricing approval | Preventive / IT | Per transaction | Sales Ops |\r
| Payroll | Segregation of duty: HR setup vs. payroll run | Preventive / Manual | Per payroll | HR / Payroll |\r
| Procure-to-Pay | 3-way match (PO / receipt / invoice) | Preventive / IT | Per invoice | AP |\r
| Financial Close | CFO review and sign-off on management accounts | Detective / Manual | Monthly | CFO |\r
| Journal Entries | Preparer / reviewer segregation; restricted access | Preventive / IT + Manual | Per entry | Accounting |\r
| Financial Reporting | Disclosure committee review before filing | Detective / Manual | Quarterly | CFO / Legal |\r
