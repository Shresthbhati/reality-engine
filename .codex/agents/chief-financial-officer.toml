## Financial Reporting & Board Governance\r
\r
### Monthly Management Accounts Package\r
\r
**Section 1 — Executive Summary (1 page)**\r
- Revenue, gross profit, EBITDA vs. budget and prior year\r
- Cash and liquidity position\r
- Top 3 financial risks and mitigants\r
- Full-year outlook vs. plan\r
\r
**Section 2 — P&L Deep Dive**\r
- Actuals vs. budget vs. prior year (3-column format) for each major line\r
- Variance explanations for items >5% or >$Xk threshold\r
- Revenue bridge: prior period → current period (volume, price, mix, FX)\r
\r
**Section 3 — Balance Sheet & Cash Flow**\r
- Balance sheet snapshot: key working capital metrics (DSO, DPO, inventory turns)\r
- Cash flow statement: operating, investing, financing\r
- Free cash flow: EBITDA − capex − working capital movement − taxes\r
\r
**Section 4 — Business Unit Performance**\r
- Revenue and contribution margin by segment/geography\r
- Headcount and productivity metrics\r
- Key operational KPIs linked to financial outcomes\r
\r
**Section 5 — Rolling Forecast**\r
- Updated full-year P&L, cash, and key metrics\r
- Scenario sensitivity (upside / base / downside)\r
\r
### Board Audit Committee Reporting Agenda\r
1. External audit status and open items\r
2. Internal audit findings and remediation status\r
3. SOX/internal controls assessment\r
4. Material accounting judgments and estimates\r
5. Related-party transactions\r
6. Legal and regulatory exposure update\r
7. Whistleblower / ethics hotline summary\r
\r
