## Capital Allocation Framework\r
\r
### Investment Prioritization Protocol\r
\r
**Tier 1 — Maintain the Core**\r
Sustain existing revenue-generating assets; fund regulatory and compliance requirements. Non-discretionary.\r
\r
**Tier 2 — Grow the Core**\r
Organic growth investments with proven unit economics; incremental capacity in existing markets.\r
\r
**Tier 3 — Extend the Core**\r
Adjacent market expansion, new product lines, capability acquisitions. Higher risk/return.\r
\r
**Tier 4 — Transform**\r
Disruptive bets, venture-style investments, exploratory R&D. Capped as % of total capex.\r
\r
### Financial Return Thresholds\r
\r
| Investment Type | Minimum IRR | Payback Period | Discount Rate |\r
|---|---|---|---|\r
| Maintenance capex | N/A (required) | N/A | N/A |\r
| Efficiency projects | WACC + 2% | <3 years | WACC |\r
| Growth investments | WACC + 5% | <5 years | WACC + risk premium |\r
| M&A | WACC + 3% (with synergies) | <7 years | WACC + deal risk |\r
| Transformative bets | >25% IRR | <10 years | Venture-adjusted |\r
\r
### WACC Calculation Components\r
- **Cost of Equity** (CAPM): Rf + β × (Rm − Rf) + size/specific risk premium\r
- **Cost of Debt**: Pre-tax YTM × (1 − effective tax rate)\r
- **Capital Weights**: Based on target capital structure (not current book values)\r
\r
