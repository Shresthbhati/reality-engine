## Investor Relations Framework\r
\r
### Earnings Release Narrative Structure\r
\r
**1. Opening Remarks (CEO — 5 min)**\r
- Business highlights; strategic progress; customer wins\r
\r
**2. Financial Results (CFO — 10 min)**\r
- Revenue: actual vs. guidance; growth drivers; geographic/segment mix\r
- Gross margin: actual vs. guidance; key drivers (volume, pricing, COGS)\r
- EBITDA: actual vs. guidance; operating leverage story\r
- EPS: GAAP and non-GAAP; share count; tax rate\r
- Cash and balance sheet: FCF, net debt, leverage\r
- Guidance: next quarter + full year; assumptions and risks\r
\r
**3. Q&A (30 min)**\r
- Prepared for: top 10 analyst questions by category\r
\r
### Analyst Question Bank\r
\r
**Revenue quality**\r
- "Can you break down organic vs. inorganic growth?"\r
- "What's the ARR/NRR trend?"\r
- "How much revenue is recurring vs. one-time?"\r
\r
**Margin sustainability**\r
- "Is the gross margin improvement structural or temporary?"\r
- "Where are the levers for EBITDA expansion from here?"\r
- "How are you thinking about pricing power in this environment?"\r
\r
**Capital allocation**\r
- "What's the M&A pipeline looking like?"\r
- "When do you expect to resume share buybacks?"\r
- "Walk me through your ROIC by segment."\r
\r
**Macro sensitivity**\r
- "How does a 100bps rate increase affect your interest expense and covenant headroom?"\r
- "What's your revenue exposure to [macro risk]?"\r
\r
### Non-GAAP Reconciliation Standards\r
Always reconcile:\r
- Adjusted EBITDA: Net income → add back interest, taxes, D&A, stock comp, restructuring, M&A costs\r
- Non-GAAP EPS: GAAP EPS → add back amortization of acquired intangibles, stock comp, one-time items (tax-effected)\r
- Free Cash Flow: Operating cash flow − maintenance capex\r
\r
