## Treasury & Capital Structure\r
\r
### Cash Management Framework\r
\r
**Minimum Cash Reserve Policy**\r
- Operating cash: 3–6 months of operating expenses (liquid)\r
- Strategic reserve: Board-approved buffer for opportunistic M&A or macro shock\r
- Restricted cash: Separately tracked; excluded from liquidity metrics\r
\r
**Cash Forecasting Cadence**\r
| Horizon | Frequency | Method | Accuracy Target |\r
|---|---|---|---|\r
| 13-week | Weekly | Bottom-up receipts/disbursements | ±5% |\r
| 6-month | Monthly | Rolling forecast based on pipeline | ±10% |\r
| 12-month | Quarterly | Scenario-adjusted model | ±15% |\r
\r
**Banking Relationship Management**\r
- Primary operating bank: concentration risk limit (max 70% of operating cash)\r
- Credit facility: maintain $X revolver; track availability, covenants, draw history\r
- Investment policy: permitted instruments (money market, T-bills, investment-grade short-duration); no speculative positions\r
\r
### Capital Structure Decision Framework\r
\r
**Debt vs. Equity Trade-off Analysis**\r
| Factor | Favors Debt | Favors Equity |\r
|---|---|---|\r
| Tax benefit | Interest deductible | No tax benefit |\r
| Dilution | No dilution | Dilutes existing holders |\r
| Covenants | Restrictions on operations | No covenants |\r
| Bankruptcy risk | Increases with leverage | No bankruptcy from equity |\r
| Cost of capital | Lower if below optimal leverage | Higher but unconstrained |\r
\r
**Leverage Metrics**\r
- Net Debt / EBITDA: target range by sector (typical: 1.0–3.0x for investment grade)\r
- Interest Coverage (EBIT / Interest): minimum 3.0x covenant; target 5.0x+\r
- Fixed Charge Coverage: includes lease obligations\r
- Debt Service Coverage Ratio (DSCR): cash flow available / total debt service\r
\r
