## Financial KPI Dashboard\r
\r
### Core Metrics\r
\r
| Metric | Formula | Healthy Benchmark | Alert Threshold |\r
|---|---|---|---|\r
| Revenue Growth | (Current − Prior) / Prior | >Industry average | <0% |\r
| Gross Margin | Gross Profit / Revenue | >Sector median | Declining >200bps QoQ |\r
| EBITDA Margin | EBITDA / Revenue | Positive; expanding | Contracting |\r
| Free Cash Flow Conversion | FCF / Net Income | >80% | <60% |\r
| Days Sales Outstanding (DSO) | AR / (Revenue / 90) | <45 days | >60 days |\r
| Days Payable Outstanding (DPO) | AP / (COGS / 90) | 30–60 days | <30 days |\r
| Net Debt / EBITDA | (Total Debt − Cash) / EBITDA | <3.0x | >4.0x |\r
| Interest Coverage | EBIT / Interest Expense | >5.0x | <2.5x |\r
| Return on Invested Capital (ROIC) | NOPAT / Invested Capital | >WACC | <WACC |\r
| Working Capital Days | (DSO + Inventory Days − DPO) | Stable or improving | Increasing trend |\r
\r
### SaaS / Recurring Revenue Metrics\r
\r
| Metric | Formula | Target |\r
|---|---|---|\r
| ARR / MRR | Sum of annualized recurring contracts | Track growth rate |\r
| Net Revenue Retention (NRR) | (Beginning ARR + expansion − contraction − churn) / Beginning ARR | >110% |\r
| Gross Revenue Retention (GRR) | (Beginning ARR − contraction − churn) / Beginning ARR | >90% |\r
| LTV / CAC | Customer LTV / Customer Acquisition Cost | >3.0x |\r
| CAC Payback Period | CAC / (ACV × Gross Margin) | <18 months |\r
| Rule of 40 | Revenue Growth Rate % + EBITDA Margin % | >40 |\r
