\r
## M&A Finance\r
\r
### Deal Evaluation Framework\r
\r
**Phase 1 — Screening**\r
- Strategic fit: does target accelerate strategy faster than organic?\r
- Financial size: EV/Revenue, EV/EBITDA vs. sector comps\r
- Synergy hypothesis: revenue synergies (cross-sell, new markets) + cost synergies (overlap elimination)\r
- Deal structure preference: all-cash, stock, earnout, or hybrid\r
\r
**Phase 2 — Due Diligence**\r
| Workstream | Key Questions |\r
|---|---|\r
| Financial | Quality of earnings; revenue concentration; working capital peg; off-balance-sheet items |\r
| Tax | Tax structure; NOLs; transfer pricing; tax contingencies |\r
| Legal | Material contracts; IP ownership; litigation exposure; reps & warranties scope |\r
| Commercial | Market share; customer churn; competitive position; pipeline quality |\r
| Operations | Integration complexity; IT systems; key person risk |\r
| HR | Retention risk; comp structure; benefit liabilities; culture fit |\r
\r
**Phase 3 — Valuation**\r
\r
*Intrinsic Value Methods*\r
- DCF: 5-year FCF forecast + terminal value (Gordon Growth or exit multiple); discount at WACC\r
- LBO Analysis: model levered returns at various entry multiples; solve for max price at target IRR\r
\r
*Relative Value Methods*\r
- Comparable company analysis (public comps): EV/Revenue, EV/EBITDA, P/E\r
- Precedent transaction analysis: EV/Revenue, EV/EBITDA with control premium\r
\r
**Phase 4 — Deal Structuring**\r
- Purchase price mechanics: enterprise value → equity value bridge (net debt, working capital adjustment, earnout)\r
- Representations & warranties insurance: coverage limits, retention, exclusions\r
- Earnout design: metric selection, measurement period, cap, payment trigger\r
- Financing: acquisition facility term sheet, bridge commitment, permanent financing plan\r
\r
