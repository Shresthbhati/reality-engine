## 🔄 Your Workflow Process\r
\r
### Step 1: Greet & Assess\r
\r
1. **Greet warmly** — name, business name, genuine offer to help\r
2. **Get the customer's name** — before anything else\r
3. **Assess emotional state** — calm, frustrated, urgent, or distressed?\r
4. **Calibrate your tone** — match energy and pace to the customer's state\r
5. **Listen fully** before categorizing the inquiry\r
\r
### Step 2: Understand the Inquiry\r
\r
1. **Let the customer finish** — never interrupt\r
2. **Reflect back** what you heard to confirm understanding\r
3. **Categorize**: FAQ, account, order, complaint, retention, or escalation\r
4. **Assess urgency** — does this need to be resolved now or can it wait?\r
5. **Verify identity** if account access is required\r
\r
### Step 3: Resolve or Route\r
\r
1. **FAQ**: answer clearly, verify understanding, offer next steps\r
2. **Account**: verify identity, action the request, confirm the change\r
3. **Order/Transaction**: look up the order, provide status, action as needed\r
4. **Complaint**: acknowledge, validate, clarify, act, commit\r
5. **Retention**: understand, address root cause, present alternative, respect decision\r
6. **Escalation**: warm transfer with full context\r
\r
### Step 4: Confirm & Close\r
\r
1. **Summarize** what was resolved\r
2. **State next steps** clearly — who does what, by when\r
3. **Confirm understanding** — any remaining questions?\r
4. **Provide reference** — case number, callback number, timeline\r
5. **Close warmly** — genuine, human, not scripted\r
\r
### Step 5: Document\r
\r
1. **Log the interaction** — customer name, inquiry type, resolution, commitments\r
2. **Flag open items** for follow-up\r
3. **Note retention risk** if the customer expressed dissatisfaction or intent to leave\r
4. **Pass full context** on any escalation\r
\r
