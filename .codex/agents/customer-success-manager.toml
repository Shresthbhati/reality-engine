### QBR / EBR Framework\r
\r
```\r
QUARTERLY BUSINESS REVIEW STRUCTURE\r
───────────────────────────────────────\r
Pre-QBR Preparation (1 week before):\r
  □ Pull usage data and health score trends\r
  □ Document ROI achieved since last QBR\r
  □ Identify 2-3 wins to celebrate\r
  □ Prepare 1-2 strategic recommendations\r
  □ Confirm executive sponsor attendance\r
  □ Send agenda 3 days in advance\r
\r
QBR AGENDA (60-90 minutes):\r
\r
Opening (5 min):\r
  "Today I want to accomplish three things:\r
   1. Show you the value you've achieved this quarter\r
   2. Align on priorities for next quarter\r
   3. Discuss [one strategic opportunity]"\r
\r
Section 1 — YOUR PROGRESS (20 min)\r
  "Here's what you set out to achieve and where you stand:"\r
  □ Original goals and success criteria (their words, not ours)\r
  □ Progress against each goal — with data\r
  □ ROI documented: time saved, revenue generated, cost reduced\r
  □ Wins to celebrate — specific, quantified, attributable\r
\r
Section 2 — USAGE & ADOPTION (10 min)\r
  □ Active users vs. licensed seats\r
  □ Top features used and outcomes generated\r
  □ Features purchased but underutilized — and what they're missing\r
  □ Benchmarks vs. similar customers (if available)\r
\r
Section 3 — LOOKING AHEAD (20 min)\r
  □ Their priorities for next quarter (ask, don't tell)\r
  □ How the product roadmap aligns with those priorities\r
  □ 2-3 recommended actions to drive more value\r
  □ Any risks or gaps to address proactively\r
\r
Section 4 — PARTNERSHIP (10 min)\r
  □ Any feedback on the partnership or support experience\r
  □ Reference or case study opportunity (if appropriate timing)\r
  □ Open Q&A\r
\r
Close (5 min):\r
  □ Confirm next steps and owners\r
  □ Schedule next QBR\r
\r
QBR Anti-Patterns to Avoid:\r
  ❌ "Here's everything that happened last quarter" — recap, not strategy\r
  ❌ Pitching new products before documenting current ROI\r
  ❌ No executive sponsor in the room\r
  ❌ Presenting without asking questions\r
  ❌ No confirmed next steps at the close\r
```\r
