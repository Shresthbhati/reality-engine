### Churn Prevention Playbook\r
\r
```\r
CHURN RISK INTERVENTION GUIDE\r
───────────────────────────────────────\r
EARLY WARNING SIGNALS (trigger yellow health):\r
  - Login frequency drops >30% week-over-week\r
  - Champion goes dark (no response in 10+ days)\r
  - Support ticket volume spikes\r
  - Missed 2+ consecutive scheduled meetings\r
  - NPS score drops to Passive (7-8) or Detractor (0-6)\r
  - Champion announces departure or role change\r
  - Company announces layoffs, merger, or acquisition\r
  - Invoice payment delayed >15 days\r
\r
SAVE PLAY — LEVEL 1 (Yellow Health):\r
  1. Reach out personally within 24 hours of signal detection\r
  2. Frame as check-in: "I noticed X and wanted to connect"\r
  3. Uncover root cause through questions — don't assume\r
  4. Co-create a recovery plan with specific milestones\r
  5. Increase touch cadence to weekly until green\r
\r
SAVE PLAY — LEVEL 2 (Red Health / Active Churn Risk):\r
  1. Escalate to CSM manager and Account Executive immediately\r
  2. Request executive-to-executive call within the week\r
  3. Conduct internal win/loss analysis: what went wrong?\r
  4. Prepare concession options (with approval): training, credits, roadmap commitment\r
  5. Deliver a formal "Success Recovery Plan" document\r
  6. Weekly check-ins with documented progress until stable\r
\r
CHAMPION DEPARTURE PROTOCOL:\r
  Day 1:  Send personal note to departing champion — maintain relationship\r
  Day 1:  Identify successor — ask departing champion for introduction\r
  Day 2:  Schedule onboarding call with new contact\r
  Week 1: Re-run condensed version of original onboarding\r
  Week 2: Executive check-in to reaffirm partnership\r
  Week 4: Assess new champion's engagement and sentiment\r
\r
WHAT CUSTOMERS SAY VS. WHAT THEY MEAN:\r
  "We're evaluating our tech stack" → actively looking at competitors\r
  "We need to think about it" → someone internally is pushing back\r
  "Budget is tight this year" → ROI isn't proven; they need a business case\r
  "We'll circle back after [event]" → buying time; flag for follow-up\r
  "Everything is fine" from a disengaged account → not fine; dig deeper\r
```\r
\r
### Expansion Identification Framework\r
\r
```\r
EXPANSION OPPORTUNITY FRAMEWORK\r
───────────────────────────────────────\r
Expansion is appropriate when:\r
  ✅ Customer has achieved documented ROI on current investment\r
  ✅ Current use case is fully adopted (≥ 80% seat utilization)\r
  ✅ Customer has expressed desire to expand scope or team\r
  ✅ A trigger event creates new need (new team, new market, new initiative)\r
  ✅ Health score is Green for ≥ 60 days\r
\r
Expansion types:\r
  Seat expansion:     More users on the same product\r
  Feature expansion:  Additional modules or capabilities\r
  Use case expansion: New department or workflow\r
  Cross-sell:         Different product that solves adjacent need\r
\r
EXPANSION BUSINESS CASE STRUCTURE:\r
  "Here's why expanding makes sense for [Company] right now:"\r
\r
  1. CURRENT VALUE\r
     "You've achieved [X outcome] using [current product/tier]."\r
\r
  2. THE OPPORTUNITY COST OF NOT EXPANDING\r
     "Right now, [specific team/process] is still [doing it the old way],\r
     which costs approximately [time/money/risk]."\r
\r
  3. THE EXPANSION SOLUTION\r
     "Adding [feature/seats/module] would [specific outcome]."\r
\r
  4. THE ROI CASE\r
     "Based on your current results, we estimate [expansion] would\r
     generate [outcome] within [timeframe]."\r
\r
  5. THE ASK\r
     "Can we schedule 30 minutes with [decision maker] to walk\r
     through the numbers?"\r
```\r
