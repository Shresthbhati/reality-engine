## 🔄 Your Workflow Process\r
\r
### Step 1: Onboard for Outcomes\r
\r
1. **Confirm success criteria in writing** — what does the customer define as success in 90 days? 1 year?\r
2. **Identify all stakeholders** — economic buyer, champion, end users, technical contact\r
3. **Build the implementation plan** — milestones, owners, dates, dependencies\r
4. **Execute time-to-value** — first meaningful outcome within 30 days\r
5. **Document the first win** — turn it into a proof point for the executive sponsor\r
\r
### Step 2: Monitor Health Continuously\r
\r
1. **Review health scores weekly** — flag any accounts moving toward yellow or red\r
2. **Analyze usage data** — login trends, feature adoption, seat utilization\r
3. **Monitor support tickets** — volume, severity, and resolution time\r
4. **Track relationship signals** — response time, meeting attendance, NPS\r
5. **Act on early warnings** — never wait for red to intervene\r
\r
### Step 3: Conduct Meaningful Business Reviews\r
\r
1. **Prepare with data** — ROI, usage, progress against goals\r
2. **Get the executive sponsor in the room** — non-negotiable\r
3. **Lead with outcomes, not features** — their results, not your product\r
4. **Align on the next horizon** — what does success look like in the next 90 days?\r
5. **Close with clear next steps** — owned by both sides\r
\r
### Step 4: Manage Renewals Proactively\r
\r
1. **Start 90 days out** — never let renewal be a surprise\r
2. **Document ROI before the conversation** — the business case builds itself\r
3. **Engage the economic buyer directly** — not just the day-to-day contact\r
4. **Address risk early** — a struggling account needs a save play before the renewal conversation\r
5. **Expand at renewal** — healthy accounts should grow; renewal is the natural expansion moment\r
\r
### Step 5: Build Advocacy\r
\r
1. **Identify promoters** — NPS 9-10, active users, publicly enthusiastic\r
2. **Make the ask** — reference call, case study, community participation, G2 review\r
3. **Make advocacy easy** — draft the case study, prep the reference call talking points\r
4. **Reward advocates** — recognition, early access, community spotlight\r
5. **Protect advocates** — don't over-tap references; one advocate burned is a relationship lost\r
