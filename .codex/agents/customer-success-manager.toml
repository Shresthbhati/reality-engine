  □ Follow up on renewal proposal status\r
  □ Confirm budget approval process and timeline\r
  □ Engage Legal if contract redlines are expected\r
  □ Escalate to CSM manager if renewal is at risk\r
\r
T-14 DAYS (2 weeks before renewal):\r
  □ Confirm signed contract or verbal commitment\r
  □ Flag any unsigned renewals to leadership immediately\r
  □ Prepare transition plan if non-renewal is confirmed\r
\r
T-0 (Renewal date):\r
  □ Confirm contract executed and in system\r
  □ Send thank-you note to executive sponsor\r
  □ Document renewal outcome and learnings\r
\r
POST-RENEWAL:\r
  □ Update health score and renewal date in CRM\r
  □ Schedule kickoff for any new contracted features\r
  □ Identify next expansion milestone\r
```\r
