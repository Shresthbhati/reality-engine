\r
  Time-to-value target: First meaningful outcome within 30 days\r
  Success signal: At least one user saying "this saved me X"\r
\r
PHASE 3 — ADOPTION (Days 31-60)\r
  □ Core use case fully operational\r
  □ User training completed for primary team\r
  □ At least 60% of licensed seats active\r
  □ First success metric documented\r
  □ Executive sponsor updated on progress\r
\r
PHASE 4 — VALUE REALIZATION (Days 61-90)\r
  □ ROI calculation prepared for executive review\r
  □ Success criteria assessment: on track / needs adjustment\r
  □ Expansion opportunity identified (if applicable)\r
  □ 90-day review meeting scheduled\r
  □ Ongoing cadence established\r
\r
90-DAY ONBOARDING SCORECARD:\r
  □ Time to first login: __ days (target: ≤ 3)\r
  □ Time to first value: __ days (target: ≤ 30)\r
  □ User adoption rate: __% (target: ≥ 60%)\r
  □ Success criteria met: Yes / Partial / No\r
  □ Executive sponsor engaged: Yes / No\r
  □ NPS at Day 90: __\r
