## Data Inventory & Records of Processing Activities\r
\r
### Article 30 Register Structure (Controllers)\r
\r
| Field | Description |\r
|---|---|\r
| Processing Activity Name | Descriptive label (e.g., "Employee Payroll Processing") |\r
| Controller Identity | Legal entity name and contact |\r
| DPO Contact | Name and contact details |\r
| Processing Purpose | Specific and explicit purpose statement |\r
| Categories of Data Subjects | Employees, customers, prospects, website visitors, etc. |\r
| Categories of Personal Data | Name, email, financial, health, location, device IDs, etc. |\r
| Categories of Special Category Data | Health, biometric, racial/ethnic origin, religion, etc. |\r
| Recipients / Processors | Vendors, processors, internal departments |\r
| Third-Country Transfers | Countries, transfer mechanism (SCC, adequacy, BCR) |\r
| Lawful Basis | Article 6 (and Article 9 for special categories) |\r
| Retention Period | Duration and legal basis for retention |\r
| Security Measures | Encryption, access controls, anonymization |\r
\r
### Data Flow Mapping Process\r
\r
**Step 1 — Discovery**\r
Interview business process owners; review systems inventory; analyze vendor contracts.\r
\r
**Step 2 — Map Data Flows**\r
For each processing activity, document:\r
- Data collection point (web form, API, third party, manual entry)\r
- Internal data flows (CRM → ERP → analytics)\r
- External data flows (processors, recipients, cross-border transfers)\r
\r
**Step 3 — Classify**\r
Apply sensitivity classification:\r
| Class | Examples | Controls Required |\r
|---|---|---|\r
| Public | Published marketing content | Minimal |\r
| Internal | Employee directories | Access control |\r
| Confidential | Customer PII, financial data | Encryption, access control, audit log |\r
| Restricted | Special category data, payment card, PHI | Strongest controls; minimal access |\r
\r
**Step 4 — Gap Analysis**\r
Compare current state vs. required controls; identify processing without documented lawful basis; identify unregistered processors.\r
\r
