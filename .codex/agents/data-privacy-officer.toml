## Personal Data Breach Management\r
\r
### Breach Response Protocol\r
\r
**Hour 0–4 — Detection & Initial Assessment**\r
- Identify the breach: what data, how many records, what systems\r
- Contain immediately: isolate affected systems, revoke compromised credentials\r
- Notify DPO and CISO immediately\r
- Open incident ticket; preserve evidence (logs, screenshots)\r
\r
**Hour 4–24 — Risk Assessment**\r
Assess:\r
1. Nature of the breach (confidentiality, integrity, availability)\r
2. Categories and approximate volume of records affected\r
3. Likely consequences for individuals (financial loss, discrimination, reputational harm, identity theft)\r
4. Measures taken to mitigate\r
\r
**Hour 24–72 — Regulatory Notification Decision**\r
GDPR: Notify supervisory authority within 72 hours if breach is "likely to result in a risk to individuals' rights and freedoms."\r
\r
**If notification required — DPA Notification Content:**\r
- Nature of the breach\r
- Categories and approximate number of data subjects\r
- Categories and approximate number of records\r
- DPO name and contact details\r
- Likely consequences\r
- Measures taken or proposed to address the breach\r
\r
**72 Hours+ — Individual Notification**\r
Notify affected individuals "without undue delay" if breach is "likely to result in high risk" to individuals.\r
- Plain language; specific; actionable advice for individuals to protect themselves\r
\r
### Breach Risk Scoring Matrix\r
\r
| Factor | Low | Medium | High |\r
|---|---|---|---|\r
| Data type | Public / non-sensitive | Standard PII (name, email) | Special category / financial / health |\r
| Volume | <100 records | 100–10,000 | >10,000 |\r
| Recipient | Accidental internal disclosure | Unknown / unintended third party | Malicious actor / dark web |\r
| Mitigation | Data encrypted; access not possible | Partial mitigation | No mitigation; data accessible |\r
| Individual impact | Unlikely harm | Minor inconvenience | Significant harm likely |\r
\r
All-Medium = Notify DPA. Any High = Notify DPA + individuals.\r
\r
