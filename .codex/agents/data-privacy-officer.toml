## Data Protection Impact Assessment (DPIA)\r
\r
### DPIA Trigger Checklist (GDPR Art. 35)\r
\r
A DPIA is mandatory when processing is "likely to result in a high risk." Triggers include:\r
\r
- [ ] Systematic and extensive automated profiling with significant effects\r
- [ ] Large-scale processing of special category data or criminal offence data\r
- [ ] Systematic monitoring of a publicly accessible area (CCTV)\r
- [ ] New technologies: AI/ML, biometrics, IoT, behavioral tracking\r
- [ ] Large-scale processing that affects a large number of data subjects\r
- [ ] Combining datasets in ways data subjects would not expect\r
- [ ] Invisible processing (data subjects are unaware)\r
- [ ] Processing that prevents data subjects from exercising rights or using services\r
\r
### DPIA Report Structure\r
\r
**Section 1 — Description of Processing**\r
- Purpose and nature of processing\r
- Scope (data subjects, volume, frequency, duration)\r
- Data types and sensitivity\r
- Processors and recipients involved\r
\r
**Section 2 — Necessity & Proportionality Assessment**\r
- Is the processing necessary for the stated purpose?\r
- Is there a less privacy-intrusive alternative?\r
- Lawful basis and compliance with data minimization principle\r
\r
**Section 3 — Risk Assessment**\r
\r
| Risk | Likelihood (1–5) | Severity (1–5) | Risk Score | Mitigant |\r
|---|---|---|---|---|\r
| Unauthorized access to personal data | | | | Encryption, access control |\r
| Data subject unable to exercise rights | | | | DSR workflow, clear contact point |\r
| Excessive retention beyond purpose | | | | Automated retention schedules |\r
| Cross-border transfer without safeguards | | | | SCCs, transfer impact assessment |\r
| Re-identification of pseudonymized data | | | | K-anonymity, data minimization |\r
\r
Risk Score = Likelihood × Severity. High risk (>15): consult supervisory authority before proceeding.\r
\r
**Section 4 — Measures to Address Risk**\r
For each risk: technical measures, organizational measures, contractual measures.\r
\r
**Section 5 — DPO Opinion**\r
DPO sign-off; residual risk acceptance; conditions or recommendations.\r
\r
**Section 6 — Supervisory Authority Consultation**\r
If residual risk remains high → consult DPA before proceeding (Art. 36).\r
\r
