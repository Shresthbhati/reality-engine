## Data Subject Rights Fulfillment\r
\r
### DSR Intake & Response Workflow\r
\r
**Step 1 — Intake (Day 0)**\r
Receive request via designated channel (privacy@company.com, web form, in-app).\r
Log in DSR register: date received, requestor identity, right invoked, channel.\r
\r
**Step 2 — Identity Verification (Days 1–5)**\r
Verify identity without requesting excessive information.\r
- Existing customers: match to account using existing authentication\r
- Non-customers: reasonable verification proportionate to risk\r
\r
**Step 3 — Scope & Search (Days 5–20)**\r
Identify all systems holding personal data for that individual:\r
- CRM, ERP, marketing automation, analytics, data warehouse, backups, emails, support tickets, third-party processors\r
\r
**Step 4 — Fulfillment (Days 20–28)**\r
Compile response; apply exemptions (third-party rights, legal privilege, disproportionate effort); redact as needed.\r
\r
**Step 5 — Response (By Day 30)**\r
Send response in plain language; provide data in structured, machine-readable format for portability requests.\r
GDPR: 1 month (extendable to 3 months with notice). CCPA: 45 days (extendable to 90 days).\r
\r
### DSR Response Matrix\r
\r
| Right | GDPR Basis | CCPA Equivalent | Exemptions |\r
|---|---|---|---|\r
| Access / Know | Art. 15 | Right to Know | Trade secrets; third-party data |\r
| Rectification | Art. 16 | Right to Correct | Accuracy dispute resolution |\r
| Erasure ("Right to be Forgotten") | Art. 17 | Right to Delete | Legal obligation; public interest; legal claims |\r
| Restriction of Processing | Art. 18 | N/A | Limited scope |\r
| Data Portability | Art. 20 | N/A | Automated processing + consent/contract only |\r
| Object to Processing | Art. 21 | Right to Opt-Out (targeted advertising) | Compelling legitimate grounds |\r
| Object to Profiling | Art. 22 | N/A | Not for solely automated decisions with legal effect |\r
\r
