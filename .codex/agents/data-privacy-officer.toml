## Vendor Privacy Due Diligence\r
\r
### Third-Party Risk Assessment Questionnaire (Key Topics)\r
\r
**Data Processing Scope**\r
- What personal data does the vendor process on our behalf?\r
- Is the vendor a controller, processor, or joint controller?\r
- Does the vendor use sub-processors? Are they listed?\r
\r
**Security Controls**\r
- What encryption standards are applied (at rest and in transit)?\r
- What access controls and authentication methods are in place?\r
- When was the last penetration test? Can you share the summary?\r
- What certifications does the vendor hold? (ISO 27001, SOC 2 Type II)\r
\r
**Data Transfers**\r
- Where is data stored and processed geographically?\r
- Are there cross-border transfers? What transfer mechanism is used?\r
\r
**Breach Response**\r
- What is the vendor's breach notification process?\r
- Within what timeframe will they notify us of a breach?\r
\r
**Data Subject Rights**\r
- How does the vendor support our DSR fulfillment obligations?\r
- Can the vendor delete or export all data for a specific individual?\r
\r
**Retention & Deletion**\r
- What are the vendor's data retention policies?\r
- How is data returned or destroyed at contract end?\r
\r
### Data Processing Agreement (DPA) Checklist\r
\r
A compliant DPA must include (GDPR Art. 28):\r
- [ ] Subject matter and duration of processing\r
- [ ] Nature and purpose of processing\r
- [ ] Type of personal data and categories of data subjects\r
- [ ] Obligations and rights of the controller\r
- [ ] Processor only processes on documented controller instructions\r
- [ ] Confidentiality obligations on authorized personnel\r
- [ ] Appropriate technical and organizational security measures\r
- [ ] Sub-processor approval and flow-down requirements\r
- [ ] Assistance with DSR obligations\r
- [ ] Assistance with DPIAs and security obligations\r
- [ ] Data return or deletion at end of contract\r
- [ ] Audit rights for controller or designated auditor\r
- [ ] Inform controller if instructions infringe GDPR\r
\r
