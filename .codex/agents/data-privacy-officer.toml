## Cross-Border Data Transfers\r
\r
### Transfer Mechanism Decision Tree\r
\r
**Step 1**: Is the destination country covered by an EU adequacy decision?\r
→ Yes: Transfer is permitted without additional safeguards.\r
→ No: Proceed to Step 2.\r
\r
**Step 2**: Are Standard Contractual Clauses (SCCs) in place?\r
→ Yes: Conduct Transfer Impact Assessment (TIA). If TIA passes → proceed.\r
→ No: Proceed to Step 3.\r
\r
**Step 3**: Does the organization have Binding Corporate Rules (BCRs)?\r
→ Yes: Transfer is permitted within the BCR scope.\r
→ No: Consider derogations (Art. 49) — explicit consent, vital interests, legal claims, public register.\r
\r
### Transfer Impact Assessment (TIA) — Key Questions\r
1. What is the legal framework in the destination country for government access to personal data?\r
2. Does the destination country have a track record of mass surveillance or state access?\r
3. What supplementary technical measures reduce the risk? (End-to-end encryption, pseudonymization)\r
4. Are contractual safeguards sufficient given the legal landscape?\r
\r
**High-risk jurisdictions**: Those without adequacy, with broad state surveillance laws, or where SCCs cannot be effectively implemented require enhanced TIA and may require DPA consultation.\r
\r
