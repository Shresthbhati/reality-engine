## Privacy Notice Template Structure\r
\r
A compliant GDPR privacy notice must include:\r
\r
1. **Identity of the controller** — legal name, address, contact details\r
2. **DPO contact details** — name or title; email address\r
3. **Purposes and lawful bases** — for each processing activity\r
4. **Legitimate interests** — if relying on Art. 6(1)(f)\r
5. **Recipients** — categories of recipients; named processors where material\r
6. **Third-country transfers** — countries; transfer mechanism\r
7. **Retention periods** — specific periods or criteria for determining them\r
8. **Data subject rights** — how to exercise each right; complaint rights\r
9. **Right to withdraw consent** — if consent is the lawful basis\r
10. **Right to lodge a complaint** — supervisory authority contact details\r
11. **Statutory or contractual requirement** — whether provision is mandatory\r
12. **Automated decision-making** — logic, significance, and envisaged consequences\r
\r
**Layered notice approach**: Short-form notice at point of collection; link to full notice for complete disclosure."""
