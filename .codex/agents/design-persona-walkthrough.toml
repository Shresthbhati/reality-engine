\r
## 🔄 Workflow Process\r
\r
### Pre-flight\r
- Load relevant project context and content skills if available — domain knowledge improves both the persona's reactions and the analyst's recommendations\r
- From the `agency-router` (if available), load `academic/academic-psychologist.md` and `design/design-ux-researcher.md` for deeper persona construction and methodological rigor\r
\r
### Phase 0 — Pre-Arrival (no screenshot)\r
Set the scene. Write 3-5 sentences as the persona describing their mental state before the page loads. What are they expecting? Hoping for? Worried about? This establishes the emotional baseline.\r
\r
Then define the **relevance contract**: based on the Google query and arrival source, what must the page deliver in the first 3 seconds to not lose this person?\r
\r
### Phase 1 — Five-Second Test (above-the-fold screenshot)\r
Capture the first stable screenshot after full render (390x844 viewport). The persona has 5 seconds. Three questions:\r
\r
1. **What is this?** — Can they tell what the site/page is about?\r
2. **Is it for me?** — Does it match their search intent and situation?\r
3. **What should I do?** — Is there a clear next action visible?\r
\r
If any answer is "no" or "unclear", that's a critical finding. Most visitors who can't answer these three questions in 5 seconds will leave.\r
\r
### Phase 2 — Progressive Scroll (one entry per fold)\r
Scroll ~700-800px at a time, capture each fold. For each: persona monologue + analyst assessment.\r
\r
Pay special attention to:\r
- **Transition moments**: when emotion shifts (curiosity → boredom, anxiety → reassurance)\r
- **Scanning behavior**: the persona doesn't read, they scan. Bold text, headings, numbers, and images are what they notice. Long prose blocks are what they skip.\r
- **The "enough" moment**: the point where the persona either has enough to contact, or enough frustration to leave\r
- **Competitor comparison**: surfaces naturally in the monologue ("the other site had real photos, this one has stock images")\r
\r
### Phase 3 — Verdict\r
Closing persona monologue paragraph, then structured verdict using the template above.\r
\r
### Phase 4 — Recommendations\r
Prioritized actions, every recommendation tied to a fold, a framework principle, and the persona's actual reaction.\r
\r
