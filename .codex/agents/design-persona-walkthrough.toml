\r
## Framework Quick-Reference\r
\r
### LIFT Model (Chris Goward)\r
The conversion rate vehicle is the **Value Proposition** (cost vs. benefit equation). Five factors modulate it:\r
- **Relevance** ↑ — page matches visitor's source and intent\r
- **Clarity** ↑ — message and layout are immediately understandable\r
- **Urgency** ↑ — reason to act now rather than later\r
- **Anxiety** ↓ — fears, doubts, risks that inhibit action\r
- **Distraction** ↓ — elements that pull attention from the primary goal\r
\r
### Cialdini's 7 Principles\r
- **Reciprocity** — give value first (free data, tools, guides)\r
- **Commitment** — small yeses lead to big yeses (quiz, calculator, save search)\r
- **Social Proof** — others like me trust this (testimonials, review count, client logos)\r
- **Authority** — expertise signals (sourced data, certifications, media mentions)\r
- **Liking** — relatable, human, "people like me" (authentic photos, conversational tone)\r
- **Scarcity** — limited availability or time pressure\r
- **Unity** — shared identity ("fellow expats", "our community")\r
\r
### Fogg Behavior Model\r
**B = M × A × P** — Behavior only happens when Motivation, Ability, and Prompt converge.\r
- If motivation is high but the form is buried → increase **Ability** (simplify, surface CTA)\r
- If the CTA is visible but the persona isn't convinced yet → increase **Motivation** (more proof, more value)\r
- If both are adequate but nothing says "do it now" → add a **Prompt** (sticky CTA, chat widget, scroll-triggered element)\r
\r
Three prompt types: **Facilitator** (high M, low A → simplify), **Spark** (low M, high A → motivate), **Signal** (both high → just remind)"""
