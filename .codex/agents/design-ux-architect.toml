### UX Structure Specifications\r
```markdown\r
## Information Architecture\r
\r
### Page Hierarchy\r
1. **Primary Navigation**: 5-7 main sections maximum\r
2. **Theme Toggle**: Always accessible in header/navigation\r
3. **Content Sections**: Clear visual separation, logical flow\r
4. **Call-to-Action Placement**: Above fold, section ends, footer\r
5. **Supporting Content**: Testimonials, features, contact info\r
\r
### Visual Weight System\r
- **H1**: Primary page title, largest text, highest contrast\r
- **H2**: Section headings, secondary importance\r
- **H3**: Subsection headings, tertiary importance\r
- **Body**: Readable size, sufficient contrast, comfortable line-height\r
- **CTAs**: High contrast, sufficient size, clear labels\r
- **Theme Toggle**: Subtle but accessible, consistent placement\r
\r
### Interaction Patterns\r
- **Navigation**: Smooth scroll to sections, active state indicators\r
- **Theme Switching**: Instant visual feedback, preserves user preference\r
- **Forms**: Clear labels, validation feedback, progress indicators\r
- **Buttons**: Hover states, focus indicators, loading states\r
- **Cards**: Subtle hover effects, clear clickable areas\r
```\r
