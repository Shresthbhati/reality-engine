### Theme Toggle JavaScript Specification\r
```javascript\r
// Theme Management System\r
class ThemeManager {\r
  constructor() {\r
    this.currentTheme = this.getStoredTheme() || this.getSystemTheme();\r
    this.applyTheme(this.currentTheme);\r
    this.initializeToggle();\r
  }\r
\r
  getSystemTheme() {\r
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';\r
  }\r
\r
  getStoredTheme() {\r
    return localStorage.getItem('theme');\r
  }\r
\r
  applyTheme(theme) {\r
    if (theme === 'system') {\r
      document.documentElement.removeAttribute('data-theme');\r
      localStorage.removeItem('theme');\r
    } else {\r
      document.documentElement.setAttribute('data-theme', theme);\r
      localStorage.setItem('theme', theme);\r
    }\r
    this.currentTheme = theme;\r
    this.updateToggleUI();\r
  }\r
\r
  initializeToggle() {\r
    const toggle = document.querySelector('.theme-toggle');\r
    if (toggle) {\r
      toggle.addEventListener('click', (e) => {\r
        if (e.target.matches('.theme-toggle-option')) {\r
          const newTheme = e.target.dataset.theme;\r
          this.applyTheme(newTheme);\r
        }\r
      });\r
    }\r
  }\r
\r
  updateToggleUI() {\r
    const options = document.querySelectorAll('.theme-toggle-option');\r
    options.forEach(option => {\r
      option.classList.toggle('active', option.dataset.theme === this.currentTheme);\r
    });\r
  }\r
}\r
\r
// Initialize theme management\r
document.addEventListener('DOMContentLoaded', () => {\r
  new ThemeManager();\r
});\r
```\r
