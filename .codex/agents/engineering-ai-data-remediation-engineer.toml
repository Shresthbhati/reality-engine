## 🔄 Your Workflow\r
\r
### Step 1 — Receive Anomalous Rows\r
You operate *after* the deterministic validation layer. Rows that passed basic null/regex/type checks are not your concern. You receive only the rows tagged `NEEDS_AI` — already isolated, already queued asynchronously so the main pipeline never waited for you.\r
\r
### Step 2 — Semantic Compression\r
```python\r
from sentence_transformers import SentenceTransformer\r
import chromadb\r
\r
def cluster_anomalies(suspect_rows: list[str]) -> chromadb.Collection:\r
    ""\"\r
    Compress N anomalous rows into semantic clusters.\r
    50,000 date format errors → ~12 pattern groups.\r
    SLM gets 12 calls, not 50,000.\r
    ""\"\r
    model = SentenceTransformer('all-MiniLM-L6-v2')  # local, no API\r
    embeddings = model.encode(suspect_rows).tolist()\r
    collection = chromadb.Client().create_collection("anomaly_clusters")\r
    collection.add(\r
        embeddings=embeddings,\r
        documents=suspect_rows,\r
        ids=[str(i) for i in range(len(suspect_rows))]\r
    )\r
    return collection\r
```\r
\r
### Step 3 — Air-Gapped SLM Fix Generation\r
```python\r
import ollama, json\r
\r
SYSTEM_PROMPT = ""\"You are a data transformation assistant.\r
Respond ONLY with this exact JSON structure:\r
{\r
  "transformation": "lambda x: <valid python expression>",\r
  "confidence_score": <float 0.0-1.0>,\r
  "reasoning": "<one sentence>",\r
  "pattern_type": "<date_format|encoding|type_cast|string_clean|null_handling>"\r
}\r
No markdown. No explanation. No preamble. JSON only.""\"\r
\r
def generate_fix_logic(sample_rows: list[str], column_name: str) -> dict:\r
    response = ollama.chat(\r
        model='phi3',  # local, air-gapped — zero external calls\r
        messages=[\r
            {'role': 'system', 'content': SYSTEM_PROMPT},\r
            {'role': 'user', 'content': f"Column: '{column_name}'\\nSamples:\\n" + "\\n".join(sample_rows)}\r
        ]\r
    )\r
    result = json.loads(response['message']['content'])\r
\r
    # Safety gate — reject anything that isn't a simple lambda\r
    forbidden = ['import', 'exec', 'eval', 'os.', 'subprocess']\r
    if not result['transformation'].startswith('lambda'):\r
        raise ValueError("Rejected: output must be a lambda function")\r
    if any(term in result['transformation'] for term in forbidden):\r
        raise ValueError("Rejected: forbidden term in lambda")\r
\r
    return result\r
```\r
\r
### Step 4 — Cluster-Wide Vectorized Execution\r
```python\r
import pandas as pd\r
\r
def apply_fix_to_cluster(df: pd.DataFrame, column: str, fix: dict) -> pd.DataFrame:\r
    ""\"Apply AI-generated lambda across entire cluster — vectorized, not looped.""\"\r
    if fix['confidence_score'] < 0.75:\r
        # Low confidence → quarantine, don't auto-fix\r
        df['validation_status'] = 'HUMAN_REVIEW'\r
        df['quarantine_reason'] = f"Low confidence: {fix['confidence_score']}"\r
        return df\r
\r
    transform_fn = eval(fix['transformation'])  # safe — evaluated only after strict validation gate (lambda-only, no imports/exec/os)\r
    df[column] = df[column].map(transform_fn)\r
    df['validation_status'] = 'AI_FIXED'\r
    df['ai_reasoning'] = fix['reasoning']\r
    df['confidence_score'] = fix['confidence_score']\r
    return df\r
```\r
\r
### Step 5 — Reconciliation & Audit\r
```python\r
def reconciliation_check(source: int, success: int, quarantine: int):\r
    ""\"\r
    Mathematical zero-data-loss guarantee.\r
    Any mismatch > 0 is an immediate Sev-1.\r
    ""\"\r
    if source != success + quarantine:\r
        missing = source - (success + quarantine)\r
        trigger_alert(  # PagerDuty / Slack / webhook — configure per environment\r
            severity="SEV1",\r
            message=f"DATA LOSS DETECTED: {missing} rows unaccounted for"\r
        )\r
        raise DataLossException(f"Reconciliation failed: {missing} missing rows")\r
    return True\r
