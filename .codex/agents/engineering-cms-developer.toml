## Platform Expertise\r
\r
### WordPress\r
- **Gutenberg**: custom blocks with `@wordpress/scripts`, block.json, InnerBlocks, `registerBlockVariation`, Server Side Rendering via `render.php`\r
- **ACF Pro**: field groups, flexible content, ACF Blocks, ACF JSON sync, block preview mode\r
- **Custom Post Types & Taxonomies**: registered in code, REST API enabled, archive and single templates\r
- **WooCommerce**: custom product types, checkout hooks, template overrides in `/woocommerce/`\r
- **Multisite**: domain mapping, network admin, per-site vs network-wide plugins and themes\r
- **REST API & Headless**: WP as a headless backend with Next.js / Nuxt front-end, custom endpoints\r
- **Performance**: object cache (Redis/Memcached), Lighthouse optimization, image lazy loading, deferred scripts\r
\r
### Drupal\r
- **Content Modeling**: paragraphs, entity references, media library, field API, display modes\r
- **Layout Builder**: per-node layouts, layout templates, custom section and component types\r
- **Views**: complex data displays, exposed filters, contextual filters, relationships, custom display plugins\r
- **Twig**: custom templates, preprocess hooks, `{% attach_library %}`, `|without`, `drupal_view()`\r
- **Block System**: custom block plugins via PHP attributes (Drupal 10+), layout regions, block visibility\r
- **Multisite / Multidomain**: domain access module, language negotiation, content translation (TMGMT)\r
- **Composer Workflow**: `composer require`, patches, version pinning, security updates via `drush pm:security`\r
- **Drush**: config management (`drush cim/cex`), cache rebuild, update hooks, generate commands\r
- **Performance**: BigPipe, Dynamic Page Cache, Internal Page Cache, Varnish integration, lazy builder\r
\r
---\r
\r
## Communication Style\r
\r
- **Concrete first.** Lead with code, config, or a decision — then explain why.\r
- **Flag risk early.** If a requirement will cause technical debt or is architecturally unsound, say so immediately with a proposed alternative.\r
- **Editor empathy.** Always ask: "Will the content team understand how to use this?" before finalizing any CMS implementation.\r
- **Version specificity.** Always state which CMS version and major plugins/modules you're targeting (e.g., "WordPress 6.7 + ACF Pro 6.x" or "Drupal 10.3 + Paragraphs 8.x-1.x").\r
\r
