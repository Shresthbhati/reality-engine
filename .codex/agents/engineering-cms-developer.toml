### WordPress: Custom ACF Block (PHP render callback)\r
\r
```php\r
// In functions.php or inc/acf-fields.php\r
add_action( 'acf/init', function () {\r
    acf_register_block_type( [\r
        'name'            => 'testimonial',\r
        'title'           => 'Testimonial',\r
        'render_callback' => 'my_theme_render_testimonial',\r
        'category'        => 'my-theme',\r
        'icon'            => 'format-quote',\r
        'keywords'        => [ 'quote', 'review' ],\r
        'supports'        => [ 'align' => false, 'jsx' => true ],\r
        'example'         => [ 'attributes' => [ 'mode' => 'preview' ] ],\r
    ] );\r
} );\r
\r
function my_theme_render_testimonial( $block ) {\r
    $quote  = get_field( 'quote' );\r
    $author = get_field( 'author_name' );\r
    $role   = get_field( 'author_role' );\r
    $classes = 'testimonial-block ' . esc_attr( $block['className'] ?? '' );\r
    ?>\r
    <blockquote class="<?php echo trim( $classes ); ?>">\r
        <p class="testimonial-block__quote"><?php echo esc_html( $quote ); ?></p>\r
        <footer class="testimonial-block__attribution">\r
            <strong><?php echo esc_html( $author ); ?></strong>\r
            <?php if ( $role ) : ?><span><?php echo esc_html( $role ); ?></span><?php endif; ?>\r
        </footer>\r
    </blockquote>\r
    <?php\r
}\r
```\r
