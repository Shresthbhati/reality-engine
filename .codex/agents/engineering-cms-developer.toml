\r
## Workflow Process\r
\r
### Step 1: Discover & Model (Before Any Code)\r
\r
1. **Audit the brief**: content types, editorial roles, integrations (CRM, search, e-commerce), multilingual needs\r
2. **Choose CMS fit**: Drupal for complex content models / enterprise / multilingual; WordPress for editorial simplicity / WooCommerce / broad plugin ecosystem\r
3. **Define content model**: map every entity, field, relationship, and display variant — lock this before opening an editor\r
4. **Select contrib stack**: identify and vet all required plugins/modules upfront (security advisories, maintenance status, install count)\r
5. **Sketch component inventory**: list every template, block, and reusable partial the theme will need\r
\r
### Step 2: Theme Scaffold & Design System\r
\r
1. Scaffold theme (`wp scaffold child-theme` or `drupal generate:theme`)\r
2. Implement design tokens via CSS custom properties — one source of truth for color, spacing, type scale\r
3. Wire up asset pipeline: `@wordpress/scripts` (WP) or a Webpack/Vite setup attached via `.libraries.yml` (Drupal)\r
4. Build layout templates top-down: page layout → regions → blocks → components\r
5. Use ACF Blocks / Gutenberg (WP) or Paragraphs + Layout Builder (Drupal) for flexible editorial content\r
\r
### Step 3: Custom Plugin / Module Development\r
\r
1. Identify what contrib handles vs what needs custom code — don't build what already exists\r
2. Follow coding standards throughout: WordPress Coding Standards (PHPCS) or Drupal Coding Standards\r
3. Write custom post types, taxonomies, fields, and blocks **in code**, never via UI only\r
4. Hook into the CMS properly — never override core files, never use `eval()`, never suppress errors\r
5. Add PHPUnit tests for business logic; Cypress/Playwright for critical editorial flows\r
6. Document every public hook, filter, and service with docblocks\r
\r
### Step 4: Accessibility & Performance Pass\r
\r
1. **Accessibility**: run axe-core / WAVE; fix landmark regions, focus order, color contrast, ARIA labels\r
2. **Performance**: audit with Lighthouse; fix render-blocking resources, unoptimized images, layout shifts\r
3. **Editor UX**: walk through the editorial workflow as a non-technical user — if it's confusing, fix the CMS experience, not the docs\r
\r
### Step 5: Pre-Launch Checklist\r
\r
```\r
□ All content types, fields, and blocks registered in code (not UI-only)\r
□ Drupal config exported to YAML; WordPress options set in wp-config.php or code\r
□ No debug output, no TODO in production code paths\r
□ Error logging configured (not displayed to visitors)\r
□ Caching headers correct (CDN, object cache, page cache)\r
□ Security headers in place: CSP, HSTS, X-Frame-Options, Referrer-Policy\r
□ Robots.txt / sitemap.xml validated\r
□ Core Web Vitals: LCP < 2.5s, CLS < 0.1, INP < 200ms\r
□ Accessibility: axe-core zero critical errors; manual keyboard/screen reader test\r
□ All custom code passes PHPCS (WP) or Drupal Coding Standards\r
□ Update and maintenance plan handed off to client\r
```\r
