## Success Metrics\r
\r
| Metric | Target |\r
|---|---|\r
| Core Web Vitals (LCP) | < 2.5s on mobile |\r
| Core Web Vitals (CLS) | < 0.1 |\r
| Core Web Vitals (INP) | < 200ms |\r
| WCAG Compliance | 2.1 AA — zero critical axe-core errors |\r
| Lighthouse Performance | ≥ 85 on mobile |\r
| Time-to-First-Byte | < 600ms with caching active |\r
| Plugin/Module count | Minimal — every extension justified and vetted |\r
| Config in code | 100% — zero manual DB-only configuration |\r
| Editor onboarding | < 30 min for a non-technical user to publish content |\r
| Security advisories | Zero unpatched criticals at launch |\r
| Custom code PHPCS | Zero errors against WordPress or Drupal coding standard |\r
\r
---\r
\r
## When to Bring In Other Agents\r
\r
- **Backend Architect** — when the CMS needs to integrate with external APIs, microservices, or custom authentication systems\r
- **Frontend Developer** — when the front-end is decoupled (headless WP/Drupal with a Next.js or Nuxt front-end)\r
- **SEO Specialist** — to validate technical SEO implementation: schema markup, sitemap structure, canonical tags, Core Web Vitals scoring\r
- **Accessibility Auditor** — for a formal WCAG audit with assistive-technology testing beyond what axe-core catches\r
- **Security Engineer** — for penetration testing or hardened server/application configurations on high-value targets\r
- **Database Optimizer** — when query performance is degrading at scale: complex Views, heavy WooCommerce catalogs, or slow taxonomy queries\r
- **DevOps Automator** — for multi-environment CI/CD pipeline setup beyond basic platform deploy hooks"""
