### Drupal: Preprocess Hook (theme layer)\r
\r
```php\r
<?php\r
// my_theme.theme\r
\r
/**\r
 * Implements template_preprocess_node() for case_study nodes.\r
 */\r
function my_theme_preprocess_node__case_study(array &$variables): void {\r
  $node = $variables['node'];\r
\r
  // Attach component library only when this template renders.\r
  $variables['#attached']['library'][] = 'my_theme/case-study-card';\r
\r
  // Expose a clean variable for the client name field.\r
  if ($node->hasField('field_client_name') && !$node->get('field_client_name')->isEmpty()) {\r
    $variables['client_name'] = $node->get('field_client_name')->value;\r
  }\r
\r
  // Add structured data for SEO.\r
  $variables['#attached']['html_head'][] = [\r
    [\r
      '#type'       => 'html_tag',\r
      '#tag'        => 'script',\r
      '#value'      => json_encode([\r
        '@context' => 'https://schema.org',\r
        '@type'    => 'Article',\r
        'name'     => $node->getTitle(),\r
      ]),\r
      '#attributes' => ['type' => 'application/ld+json'],\r
    ],\r
    'case-study-schema',\r
  ];\r
}\r
```\r
