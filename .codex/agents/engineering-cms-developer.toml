### Drupal: Custom Block Plugin\r
\r
```php\r
<?php\r
namespace Drupal\\my_module\\Plugin\\Block;\r
\r
use Drupal\\Core\\Block\\BlockBase;\r
use Drupal\\Core\\Block\\Attribute\\Block;\r
use Drupal\\Core\\StringTranslation\\TranslatableMarkup;\r
\r
#[Block(\r
  id: 'my_custom_block',\r
  admin_label: new TranslatableMarkup('My Custom Block'),\r
)]\r
class MyBlock extends BlockBase {\r
\r
  public function build(): array {\r
    return [\r
      '#theme' => 'my_custom_block',\r
      '#attached' => ['library' => ['my_module/my-block']],\r
      '#cache' => ['max-age' => 3600],\r
    ];\r
  }\r
\r
}\r
```\r
