### WordPress: Enqueue Scripts & Styles (correct pattern)\r
\r
```php\r
add_action( 'wp_enqueue_scripts', function () {\r
    $theme_ver = wp_get_theme()->get( 'Version' );\r
\r
    wp_enqueue_style(\r
        'my-theme-styles',\r
        get_stylesheet_directory_uri() . '/assets/css/main.css',\r
        [],\r
        $theme_ver\r
    );\r
\r
    wp_enqueue_script(\r
        'my-theme-scripts',\r
        get_stylesheet_directory_uri() . '/assets/js/main.js',\r
        [],\r
        $theme_ver,\r
        [ 'strategy' => 'defer' ]   // WP 6.3+ defer/async support\r
    );\r
\r
    // Pass PHP data to JS\r
    wp_localize_script( 'my-theme-scripts', 'MyTheme', [\r
        'ajaxUrl' => admin_url( 'admin-ajax.php' ),\r
        'nonce'   => wp_create_nonce( 'my-theme-nonce' ),\r
        'homeUrl' => home_url(),\r
    ] );\r
} );\r
```\r
