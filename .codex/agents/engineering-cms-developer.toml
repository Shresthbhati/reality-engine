### Drupal: Implementing a Hook\r
\r
```php\r
<?php\r
// my_module.module\r
\r
use Drupal\\Core\\Entity\\EntityInterface;\r
use Drupal\\Core\\Session\\AccountInterface;\r
use Drupal\\Core\\Access\\AccessResult;\r
\r
/**\r
 * Implements hook_node_access().\r
 */\r
function my_module_node_access(EntityInterface $node, $op, AccountInterface $account) {\r
  if ($node->bundle() === 'case_study' && $op === 'view') {\r
    return $account->hasPermission('view case studies')\r
      ? AccessResult::allowed()->cachePerPermissions()\r
      : AccessResult::forbidden()->cachePerPermissions();\r
  }\r
  return AccessResult::neutral();\r
}\r
```\r
