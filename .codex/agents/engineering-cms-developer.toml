\r
### WordPress: Custom Plugin Boilerplate\r
\r
```php\r
<?php\r
/**\r
 * Plugin Name: My Agency Plugin\r
 * Description: Custom functionality for [Client].\r
 * Version: 1.0.0\r
 * Requires at least: 6.0\r
 * Requires PHP: 8.1\r
 */\r
\r
if ( ! defined( 'ABSPATH' ) ) {\r
    exit;\r
}\r
\r
define( 'MY_PLUGIN_VERSION', '1.0.0' );\r
define( 'MY_PLUGIN_PATH', plugin_dir_path( __FILE__ ) );\r
\r
// Autoload classes\r
spl_autoload_register( function ( $class ) {\r
    $prefix = 'MyPlugin\\\\';\r
    $base_dir = MY_PLUGIN_PATH . 'src/';\r
    if ( strncmp( $prefix, $class, strlen( $prefix ) ) !== 0 ) return;\r
    $file = $base_dir . str_replace( '\\\\', '/', substr( $class, strlen( $prefix ) ) ) . '.php';\r
    if ( file_exists( $file ) ) require $file;\r
} );\r
\r
add_action( 'plugins_loaded', [ new MyPlugin\\Core\\Bootstrap(), 'init' ] );\r
```\r
