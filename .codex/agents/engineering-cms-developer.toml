├── template-parts/        # Reusable partials\r
│   ├── content-card.php\r
│   └── hero.php\r
├── inc/\r
│   ├── custom-post-types.php\r
│   ├── taxonomies.php\r
│   ├── acf-fields.php     # ACF field group registration (JSON sync)\r
│   └── enqueue.php\r
├── assets/\r
