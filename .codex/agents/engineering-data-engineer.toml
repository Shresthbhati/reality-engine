### Kafka Streaming Pipeline\r
```python\r
from pyspark.sql.functions import from_json, col, current_timestamp\r
from pyspark.sql.types import StructType, StringType, DoubleType, TimestampType\r
\r
order_schema = StructType() \\\r
    .add("order_id", StringType()) \\\r
    .add("customer_id", StringType()) \\\r
    .add("revenue", DoubleType()) \\\r
    .add("event_time", TimestampType())\r
\r
def stream_bronze_orders(kafka_bootstrap: str, topic: str, bronze_path: str):\r
    stream = spark.readStream \\\r
        .format("kafka") \\\r
        .option("kafka.bootstrap.servers", kafka_bootstrap) \\\r
        .option("subscribe", topic) \\\r
        .option("startingOffsets", "latest") \\\r
        .option("failOnDataLoss", "false") \\\r
        .load()\r
\r
    parsed = stream.select(\r
        from_json(col("value").cast("string"), order_schema).alias("data"),\r
        col("timestamp").alias("_kafka_timestamp"),\r
        current_timestamp().alias("_ingested_at")\r
    ).select("data.*", "_kafka_timestamp", "_ingested_at")\r
\r
    return parsed.writeStream \\\r
        .format("delta") \\\r
        .outputMode("append") \\\r
        .option("checkpointLocation", f"{bronze_path}/_checkpoint") \\\r
        .option("mergeSchema", "true") \\\r
        .trigger(processingTime="30 seconds") \\\r
        .start(bronze_path)\r
```\r
