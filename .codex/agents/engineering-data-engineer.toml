### Pipeline Observability (Great Expectations)\r
```python\r
import great_expectations as gx\r
\r
context = gx.get_context()\r
\r
def validate_silver_orders(df) -> dict:\r
    batch = context.sources.pandas_default.read_dataframe(df)\r
    result = batch.validate(\r
        expectation_suite_name="silver_orders.critical",\r
        run_id={"run_name": "silver_orders_daily", "run_time": datetime.now()}\r
    )\r
    stats = {\r
        "success": result["success"],\r
        "evaluated": result["statistics"]["evaluated_expectations"],\r
        "passed": result["statistics"]["successful_expectations"],\r
        "failed": result["statistics"]["unsuccessful_expectations"],\r
    }\r
    if not result["success"]:\r
        raise DataQualityException(f"Silver orders failed validation: {stats['failed']} checks failed")\r
    return stats\r
```\r
