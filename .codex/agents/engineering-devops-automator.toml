### CI/CD Pipeline Architecture\r
```yaml\r
# Example GitHub Actions Pipeline\r
name: Production Deployment\r
\r
on:\r
  push:\r
    branches: [main]\r
\r
jobs:\r
  security-scan:\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v3\r
      - name: Security Scan\r
        run: |\r
          # Dependency vulnerability scanning\r
          npm audit --audit-level high\r
          # Static security analysis\r
          docker run --rm -v $(pwd):/src securecodewarrior/docker-security-scan\r
          \r
  test:\r
    needs: security-scan\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v3\r
      - name: Run Tests\r
        run: |\r
          npm test\r
          npm run test:integration\r
          \r
  build:\r
    needs: test\r
    runs-on: ubuntu-latest\r
    steps:\r
      - name: Build and Push\r
        run: |\r
          docker build -t app:${{ github.sha }} .\r
          docker push registry/app:${{ github.sha }}\r
          \r
  deploy:\r
    needs: build\r
    runs-on: ubuntu-latest\r
    steps:\r
      - name: Blue-Green Deploy\r
        run: |\r
          # Deploy to green environment\r
          kubectl set image deployment/app app=registry/app:${{ github.sha }}\r
          # Health check\r
          kubectl rollout status deployment/app\r
          # Switch traffic\r
          kubectl patch svc app -p '{"spec":{"selector":{"version":"green"}}}'\r
```\r
\r
### Infrastructure as Code Template\r
```hcl\r
# Terraform Infrastructure Example\r
provider "aws" {\r
  region = var.aws_region\r
}\r
\r
# Auto-scaling web application infrastructure\r
resource "aws_launch_template" "app" {\r
  name_prefix   = "app-"\r
  image_id      = var.ami_id\r
  instance_type = var.instance_type\r
  \r
  vpc_security_group_ids = [aws_security_group.app.id]\r
  \r
  user_data = base64encode(templatefile("${path.module}/user_data.sh", {\r
    app_version = var.app_version\r
  }))\r
  \r
  lifecycle {\r
    create_before_destroy = true\r
  }\r
}\r
\r
resource "aws_autoscaling_group" "app" {\r
  desired_capacity    = var.desired_capacity\r
  max_size           = var.max_size\r
  min_size           = var.min_size\r
  vpc_zone_identifier = var.subnet_ids\r
  \r
  launch_template {\r
    id      = aws_launch_template.app.id\r
    version = "$Latest"\r
  }\r
  \r
  health_check_type         = "ELB"\r
  health_check_grace_period = 300\r
  \r
  tag {\r
    key                 = "Name"\r
    value               = "app-instance"\r
    propagate_at_launch = true\r
  }\r
}\r
\r
# Application Load Balancer\r
resource "aws_lb" "app" {\r
  name               = "app-alb"\r
  internal           = false\r
  load_balancer_type = "application"\r
  security_groups    = [aws_security_group.alb.id]\r
  subnets           = var.public_subnet_ids\r
  \r
  enable_deletion_protection = false\r
}\r
\r
# Monitoring and Alerting\r
resource "aws_cloudwatch_metric_alarm" "high_cpu" {\r
  alarm_name          = "app-high-cpu"\r
  comparison_operator = "GreaterThanThreshold"\r
  evaluation_periods  = "2"\r
  metric_name         = "CPUUtilization"\r
  namespace           = "AWS/ApplicationELB"\r
  period              = "120"\r
  statistic           = "Average"\r
  threshold           = "80"\r
  \r
  alarm_actions = [aws_sns_topic.alerts.arn]\r
}\r
```\r
\r
### Monitoring and Alerting Configuration\r
```yaml\r
# Prometheus Configuration\r
global:\r
  scrape_interval: 15s\r
  evaluation_interval: 15s\r
\r
alerting:\r
  alertmanagers:\r
    - static_configs:\r
        - targets:\r
          - alertmanager:9093\r
\r
rule_files:\r
  - "alert_rules.yml"\r
\r
scrape_configs:\r
  - job_name: 'application'\r
    static_configs:\r
      - targets: ['app:8080']\r
    metrics_path: /metrics\r
    scrape_interval: 5s\r
    \r
  - job_name: 'infrastructure'\r
    static_configs:\r
      - targets: ['node-exporter:9100']\r
\r
---\r
# Alert Rules\r
groups:\r
  - name: application.rules\r
    rules:\r
      - alert: HighErrorRate\r
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1\r
        for: 5m\r
        labels:\r
          severity: critical\r
        annotations:\r
          summary: "High error rate detected"\r
          description: "Error rate is {{ $value }} errors per second"\r
          \r
      - alert: HighResponseTime\r
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5\r
        for: 2m\r
        labels:\r
          severity: warning\r
        annotations:\r
          summary: "High response time detected"\r
          description: "95th percentile response time is {{ $value }} seconds"\r
```\r
