## 📋 Your Technical Deliverables\r
\r
### Product Architecture Blueprint\r
\r
```\r
DRUPAL COMMERCE PRODUCT ARCHITECTURE\r
───────────────────────────────────────\r
STORE CONFIGURATION\r
  Store type:           [Online / Physical / Multi-store]\r
  Default currency:     [USD / EUR / multi-currency]\r
  Tax registration:     [Jurisdictions where tax is collected]\r
  Billing countries:    [Allowed billing/shipping countries]\r
\r
PRODUCT TYPE\r
  Machine name:         [e.g., default, apparel, digital]\r
  Product fields:       [title, body, images, brand, category…]\r
  Variation type:       [Linked variation type]\r
  Stores:               [Single store / assigned stores]\r
\r
PRODUCT VARIATION TYPE\r
  Machine name:         [e.g., apparel_variation]\r
  SKU pattern:          [How SKUs are generated/validated]\r
  Price field:          [commerce_price — list price + price]\r
  Attributes:           [Size, Color, Material…]\r
  Generates title:      [Auto from attributes? Yes/No]\r
  Inventory tracked:    [Yes/No — which stock provider]\r
\r
ATTRIBUTES\r
  Attribute:            [Size]   Values: [S, M, L, XL]\r
  Attribute:            [Color]  Values: [Red, Blue, Black]\r
  Rendered as:          [Select / radios / swatch widget]\r
\r
DERIVED MATRIX\r
  [Size × Color] → N variations, each with own SKU, price, stock\r
```\r
\r
### Checkout Flow Specification\r
\r
```\r
CHECKOUT FLOW DEFINITION\r
───────────────────────────────────────\r
FLOW: [machine_name — e.g., default, express, digital]\r
\r
STEP: Login\r
  Panes: [login, registration, guest checkout]\r
\r
STEP: Order Information\r
  Panes:\r
    □ contact_information   (email — required)\r
    □ billing_information   (address)\r
    □ shipping_information  (address + shipping rate)\r
    □ [custom pane: gift message / PO number / etc.]\r
  Validation: [Address verification? Tax recalculation?]\r
\r
STEP: Review\r
  Panes:\r
    □ review (order summary — items, prices, tax, total)\r
    □ [custom: terms acceptance / age verification]\r
\r
STEP: Payment\r
  Panes:\r
    □ payment_information (gateway + method selection)\r
    □ payment_process (on-site capture / redirect off-site)\r
\r
STEP: Complete\r
  Panes:\r
    □ completion_message\r
    □ [custom: receipt, fulfillment trigger, analytics event]\r
\r
CUSTOM PANE CONTRACT (for any added pane):\r
  - buildPaneForm() validates input, never trusts client values\r
  - validatePaneForm() blocks only on true errors\r
  - submitPaneForm() is idempotent and exception-safe\r
  - failure logs to watchdog and does NOT abort checkout\r
```\r
\r
### Payment Gateway Integration Spec\r
\r
```\r
PAYMENT GATEWAY INTEGRATION\r
───────────────────────────────────────\r
GATEWAY:               [Stripe / PayPal / Braintree / Authorize.Net / custom]\r
INTEGRATION TYPE:      [On-site (PCI SAQ A-EP) / Off-site redirect (SAQ A)]\r
MODE:                  [TEST / LIVE — must be explicit and visible]\r
\r
CREDENTIALS (never committed):\r
  Source:              [Environment variable / secrets manager]\r
  Keys required:       [Publishable key, secret key, webhook secret]\r
  Referenced via:      [settings.php override / config override]\r
\r
SUPPORTED OPERATIONS:\r
  □ Authorize          □ Authorize + Capture\r
  □ Capture (deferred) □ Void\r
  □ Refund (full)      □ Refund (partial)\r
  □ Stored payment methods (tokenization)\r
\r
WEBHOOK / IPN HANDLING:\r
  Endpoint:            [route + path]\r
  Signature verified:  [How — header + signing secret]\r
  Idempotency:         [Dedup by event/transaction ID]\r
  Logged:              [Every event to watchdog + payment record]\r
  Maps to:             [Commerce payment state transition]\r
\r
RECONCILIATION:\r
  Source of truth:     [Gateway settlement report]\r
  Match key:           [Payment remote_id ↔ gateway transaction ID]\r
  Discrepancy alert:   [How mismatches are surfaced]\r
\r
GO-LIVE CHECKLIST:\r
  □ Live credentials in production secrets only\r
  □ Webhook endpoint registered + signature verified live\r
  □ Test transaction captured AND refunded successfully\r
  □ Mode confirmed LIVE in production, TEST elsewhere\r
  □ Receipt emails verified\r
```\r
\r
### Order Workflow Map\r
\r
```\r
ORDER WORKFLOW (states + transitions)\r
───────────────────────────────────────\r
DEFAULT WORKFLOW (order_default):\r
  draft ──(place)──▶ completed\r
\r
FULFILLMENT WORKFLOW (order_fulfillment):\r
  draft\r
    └─(place)─▶ fulfillment\r
                  ├─(fulfill)─▶ completed\r
                  └─(cancel)──▶ canceled\r
\r
PAYMENT-DRIVEN STATES (custom example):\r
  draft ─(place)─▶ pending_payment\r
    ├─(payment_received)─▶ processing ─(ship)─▶ completed\r
    └─(payment_failed)───▶ canceled\r
\r
RULES:\r
  - Orders are NEVER deleted — only transitioned\r
  - Stock decrements on [payment_received], not add-to-cart\r
  - Each transition can fire events: email, fulfillment, ERP sync\r
  - Canceled/refunded orders retain full payment history\r
```\r
