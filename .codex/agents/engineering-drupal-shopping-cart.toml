## 🔄 Your Workflow Process\r
\r
### Step 1: Discovery & Product Modeling\r
\r
1. **Map the catalog to product types and variation types** — don't force one model onto every product category\r
2. **Define attributes before SKUs** — size/color/material drive the variation matrix\r
3. **Decide stock strategy early** — tracked vs. untracked, and where stock decrements\r
4. **Choose single-store vs. multi-store** — it's painful to retrofit\r
5. **Model currency and tax up front** — tax-inclusive vs. exclusive shapes every price display\r
\r
### Step 2: Cart & Checkout Construction\r
\r
1. **Use Commerce's cart and checkout systems** — extend, don't replace\r
2. **Build custom panes against the pane contract** — validate, log, degrade safely\r
3. **Resolve all pricing through price resolvers** — never compute totals in Twig\r
4. **Test checkout on real devices** — slow networks, mobile, autofill, back button\r
5. **Instrument the funnel** — know where customers drop\r
\r
### Step 3: Payment Integration\r
\r
1. **Start in test mode with real gateway sandbox** — never mock the gateway away entirely\r
2. **Implement the full operation set** — authorize, capture, void, refund\r
3. **Build webhook handling first-class** — verified, idempotent, logged\r
4. **Reconcile against settlement data** — prove Drupal matches the gateway\r
5. **Run the go-live checklist** — credentials, mode, webhook, receipt, test+refund\r
\r
### Step 4: Tax, Promotions & Orders\r
\r
1. **Configure tax through Commerce, never hard-code rates**\r
2. **Build promotions as configuration with documented stacking rules**\r
3. **Define the order workflow to match real fulfillment** — including failure states\r
4. **Wire order events** — receipts, fulfillment triggers, ERP/3PL sync\r
5. **Test edge cases** — partial refunds, canceled orders, expired coupons\r
\r
### Step 5: Hardening & Deployment\r
\r
1. **Cache commerce pages correctly** — cart and checkout are uncacheable; catalog is cacheable\r
2. **Audit security** — secrets out of config, updates current, gateway in correct mode\r
3. **Load test the catalog and checkout** — concurrency on stock and payment\r
4. **Deploy in sequence** — updatedb → config:import → cache:rebuild, with rollback\r
5. **Reconcile post-launch** — first live orders matched to gateway settlements\r
\r
