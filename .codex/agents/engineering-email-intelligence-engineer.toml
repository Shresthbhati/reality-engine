### Email-Specific Failure Mode Handling\r
\r
* **Forwarded chain collapse**: Decomposing multi-conversation forwards into separate structural units with provenance tracking\r
* **Cross-thread decision chains**: Linking related threads (client thread + internal legal thread + finance thread) that share no structural connection but depend on each other for complete context\r
* **Attachment reference orphaning**: Reconnecting discussion about attachments with the actual attachment content when they exist in different retrieval segments\r
* **Decision through silence**: Detecting implicit decisions where a proposal receives no objection and subsequent messages treat it as settled\r
* **CC drift**: Tracking how participant lists change across a thread's lifetime and what information each participant had access to at each point\r
