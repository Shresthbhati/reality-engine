### Step 1: Email Ingestion & Normalization\r
\r
```python\r
# Connect to email source and fetch raw messages\r
import imaplib\r
import email\r
from email import policy\r
\r
def fetch_thread(imap_conn, thread_ids):\r
    ""\"Fetch and parse raw messages, preserving full MIME structure.""\"\r
    messages = []\r
    for msg_id in thread_ids:\r
        _, data = imap_conn.fetch(msg_id, "(RFC822)")\r
        raw = data[0][1]\r
        parsed = email.message_from_bytes(raw, policy=policy.default)\r
        messages.append({\r
            "message_id": parsed["Message-ID"],\r
            "in_reply_to": parsed["In-Reply-To"],\r
            "references": parsed["References"],\r
            "from": parsed["From"],\r
            "to": parsed["To"],\r
            "cc": parsed["CC"],\r
            "date": parsed["Date"],\r
            "subject": parsed["Subject"],\r
            "body": extract_body(parsed),\r
            "attachments": extract_attachments(parsed)\r
        })\r
    return messages\r
```\r
\r
### Step 2: Thread Reconstruction & Deduplication\r
\r
```python\r
def reconstruct_thread(messages):\r
    ""\"Build conversation topology from message headers.\r
    \r
    Key challenges:\r
    - Forwarded chains collapse multiple conversations into one message body\r
    - Quoted replies duplicate content (20-msg thread = ~4-5x token bloat)\r
    - Thread forks when people reply to different messages in the chain\r
    ""\"\r
    # Build reply graph from In-Reply-To and References headers\r
    graph = {}\r
    for msg in messages:\r
        parent_id = msg["in_reply_to"]\r
        graph[msg["message_id"]] = {\r
            "parent": parent_id,\r
            "children": [],\r
            "message": msg\r
        }\r
    \r
    # Link children to parents\r
    for msg_id, node in graph.items():\r
        if node["parent"] and node["parent"] in graph:\r
            graph[node["parent"]]["children"].append(msg_id)\r
    \r
    # Deduplicate quoted content\r
    for msg_id, node in graph.items():\r
        node["message"]["unique_body"] = strip_quoted_content(\r
            node["message"]["body"],\r
            get_parent_bodies(node, graph)\r
        )\r
    \r
    return graph\r
\r
def strip_quoted_content(body, parent_bodies):\r
    ""\"Remove quoted text that duplicates parent messages.\r
    \r
    Handles multiple quoting styles:\r
    - Prefix quoting: lines starting with '>'\r
    - Delimiter quoting: '---Original Message---', 'On ... wrote:'\r
    - Outlook XML quoting: nested <div> blocks with specific classes\r
    ""\"\r
    lines = body.split("\\n")\r
    unique_lines = []\r
    in_quote_block = False\r
    \r
    for line in lines:\r
        if is_quote_delimiter(line):\r
            in_quote_block = True\r
            continue\r
        if in_quote_block and not line.strip():\r
            in_quote_block = False\r
            continue\r
        if not in_quote_block and not line.startswith(">"):\r
            unique_lines.append(line)\r
    \r
    return "\\n".join(unique_lines)\r
```\r
