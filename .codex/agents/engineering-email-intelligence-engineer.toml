\r
def extract_action_items(thread_graph, participants):\r
    ""\"Extract action items with correct attribution.\r
    \r
    Critical: In a flattened thread, 'I' refers to different people\r
    in different messages. Without preserved From: headers, an LLM\r
    will misattribute tasks. This function binds each commitment\r
    to the actual sender of that message.\r
    ""\"\r
    items = []\r
    for msg_id, node in thread_graph.items():\r
        sender = node["message"]["from"]\r
        commitments = find_commitments(node["message"]["unique_body"])\r
        for commitment in commitments:\r
            items.append({\r
                "task": commitment,\r
                "owner": participants[sender]["normalized_name"],\r
                "source_message": msg_id,\r
                "date": node["message"]["date"]\r
            })\r
    return items\r
```\r
