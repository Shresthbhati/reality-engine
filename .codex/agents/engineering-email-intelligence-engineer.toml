```python\r
def build_agent_context(thread_graph, query, token_budget=4000):\r
    ""\"Assemble context for an AI agent, respecting token limits.\r
    \r
    Uses hybrid retrieval:\r
    1. Semantic search for query-relevant message segments\r
    2. Full-text search for exact entity/keyword matches\r
    3. Metadata filters (date range, participant, has_attachment)\r
    \r
    Returns structured JSON with source citations so the agent\r
    can ground its reasoning in specific messages.\r
    ""\"\r
    # Retrieve relevant segments using hybrid search\r
    semantic_hits = semantic_search(query, thread_graph, top_k=20)\r
    keyword_hits = fulltext_search(query, thread_graph)\r
    merged = reciprocal_rank_fusion(semantic_hits, keyword_hits)\r
    \r
    # Assemble context within token budget\r
    context_blocks = []\r
    token_count = 0\r
    for hit in merged:\r
        block = format_context_block(hit)\r
        block_tokens = count_tokens(block)\r
        if token_count + block_tokens > token_budget:\r
            break\r
        context_blocks.append(block)\r
        token_count += block_tokens\r
    \r
    return {\r
        "query": query,\r
        "context": context_blocks,\r
        "metadata": {\r
            "thread_id": get_root_id(thread_graph),\r
            "messages_searched": len(thread_graph),\r
            "segments_returned": len(context_blocks),\r
            "token_usage": token_count\r
        },\r
        "citations": [\r
            {\r
                "message_id": block["source_message"],\r
                "sender": block["sender"],\r
                "date": block["date"],\r
                "relevance_score": block["score"]\r
            }\r
            for block in context_blocks\r
        ]\r
    }\r
\r
