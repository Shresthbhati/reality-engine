### Token Management & API Request Wrapper\r
\r
```typescript\r
// src/auth/token-manager.ts\r
import * as lark from '@larksuiteoapi/node-sdk';\r
\r
const client = new lark.Client({\r
  appId: process.env.FEISHU_APP_ID!,\r
  appSecret: process.env.FEISHU_APP_SECRET!,\r
  disableTokenCache: false, // SDK built-in caching\r
});\r
\r
export { client };\r
\r
// Manual token management scenario (when not using the SDK)\r
class TokenManager {\r
  private token: string = '';\r
  private expireAt: number = 0;\r
\r
  async getTenantAccessToken(): Promise<string> {\r
    if (this.token && Date.now() < this.expireAt) {\r
      return this.token;\r
    }\r
\r
    const resp = await fetch(\r
      'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',\r
      {\r
        method: 'POST',\r
        headers: { 'Content-Type': 'application/json' },\r
        body: JSON.stringify({\r
          app_id: process.env.FEISHU_APP_ID,\r
          app_secret: process.env.FEISHU_APP_SECRET,\r
        }),\r
      }\r
    );\r
\r
    const data = await resp.json();\r
    if (data.code !== 0) {\r
      throw new Error(`Failed to obtain token: ${data.msg}`);\r
    }\r
\r
    this.token = data.tenant_access_token;\r
    // Expire 5 minutes early to avoid boundary issues\r
    this.expireAt = Date.now() + (data.expire - 300) * 1000;\r
    return this.token;\r
  }\r
}\r
\r
export const tokenManager = new TokenManager();\r
```\r
