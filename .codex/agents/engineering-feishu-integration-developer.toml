### SSO QR Code Login\r
\r
```typescript\r
// src/sso/oauth-handler.ts\r
import { Router } from 'express';\r
\r
const router = Router();\r
\r
// Step 1: Redirect to Feishu authorization page\r
router.get('/login/feishu', (req, res) => {\r
  const redirectUri = encodeURIComponent(\r
    `${process.env.BASE_URL}/callback/feishu`\r
  );\r
  const state = generateRandomState();\r
  req.session!.oauthState = state;\r
\r
  res.redirect(\r
    `https://open.feishu.cn/open-apis/authen/v1/authorize` +\r
    `?app_id=${process.env.FEISHU_APP_ID}` +\r
    `&redirect_uri=${redirectUri}` +\r
    `&state=${state}`\r
  );\r
});\r
\r
// Step 2: Feishu callback — exchange code for user_access_token\r
router.get('/callback/feishu', async (req, res) => {\r
  const { code, state } = req.query;\r
\r
  if (state !== req.session!.oauthState) {\r
    return res.status(403).json({ error: 'State mismatch — possible CSRF attack' });\r
  }\r
\r
  const tokenResp = await client.authen.oidcAccessToken.create({\r
    data: {\r
      grant_type: 'authorization_code',\r
      code: code as string,\r
    },\r
  });\r
\r
  if (tokenResp.code !== 0) {\r
    return res.status(401).json({ error: 'Authorization failed' });\r
  }\r
\r
  const userToken = tokenResp.data!.access_token;\r
\r
  // Step 3: Retrieve user info\r
  const userResp = await client.authen.userInfo.get({\r
    headers: { Authorization: `Bearer ${userToken}` },\r
  });\r
\r
  const feishuUser = userResp.data;\r
  // Bind or create a local user linked to the Feishu user\r
  const localUser = await bindOrCreateUser({\r
    openId: feishuUser!.open_id!,\r
    unionId: feishuUser!.union_id!,\r
    name: feishuUser!.name!,\r
    email: feishuUser!.email!,\r
    avatar: feishuUser!.avatar_url!,\r
  });\r
\r
  const jwt = signJwt({ userId: localUser.id });\r
  res.redirect(`${process.env.FRONTEND_URL}/auth?token=${jwt}`);\r
});\r
\r
export default router;\r
```\r
