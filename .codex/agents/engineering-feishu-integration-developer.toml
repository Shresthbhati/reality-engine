\r
// Send a message card\r
async function sendCardMessage(\r
  client: any,\r
  receiveId: string,\r
  receiveIdType: 'open_id' | 'chat_id' | 'user_id',\r
  card: object\r
): Promise<string> {\r
  const resp = await client.im.message.create({\r
    params: { receive_id_type: receiveIdType },\r
    data: {\r
      receive_id: receiveId,\r
      msg_type: 'interactive',\r
      content: JSON.stringify(card),\r
    },\r
  });\r
\r
  if (resp.code !== 0) {\r
    throw new Error(`Failed to send card: ${resp.msg}`);\r
  }\r
  return resp.data!.message_id;\r
