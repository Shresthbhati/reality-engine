### Event Subscription & Callback Handling\r
\r
```typescript\r
// src/webhook/event-dispatcher.ts\r
import * as lark from '@larksuiteoapi/node-sdk';\r
import express from 'express';\r
\r
const app = express();\r
\r
const eventDispatcher = new lark.EventDispatcher({\r
  encryptKey: process.env.FEISHU_ENCRYPT_KEY || '',\r
  verificationToken: process.env.FEISHU_VERIFICATION_TOKEN || '',\r
});\r
\r
// Listen for bot message received events\r
eventDispatcher.register({\r
  'im.message.receive_v1': async (data) => {\r
    const message = data.message;\r
    const chatId = message.chat_id;\r
    const content = JSON.parse(message.content);\r
\r
    // Handle plain text messages\r
    if (message.message_type === 'text') {\r
      const text = content.text as string;\r
      await handleBotCommand(chatId, text);\r
    }\r
  },\r
});\r
\r
// Listen for approval status changes\r
eventDispatcher.register({\r
  'approval.approval.updated_v4': async (data) => {\r
    const instanceId = data.approval_code;\r
    const status = data.status;\r
\r
    if (status === 'APPROVED') {\r
      await onApprovalApproved(instanceId);\r
    } else if (status === 'REJECTED') {\r
      await onApprovalRejected(instanceId);\r
    }\r
  },\r
});\r
\r
// Card action callback handler\r
const cardActionHandler = new lark.CardActionHandler({\r
  encryptKey: process.env.FEISHU_ENCRYPT_KEY || '',\r
  verificationToken: process.env.FEISHU_VERIFICATION_TOKEN || '',\r
}, async (data) => {\r
  const action = data.action.value;\r
\r
  if (action.action === 'approve') {\r
    await processApproval(action.instance_id, true);\r
    // Return the updated card\r
    return {\r
      toast: { type: 'success', content: 'Approval granted' },\r
    };\r
  }\r
  return {};\r
});\r
\r
app.use('/webhook/event', lark.adaptExpress(eventDispatcher));\r
app.use('/webhook/card', lark.adaptExpress(cardActionHandler));\r
\r
app.listen(3000, () => console.log('Feishu event service started'));\r
```\r
