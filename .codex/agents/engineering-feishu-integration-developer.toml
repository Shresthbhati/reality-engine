### Bitable Operations\r
\r
```typescript\r
// src/bitable/table-client.ts\r
class BitableClient {\r
  constructor(private client: any) {}\r
\r
  // Query table records (with filtering and pagination)\r
  async listRecords(\r
    appToken: string,\r
    tableId: string,\r
    options?: {\r
      filter?: string;\r
      sort?: string[];\r
      pageSize?: number;\r
      pageToken?: string;\r
    }\r
  ) {\r
    const resp = await this.client.bitable.appTableRecord.list({\r
      path: { app_token: appToken, table_id: tableId },\r
      params: {\r
        filter: options?.filter,\r
        sort: options?.sort ? JSON.stringify(options.sort) : undefined,\r
        page_size: options?.pageSize || 100,\r
        page_token: options?.pageToken,\r
      },\r
    });\r
\r
    if (resp.code !== 0) {\r
      throw new Error(`Failed to query records: ${resp.msg}`);\r
    }\r
    return resp.data;\r
  }\r
\r
  // Batch create records\r
  async batchCreateRecords(\r
    appToken: string,\r
    tableId: string,\r
    records: Array<{ fields: Record<string, any> }>\r
  ) {\r
    const resp = await this.client.bitable.appTableRecord.batchCreate({\r
      path: { app_token: appToken, table_id: tableId },\r
      data: { records },\r
    });\r
\r
    if (resp.code !== 0) {\r
      throw new Error(`Failed to batch create records: ${resp.msg}`);\r
    }\r
    return resp.data;\r
  }\r
\r
  // Update a single record\r
  async updateRecord(\r
    appToken: string,\r
    tableId: string,\r
    recordId: string,\r
    fields: Record<string, any>\r
  ) {\r
    const resp = await this.client.bitable.appTableRecord.update({\r
      path: {\r
        app_token: appToken,\r
        table_id: tableId,\r
        record_id: recordId,\r
      },\r
      data: { fields },\r
    });\r
\r
    if (resp.code !== 0) {\r
      throw new Error(`Failed to update record: ${resp.msg}`);\r
    }\r
    return resp.data;\r
  }\r
}\r
\r
// Example: Sync external order data to a Bitable spreadsheet\r
async function syncOrdersToBitable(orders: any[]) {\r
  const bitable = new BitableClient(client);\r
  const appToken = process.env.BITABLE_APP_TOKEN!;\r
  const tableId = process.env.BITABLE_TABLE_ID!;\r
\r
  const records = orders.map((order) => ({\r
    fields: {\r
      'Order ID': order.orderId,\r
      'Customer Name': order.customerName,\r
      'Order Amount': order.amount,\r
      'Status': order.status,\r
      'Created At': order.createdAt,\r
    },\r
  }));\r
\r
  // Maximum 500 records per batch\r
  for (let i = 0; i < records.length; i += 500) {\r
    const batch = records.slice(i, i + 500);\r
    await bitable.batchCreateRecords(appToken, tableId, batch);\r
  }\r
}\r
```\r
