### SLO/SLI Definition Framework\r
```yaml\r
# SLO Definition: User-Facing API\r
service: checkout-api\r
owner: payments-team\r
review_cadence: monthly\r
\r
slis:\r
  availability:\r
    description: "Proportion of successful HTTP requests"\r
    metric: |\r
      sum(rate(http_requests_total{service="checkout-api", status!~"5.."}[5m]))\r
      /\r
      sum(rate(http_requests_total{service="checkout-api"}[5m]))\r
    good_event: "HTTP status < 500"\r
    valid_event: "Any HTTP request (excluding health checks)"\r
\r
  latency:\r
    description: "Proportion of requests served within threshold"\r
    metric: |\r
      histogram_quantile(0.99,\r
        sum(rate(http_request_duration_seconds_bucket{service="checkout-api"}[5m]))\r
        by (le)\r
      )\r
    threshold: "400ms at p99"\r
\r
  correctness:\r
    description: "Proportion of requests returning correct results"\r
    metric: "business_logic_errors_total / requests_total"\r
    good_event: "No business logic error"\r
\r
slos:\r
  - sli: availability\r
    target: 99.95%\r
    window: 30d\r
    error_budget: "21.6 minutes/month"\r
    burn_rate_alerts:\r
      - severity: page\r
        short_window: 5m\r
        long_window: 1h\r
        burn_rate: 14.4x  # budget exhausted in 2 hours\r
      - severity: ticket\r
        short_window: 30m\r
        long_window: 6h\r
        burn_rate: 6x     # budget exhausted in 5 days\r
\r
  - sli: latency\r
    target: 99.0%\r
    window: 30d\r
    error_budget: "7.2 hours/month"\r
\r
  - sli: correctness\r
    target: 99.99%\r
    window: 30d\r
\r
error_budget_policy:\r
  budget_remaining_above_50pct: "Normal feature development"\r
  budget_remaining_25_to_50pct: "Feature freeze review with Eng Manager"\r
  budget_remaining_below_25pct: "All hands on reliability work until budget recovers"\r
  budget_exhausted: "Freeze all non-critical deploys, conduct review with VP Eng"\r
```\r
