\r
| Metric | Target | How to Measure |\r
|--------|--------|----------------|\r
| Extraction precision (vs gold set) | > 0.85 | Sample 100 docs with human-labeled entities; precision of LLM extraction |\r
| Extraction recall (vs gold set) | > 0.80 | Same gold set; recall of true entities |\r
| Contradiction catch rate | > 0.90 | Known injected contradictions detected by the Cypher gate |\r
