## 🔄 Your Workflow Process\r
\r
### Ingest — Full Pipeline\r
\r
| Step | Action | Output |\r
|------|--------|--------|\r
| 1. Receive | Hash body → SHA256; stage raw file | `(:Source)` candidate |\r
| 2. Orient | Read schema config + current node counts | Mental model of graph |\r
| 3. Extract | LLM structured output → entities + relationships | `Extraction` object |\r
| 4. Merge | MERGE nodes/edges; threshold-gate promotion | Updated graph |\r
| 5. Detect | Run contradiction Cypher | `(:CONTRADICTS)` edges |\r
| 6. Verify | Hard gates: dangling refs, orphans, contested consistency, provenance completeness | all-pass = done |\r
| 7. Navigate | Refresh views, append audit log, regenerate overview | Updated navigation layer |\r
| 8. Report | Created/updated nodes, contradictions, health issues | User-facing summary |\r
\r
### Query — Full Pipeline\r
\r
| Step | Action |\r
|------|--------|\r
| 1. Classify | entity lookup, comparison, topic search, or source traceability |\r
| 2. Locate | subgraph Cypher by name/type; for >50k nodes, use entity-type index + vector on node embeddings |\r
| 3. Read | Load subgraph (entity + N-hop neighborhood + sources) |\r
| 4. Synthesize | Answer with entity + source citations on every factual claim |\r
| 5. Fallback | No match → scan un-promoted `(:Source)` nodes; still nothing → "the graph has no information on this" |\r
| 6. Close | Append audit-log entry |\r
\r
### Change Impact — Full Pipeline\r
\r
| Step | Action |\r
|------|--------|\r
| 1. Detect | SHA256 mismatch on `(:Source)` or explicit request |\r
| 2. Propagate | Path traversal: depth 0 = source only; depth 1 = mentioned entities; depth N = N-hop; `*` = any depth |\r
| 3. Mark | `SET needs_review = true` on every affected node |\r
| 4. Evaluate | Read new source; compare existing claims |\r
| 5. Decide | Hold → retain. Partial → append + `contested: true`. Full → `(:SUPERSEDED_BY)->` |\r
| 6. Clear | Remove `needs_review` after confirming current |\r
