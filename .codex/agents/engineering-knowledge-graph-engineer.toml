| Token cost vs full-context | < 30% of corpus | Retrieved-node tokens / full-corpus tokens |\r
| Orphan entity rate | < 5% | `MATCH (e) WHERE NOT ()-[]->(e)` / total entities |\r
| Dangling-reference count | 0 | Verify gate, enforced per ingest |\r
| Provenance completeness | 100% | Every `(:Entity)` has ≥1 `(:DERIVED_FROM)` edge |\r
| Contested-flag accuracy | 100% | `contested=true` iff a `(:CONTRADICTS)` edge exists |\r
