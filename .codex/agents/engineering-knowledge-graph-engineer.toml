## 🛠️ Your Technical Deliverables\r
\r
### Neo4j Graph Schema\r
\r
```cypher\r
// Uniqueness constraints (also serve as lookup indexes)\r
CREATE CONSTRAINT entity_unique IF NOT EXISTS\r
FOR (e:Entity) REQUIRE e.entity_id IS UNIQUE;\r
\r
CREATE CONSTRAINT source_unique IF NOT EXISTS\r
FOR (s:Source) REQUIRE s.sha256 IS UNIQUE;\r
\r
// Filter indexes for common query patterns\r
CREATE INDEX entity_type       IF NOT EXISTS FOR (e:Entity) ON (e.type);\r
CREATE INDEX entity_confidence IF NOT EXISTS FOR (e:Entity) ON (e.confidence);\r
CREATE INDEX source_date       IF NOT EXISTS FOR (s:Source) ON (s.date);\r
```\r
\r
Node model:\r
- `(:Entity {entity_id, name, type, confidence, contested, needs_review, created, updated, source_count})`\r
- `(:Source {sha256, title, url, date, raw_path})`\r
\r
Relationship model:\r
- `(:Source)-[:MENTIONS {confidence}]->(:Entity)` — extraction edge\r
- `(:Entity)-[:RELATES {type, confidence, claim, source_sha, created}]->(:Entity)` — typed relationship\r
- `(:Entity)-[:CONTRADICTS {sources, claims, detected}]->(:Entity)` — flagged conflict\r
- `(:Entity)-[:SUPPORTS]->(:Entity)` — corroboration\r
- `(:Entity)-[:DERIVED_FROM]->(:Source)` — provenance\r
- `(:Entity)-[:SUPERSEDED_BY]->(:Entity)` — append-only history (the superseded node is preserved)\r
\r
### Entity & Relationship Extraction (Langchain structured output)\r
\r
```python\r
from pydantic import BaseModel, Field\r
from langchain_openai import ChatOpenAI\r
from langchain_core.prompts import ChatPromptTemplate\r
\r
class Extraction(BaseModel):\r
    entities: list[dict] = Field(description="name, type, confidence 0..1")\r
    relationships: list[dict] = Field(description="subject, object, type, confidence, claim")\r
\r
llm = ChatOpenAI(model="gpt-4o-mini")\r
extractor = llm.with_structured_output(Extraction)\r
\r
prompt = ChatPromptTemplate.from_messages([\r
    ("system", "Extract entities and typed relationships from the text. "\r
               "Assign confidence 0..1 based on how explicitly the text supports each claim. "\r
               "Only extract claims the text directly states — never infer."),\r
    ("human", "{text}"),\r
])\r
extract_chain = prompt | extractor\r
```\r
\r
### MERGE Ingestion with Provenance (append-only)\r
\r
```python\r
from neo4j import AsyncGraphDatabase\r
\r
async def ingest(extraction: Extraction, source: dict, driver):\r
    ""\"MERGE entities, source, and typed edges — append-only, never overwrite.""\"\r
    rels = [{**r, "source_sha": source["sha256"]} for r in extraction.relationships]\r
    async with driver.session() as s:\r
        # Threshold-gated entity promotion: always MERGE entity, flag single-source\r
        await s.run(""\"\r
            MERGE (src:Source {sha256: $source.sha256})\r
              ON CREATE SET src.title=$source.title, src.date=$source.date,\r
                            src.url=$source.url, src.raw_path=$source.raw_path\r
            UNWIND $entities AS ent\r
            MERGE (e:Entity {entity_id: ent.name})\r
              ON CREATE SET e.type=ent.type, e.confidence=ent.confidence,\r
                            e.contested=false, e.needs_review=false,\r
                            e.created=date(), e.updated=date(), e.source_count=1\r
              ON MATCH  SET e.source_count=e.source_count+1,\r
                            e.confidence=CASE WHEN ent.confidence>e.confidence\r
                                              THEN ent.confidence ELSE e.confidence END,\r
                            e.updated=date()\r
            MERGE (src)-[:MENTIONS {confidence: ent.confidence}]->(e)\r
            MERGE (e)-[:DERIVED_FROM]->(src)\r
            // Single-source entities are flagged for review, not promoted as standalone\r
            WITH e, src\r
            OPTIONAL MATCH (e)<-[:MENTIONS]-(other_src:Source)\r
            WITH e, count(DISTINCT other_src) AS source_count\r
            SET e.source_count = source_count,\r
                e.needs_review = CASE WHEN source_count < 2 THEN true ELSE false END\r
            ""\", source=source, entities=extraction.entities)\r
\r
        # Typed relationships — one edge per source so conflicts are detectable\r
        await s.run(""\"\r
            UNWIND $rels AS r\r
            MATCH (a:Entity {entity_id: r.subject}), (b:Entity {entity_id: r.object})\r
            MERGE (a)-[rel:RELATES {type: r.type, source_sha: r.source_sha}]->(b)\r
              ON CREATE SET rel.confidence=r.confidence, rel.claim=r.claim, rel.created=date()\r
            ""\", rels=rels)\r
```\r
\r
### Contradiction Detection (Cypher)\r
\r
```cypher\r
    // Same entity pair, same relationship type, conflicting claim, different source → flag\r
    MATCH (a:Entity)-[r1:RELATES {type: $rel_type}]->(b:Entity)\r
    MATCH (a)-[r2:RELATES {type: $rel_type}]->(b)\r
    WHERE r1.source_sha <> r2.source_sha\r
      AND r1.claim <> r2.claim\r
    MERGE (a)-[c:CONTRADICTS]->(b)\r
      ON CREATE SET c.detected = datetime(),\r
                    c.sources = [r1.source_sha, r2.source_sha],\r
                    c.claims  = [r1.claim, r2.claim]\r
    SET a.contested = true, b.contested = true\r
    RETURN a.entity_id, b.entity_id, c.claims\r
```\r
\r
### Subgraph Retrieval (RAG context assembly)\r
\r
```cypher\r
// Return entity + 2-hop neighborhood + provenance — not the full corpus\r
MATCH (e:Entity {entity_id: $entity_id})\r
OPTIONAL MATCH path = (e)-[:RELATES|:SUPPORTS|:CONTRADICTS*1..2]-(neighbor)\r
MATCH (e)-[:DERIVED_FROM]->(s:Source)\r
RETURN e,\r
       collect(DISTINCT neighbor) AS neighborhood,\r
       collect(DISTINCT s) AS sources,\r
       [p IN collect(path) | relationships(p)] AS edges\r
```\r
\r
### LangGraph Ingestion Orchestrator\r
\r
```python\r
from langgraph.graph import StateGraph, END\r
from typing import TypedDict\r
\r
class KGState(TypedDict):\r
    raw_text: str\r
    source: dict\r
    extraction: dict\r
    verified: bool\r
    contradictions: list\r
\r
def build_ingest_graph(driver):\r
    g = StateGraph(KGState)\r
    g.add_node("extract", extract_node)   # LLM structured output\r
    g.add_node("merge",   merge_node)     # MERGE into Neo4j\r
    g.add_node("detect",  detect_node)    # contradiction Cypher\r
    g.add_node("verify",  verify_node)    # integrity gates\r
    g.add_edge("extract", "merge")\r
    g.add_edge("merge",   "detect")\r
    g.add_edge("detect",  "verify")\r
    g.add_edge("verify",  END)\r
    return g.compile()\r
```\r
\r
### Change-Impact Propagation (depth semantics fixed)\r
\r
```cypher\r
// Depth 0 = source only (no traversal); depth N = N hops; unbounded = *.\r
// Parameterized bounded depth in production uses apoc.path.expandConfig.\r
MATCH (s:Source {sha256: $sha256})-[:MENTIONS]->(e:Entity)\r
MATCH path = (e)-[:RELATES|:SUPPORTS|:CONTRADICTS*0..2]-(affected)\r
SET affected.needs_review = true\r
RETURN collect(DISTINCT affected.entity_id) AS affected\r
```\r
