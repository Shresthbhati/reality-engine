## Failure Mode Engineering\r
\r
### Failure Taxonomy\r
\r
| Failure Type | Description | Detection | Recovery |\r
|---|---|---|---|\r
| **Hard failure** | Agent returns error, exception, or times out | Error code / timeout | Retry with backoff → fallback agent → human escalation |\r
| **Silent failure** | Agent returns output but it's wrong or hallucinated | Evaluator agent; schema validation | Retry with explicit correction prompt → human review |\r
| **Partial failure** | Agent returns incomplete output (truncated, missing fields) | Schema validation; completeness check | Request specific missing fields → regenerate |\r
| **Contradiction** | Two agents return conflicting outputs | Explicit contradiction detector | Arbitration agent → human decision |\r
| **Cascade failure** | One agent's bad output poisons all downstream agents | Checkpoint validation; anomaly detection | Rollback to last checkpoint; re-run from failure point |\r
| **Loop failure** | Evaluator-optimizer never converges | Iteration counter; score plateau detection | Force exit; escalate with last best output |\r
| **Context failure** | Agent ignores instructions due to context overload | Output schema validation; instruction adherence check | Trim context; re-run with compressed state |\r
\r
### Circuit Breaker Pattern\r
\r
Apply to any agent that can be called repeatedly (retry loops, optimizer loops):\r
\r
```\r
State: CLOSED (normal) → OPEN (failing) → HALF-OPEN (testing recovery)\r
\r
CLOSED: Requests flow normally. Track failure rate over rolling window.\r
  → If failure rate > threshold (e.g., 3 failures in 5 attempts): trip to OPEN\r
\r
OPEN: Requests immediately fail / escalate. Do not call the agent.\r
  → After cooldown period (e.g., 60 seconds): transition to HALF-OPEN\r
\r
HALF-OPEN: Allow one test request.\r
  → If succeeds: return to CLOSED\r
  → If fails: return to OPEN\r
```\r
\r
### Fallback Chain Design\r
\r
For every agent in a production pipeline, define its fallback:\r
\r
| Priority | Agent | Condition to Invoke |\r
|---|---|---|\r
| 1 (primary) | Full capability agent (e.g., GPT-4o, Codex Opus) | Default |\r
| 2 (fallback) | Lighter agent with narrowed scope | Primary fails or exceeds latency SLA |\r
| 3 (degraded) | Rule-based / template output | Fallback also fails |\r
| 4 (human) | Human review queue | All automated paths fail |\r
\r
Design rule: the system must always produce *something* — even a "degraded mode" structured response is better than a silent failure.\r
\r
### Rollback & Recovery\r
\r
- **Checkpoint frequency**: after every agent that produces irreversible side effects (sends email, writes to DB, calls external API)\r
- **Idempotency requirement**: any agent that can be retried MUST be idempotent — running it twice must produce the same result or be safe to overwrite\r
- **Compensation actions**: for non-idempotent actions, define the compensation (e.g., send correction email, delete duplicate record)\r
- **Recovery point objective**: define how far back the pipeline can safely re-run from\r
\r
---\r
\r
## Trust & Permission Scoping\r
\r
### Least-Privilege Principle for Agents\r
\r
Each agent should have access to only the tools and data it needs — nothing more.\r
\r
**Tool Access Matrix (example)**\r
\r
| Agent Role | Web Search | Code Execution | File Write | External API | DB Read | DB Write |\r
|---|---|---|---|---|---|---|\r
| Researcher | ✅ | ❌ | ❌ | Read-only | ✅ | ❌ |\r
| Analyst | ❌ | ✅ (sandbox) | ❌ | ❌ | ✅ | ❌ |\r
| Writer | ❌ | ❌ | ✅ (drafts only) | ❌ | ❌ | ❌ |\r
| Publisher | ❌ | ❌ | ✅ | ✅ (publish API) | ❌ | ✅ (status only) |\r
| Orchestrator | ❌ | ❌ | ❌ | ❌ | ✅ | ✅ (task ledger) |\r
\r
### Agent Authorization Model\r
\r
**Identity**: Each agent instance has a unique ID and role label. Inter-agent messages must include sender ID — downstream agents validate the source.\r
\r
**Scope tokens**: Each agent receives a scoped token that grants only its permitted tool access. Tokens are not passed between agents.\r
\r
**Sandboxing**: Code execution agents run in isolated environments. File system access is restricted to designated directories. Network access is allowlisted, not open.\r
\r
**Audit log**: Every tool call by every agent is logged with: agent ID, tool name, inputs, outputs, timestamp. Non-negotiable for production systems.\r
\r
### Prompt Injection Defense\r
\r
Agents that process external content (web pages, user-submitted documents, emails) are at risk of prompt injection — malicious content that hijacks the agent's instructions.\r
\r
**Mitigations:**\r
- Separate content processing from instruction processing: never concatenate external content directly into the system prompt\r
- Use a "sanitizer" agent whose only job is to extract structured data from untrusted content before passing to downstream agents\r
- Validate structured outputs with schema enforcement — injected instructions don't produce valid JSON\r
- Flag and quarantine any agent output that contains instruction-like language (imperative verbs + tool names)\r
\r
