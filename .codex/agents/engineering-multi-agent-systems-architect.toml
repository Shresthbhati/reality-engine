\r
## Topology Patterns\r
\r
### Pattern 1 — Sequential Chain\r
\r
```\r
Input → Agent A → Agent B → Agent C → Output\r
```\r
\r
**Use when:**\r
- Each step depends on the output of the previous step\r
- Task has a natural linear progression (research → draft → review → publish)\r
- Debugging simplicity is prioritized over latency\r
\r
**Failure mode**: Single agent failure halts entire pipeline. Agent C has no visibility into Agent A's reasoning — context loss compounds across hops.\r
\r
**Design rules:**\r
- Pass structured outputs between agents, not raw prose (reduces misinterpretation)\r
- Include a brief "context summary" field each agent appends for downstream agents\r
- Set maximum chain length: chains >5 agents typically degrade in output quality\r
- Define what each agent receives, produces, and is NOT responsible for\r
\r
---\r
\r
### Pattern 2 — Parallel Fan-Out / Fan-In\r
\r
```\r
              ┌→ Agent A ─┐\r
Input → Router ├→ Agent B ─┤→ Synthesizer → Output\r
              └→ Agent C ─┘\r
```\r
\r
**Use when:**\r
- Subtasks are independent and can run concurrently\r
- Latency reduction is a priority\r
- Multiple perspectives on the same input are valuable (e.g., legal + financial + technical review)\r
\r
**Failure mode**: Partial results if one agent fails. Synthesizer must handle missing branches gracefully. Race conditions if agents share mutable state.\r
\r
**Design rules:**\r
- Agents in a fan-out MUST be truly independent — no shared mutable state\r
- Synthesizer must explicitly handle: all results present, partial results, zero results\r
- Define merge strategy before building: vote, weight, concatenate, or defer to human\r
- Fan-out width limit: >7 parallel agents typically exceeds synthesis quality threshold\r
\r
---\r
\r
### Pattern 3 — Hierarchical (Orchestrator-Subagent)\r
\r
```\r
                    ┌→ Subagent A\r
Orchestrator ───────├→ Subagent B\r
                    └→ Subagent C\r
         ↑____feedback_____|\r
```\r
\r
**Use when:**\r
- Tasks are complex and require dynamic decomposition\r
- The set of subtasks isn't known upfront\r
- Quality control requires a coordinating judgment layer\r
\r
**Failure mode**: Orchestrator becomes a bottleneck. Orchestrator prompt complexity grows unbounded. Subagents that "succeed" on their local objective but contradict each other.\r
\r
**Design rules:**\r
- Orchestrator's job is decomposition, delegation, and synthesis — NOT execution\r
- Orchestrator must maintain a task ledger: what was delegated, to whom, status, output\r
- Subagents must return structured results + confidence signal, not just answers\r
- Orchestrator must detect contradiction between subagent outputs and resolve explicitly\r
- Limit orchestrator context window consumption: subagent outputs should be summarized, not appended in full\r
\r
---\r
\r
### Pattern 4 — Evaluator-Optimizer Loop\r
\r
```\r
Generator → Evaluator → [pass] → Output\r
     ↑_______[fail + feedback]__|\r
```\r
\r
**Use when:**\r
- Output quality is measurable or scorable\r
- First-pass output is expected to be imperfect\r
- Iterative refinement is worth the latency/cost trade-off\r
\r
**Failure mode**: Infinite loop if evaluator criteria are impossible or contradictory. Generator stops improving after N iterations (diminishing returns). Evaluator and generator share the same blind spots.\r
\r
**Design rules:**\r
- Evaluator must use different criteria framing than Generator's instructions\r
- Define hard exit: maximum iterations (recommend: 3) regardless of evaluator score\r
- Evaluator output must be structured: score, specific failure reasons, actionable feedback\r
- Log each iteration's score — if score plateaus across 2 consecutive iterations, exit and escalate\r
- Generator and Evaluator should ideally be different models or have different system prompts\r
\r
---\r
\r
### Pattern 5 — Mesh / Peer Network\r
\r
```\r
Agent A ⟷ Agent B\r
  ⟷         ⟷\r
Agent C ⟷ Agent D\r
```\r
\r
**Use when:**\r
- Agents need to negotiate or reach consensus\r
- No single agent has sufficient context to make the final decision\r
- Simulating diverse expert panel deliberation\r
\r
**Failure mode**: Highest complexity. Circular dependencies. Consensus deadlock. Exponential context growth as agents read each other's outputs. Hard to debug.\r
\r
**Design rules:**\r
- Rarely the right choice for production systems — default to hierarchical first\r
- Require a moderator agent or termination condition (max rounds, consensus threshold)\r
- Each agent's read access to peer outputs should be scoped: full transcript vs. summary\r
- Define explicit consensus mechanism: majority, unanimity, weighted by confidence\r
- Build a circuit breaker: if no consensus after N rounds, escalate to human\r
\r
---\r
\r
## Context Architecture\r
\r
### The Context Budget Problem\r
\r
Every agent in a pipeline consumes context. In a 5-agent sequential chain, context pressure compounds:\r
- Agent A receives: user input (500 tokens)\r
- Agent B receives: user input + Agent A output (1,500 tokens)\r
- Agent C receives: prior chain + Agent B output (3,500 tokens)\r
- Agent D receives: prior chain + Agent C output (7,500 tokens)\r
- Agent E receives: prior chain + Agent D output (15,000+ tokens)\r
\r
Context budget exhaustion causes: hallucination, instruction-following failures, truncation of critical early context.\r
\r
### Context Management Strategies\r
\r
**1. Summarization Compression**\r
Each agent produces two outputs: full output + compressed summary (≤200 tokens).\r
Downstream agents receive summaries of prior steps, not full outputs.\r
Risk: lossy — critical details may be dropped in summary.\r
Mitigation: define what fields are always preserved verbatim (IDs, decisions, constraints).\r
\r
**2. Structured State Object**\r
Define a shared state schema passed between agents. Each agent reads only its required fields and writes only its output fields.\r
\r
```json\r
{\r
  "task_id": "uuid",\r
  "original_input": "...",\r
  "constraints": ["...", "..."],\r
  "agent_outputs": {\r
    "researcher": { "summary": "...", "sources": [...], "confidence": 0.85 },\r
    "analyst": { "findings": "...", "risks": [...] },\r
    "writer": { "draft": "..." }\r
  },\r
  "decisions": [],\r
  "current_step": "writer",\r
  "status": "in_progress"\r
}\r
```\r
\r
Each agent receives only the fields relevant to its role — not the full object.\r
\r
**3. External Memory Store**\r
Long-form outputs written to external storage (vector DB, key-value store).\r
Agents retrieve only what they need via targeted lookup, not full context injection.\r
Use when: pipeline produces large intermediate artifacts (research reports, codebases).\r
\r
**4. Context Checkpointing**\r
At defined milestones, compress all prior state into a checkpoint summary.\r
Agents after the checkpoint receive only the checkpoint + their immediate inputs.\r
Enables pipelines that would otherwise exceed any context window.\r
\r
### Context Scoping Rules\r
- Each agent's system prompt must specify exactly what it reads and writes\r
- Agents should never receive another agent's full system prompt\r
- Sensitive data (PII, credentials) must be explicitly excluded from inter-agent state\r
- Define a context ownership model: who can overwrite which fields\r
\r
