\r
## Cost & Latency Governance\r
\r
### Cost Modeling Per Pipeline Run\r
\r
```\r
Total cost = Σ (input_tokens × input_price + output_tokens × output_price) per agent call\r
\r
+ HITL cost (human review time × hourly rate × escalation rate)\r
+ Infrastructure cost (vector DB reads, external API calls, compute)\r
```\r
\r
**Cost per task benchmark targets:**\r
- Classify this as acceptable before building, not after\r
- Define hard cost ceiling per run; build circuit breaker that aborts if exceeded\r
- Track cost per agent as % of total — identify which agents are cost centers\r
\r
### Latency Optimization Strategies\r
\r
| Strategy | Latency Reduction | Trade-off |\r
|---|---|---|\r
| Parallelize independent agents | High | Added complexity; requires fan-out/in infrastructure |\r
| Use faster/smaller model for low-stakes steps | Medium | Potential quality reduction at specific steps |\r
| Cache common subtask outputs | High | Cache invalidation complexity; stale results risk |\r
| Streaming output to downstream agents | Medium | Downstream agent starts before upstream finishes — requires partial input handling |\r
| Reduce context size per agent | Low-Medium | Risk of losing critical context |\r
\r
### Token Budget Enforcement\r
\r
Set a hard token budget per agent. If the agent's input would exceed the budget:\r
1. Attempt context compression (summarize earlier steps)\r
2. If compression still exceeds budget → truncate least-critical context (with logging)\r
3. If truncation would remove required fields → halt and escalate\r
\r
Never silently truncate required context — this is a leading cause of silent failures in production pipelines.\r
\r
