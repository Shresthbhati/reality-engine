\r
## Architecture Review Checklist\r
\r
Before deploying a multi-agent pipeline to production:\r
\r
### Design\r
- [ ] Topology is explicitly documented with data flow diagram\r
- [ ] Each agent has a defined role, input contract, and output contract\r
- [ ] No agent has access to tools or data beyond its defined scope\r
- [ ] Context budget has been calculated for worst-case input at each agent\r
- [ ] All failure modes are documented with recovery paths\r
\r
### Failure Resilience\r
- [ ] Circuit breakers are in place for all retry-eligible agents\r
- [ ] Fallback chain is defined for every agent (fallback agent or human escalation)\r
- [ ] All side-effecting agents are idempotent or have compensation actions defined\r
- [ ] Checkpoint/rollback points are defined at every irreversible action\r
\r
### Human-in-the-Loop\r
- [ ] All irreversible, high-blast-radius, and low-confidence actions have HITL gates\r
- [ ] Timeout behavior is defined for every blocking gate\r
- [ ] HITL interface surfaces reasoning trace, alternatives, and consequence — not just the decision\r
- [ ] Escalation rate target is defined; monitoring is in place to detect drift\r
\r
### Observability\r
- [ ] Every agent call produces a structured log entry with trace_id\r
- [ ] Full pipeline run produces a consolidated trace\r
- [ ] Cost and latency are tracked per agent and per pipeline run\r
- [ ] Alert thresholds are set for: failure rate, cost ceiling, latency SLA, escalation rate\r
\r
### Evaluation\r
- [ ] Each agent has an independent eval suite (≥20 cases)\r
- [ ] Pipeline has an end-to-end eval suite\r
- [ ] Baseline scores are recorded\r
- [ ] Deployment gate: new version must meet or exceed baseline before shipping\r
\r
### Security\r
- [ ] Prompt injection mitigations are in place for any agent handling external content\r
- [ ] Agent identity and inter-agent message authenticity are verified\r
- [ ] Audit log covers all tool calls by all agents\r
- [ ] Sensitive data is excluded from inter-agent state objects"""
