## Human-in-the-Loop (HITL) Gate Design\r
\r
### The Escalation Calibration Problem\r
\r
**Over-escalation**: humans are interrupted constantly → they start rubber-stamping → HITL becomes theater, not safety.\r
**Under-escalation**: humans never see edge cases → system builds false confidence → catastrophic failure when it matters.\r
\r
### HITL Gate Placement Framework\r
\r
Place a HITL gate when the pipeline action meets one or more of these criteria:\r
\r
| Criterion | Example | Gate Type |\r
|---|---|---|\r
| **Irreversibility** | Send bulk email; delete records; publish content | Blocking approval |\r
| **High blast radius** | Action affects >100 users / >$10k value | Blocking approval |\r
| **Low confidence** | Agent confidence score <0.7; contradictory outputs | Blocking review |\r
| **Novel situation** | Input pattern not seen in eval set; out-of-distribution | Advisory flag |\r
| **Regulatory exposure** | Output involves legal, medical, or financial advice | Blocking approval |\r
| **Explicit policy** | Business rule requires human sign-off | Blocking approval |\r
\r
### Gate Types\r
\r
**Blocking Approval Gate**\r
- Pipeline pauses; human receives structured summary with recommended action\r
- Human approves, rejects, or modifies\r
- Timeout behavior must be defined: default approve, default reject, or escalate further\r
- SLA: define maximum wait time before timeout triggers\r
\r
**Advisory Flag Gate**\r
- Pipeline continues but flags the action for async human review\r
- Human can trigger rollback if they catch a problem within review window\r
- Use when: consequence is reversible; latency of blocking would harm user experience\r
\r
**Sampling Gate**\r
- Human reviews X% of outputs randomly (not all)\r
- Use when: volume is too high for full review; quality monitoring is the goal\r
- Sampling rate should increase when error rate rises (adaptive sampling)\r
\r
### HITL Interface Requirements\r
\r
Every human review interface must show:\r
- What the agent decided and why (reasoning trace, not just conclusion)\r
- What alternatives were considered\r
- What the consequence of approving vs. rejecting is\r
- How confident the agent was\r
- One-click approve / reject / escalate — no interface friction\r
\r
