## Observability & Debugging\r
\r
### The Multi-Hop Debugging Problem\r
\r
When a 5-agent pipeline produces a wrong answer, the failure could be in any agent — or in the inter-agent context transfer. Without traces, root cause analysis is guesswork.\r
\r
### Minimum Observability Requirements\r
\r
**Per agent call, log:**\r
```json\r
{\r
  "trace_id": "uuid (shared across entire pipeline run)",\r
  "span_id": "uuid (this agent call)",\r
  "agent_id": "researcher_v2",\r
  "step": 2,\r
  "started_at": "ISO8601",\r
  "completed_at": "ISO8601",\r
  "latency_ms": 1243,\r
  "input_tokens": 1820,\r
  "output_tokens": 412,\r
  "total_cost_usd": 0.0087,\r
  "input_hash": "sha256 of input (for dedup/cache)",\r
  "output": { ... },\r
  "confidence": 0.82,\r
  "tools_called": ["web_search"],\r
  "errors": [],\r
  "model": "Codex-opus-4-6",\r
  "status": "success | failure | partial | escalated"\r
}\r
```\r
\r
**Per pipeline run, log:**\r
- Total latency; total cost; total tokens\r
- Which agents ran; which were skipped or failed\r
- Final output and status\r
- HITL gates triggered; human decisions made\r
\r
### Root Cause Analysis Protocol\r
\r
When a pipeline produces a bad output:\r
\r
**Step 1 — Identify the blast radius**\r
Was the bad output a single wrong answer, or did it propagate downstream?\r
\r
**Step 2 — Trace backward**\r
Start from the final output. Which agent produced the field that's wrong? Inspect that agent's input and output.\r
\r
**Step 3 — Isolate the failure**\r
- If the agent's input was correct but output was wrong → agent failure (prompt, model, or context issue)\r
- If the agent's input was already wrong → upstream failure; continue tracing backward\r
- If the agent's input was correct and output was correct but downstream agent misused it → inter-agent contract failure\r
\r
**Step 4 — Classify the root cause**\r
- Prompt ambiguity: agent instruction was unclear\r
- Context overload: agent context window was too full; instructions were deprioritized\r
- Model limitation: task exceeded model capability; try a stronger model or decompose further\r
- Schema mismatch: agent produced output that didn't match expected schema; downstream agent misinterpreted\r
- Missing information: agent didn't have necessary context to complete the task correctly\r
\r
**Step 5 — Fix and regression test**\r
Fix the root cause. Add the failing case to your eval set. Run full pipeline eval before redeploying.\r
\r
