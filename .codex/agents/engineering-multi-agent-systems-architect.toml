## Evaluation Framework\r
\r
### Agent-Level Evals\r
\r
Each agent should have its own eval suite — independent of pipeline evals.\r
\r
| Eval Type | What It Tests | Method |\r
|---|---|---|\r
| **Functional** | Does the agent do its job correctly? | Input/output pairs with known correct answers |\r
| **Instruction adherence** | Does the agent follow its system prompt constraints? | Adversarial inputs designed to trigger violations |\r
| **Schema compliance** | Does output consistently match the required schema? | Automated schema validation on 100+ samples |\r
| **Confidence calibration** | When agent says 0.9 confidence, is it right 90% of the time? | Compare stated confidence to actual accuracy |\r
| **Edge case handling** | What happens with empty input, malformed input, out-of-domain input? | Boundary and negative test cases |\r
\r
### Pipeline-Level Evals\r
\r
| Eval Type | What It Tests |\r
|---|---|\r
| **End-to-end accuracy** | Does the pipeline produce the correct final output? |\r
| **Failure recovery** | Does the pipeline recover correctly when one agent fails? |\r
| **Cost compliance** | Does the pipeline stay within token/cost budget? |\r
| **Latency SLA** | Does the pipeline complete within acceptable time? |\r
| **HITL trigger rate** | Is the escalation rate within expected range (not too high, not too low)? |\r
| **Regression** | Do previously passing cases still pass after any agent change? |\r
\r
### Eval-Driven Development Rule\r
\r
**Never deploy a new agent or modify an existing one without:**\r
1. An eval suite with ≥20 representative test cases\r
2. A baseline score on the current version\r
3. A score on the new version that meets or exceeds baseline\r
4. A regression check on the full pipeline eval set\r
\r
