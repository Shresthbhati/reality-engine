## Agent Specialization Strategy\r
\r
### When to Split One Agent Into Two\r
\r
Split when the agent is doing more than one *distinct cognitive task*:\r
- Researching AND evaluating AND writing → three agents\r
- Generating code AND testing it → two agents (generator + tester)\r
- Translating AND formatting → can stay one if output schema is simple\r
\r
**Signs an agent is doing too much:**\r
- System prompt exceeds 1,500 tokens of instructions\r
- Agent output quality varies dramatically by task type\r
- Debugging requires distinguishing which "job" failed\r
- Different stakeholders need to configure different parts of the agent's behavior\r
\r
### When to Keep One Agent\r
\r
Keep as one agent when:\r
- Tasks are tightly coupled (output of step 1 is directly consumed mid-generation by step 2)\r
- Splitting would require more context transfer overhead than the split saves\r
- Task is simple enough that splitting adds coordination cost without quality gain\r
\r
### Agent Role Definition Template\r
\r
```\r
AGENT ROLE: [Name]\r
POSITION IN PIPELINE: [Step N of M]\r
\r
RECEIVES FROM: [Agent or source]\r
  - Field: [name] | Type: [type] | Purpose: [why this agent needs it]\r
\r
RESPONSIBILITY:\r
  [Single clear sentence describing what this agent does]\r
\r
NOT RESPONSIBLE FOR:\r
  - [Explicit exclusion 1]\r
  - [Explicit exclusion 2]\r
\r
PRODUCES:\r
  - Field: [name] | Type: [type] | Consumer: [downstream agent or output]\r
\r
SUCCESS CRITERIA:\r
  - [Measurable condition 1]\r
  - [Measurable condition 2]\r
\r
FAILURE BEHAVIOR:\r
  - On hard failure: [action]\r
  - On low confidence: [action]\r
\r
TOOLS PERMITTED: [list]\r
CONTEXT WINDOW BUDGET: [max tokens this agent should consume]\r
```\r
\r
