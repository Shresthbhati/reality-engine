```\r
\r
### Cisco ASA Firewall NAT and ACL\r
\r
```cisco\r
object network WEB-PRIVATE\r
 host 10.20.10.20\r
 nat (inside,outside) static 203.0.113.20\r
!\r
access-list OUTSIDE-IN extended permit tcp any object WEB-PRIVATE eq 443\r
access-list OUTSIDE-IN extended deny ip any any log\r
access-group OUTSIDE-IN in interface outside\r
!\r
show nat detail\r
show access-list OUTSIDE-IN\r
packet-tracer input outside tcp 198.51.100.50 54321 203.0.113.20 443 detailed\r
```\r
\r
### Juniper Junos Routing and Control-Plane Filter\r
\r
```junos\r
set interfaces ge-0/0/0 unit 0 description ISP-A\r
set interfaces ge-0/0/0 unit 0 family inet address 203.0.113.2/30\r
set interfaces ge-0/0/1 vlan-tagging\r
set interfaces ge-0/0/1 unit 20 description USERS\r
set interfaces ge-0/0/1 unit 20 vlan-id 20\r
set interfaces ge-0/0/1 unit 20 family inet address 10.20.0.1/24\r
set interfaces ge-0/0/2 unit 0 description CORE-1\r
set interfaces ge-0/0/2 unit 0 family inet address 10.0.0.2/30\r
set protocols ospf area 0.0.0.0 interface ge-0/0/1.20 passive\r
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0\r
set protocols bgp group ISP-A type external\r
set protocols bgp group ISP-A peer-as 65020\r
set protocols bgp group ISP-A neighbor 203.0.113.1\r
set policy-options prefix-list CUSTOMER-PREFIX 198.51.100.0/24\r
set policy-options policy-statement EXPORT-CUSTOMER term allow from prefix-list CUSTOMER-PREFIX\r
set policy-options policy-statement EXPORT-CUSTOMER term allow then accept\r
set policy-options policy-statement EXPORT-CUSTOMER then reject\r
set protocols bgp group ISP-A export EXPORT-CUSTOMER\r
set firewall family inet filter PROTECT-RE term allow-ssh from source-address 10.0.0.0/8\r
set firewall family inet filter PROTECT-RE term allow-ssh from protocol tcp\r
set firewall family inet filter PROTECT-RE term allow-ssh from destination-port ssh\r
set firewall family inet filter PROTECT-RE term allow-ssh then accept\r
set firewall family inet filter PROTECT-RE term drop-rest then discard\r
set interfaces lo0 unit 0 family inet filter input PROTECT-RE\r
```\r
\r
### Palo Alto PAN-OS Security Policy and Routing\r
\r
```panos\r
set network interface ethernet ethernet1/1 layer3 ip 203.0.113.2/30\r
set network interface ethernet ethernet1/2 layer3 ip 10.20.10.1/24\r
set zone untrust network layer3 ethernet1/1\r
set zone dmz network layer3 ethernet1/2\r
set network virtual-router default interface ethernet1/1\r
set network virtual-router default interface ethernet1/2\r
set network virtual-router default routing-table ip static-route default-route destination 0.0.0.0/0\r
set network virtual-router default routing-table ip static-route default-route nexthop ip-address 203.0.113.1\r
set network virtual-router default routing-table ip static-route default-route interface ethernet1/1\r
set rulebase security rules Allow-Web from untrust to dmz source any destination 10.20.10.20 application ssl service application-default action allow\r
set rulebase security rules Allow-Web log-start no log-end yes\r
commit\r
```\r
