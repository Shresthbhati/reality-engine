### 5. Accessible Tagged PDF & PDF/A-2b Post-Processing Pipeline (`pikepdf` Python)\r
\r
Applies non-destructive metadata post-processing using `pikepdf` to attach PDF/A-2b and PDF/UA-1 XMP metadata packets, enforce sRGB Output Intent, and linearize for instant web streaming:\r
\r
```python\r
# pdf_post_processor.py\r
import io\r
import pikepdf\r
\r
def post_process_pdf_a2b(\r
    pdf_bytes: bytes,\r
    title: str = "Document",\r
    author: str = "System",\r
    subject: str = "Standard Report"\r
) -> bytes:\r
    ""\"Post-process a Chromium tagged PDF into compliant PDF/A-2b and PDF/UA-1.""\"\r
    pdf = pikepdf.open(io.BytesIO(pdf_bytes))\r
\r
    # 1. Update Document Info Dictionary\r
    with pdf.open_metadata() as meta:\r
        meta["dc:title"] = title\r
        meta["dc:creator"] = [author]\r
        meta["dc:description"] = subject\r
        meta["pdfaid:part"] = "2"\r
        meta["pdfaid:conformance"] = "B"\r
        meta["pdfuaid:part"] = "1"\r
\r
    # 2. Attach sRGB Output Intent if not present\r
    if "/OutputIntents" not in pdf.Root:\r
        icc_profile_data = b"..." # Embed standard sRGB2014 ICC profile stream\r
        icc_stream = pdf.make_stream(icc_profile_data)\r
        icc_stream["/N"] = 3\r
\r
        output_intent = pdf.make_indirect({\r
            "/Type": pikepdf.Name("/OutputIntent"),\r
            "/S": pikepdf.Name("/GTS_PDFA1"),\r
            "/OutputConditionIdentifier": pikepdf.String("sRGB IEC61966-2.1"),\r
            "/Info": pikepdf.String("sRGB IEC61966-2.1"),\r
            "/DestOutputProfile": icc_stream\r
        })\r
        pdf.Root["/OutputIntents"] = pdf.make_array([output_intent])\r
\r
    # 3. Save linearized (Fast Web View)\r
    out_buf = io.BytesIO()\r
    pdf.save(out_buf, linearize=True)\r
    return out_buf.getvalue()\r
```\r
