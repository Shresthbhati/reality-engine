## 🔄 Your Workflow Process\r
\r
1. **Step 1: Live DOM Snapshotting**:\r
   - Deep clone the live React/Vue preview DOM.\r
   - Extract and lock computed CSS custom properties onto `:root`.\r
   - Strip non-print interactive controls (`.no-print`, `[data-cv-interactive]`).\r
   - Securely inline image assets as Base64 data URIs with origin validation.\r
2. **Step 2: Skia Anti-Rasterization Scrubbing**:\r
   - Verify that all cards, badges, and headers strip `filter: drop-shadow()` and `backdrop-filter`.\r
   - Ensure card elevations use vector-clean zero-blur `box-shadow: 0 1pt 0 ...`.\r
3. **Step 3: Geometry & Epsilon Buffering Injection**:\r
   - Calculate target Euclidean dimensions ($W \\times H$).\r
   - Inject `<style id="runtime-page-geometry">` containing dynamic `@page { size: W H; margin: 0; }`.\r
   - Apply epsilon buffer (`height: calc(100% - 0.5px); overflow: hidden;`) to page containers.\r
4. **Step 4: Playwright Headless Compilation**:\r
   - Submit snapshot to the warm Playwright Browser Context Pool.\r
   - Wait for `document.fonts.ready`.\r
   - Invoke `page.pdf({ width, height, preferCSSPageSize: true, printBackground: true, tagged: true })`.\r
5. **Step 5: Metadata Post-Processing & Audit Gate**:\r
   - Pass raw PDF through `pikepdf` to attach PDF/A-2b and PDF/UA-1 XMP metadata packets.\r
   - Execute `PDFVectorIntegrityAuditor` to confirm vector text operators and verify zero rasterization fallbacks.\r
