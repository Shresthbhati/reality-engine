### 4. 1:1 Sheet Canvas Viewport Scaler Architecture (CSS & React)\r
\r
Guarantees 1:1 typographic and line-break parity between interactive editor preview and printed PDF through optical zoom scaling without viewport-dependent text reflow:\r
\r
```typescript\r
// CVPageViewportScaler.tsx: Optical scaling without DOM reflow\r
import React, { useRef, useState, useEffect } from 'react';\r
\r
interface ScalerProps {\r
  children: React.ReactNode;\r
  pageWidthPx?: number; // Default: 793.70 (A4)\r
  zoomMode?: 'auto' | '100' | 'fit-width' | number;\r
}\r
\r
export const CVPageViewportScaler: React.FC<ScalerProps> = ({\r
  children,\r
  pageWidthPx = 793.70,\r
  zoomMode = 'auto'\r
}) => {\r
  const containerRef = useRef<HTMLDivElement>(null);\r
  const [scale, setScale] = useState<number>(1.0);\r
\r
  useEffect(() => {\r
    if (typeof zoomMode === 'number') {\r
      setScale(zoomMode);\r
      return;\r
    }\r
    if (zoomMode === '100') {\r
      setScale(1.0);\r
      return;\r
    }\r
\r
    const updateScale = () => {\r
      if (!containerRef.current) return;\r
      const availableWidth = containerRef.current.clientWidth - 32; // 16px gutter\r
      if (availableWidth <= 0) return;\r
\r
      if (availableWidth < pageWidthPx || zoomMode === 'fit-width') {\r
        const calculatedScale = Math.min(1.2, Math.max(0.4, availableWidth / pageWidthPx));\r
        setScale(calculatedScale);\r
      } else {\r
        setScale(1.0);\r
      }\r
    };\r
\r
    updateScale();\r
    const observer = new ResizeObserver(updateScale);\r
    if (containerRef.current) observer.observe(containerRef.current);\r
    return () => observer.disconnect();\r
  }, [pageWidthPx, zoomMode]);\r
\r
  return (\r
    <div\r
      ref={containerRef}\r
      className="cv-page-viewport-scaler-wrapper"\r
      style={{ width: '100%', display: 'flex', justifyContent: 'center', overflow: 'auto' }}\r
    >\r
      <div\r
        className="cv-page-viewport-scaler"\r
        style={{\r
          transform: `scale(${scale})`,\r
          transformOrigin: 'top center',\r
          width: `${pageWidthPx}px`,\r
          flexShrink: 0,\r
          transition: 'transform 0.15s ease-out'\r
        }}\r
      >\r
        {children}\r
      </div>\r
    </div>\r
  );\r
};\r
```\r
