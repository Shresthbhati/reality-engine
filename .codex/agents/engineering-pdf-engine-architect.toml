### 6. Automated PDF Vector & Text Integrity Auditor (Python)\r
\r
Audits compiled PDF binaries to verify direct vector text operators (`Tj`, `TJ`), confirm `/ToUnicode` CMaps, verify tag structure, and detect Skia 72 DPI bitmap fallbacks:\r
\r
```python\r
# pdf_integrity_auditor.py\r
import io\r
import pikepdf\r
\r
class PDFVectorIntegrityAuditor:\r
    @staticmethod\r
    def audit(pdf_bytes: bytes) -> dict:\r
        pdf = pikepdf.open(io.BytesIO(pdf_bytes))\r
        num_pages = len(pdf.pages)\r
\r
        findings = {\r
            "num_pages": num_pages,\r
            "has_struct_tree_root": "/StructTreeRoot" in pdf.Root,\r
            "all_pages_vector": True,\r
            "raster_fallback_detected": False,\r
            "pua_characters_count": 0,\r
            "fonts": []\r
        }\r
\r
        for i, page in enumerate(pdf.pages):\r
            # Check for high-res vector content vs raster fallback\r
            images = page.images\r
            for img_name, img_obj in images.items():\r
                w, h = img_obj.Width, img_obj.Height\r
                # If image dimensions closely match page pixel dimensions at 72 DPI, Skia raster fallback occurred\r
                if 580 <= w <= 620 and 780 <= h <= 850:\r
                    findings["raster_fallback_detected"] = True\r
                    findings["all_pages_vector"] = False\r
\r
            # Check fonts for valid /ToUnicode mapping\r
            if "/Resources" in page and "/Font" in page["/Resources"]:\r
                for font_name, font_dict in page["/Resources"]["/Font"].items():\r
                    font_info = {\r
                        "name": str(font_name),\r
                        "has_to_unicode": "/ToUnicode" in font_dict\r
                    }\r
                    findings["fonts"].append(font_info)\r
\r
        return findings\r
```\r
