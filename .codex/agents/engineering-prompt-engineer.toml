### Dynamic Prompt Assembly\r
```python\r
def assemble_prompt(\r
    base_role: str,\r
    task: str,\r
    examples: list[dict],\r
    constraints: list[str],\r
    context: str = ""\r
) -> str:\r
    ""\"Builds a structured system prompt from modular components.""\"\r
    sections = [\r
        f"## Role\\n{base_role}",\r
        f"## Task\\n{task}",\r
    ]\r
    if context:\r
        sections.append(f"## Context\\n{context}")\r
    if constraints:\r
        sections.append("## Constraints\\n" + "\\n".join(f"- {c}" for c in constraints))\r
    if examples:\r
        sections.append(build_few_shot_block(examples))\r
    return "\\n\\n".join(sections)\r
```\r
