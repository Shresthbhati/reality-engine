### Async Ingestion Pipeline\r
\r
```python\r
import asyncio\r
from openai import AsyncOpenAI\r
from pgvector.asyncpg import register_vector\r
import asyncpg\r
\r
client = AsyncOpenAI()\r
\r
async def embed_batch(texts: list[str], batch_size: int = 100) -> list[list[float]]:\r
    ""\"Batch embedding with rate limit handling.""\"\r
    all_embeddings = []\r
    for i in range(0, len(texts), batch_size):\r
        batch = texts[i:i + batch_size]\r
        response = await client.embeddings.create(\r
            input=batch,\r
            model="text-embedding-3-small"\r
        )\r
        all_embeddings.extend([r.embedding for r in response.data])\r
    return all_embeddings\r
\r
async def ingest_document(document_id: str, chunks: list[dict], pool: asyncpg.Pool):\r
    ""\"\r
    Async ingest: embed all chunks in parallel batches, then bulk-insert.\r
    Never ingest one chunk at a time — it's 100x slower.\r
    ""\"\r
    texts = [c["content"] for c in chunks]\r
    embeddings = await embed_batch(texts)\r
\r
    async with pool.acquire() as conn:\r
        await register_vector(conn)\r
        # Bulk insert with executemany for efficiency\r
        await conn.executemany(\r
            ""\"\r
            INSERT INTO document_chunks\r
                (document_id, content, embedding, chunk_index, metadata)\r
            VALUES ($1, $2, $3, $4, $5)\r
            ""\",\r
            [\r
                (document_id, c["content"], emb, idx, c.get("metadata", {}))\r
                for idx, (c, emb) in enumerate(zip(chunks, embeddings))\r
            ]\r
        )\r
```\r
