### pgvector Schema & HNSW Index\r
\r
```sql\r
-- Enable pgvector extension\r
CREATE EXTENSION IF NOT EXISTS vector;\r
\r
-- Document chunks table with rich metadata for filtering\r
CREATE TABLE document_chunks (\r
    id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),\r
    document_id UUID NOT NULL REFERENCES documents(id) ON DELETE CASCADE,\r
    content     TEXT NOT NULL,\r
    embedding   VECTOR(1536),           -- OpenAI text-embedding-3-small\r
    chunk_index INTEGER NOT NULL,\r
    metadata    JSONB DEFAULT '{}',     -- {source, section, doc_type, language, created_at}\r
    created_at  TIMESTAMPTZ DEFAULT NOW()\r
);\r
\r
-- HNSW index: better recall at query time vs. IVFFlat\r
-- ef_construction=128 and m=16 is a solid default for most workloads\r
-- Increase ef_construction for higher recall at the cost of index build time\r
CREATE INDEX ON document_chunks\r
USING hnsw (embedding vector_cosine_ops)\r
WITH (m = 16, ef_construction = 128);\r
\r
-- Index metadata for fast pre-filtering\r
CREATE INDEX ON document_chunks USING GIN (metadata);\r
CREATE INDEX ON document_chunks (document_id);\r
```\r
