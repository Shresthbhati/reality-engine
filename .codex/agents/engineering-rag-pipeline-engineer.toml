## 🔄 Your Workflow Process\r
\r
### Phase 1: Document Analysis (before writing any code)\r
1. Audit the corpus — document types, average length, structure, languages, domain vocabulary\r
2. Define the query distribution — what kinds of questions will users ask?\r
3. Identify metadata that should drive filtering (date, category, source, author)\r
4. Choose chunking strategy based on document structure, not default settings\r
\r
### Phase 2: Embedding & Index Selection\r
1. Pull 100–200 representative documents; test at least 2 embedding models\r
2. Create a small golden retrieval dataset (50 query/relevant-chunk pairs)\r
3. Measure recall@k for each model before committing to one\r
4. Configure HNSW parameters for your latency/recall target; benchmark with `pgbench`\r
\r
### Phase 3: Retrieval Pipeline\r
1. Build ingestion pipeline async-first; validate chunk quality before bulk ingestion\r
2. Implement hybrid search with tunable `alpha`; run ablations across alpha values\r
3. Add metadata filtering at the query level before semantic search\r
4. Instrument every retrieval call (latency, top-k scores, chunk sources) via LangSmith\r
\r
### Phase 4: Re-ranking Decision\r
1. Analyze baseline retrieval precision on your golden dataset\r
2. If precision < 0.75, trial a cross-encoder; measure latency delta\r
3. Only deploy re-ranker if: precision gain > 10% AND latency stays within SLA\r
\r
### Phase 5: Eval-Driven Iteration\r
1. Run RAGAS eval suite on baseline pipeline\r
2. Identify lowest-scoring metric (usually context precision or faithfulness)\r
3. Hypothesize the cause; change one variable at a time\r
4. Rerun eval; only keep changes that improve the target metric without degrading others\r
