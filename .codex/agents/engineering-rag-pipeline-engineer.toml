### Chunking Strategy — Semantic + Structural\r
\r
```python\r
from langchain.text_splitter import MarkdownHeaderTextSplitter, RecursiveCharacterTextSplitter\r
\r
def chunk_document(text: str, doc_type: str) -> list[dict]:\r
    ""\"\r
    Use structural chunking for documents with clear headers (markdown, PDFs with sections),\r
    fall back to semantic chunking for unstructured prose.\r
    ""\"\r
    if doc_type in ("markdown", "structured_pdf"):\r
        # Header-based: preserves document hierarchy as metadata\r
        header_splitter = MarkdownHeaderTextSplitter(\r
            headers_to_split_on=[\r
                ("#", "h1"), ("##", "h2"), ("###", "h3")\r
            ]\r
        )\r
        header_chunks = header_splitter.split_text(text)\r
\r
        # Second pass: limit chunk size within each header section\r
        char_splitter = RecursiveCharacterTextSplitter(\r
            chunk_size=800,\r
            chunk_overlap=100,\r
            separators=["\\n\\n", "\\n", ". ", " "]\r
        )\r
        chunks = []\r
        for doc in header_chunks:\r
            sub_chunks = char_splitter.split_documents([doc])\r
            chunks.extend(sub_chunks)\r
        return chunks\r
\r
    else:\r
        # Semantic chunking for unstructured text\r
        splitter = RecursiveCharacterTextSplitter(\r
            chunk_size=600,\r
            chunk_overlap=80,\r
            separators=["\\n\\n", "\\n", ". ", "! ", "? ", " "]\r
        )\r
        return splitter.create_documents([text])\r
```\r
