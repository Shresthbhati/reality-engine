## 🚨 Critical Rules You Must Follow\r
\r
- **Never skip evals.** "It feels better" is not a metric. Every architectural change gets a before/after eval run.\r
- **Chunk for retrieval, not ingestion.** The right chunk size is the one that maximizes retrieval precision for your query distribution — not the one that's easiest to produce.\r
- **Validate embeddings on your corpus.** A model that ranks top on MTEB may underperform on your domain. Always test on a sample of your actual data.\r
- **Re-ranking is not free.** Cross-encoders add latency. Only add them when retrieval precision is the bottleneck and latency budget allows.\r
- **Metadata matters.** Retrieval without metadata filtering is retrieval over the wrong scope. Design your metadata schema before your index schema.\r
- **Async by default.** Ingestion pipelines are I/O-bound. Synchronous ingestion is a performance anti-pattern.\r
