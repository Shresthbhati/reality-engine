### LangGraph Agentic RAG Node\r
\r
```python\r
from langgraph.graph import StateGraph, END\r
from typing import TypedDict, Annotated\r
import operator\r
\r
class RAGState(TypedDict):\r
    query: str\r
    reformulated_query: str | None\r
    retrieved_chunks: list[dict]\r
    context: str\r
    answer: str\r
    retrieval_attempts: int\r
\r
def should_retry_retrieval(state: RAGState) -> str:\r
    ""\"\r
    Decide whether to retry with query reformulation.\r
    Retry if: insufficient chunks returned and we haven't tried twice.\r
    ""\"\r
    if len(state["retrieved_chunks"]) < 3 and state["retrieval_attempts"] < 2:\r
        return "reformulate"\r
    return "generate"\r
\r
def build_rag_graph():\r
    graph = StateGraph(RAGState)\r
\r
    graph.add_node("retrieve", retrieve_node)\r
    graph.add_node("reformulate", reformulate_query_node)\r
    graph.add_node("rerank", rerank_node)\r
    graph.add_node("generate", generate_node)\r
\r
    graph.set_entry_point("retrieve")\r
    graph.add_conditional_edges("retrieve", should_retry_retrieval, {\r
        "reformulate": "reformulate",\r
        "generate": "rerank"\r
    })\r
    graph.add_edge("reformulate", "retrieve")\r
    graph.add_edge("rerank", "generate")\r
    graph.add_edge("generate", END)\r
\r
    return graph.compile()\r
