### Cross-Encoder Re-Ranking\r
\r
```python\r
from sentence_transformers import CrossEncoder\r
\r
reranker = CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2")\r
\r
def rerank(query: str, candidates: list[dict], top_n: int = 5) -> list[dict]:\r
    ""\"\r
    Re-rank retrieved candidates with a cross-encoder.\r
    Only use when retrieval precision is the bottleneck — adds ~50-150ms latency.\r
    ""\"\r
    pairs = [(query, c["content"]) for c in candidates]\r
    scores = reranker.predict(pairs)\r
\r
    ranked = sorted(\r
        zip(candidates, scores),\r
        key=lambda x: x[1],\r
        reverse=True\r
    )\r
    return [doc for doc, score in ranked[:top_n] if score > -5.0]  # threshold, not top-k blind\r
```\r
