### Hybrid Search (Dense + Sparse Fusion)\r
\r
```python\r
from sqlalchemy.ext.asyncio import AsyncSession\r
from sqlalchemy import text\r
\r
async def hybrid_search(\r
    query: str,\r
    query_embedding: list[float],\r
    db: AsyncSession,\r
    metadata_filter: dict | None = None,\r
    top_k: int = 10,\r
    alpha: float = 0.7,  # weight for semantic vs. keyword; tune per domain\r
) -> list[dict]:\r
    ""\"\r
    Reciprocal Rank Fusion of semantic and full-text search.\r
    alpha=0.7 favors semantic; lower it for keyword-heavy domains.\r
    ""\"\r
    filter_clause = ""\r
    params = {"embedding": query_embedding, "query": query, "top_k": top_k * 2}\r
\r
    if metadata_filter:\r
        filter_clause = "AND metadata @> :filter"\r
        params["filter"] = metadata_filter\r
\r
    result = await db.execute(text(f""\"\r
        WITH semantic AS (\r
            SELECT id, content, metadata,\r
                   1 - (embedding <=> :embedding::vector) AS score,\r
                   ROW_NUMBER() OVER (ORDER BY embedding <=> :embedding::vector) AS rank\r
            FROM document_chunks\r
            WHERE 1=1 {filter_clause}\r
            ORDER BY embedding <=> :embedding::vector\r
            LIMIT :top_k\r
        ),\r
        keyword AS (\r
            SELECT id, content, metadata,\r
                   ts_rank(to_tsvector('english', content),\r
                           plainto_tsquery('english', :query)) AS score,\r
                   ROW_NUMBER() OVER (\r
                       ORDER BY ts_rank(to_tsvector('english', content),\r
                                        plainto_tsquery('english', :query)) DESC\r
                   ) AS rank\r
            FROM document_chunks\r
            WHERE to_tsvector('english', content) @@ plainto_tsquery('english', :query)\r
            {filter_clause}\r
            LIMIT :top_k\r
        ),\r
        fused AS (\r
            SELECT\r
                COALESCE(s.id, k.id) AS id,\r
                COALESCE(s.content, k.content) AS content,\r
                COALESCE(s.metadata, k.metadata) AS metadata,\r
                (\r
                    {alpha} * COALESCE(1.0 / (60 + s.rank), 0) +\r
                    (1 - {alpha}) * COALESCE(1.0 / (60 + k.rank), 0)\r
                ) AS rrf_score\r
            FROM semantic s\r
            FULL OUTER JOIN keyword k ON s.id = k.id\r
        )\r
        SELECT * FROM fused ORDER BY rrf_score DESC LIMIT :top_k\r
    ""\"), params)\r
\r
    return [dict(row) for row in result.fetchall()]\r
```\r
