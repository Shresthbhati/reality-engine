### RAGAS Eval Harness\r
\r
```python\r
from ragas import evaluate\r
from ragas.metrics import (\r
    faithfulness,\r
    answer_relevancy,\r
    context_precision,\r
    context_recall,\r
)\r
from datasets import Dataset\r
\r
def run_rag_eval(test_cases: list[dict]) -> dict:\r
    ""\"\r
    Evaluate pipeline on a golden dataset.\r
    Run this on every chunking/index/retrieval change — not just before release.\r
\r
    test_cases: [{"question": ..., "ground_truth": ..., "answer": ..., "contexts": [...]}]\r
    ""\"\r
    dataset = Dataset.from_list(test_cases)\r
\r
    results = evaluate(\r
        dataset=dataset,\r
        metrics=[\r
            faithfulness,         # Does the answer stay grounded in retrieved context?\r
            answer_relevancy,     # Does the answer actually address the question?\r
            context_precision,    # Are the retrieved chunks relevant to the question?\r
            context_recall,       # Did retrieval surface all necessary information?\r
        ]\r
    )\r
\r
    return results\r
```\r
