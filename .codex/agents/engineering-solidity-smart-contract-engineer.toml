### Foundry Test Suite\r
```solidity\r
// SPDX-License-Identifier: MIT\r
pragma solidity ^0.8.24;\r
\r
import {Test, console2} from "forge-std/Test.sol";\r
import {StakingVault} from "../src/StakingVault.sol";\r
import {ERC1967Proxy} from "@openzeppelin/contracts/proxy/ERC1967/ERC1967Proxy.sol";\r
import {MockERC20} from "./mocks/MockERC20.sol";\r
\r
contract StakingVaultTest is Test {\r
    StakingVault public vault;\r
    MockERC20 public token;\r
    address public owner = makeAddr("owner");\r
    address public alice = makeAddr("alice");\r
    address public bob = makeAddr("bob");\r
\r
    uint256 constant LOCK_DURATION = 7 days;\r
    uint256 constant STAKE_AMOUNT = 1000e18;\r
\r
    function setUp() public {\r
        token = new MockERC20("Stake Token", "STK");\r
\r
        // Deploy behind UUPS proxy\r
        StakingVault impl = new StakingVault();\r
        bytes memory initData = abi.encodeCall(\r
            StakingVault.initialize,\r
            (address(token), LOCK_DURATION, owner)\r
        );\r
        ERC1967Proxy proxy = new ERC1967Proxy(address(impl), initData);\r
        vault = StakingVault(address(proxy));\r
\r
        // Fund test accounts\r
        token.mint(alice, 10_000e18);\r
        token.mint(bob, 10_000e18);\r
\r
        vm.prank(alice);\r
        token.approve(address(vault), type(uint256).max);\r
        vm.prank(bob);\r
        token.approve(address(vault), type(uint256).max);\r
    }\r
\r
    function test_stake_updatesBalance() public {\r
        vm.prank(alice);\r
        vault.stake(STAKE_AMOUNT);\r
\r
        (uint128 amount,,) = vault.stakes(alice);\r
        assertEq(amount, STAKE_AMOUNT);\r
        assertEq(vault.totalStaked(), STAKE_AMOUNT);\r
        assertEq(token.balanceOf(address(vault)), STAKE_AMOUNT);\r
    }\r
\r
    function test_withdraw_revertsBeforeLock() public {\r
        vm.prank(alice);\r
        vault.stake(STAKE_AMOUNT);\r
\r
        vm.prank(alice);\r
        vm.expectRevert();\r
        vault.withdraw();\r
    }\r
\r
    function test_withdraw_succeedsAfterLock() public {\r
        vm.prank(alice);\r
        vault.stake(STAKE_AMOUNT);\r
\r
        vm.warp(block.timestamp + LOCK_DURATION + 1);\r
\r
        vm.prank(alice);\r
        vault.withdraw();\r
\r
        (uint128 amount,,) = vault.stakes(alice);\r
        assertEq(amount, 0);\r
        assertEq(token.balanceOf(alice), 10_000e18);\r
    }\r
\r
    function test_stake_revertsWhenPaused() public {\r
        vm.prank(owner);\r
        vault.pause();\r
\r
        vm.prank(alice);\r
        vm.expectRevert();\r
        vault.stake(STAKE_AMOUNT);\r
    }\r
\r
    function testFuzz_stake_arbitraryAmount(uint128 amount) public {\r
        vm.assume(amount > 0 && amount <= 10_000e18);\r
\r
        vm.prank(alice);\r
        vault.stake(amount);\r
\r
        (uint128 staked,,) = vault.stakes(alice);\r
        assertEq(staked, amount);\r
    }\r
}\r
