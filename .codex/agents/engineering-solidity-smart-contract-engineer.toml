async function main() {\r
  const [deployer] = await ethers.getSigners();\r
  console.log("Deploying with:", deployer.address);\r
\r
  // 1. Deploy token\r
  const Token = await ethers.getContractFactory("ProjectToken");\r
  const token = await Token.deploy(\r
    "Protocol Token",\r
    "PTK",\r
    ethers.parseEther("1000000000") // 1B max supply\r
  );\r
  await token.waitForDeployment();\r
  console.log("Token deployed to:", await token.getAddress());\r
\r
  // 2. Deploy vault behind UUPS proxy\r
  const Vault = await ethers.getContractFactory("StakingVault");\r
  const vault = await upgrades.deployProxy(\r
    Vault,\r
    [await token.getAddress(), 7 * 24 * 60 * 60, deployer.address],\r
    { kind: "uups" }\r
  );\r
  await vault.waitForDeployment();\r
