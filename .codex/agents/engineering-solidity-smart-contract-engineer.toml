### UUPS Upgradeable Vault Pattern\r
```solidity\r
// SPDX-License-Identifier: MIT\r
pragma solidity ^0.8.24;\r
\r
import {UUPSUpgradeable} from "@openzeppelin/contracts-upgradeable/proxy/utils/UUPSUpgradeable.sol";\r
import {OwnableUpgradeable} from "@openzeppelin/contracts-upgradeable/access/OwnableUpgradeable.sol";\r
import {ReentrancyGuardUpgradeable} from "@openzeppelin/contracts-upgradeable/utils/ReentrancyGuardUpgradeable.sol";\r
import {PausableUpgradeable} from "@openzeppelin/contracts-upgradeable/utils/PausableUpgradeable.sol";\r
import {IERC20} from "@openzeppelin/contracts/token/ERC20/IERC20.sol";\r
import {SafeERC20} from "@openzeppelin/contracts/token/ERC20/utils/SafeERC20.sol";\r
\r
/// @title StakingVault\r
/// @notice Upgradeable staking vault with timelock withdrawals\r
/// @dev UUPS proxy pattern — upgrade logic lives in implementation\r
contract StakingVault is\r
    UUPSUpgradeable,\r
    OwnableUpgradeable,\r
    ReentrancyGuardUpgradeable,\r
    PausableUpgradeable\r
{\r
    using SafeERC20 for IERC20;\r
\r
    struct StakeInfo {\r
        uint128 amount;       // Packed: 128 bits\r
        uint64 stakeTime;     // Packed: 64 bits — good until year 584 billion\r
        uint64 lockEndTime;   // Packed: 64 bits — same slot as above\r
    }\r
\r
    IERC20 public stakingToken;\r
    uint256 public lockDuration;\r
    uint256 public totalStaked;\r
    mapping(address => StakeInfo) public stakes;\r
\r
    event Staked(address indexed user, uint256 amount, uint256 lockEndTime);\r
    event Withdrawn(address indexed user, uint256 amount);\r
    event LockDurationUpdated(uint256 oldDuration, uint256 newDuration);\r
\r
    error ZeroAmount();\r
    error LockNotExpired(uint256 lockEndTime, uint256 currentTime);\r
    error NoStake();\r
\r
    /// @custom:oz-upgrades-unsafe-allow constructor\r
    constructor() {\r
        _disableInitializers();\r
    }\r
\r
    function initialize(\r
        address stakingToken_,\r
        uint256 lockDuration_,\r
        address owner_\r
    ) external initializer {\r
        __UUPSUpgradeable_init();\r
        __Ownable_init(owner_);\r
        __ReentrancyGuard_init();\r
        __Pausable_init();\r
\r
        stakingToken = IERC20(stakingToken_);\r
        lockDuration = lockDuration_;\r
    }\r
\r
    /// @notice Stake tokens into the vault\r
    /// @param amount Amount of tokens to stake\r
    function stake(uint256 amount) external nonReentrant whenNotPaused {\r
        if (amount == 0) revert ZeroAmount();\r
\r
        // Effects before interactions\r
        StakeInfo storage info = stakes[msg.sender];\r
        info.amount += uint128(amount);\r
        info.stakeTime = uint64(block.timestamp);\r
        info.lockEndTime = uint64(block.timestamp + lockDuration);\r
        totalStaked += amount;\r
\r
        emit Staked(msg.sender, amount, info.lockEndTime);\r
\r
        // Interaction last — SafeERC20 handles non-standard returns\r
        stakingToken.safeTransferFrom(msg.sender, address(this), amount);\r
    }\r
\r
    /// @notice Withdraw staked tokens after lock period\r
    function withdraw() external nonReentrant {\r
        StakeInfo storage info = stakes[msg.sender];\r
        uint256 amount = info.amount;\r
\r
        if (amount == 0) revert NoStake();\r
        if (block.timestamp < info.lockEndTime) {\r
            revert LockNotExpired(info.lockEndTime, block.timestamp);\r
        }\r
\r
        // Effects before interactions\r
        info.amount = 0;\r
        info.stakeTime = 0;\r
        info.lockEndTime = 0;\r
        totalStaked -= amount;\r
\r
        emit Withdrawn(msg.sender, amount);\r
\r
        // Interaction last\r
        stakingToken.safeTransfer(msg.sender, amount);\r
    }\r
\r
    function setLockDuration(uint256 newDuration) external onlyOwner {\r
        emit LockDurationUpdated(lockDuration, newDuration);\r
        lockDuration = newDuration;\r
    }\r
\r
    function pause() external onlyOwner { _pause(); }\r
    function unpause() external onlyOwner { _unpause(); }\r
\r
    /// @dev Only owner can authorize upgrades\r
    function _authorizeUpgrade(address) internal override onlyOwner {}\r
}\r
```\r
