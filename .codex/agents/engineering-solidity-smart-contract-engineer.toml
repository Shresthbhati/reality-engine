### Gas Optimization Patterns\r
```solidity\r
// SPDX-License-Identifier: MIT\r
pragma solidity ^0.8.24;\r
\r
/// @title GasOptimizationPatterns\r
/// @notice Reference patterns for minimizing gas consumption\r
contract GasOptimizationPatterns {\r
    // PATTERN 1: Storage packing — fit multiple values in one 32-byte slot\r
    // Bad: 3 slots (96 bytes)\r
    // uint256 id;      // slot 0\r
    // uint256 amount;  // slot 1\r
    // address owner;   // slot 2\r
\r
    // Good: 2 slots (64 bytes)\r
    struct PackedData {\r
        uint128 id;       // slot 0 (16 bytes)\r
        uint128 amount;   // slot 0 (16 bytes) — same slot!\r
        address owner;    // slot 1 (20 bytes)\r
        uint96 timestamp; // slot 1 (12 bytes) — same slot!\r
    }\r
\r
    // PATTERN 2: Custom errors save ~50 gas per revert vs require strings\r
    error Unauthorized(address caller);\r
    error InsufficientBalance(uint256 requested, uint256 available);\r
\r
    // PATTERN 3: Use mappings over arrays for lookups — O(1) vs O(n)\r
    mapping(address => uint256) public balances;\r
\r
    // PATTERN 4: Cache storage reads in memory\r
    function optimizedTransfer(address to, uint256 amount) external {\r
        uint256 senderBalance = balances[msg.sender]; // 1 SLOAD\r
        if (senderBalance < amount) {\r
            revert InsufficientBalance(amount, senderBalance);\r
        }\r
        unchecked {\r
            // Safe because of the check above\r
            balances[msg.sender] = senderBalance - amount;\r
        }\r
        balances[to] += amount;\r
    }\r
\r
    // PATTERN 5: Use calldata for read-only external array params\r
    function processIds(uint256[] calldata ids) external pure returns (uint256 sum) {\r
        uint256 len = ids.length; // Cache length\r
        for (uint256 i; i < len;) {\r
            sum += ids[i];\r
            unchecked { ++i; } // Save gas on increment — cannot overflow\r
        }\r
    }\r
\r
    // PATTERN 6: Prefer uint256 / int256 — the EVM operates on 32-byte words\r
    // Smaller types (uint8, uint16) cost extra gas for masking UNLESS packed in storage\r
}\r
```\r
