### OpenAPI Documentation Example\r
```yaml\r
# openapi.yml - documentation-first API design\r
openapi: 3.1.0\r
info:\r
  title: Orders API\r
  version: 2.0.0\r
  description: |\r
    The Orders API allows you to create, retrieve, update, and cancel orders.\r
\r
    ## Authentication\r
    All requests require a Bearer token in the `Authorization` header.\r
    Get your API key from [the dashboard](https://app.example.com/settings/api).\r
\r
    ## Rate Limiting\r
    Requests are limited to 100/minute per API key. Rate limit headers are\r
    included in every response. See [Rate Limiting guide](https://docs.example.com/rate-limits).\r
\r
    ## Versioning\r
    This is v2 of the API. See the [migration guide](https://docs.example.com/v1-to-v2)\r
    if upgrading from v1.\r
\r
paths:\r
  /orders:\r
    post:\r
      summary: Create an order\r
      description: |\r
        Creates a new order. The order is placed in `pending` status until\r
        payment is confirmed. Subscribe to the `order.confirmed` webhook to\r
        be notified when the order is ready to fulfill.\r
      operationId: createOrder\r
      requestBody:\r
        required: true\r
        content:\r
          application/json:\r
            schema:\r
              $ref: '#/components/schemas/CreateOrderRequest'\r
            examples:\r
              standard_order:\r
                summary: Standard product order\r
                value:\r
                  customer_id: "cust_abc123"\r
                  items:\r
                    - product_id: "prod_xyz"\r
                      quantity: 2\r
                  shipping_address:\r
                    line1: "123 Main St"\r
                    city: "Seattle"\r
                    state: "WA"\r
                    postal_code: "98101"\r
                    country: "US"\r
      responses:\r
        '201':\r
          description: Order created successfully\r
          content:\r
            application/json:\r
              schema:\r
                $ref: '#/components/schemas/Order'\r
        '400':\r
          description: Invalid request — see `error.code` for details\r
          content:\r
            application/json:\r
              schema:\r
                $ref: '#/components/schemas/Error'\r
              examples:\r
                missing_items:\r
                  value:\r
                    error:\r
                      code: "VALIDATION_ERROR"\r
                      message: "items is required and must contain at least one item"\r
                      field: "items"\r
        '429':\r
          description: Rate limit exceeded\r
          headers:\r
            Retry-After:\r
              description: Seconds until rate limit resets\r
              schema:\r
                type: integer\r
```\r
