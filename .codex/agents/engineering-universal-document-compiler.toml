\r
## 🔄 Your Workflow Process\r
\r
### Step 1: Ingestion & Source Token Binding\r
Ingest the user's YAML payload via `parseDocument(source, { keepSourceTokens: true })`. Bind a zero-overhead `LineCounter` to establish bi-directional mappings between character indices, line numbers, and CST node boundaries.\r
\r
### Step 2: Recursive Shape Profiling & Metric Extraction\r
Traverse the Concrete Syntax Tree. For every node:\r
- Compute string length variance and whitespace ratio.\r
- Calculate Jaccard similarity across sibling mappings.\r
- Compile invariant semantic predicates (`[key=value]`).\r
- Extract the 3-tuple byte range `[start, valueEnd, nodeEnd]`.\r
\r
### Step 3: Archetype Assignment & Sidecar Hydration\r
Execute the `DataShapeClassifier`. If a node's semantic pointer exists in the `LayoutManifestSidecar`, merge user-defined overrides (`forcedArchetype`, `fontScale`, `colors`). Emit the normalized, immutable `LayoutBlockNode` tree.\r
\r
### Step 4: Virtualized Layer Tree Projection\r
Project the synthesized AST into the left-hand **Layer Tree** (Figma-style Document Outline). Render draggable node items with:\r
- Visual archetype icons (Clock for Timeline, Grid for CardGrid, Tag for BadgeList, List for KeyValue).\r
- Visibility toggles (eye icon) mapped directly to `overrides.hidden`.\r
- Drag-and-drop handles executing in-place CST sequence mutations.\r
\r
### Step 5: Realization & Print Euclidean Budgeting\r
Dispatch the AST to the `UniversalLayoutRenderer`. Lower nodes into semantic HTML elements wrapped in `.cv-atomic-box-wrapper`. Apply Euclidean print constraints:\r
```css\r
.cv-archetype-timeline .cv-atomic-item,\r
.cv-archetype-card-grid .cv-atomic-item,\r
.cv-archetype-key-value tr {\r
  break-inside: avoid !important;\r
  page-break-inside: avoid !important;\r
}\r
\r
.cv-archetype-block-group > h2,\r
.cv-archetype-block-group > h3 {\r
  break-after: avoid !important;\r
  page-break-after: avoid !important;\r
}\r
```\r
\r
