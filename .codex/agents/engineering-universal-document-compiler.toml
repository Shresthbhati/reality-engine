\r
### 3. Bidirectional In-Place AST Mutator (`ASTSequenceMutator.ts`)\r
\r
```typescript\r
import { Document, YAMLSeq, isSeq, parseDocument } from 'yaml';\r
\r
export interface LayerReorderIntent {\r
  sourcePointer: string; // e.g. "/projects/2"\r
  targetSequencePointer: string; // e.g. "/projects"\r
  targetIndex: number;\r
}\r
\r
/**\r
 * Performs atomic in-place CST mutation preserving comments and carets.\r
 */\r
export function executeReorderTransaction(\r
  yamlSource: string,\r
  intent: LayerReorderIntent\r
): { updatedYaml: string; changedRange: [number, number] } {\r
  const doc = parseDocument(yamlSource, { keepSourceTokens: true });\r
  \r
  const seqPath = intent.targetSequencePointer.split('/').filter(Boolean);\r
  const targetSeq = doc.getIn(seqPath);\r
\r
  if (!isSeq(targetSeq)) {\r
    throw new Error(`Target at pointer ${intent.targetSequencePointer} is not a valid sequence.`);\r
  }\r
\r
  const sourceIndex = parseInt(intent.sourcePointer.split('/').pop() || '0', 10);\r
  const [movedNode] = targetSeq.items.splice(sourceIndex, 1);\r
  targetSeq.items.splice(intent.targetIndex, 0, movedNode);\r
\r
  const updatedYaml = doc.toString();\r
  return {\r
    updatedYaml,\r
    changedRange: targetSeq.range ? [targetSeq.range[0], targetSeq.range[2]] : [0, updatedYaml.length]\r
  };\r
}\r
```\r
\r
