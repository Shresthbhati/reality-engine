\r
### 2. Algorithmic Data-Shape Classifier (`DataShapeClassifier.ts`)\r
\r
```typescript\r
export class DataShapeClassifier {\r
  private static TEMPORAL_KEYS = new Set([\r
    'date', 'period', 'year', 'startdate', 'enddate', 'until', 'ano', 'inicio', 'fim', 'data'\r
  ]);\r
\r
  private static METRIC_KEYS = new Set([\r
    'value', 'metric', 'total', 'amount', 'score', 'valor', 'total', 'kpi', 'delta'\r
  ]);\r
\r
  /**\r
   * Calculates the average pairwise Jaccard similarity across a collection of mappings.\r
   */\r
  public static calculateJaccardUniformity(records: Record<string, any>[]): number {\r
    if (records.length <= 1) return 1.0;\r
    let totalJaccard = 0;\r
    let pairs = 0;\r
\r
    const keySets = records.map(r => new Set(Object.keys(r || {})));\r
\r
    for (let i = 0; i < keySets.length; i++) {\r
      for (let j = i + 1; j < keySets.length; j++) {\r
        const intersection = new Set([...keySets[i]].filter(k => keySets[j].has(k)));\r
        const union = new Set([...keySets[i], ...keySets[j]]);\r
        totalJaccard += union.size === 0 ? 1 : intersection.size / union.size;\r
        pairs++;\r
      }\r
    }\r
    return pairs === 0 ? 1.0 : totalJaccard / pairs;\r
  }\r
\r
  /**\r
   * Infers the optimal layout archetype for any arbitrary data node.\r
   */\r
  public static inferArchetype(data: any): LayoutArchetype {\r
    // 1. Primitive Scalars\r
    if (typeof data !== 'object' || data === null) {\r
      return typeof data === 'string' && data.length > 120 ? 'prose_flow' : 'leaf_item';\r
    }\r
\r
    // 2. Sequences\r
    if (Array.isArray(data)) {\r
      if (data.length === 0) return 'leaf_item';\r
\r
      // Sequence of Scalars\r
      if (typeof data[0] !== 'object' || data[0] === null) {\r
        const avgLength = data.reduce((acc, str) => acc + String(str).length, 0) / data.length;\r
        return avgLength <= 35 ? 'badge_list' : 'prose_flow';\r
      }\r
\r
      // Sequence of Mappings\r
      const records = data.filter(item => typeof item === 'object' && item !== null);\r
      const uniformity = this.calculateJaccardUniformity(records);\r
\r
      if (uniformity >= 0.55) {\r
        // Inspect keys for temporal triggers\r
        const hasTemporal = records.some(rec => \r
          Object.keys(rec).some(k => this.TEMPORAL_KEYS.has(k.toLowerCase()))\r
        );\r
        if (hasTemporal && records.length <= 25) return 'timeline';\r
\r
        // Inspect keys for numeric/metric triggers\r
        const hasMetric = records.some(rec => \r
          Object.keys(rec).some(k => this.METRIC_KEYS.has(k.toLowerCase()))\r
        );\r
        if (hasMetric && records.length <= 8) return 'key_value_table';\r
\r
        return 'card_grid';\r
      }\r
\r
      return 'block_group';\r
    }\r
\r
    // 3. Associative Mappings (Objects)\r
    const values = Object.values(data);\r
    const allTerminal = values.every(v => typeof v !== 'object' || v === null);\r
    if (allTerminal && Object.keys(data).length <= 12) {\r
      return 'key_value_table';\r
    }\r
\r
    return 'block_group';\r
  }\r
}\r
```\r
\r
