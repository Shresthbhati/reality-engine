### Step 5: Post-Processing and Structured Output\r
\r
```python\r
import json\r
import re\r
\r
def normalize_transcript(segments: list[TranscriptSegment]) -> list[TranscriptSegment]:\r
    ""\"\r
    Clean transcript text after model output.\r
\r
    Handles common Whisper-style model artifacts:\r
    - All-caps transcription segments from music/noise\r
    - Double spaces, leading/trailing whitespace\r
    - Filler word normalization (configurable)\r
    - Sentence boundary repair across segment splits\r
    ""\"\r
    for seg in segments:\r
        text = seg.text\r
        text = re.sub(r"\\s+", " ", text).strip()\r
        # Flag likely noise segments — do not silently drop them\r
        if text.isupper() and len(text) > 20:\r
            seg.text = f"[NOISE: {text}]"\r
        else:\r
            seg.text = text\r
    return segments\r
\r
\r
def export_srt(segments: list[TranscriptSegment], output_path: str) -> str:\r
    ""\"\r
    Export transcript as SRT subtitle file.\r
\r
    Validates reading speed (max 20 chars/second per broadcast standard).\r
    Splits long segments to comply with line length limits.\r
    ""\"\r
    def format_timestamp(seconds: float) -> str:\r
        h = int(seconds // 3600)\r
        m = int((seconds % 3600) // 60)\r
        s = int(seconds % 60)\r
        ms = int((seconds % 1) * 1000)\r
        return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"\r
\r
    lines = []\r
    for i, seg in enumerate(segments, 1):\r
        lines.append(str(i))\r
        lines.append(f"{format_timestamp(seg.start)} --> {format_timestamp(seg.end)}")\r
        speaker_prefix = f"[{seg.speaker}] " if seg.speaker else ""\r
        lines.append(f"{speaker_prefix}{seg.text}")\r
        lines.append("")\r
\r
    content = "\\n".join(lines)\r
    with open(output_path, "w", encoding="utf-8") as f:\r
        f.write(content)\r
    return output_path\r
\r
\r
def export_structured_json(segments: list[TranscriptSegment],\r
                            metadata: dict) -> dict:\r
    ""\"\r
    Export full transcript as structured JSON for downstream consumers.\r
\r
    Schema is stable across pipeline versions — consumers depend on it.\r
    Add fields, never remove or rename without versioning.\r
    ""\"\r
    return {\r
        "schema_version": "1.0",\r
        "metadata": metadata,\r
        "segments": [\r
            {\r
                "index": i,\r
                "start": seg.start,\r
                "end": seg.end,\r
                "duration": round(seg.end - seg.start, 3),\r
                "speaker": seg.speaker,\r
                "text": seg.text,\r
                "confidence": seg.confidence\r
            }\r
            for i, seg in enumerate(segments)\r
        ],\r
        "full_text": " ".join(seg.text for seg in segments),\r
        "speakers": list({seg.speaker for seg in segments if seg.speaker}),\r
        "total_duration": segments[-1].end if segments else 0\r
    }\r
```\r
