### Step 2: Audio Preprocessing with ffmpeg\r
\r
```python\r
import subprocess\r
from pathlib import Path\r
\r
def preprocess_audio(input_path: str, output_path: str) -> str:\r
    ""\"\r
    Normalize audio for Whisper-style model input.\r
\r
    Critical steps:\r
    - Resample to 16kHz (Whisper's native sample rate)\r
    - Downmix to mono (prevents channel-dependent accuracy variance)\r
    - Normalize loudness to EBU R128 standard\r
    - Strip video track if present (reduces file size, speeds processing)\r
\r
    Returns path to preprocessed wav file.\r
    ""\"\r
    cmd = [\r
        "ffmpeg", "-y",\r
        "-i", input_path,\r
        "-vn",                        # strip video\r
        "-acodec", "pcm_s16le",       # 16-bit PCM\r
        "-ar", "16000",               # 16kHz sample rate\r
        "-ac", "1",                   # mono\r
        "-af", "loudnorm=I=-16:TP=-1.5:LRA=11",  # EBU R128 loudness normalization\r
        output_path\r
    ]\r
    subprocess.run(cmd, check=True, capture_output=True)\r
    return output_path\r
\r
\r
def chunk_audio(input_path: str, chunk_dir: str,\r
                chunk_duration: int = 1800, overlap: int = 30) -> list[str]:\r
    ""\"\r
    Split long audio into overlapping chunks for model processing.\r
\r
    Uses overlap to prevent word truncation at chunk boundaries.\r
    Overlap segments are trimmed during transcript assembly.\r
\r
    chunk_duration: seconds per chunk (default 30 min)\r
    overlap: overlap window in seconds (default 30s)\r
    ""\"\r
    import math, os\r
    result = subprocess.run([\r
        "ffprobe", "-v", "quiet", "-show_entries", "format=duration",\r
        "-of", "default=noprint_wrappers=1:nokey=1", input_path\r
    ], capture_output=True, text=True, check=True)\r
    total_duration = float(result.stdout.strip())\r
\r
    chunks = []\r
    start = 0\r
    chunk_index = 0\r
    os.makedirs(chunk_dir, exist_ok=True)\r
\r
    while start < total_duration:\r
        end = min(start + chunk_duration + overlap, total_duration)\r
        out_path = f"{chunk_dir}/chunk_{chunk_index:04d}.wav"\r
        subprocess.run([\r
            "ffmpeg", "-y",\r
            "-i", input_path,\r
            "-ss", str(start),\r
            "-to", str(end),\r
            "-acodec", "copy",\r
            out_path\r
        ], check=True, capture_output=True)\r
        chunks.append({"path": out_path, "start_offset": start, "index": chunk_index})\r
        start += chunk_duration\r
        chunk_index += 1\r
\r
    return chunks\r
```\r
\r
### Step 3: Transcription with faster-whisper\r
\r
```python\r
from faster_whisper import WhisperModel\r
from dataclasses import dataclass\r
\r
@dataclass\r
class TranscriptSegment:\r
    start: float\r
    end: float\r
    text: str\r
    speaker: str | None = None\r
    confidence: float | None = None\r
\r
def transcribe_chunk(audio_path: str, model: WhisperModel,\r
                     language: str | None = None) -> list[TranscriptSegment]:\r
    ""\"\r
    Transcribe a single audio chunk using faster-whisper.\r
\r
    Returns segments with timestamps. Word-level timestamps enabled\r
    for subtitle generation accuracy.\r
\r
    Model size guidance:\r
    - tiny/base: real-time local use, lower accuracy\r
    - small/medium: balanced accuracy/speed for most use cases\r
    - large-v3: highest accuracy, requires GPU, ~2-3x real-time on A10G\r
    ""\"\r
    segments, info = model.transcribe(\r
        audio_path,\r
        language=language,\r
        word_timestamps=True,\r
        beam_size=5,\r
        vad_filter=True,           # voice activity detection — skip silence\r
        vad_parameters={"min_silence_duration_ms": 500}\r
    )\r
\r
    result = []\r
    for seg in segments:\r
        result.append(TranscriptSegment(\r
            start=seg.start,\r
            end=seg.end,\r
            text=seg.text.strip(),\r
            confidence=getattr(seg, "avg_logprob", None)\r
        ))\r
    return result\r
\r
\r
def assemble_chunks(chunk_results: list[dict],\r
                    overlap_seconds: int = 30) -> list[TranscriptSegment]:\r
    ""\"\r
    Merge chunked transcript results into a single timeline.\r
\r
    Trims the overlap region from all chunks except the first\r
    to prevent duplicate segments at chunk boundaries.\r
    ""\"\r
    merged = []\r
    for chunk in sorted(chunk_results, key=lambda c: c["start_offset"]):\r
        offset = chunk["start_offset"]\r
        trim_start = overlap_seconds if chunk["index"] > 0 else 0\r
        for seg in chunk["segments"]:\r
            adjusted_start = seg.start + offset\r
            if adjusted_start < offset + trim_start:\r
                continue  # skip overlap region from previous chunk\r
            merged.append(TranscriptSegment(\r
                start=adjusted_start,\r
                end=seg.end + offset,\r
                text=seg.text,\r
                confidence=seg.confidence\r
            ))\r
    return merged\r
```\r
