### Step 4: Speaker Diarization Integration\r
\r
```python\r
from pyannote.audio import Pipeline\r
import torch\r
\r
def run_diarization(audio_path: str, hf_token: str,\r
                    num_speakers: int | None = None) -> list[dict]:\r
    ""\"\r
    Run speaker diarization using pyannote.audio.\r
\r
    Returns speaker segments as [{start, end, speaker}].\r
    Merge with transcript segments in next step.\r
\r
    num_speakers: if known, pass it — improves accuracy significantly.\r
    If unknown, pyannote will estimate automatically (less accurate).\r
    ""\"\r
    pipeline = Pipeline.from_pretrained(\r
        "pyannote/speaker-diarization-3.1",\r
        use_auth_token=hf_token\r
    )\r
    pipeline.to(torch.device("cuda" if torch.cuda.is_available() else "cpu"))\r
\r
    diarization = pipeline(audio_path, num_speakers=num_speakers)\r
    segments = []\r
    for turn, _, speaker in diarization.itertracks(yield_label=True):\r
        segments.append({\r
            "start": turn.start,\r
            "end": turn.end,\r
            "speaker": speaker\r
        })\r
    return segments\r
\r
\r
def assign_speakers(transcript_segments: list[TranscriptSegment],\r
                    diarization_segments: list[dict]) -> list[TranscriptSegment]:\r
    ""\"\r
    Assign speaker labels to transcript segments using time overlap.\r
\r
    For each transcript segment, find the diarization segment with\r
    maximum overlap and assign that speaker label.\r
    ""\"\r
    def overlap(seg, dia):\r
        return max(0, min(seg.end, dia["end"]) - max(seg.start, dia["start"]))\r
\r
    for seg in transcript_segments:\r
        best_match = max(diarization_segments,\r
                         key=lambda d: overlap(seg, d),\r
                         default=None)\r
        if best_match and overlap(seg, best_match) > 0:\r
            seg.speaker = best_match["speaker"]\r
    return transcript_segments\r
```\r
