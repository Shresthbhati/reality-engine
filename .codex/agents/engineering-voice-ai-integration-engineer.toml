### Step 1: Audio Ingestion and Validation\r
\r
```python\r
import subprocess\r
import json\r
from pathlib import Path\r
\r
SUPPORTED_EXTENSIONS = {".wav", ".mp3", ".m4a", ".ogg", ".flac", ".mp4", ".mov", ".webm"}\r
MAX_DURATION_SECONDS = 14400  # 4 hours\r
\r
def validate_audio_file(file_path: str) -> dict:\r
    ""\"\r
    Validate audio file before processing.\r
    Uses ffprobe to detect format, duration, codec, and channel layout.\r
    Never trust file extensions — always probe the actual container.\r
    ""\"\r
    path = Path(file_path)\r
    if path.suffix.lower() not in SUPPORTED_EXTENSIONS:\r
        raise ValueError(f"Unsupported extension: {path.suffix}")\r
\r
    result = subprocess.run([\r
        "ffprobe", "-v", "quiet",\r
        "-print_format", "json",\r
        "-show_streams", "-show_format",\r
        str(path)\r
    ], capture_output=True, text=True, check=True)\r
\r
    probe = json.loads(result.stdout)\r
    duration = float(probe["format"]["duration"])\r
\r
    if duration > MAX_DURATION_SECONDS:\r
        raise ValueError(f"File exceeds max duration: {duration:.0f}s > {MAX_DURATION_SECONDS}s")\r
\r
    audio_streams = [s for s in probe["streams"] if s["codec_type"] == "audio"]\r
    if not audio_streams:\r
        raise ValueError("No audio stream found in file")\r
\r
    stream = audio_streams[0]\r
    return {\r
        "duration": duration,\r
        "codec": stream["codec_name"],\r
        "sample_rate": int(stream["sample_rate"]),\r
        "channels": stream["channels"],\r
        "bit_rate": probe["format"].get("bit_rate"),\r
        "format": probe["format"]["format_name"]\r
    }\r
```\r
