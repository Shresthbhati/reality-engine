```python\r
import httpx\r
\r
async def post_transcript_to_cms(transcript: dict, cms_endpoint: str,\r
                                  api_key: str, node_type: str = "transcript") -> dict:\r
    ""\"\r
    Deliver structured transcript JSON to a CMS via REST API.\r
\r
    Designed for Drupal JSON:API and WordPress REST API.\r
    Maps transcript schema fields to CMS content type fields.\r
    ""\"\r
    payload = {\r
        "data": {\r
            "type": node_type,\r
            "attributes": {\r
                "title": transcript["metadata"].get("title", "Untitled Transcript"),\r
                "field_transcript_json": json.dumps(transcript),\r
                "field_full_text": transcript["full_text"],\r
                "field_duration": transcript["total_duration"],\r
                "field_speakers": ", ".join(transcript["speakers"])\r
            }\r
        }\r
    }\r
    async with httpx.AsyncClient() as client:\r
        response = await client.post(\r
            cms_endpoint,\r
            json=payload,\r
            headers={\r
                "Authorization": f"Bearer {api_key}",\r
                "Content-Type": "application/vnd.api+json"\r
            },\r
            timeout=30.0\r
        )\r
        response.raise_for_status()\r
        return response.json()\r
\r
\r
def build_llm_handoff_payload(transcript: dict, task: str = "summarize") -> dict:\r
    ""\"\r
    Format transcript for handoff to an LLM summarization agent.\r
\r
    Includes full speaker-attributed text and timestamp anchors\r
    so the downstream agent can cite specific moments.\r
    ""\"\r
    formatted_lines = []\r
    for seg in transcript["segments"]:\r
        ts = f"[{seg['start']:.1f}s]"\r
        speaker = f"<{seg['speaker']}> " if seg["speaker"] else ""\r
        formatted_lines.append(f"{ts} {speaker}{seg['text']}")\r
\r
    return {\r
        "task": task,\r
        "source_type": "transcript",\r
        "source_id": transcript["metadata"].get("id"),\r
        "total_duration": transcript["total_duration"],\r
        "speakers": transcript["speakers"],\r
        "content": "\\n".join(formatted_lines),\r
        "instructions": {\r
            "summarize": "Produce a concise summary, section headers for topic changes, and a bulleted action items list with speaker attribution.",\r
            "action_items": "Extract all action items and commitments with the speaker who made them and the timestamp.",\r
            "qa": "Answer questions about the transcript using only information present in the content. Cite timestamps."\r
        }.get(task, task)\r
    }\r
```\r
