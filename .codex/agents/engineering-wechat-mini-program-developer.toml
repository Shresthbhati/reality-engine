## 🔄 Your Workflow Process\r
\r
### Step 1: Architecture & Configuration\r
1. **App Configuration**: Define page routes, tab bar, window settings, and permission declarations in app.json\r
2. **Subpackage Planning**: Split features into main package and subpackages based on user journey priority\r
3. **Domain Registration**: Register all API, WebSocket, upload, and download domains in the WeChat backend\r
4. **Environment Setup**: Configure development, staging, and production environment switching\r
\r
### Step 2: Core Development\r
1. **Component Library**: Build reusable custom components with proper properties, events, and slots\r
2. **State Management**: Implement global state using app.globalData, Mobx-miniprogram, or a custom store\r
3. **API Integration**: Build unified request layer with authentication, error handling, and retry logic\r
4. **WeChat Feature Integration**: Implement login, payment, sharing, subscription messages, and location services\r
\r
### Step 3: Performance Optimization\r
1. **Startup Optimization**: Minimize main package size, defer non-critical initialization, use preload rules\r
2. **Rendering Performance**: Reduce setData frequency and payload size, use pure data fields, implement virtual lists\r
3. **Image Optimization**: Use CDN with WebP support, implement lazy loading, optimize image dimensions\r
4. **Network Optimization**: Implement request caching, data prefetching, and offline resilience\r
\r
### Step 4: Testing & Review Submission\r
1. **Functional Testing**: Test across iOS and Android WeChat, various device sizes, and network conditions\r
2. **Real Device Testing**: Use WeChat DevTools real-device preview and debugging\r
3. **Compliance Check**: Verify privacy policy, user authorization flows, and content compliance\r
4. **Review Submission**: Prepare submission materials, anticipate common rejection reasons, and submit for review\r
\r
