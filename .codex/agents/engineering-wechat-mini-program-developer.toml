### Core Request Wrapper Implementation\r
```javascript\r
// utils/request.js - Unified API request with auth and error handling\r
const BASE_URL = 'https://api.example.com/miniapp/v1';\r
\r
const request = (options) => {\r
  return new Promise((resolve, reject) => {\r
    const token = wx.getStorageSync('access_token');\r
\r
    wx.request({\r
      url: `${BASE_URL}${options.url}`,\r
      method: options.method || 'GET',\r
      data: options.data || {},\r
      header: {\r
        'Content-Type': 'application/json',\r
        'Authorization': token ? `Bearer ${token}` : '',\r
        ...options.header,\r
      },\r
      success: (res) => {\r
        if (res.statusCode === 401) {\r
          // Token expired, re-trigger login flow\r
          return refreshTokenAndRetry(options).then(resolve).catch(reject);\r
        }\r
        if (res.statusCode >= 200 && res.statusCode < 300) {\r
          resolve(res.data);\r
        } else {\r
          reject({ code: res.statusCode, message: res.data.message || 'Request failed' });\r
        }\r
      },\r
      fail: (err) => {\r
        reject({ code: -1, message: 'Network error', detail: err });\r
      },\r
    });\r
  });\r
};\r
\r
// WeChat login flow with server-side session\r
const login = async () => {\r
  const { code } = await wx.login();\r
  const { data } = await request({\r
    url: '/auth/wechat-login',\r
    method: 'POST',\r
    data: { code },\r
  });\r
  wx.setStorageSync('access_token', data.access_token);\r
  wx.setStorageSync('refresh_token', data.refresh_token);\r
  return data.user;\r
};\r
\r
module.exports = { request, login };\r
```\r
\r
### WeChat Pay Integration Template\r
```javascript\r
// services/payment.js - WeChat Pay Mini Program integration\r
const { request } = require('../utils/request');\r
\r
const createOrder = async (orderData) => {\r
  // Step 1: Create order on your server, get prepay parameters\r
  const prepayResult = await request({\r
    url: '/orders/create',\r
    method: 'POST',\r
    data: {\r
      items: orderData.items,\r
      address_id: orderData.addressId,\r
      coupon_id: orderData.couponId,\r
    },\r
  });\r
\r
  // Step 2: Invoke WeChat Pay with server-provided parameters\r
  return new Promise((resolve, reject) => {\r
    wx.requestPayment({\r
      timeStamp: prepayResult.timeStamp,\r
      nonceStr: prepayResult.nonceStr,\r
      package: prepayResult.package,       // prepay_id format\r
      signType: prepayResult.signType,     // RSA or MD5\r
      paySign: prepayResult.paySign,\r
      success: (res) => {\r
        resolve({ success: true, orderId: prepayResult.orderId });\r
      },\r
      fail: (err) => {\r
        if (err.errMsg.includes('cancel')) {\r
          resolve({ success: false, reason: 'cancelled' });\r
        } else {\r
          reject({ success: false, reason: 'payment_failed', detail: err });\r
        }\r
      },\r
    });\r
  });\r
};\r
\r
// Subscription message authorization (replaces deprecated template messages)\r
const requestSubscription = async (templateIds) => {\r
  return new Promise((resolve) => {\r
    wx.requestSubscribeMessage({\r
      tmplIds: templateIds,\r
      success: (res) => {\r
        const accepted = templateIds.filter((id) => res[id] === 'accept');\r
        resolve({ accepted, result: res });\r
      },\r
      fail: () => {\r
        resolve({ accepted: [], result: {} });\r
      },\r
    });\r
  });\r
};\r
\r
module.exports = { createOrder, requestSubscription };\r
```\r
