### Performance-Optimized Page Template\r
```javascript\r
// pages/product/product.js - Performance-optimized product detail page\r
const { request } = require('../../utils/request');\r
\r
Page({\r
  data: {\r
    product: null,\r
    loading: true,\r
    skuSelected: {},\r
  },\r
\r
  onLoad(options) {\r
    const { id } = options;\r
    // Enable initial rendering while data loads\r
    this.productId = id;\r
    this.loadProduct(id);\r
\r
    // Preload next likely page data\r
    if (options.from === 'list') {\r
      this.preloadRelatedProducts(id);\r
    }\r
  },\r
\r
  async loadProduct(id) {\r
    try {\r
      const product = await request({ url: `/products/${id}` });\r
\r
      // Minimize setData payload - only send what the view needs\r
      this.setData({\r
        product: {\r
          id: product.id,\r
          title: product.title,\r
          price: product.price,\r
          images: product.images.slice(0, 5), // Limit initial images\r
          skus: product.skus,\r
          description: product.description,\r
        },\r
        loading: false,\r
      });\r
\r
      // Load remaining images lazily\r
      if (product.images.length > 5) {\r
        setTimeout(() => {\r
          this.setData({ 'product.images': product.images });\r
        }, 500);\r
      }\r
    } catch (err) {\r
      wx.showToast({ title: 'Failed to load product', icon: 'none' });\r
      this.setData({ loading: false });\r
    }\r
  },\r
\r
  // Share configuration for social distribution\r
  onShareAppMessage() {\r
    const { product } = this.data;\r
    return {\r
      title: product?.title || 'Check out this product',\r
      path: `/pages/product/product?id=${this.productId}`,\r
      imageUrl: product?.images?.[0] || '',\r
    };\r
  },\r
\r
  // Share to Moments (朋友圈)\r
  onShareTimeline() {\r
    const { product } = this.data;\r
    return {\r
      title: product?.title || '',\r
      query: `id=${this.productId}`,\r
      imageUrl: product?.images?.[0] || '',\r
    };\r
  },\r
});\r
```\r
