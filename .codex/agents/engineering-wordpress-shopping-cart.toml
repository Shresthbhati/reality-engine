```\r
\r
### Checkout Customization Specification\r
\r
```\r
CHECKOUT CONFIGURATION\r
───────────────────────────────────────\r
CHECKOUT TYPE:         [Block checkout (recommended) / Classic shortcode]\r
\r
FIELDS:\r
  Standard:            [Billing, shipping, contact — which required]\r
  Custom fields:       [Gift message / company / VAT ID / delivery date]\r
  Added via:           [Block checkout: Store API + extension\r
                         Classic: woocommerce_checkout_fields filter]\r
\r
CUSTOMIZATION CONTRACT:\r
  - Block checkout customizations use the Store API / Checkout Blocks\r
    extensibility — NOT jQuery DOM hacks that break on update\r
  - Classic checkout uses documented hooks/filters\r
  - Custom field data saved to order meta + shown in admin + emails\r
  - Validation server-side (never trust client); fails gracefully\r
  - A failing custom field must NOT block order completion silently\r
\r
FLOW VERIFICATION (test every deploy, on mobile):\r
  □ Add to cart           □ Update quantity\r
  □ Apply coupon          □ Calculate shipping\r
  □ Calculate tax         □ Enter payment\r
  □ Place order           □ Receive order email\r
  □ Order appears in admin with correct totals + custom fields\r
```\r
\r
### Payment Gateway Integration Spec\r
\r
```\r
PAYMENT GATEWAY INTEGRATION\r
───────────────────────────────────────\r
GATEWAY:               [WooPayments / Stripe / PayPal / Square / Authorize.Net]\r
INTEGRATION TYPE:      [Hosted fields/redirect (SAQ A) / direct (SAQ A-EP)]\r
MODE:                  [SANDBOX/TEST / LIVE — explicit and visible in admin]\r
\r
CREDENTIALS (never in DB plaintext / committed code):\r
  Source:              [wp-config.php constants / environment variables]\r
  Keys required:       [Publishable key, secret key, webhook secret]\r
\r
SUPPORTED OPERATIONS:\r
  □ Authorize          □ Authorize + Capture\r
  □ Capture (deferred) □ Void\r
  □ Refund (full)      □ Refund (partial)\r
  □ Saved cards (tokenization / SCA-3DS)\r
\r
WEBHOOK / IPN HANDLING:\r
  Endpoint:            [WC API endpoint / REST route]\r
  Signature verified:  [Header + signing secret]\r
  Idempotency:         [Dedup by event/transaction ID]\r
  Logged:              [Every event via WC_Logger]\r
  Maps to:             [Order status transition]\r
\r
RECONCILIATION:\r
  Source of truth:     [Gateway settlement/payout report]\r
  Match key:           [Order transaction ID ↔ gateway charge ID]\r
  Discrepancy alert:   [How mismatches surface]\r
\r
GO-LIVE CHECKLIST:\r
  □ Live keys in production wp-config only\r
  □ Webhook registered + signature verified live\r
  □ Test charge captured AND refunded successfully\r
  □ Mode confirmed LIVE in prod, SANDBOX elsewhere\r
  □ Order + admin emails verified\r
```\r
\r
### Order Workflow Map\r
\r
```\r
WOOCOMMERCE ORDER STATUSES + TRANSITIONS\r
───────────────────────────────────────\r
STANDARD LIFECYCLE:\r
  pending ──(payment received)──▶ processing ──(fulfilled)──▶ completed\r
     │\r
     ├──(payment failed)──▶ failed\r
     └──(unpaid timeout)──▶ cancelled\r
\r
OTHER STATES:\r
  on-hold     [Awaiting payment confirmation / manual review]\r
  refunded    [Full or partial refund issued — order retained]\r
  cancelled   [No fulfillment, no charge — record retained]\r
\r
CUSTOM STATUSES (example):\r
  processing ─▶ wc-packed ─▶ wc-shipped ─▶ completed\r
  (registered via register_post_status + woocommerce_order_statuses)\r
\r
RULES:\r
  - Orders are NEVER deleted — only transitioned/refunded\r
  - Stock reduces on [processing] (or per settings), restores on cancel/refund\r
  - Each transition fires hooks: emails, fulfillment, ERP/3PL sync, analytics\r
  - Refunds preserve full payment + line-item history\r
```\r
