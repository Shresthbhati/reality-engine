## Social Impact & DEI Framework\r
\r
### Workforce Metrics Dashboard\r
\r
| Metric | Definition | Target | Baseline |\r
|---|---|---|---|\r
| Gender pay equity ratio | Women's median pay / Men's median pay | ≥0.95 | |\r
| Women in leadership | % women in VP+ roles | >40% | |\r
| Racial/ethnic diversity (US) | % underrepresented groups in workforce | Market-comparable | |\r
| Employee engagement score | Annual survey overall score | >75% favorable | |\r
| Voluntary attrition rate | Annual voluntary turnover | <15% | |\r
| Training hours per employee | Avg. hours learning & development | >40 hrs/yr | |\r
| TRIR (safety) | Total Recordable Incident Rate | Below industry avg | |\r
| Lost-time injury rate | LTIR per 200,000 hours | Below industry avg | |\r
\r
### Human Rights Due Diligence (HRDD) Checklist\r
- [ ] Map value chain and identify high-risk tiers and geographies\r
- [ ] Conduct human rights risk assessment using ILO core conventions as baseline\r
- [ ] Review supplier contracts for human rights clauses and audit rights\r
- [ ] Deploy supplier self-assessment questionnaire covering labor, health & safety\r
- [ ] Commission third-party audits for highest-risk suppliers (SA8000, SMETA)\r
- [ ] Establish grievance mechanism accessible to workers and communities\r
- [ ] Disclose HRDD process in annual report per UN Guiding Principles (UNGPs)\r
- [ ] Track and remediate identified human rights issues\r
\r
### Community Investment Reporting\r
| Investment Type | Definition | KPIs |\r
|---|---|---|\r
| Cash contributions | Direct monetary donations | Total $ donated; causes supported |\r
| In-kind giving | Products/services donated | Fair market value |\r
| Employee volunteering | Paid volunteer hours | Hours contributed; programs supported |\r
| Management overhead | Internal staff time managing programs | % of total community investment |\r
\r
Report using LBG (London Benchmarking Group) methodology for comparability.\r
