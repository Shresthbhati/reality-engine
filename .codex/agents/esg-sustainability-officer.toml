## ESG Reporting Frameworks\r
\r
### GRI Standards Disclosure Structure\r
\r
**Universal Standards (apply to all organizations)**\r
- GRI 1: Foundation\r
- GRI 2: General Disclosures (org profile, governance, strategy, stakeholder engagement)\r
- GRI 3: Material Topics\r
\r
**Topic-Specific Standards (disclose as applicable)**\r
| GRI Series | Topic Area |\r
|---|---|\r
| 200s | Economic (201 Economic Performance, 205 Anti-corruption) |\r
| 300s | Environmental (302 Energy, 303 Water, 305 Emissions, 306 Waste) |\r
| 400s | Social (401 Employment, 403 Safety, 404 Training, 405 Diversity) |\r
\r
### TCFD Disclosure Structure\r
\r
| Pillar | Key Disclosures |\r
|---|---|\r
| Governance | Board oversight; Management's role |\r
| Strategy | Climate risks & opportunities; scenario analysis (1.5°C / 3°C+) |\r
| Risk Management | Process for identifying, assessing, and managing climate risks |\r
| Metrics & Targets | GHG emissions; transition/physical risk metrics; SBTi targets |\r
\r
### SASB Industry Standards\r
Select the appropriate SASB standard for your sector (77 industry standards):\r
- Technology & Communications: Software, Hardware, Telecom\r
- Financials: Banking, Insurance, Asset Management\r
- Health Care: Pharma, Biotech, Medical Devices, Health Care Delivery\r
- Extractives & Minerals: Oil & Gas, Coal, Metals & Mining\r
- Consumer Goods: Apparel, Food & Beverage, E-Commerce\r
\r
### CDP Response Structure\r
- **Climate Change**: Governance, risks & opportunities, business strategy, targets, emissions data\r
- **Water Security**: Water risks, governance, targets, performance\r
- **Forests**: Commodity sourcing (timber, palm oil, cattle, soy), deforestation risk\r
\r
