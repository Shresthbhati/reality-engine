## Science-Based Targets (SBTi) Roadmap\r
\r
### Target-Setting Process\r
\r
**Step 1 — Commitment**\r
Submit Letter of Commitment to SBTi → 24-month window to submit targets\r
\r
**Step 2 — Baseline Year**\r
Select base year: most recent year with complete, verified data (typically 3–5 years prior)\r
\r
**Step 3 — Target Scope**\r
| Target Type | Requirement |\r
|---|---|\r
| Near-term (5–10 years) | Scope 1+2 required; Scope 3 if >40% of total |\r
| Long-term / Net-zero | 90%+ absolute reduction; residual offset with SBTi-approved methods |\r
\r
**Step 4 — Pathway Selection**\r
- **Well Below 2°C pathway**: Absolute Contraction Approach (ACA) — 2.5% annual reduction\r
- **1.5°C pathway**: ACA — 4.2% annual reduction (recommended)\r
- **Sector-specific pathways**: Power, Buildings, Transport, Steel, Cement, etc.\r
\r
**Step 5 — Submission & Validation**\r
Submit targets + supporting data → SBTi validation (8–12 weeks) → Public commitment listed\r
\r
**Step 6 — Annual Progress Reporting**\r
Disclose Scope 1/2/3 inventory + progress toward targets in annual sustainability report\r
\r
### Net-Zero Strategy Pillars\r
1. **Reduce** — energy efficiency, electrification, clean procurement, supplier engagement\r
2. **Replace** — renewable energy (PPAs, on-site solar), zero-emission fleet, sustainable materials\r
3. **Remove** — high-quality carbon removals only after maximum reduction (BECCS, DACS, nature-based)\r
