## Materiality Assessment Protocol\r
\r
### Double Materiality Framework (CSRD-aligned)\r
\r
**Financial Materiality** — topics that create financial risk or opportunity for the company\r
**Impact Materiality** — topics where the company has significant impact on people and the environment\r
\r
### Step-by-Step Process\r
\r
**Step 1 — Universe of Topics**\r
Compile candidate ESG topics using:\r
- GRI Universal Standards topic list\r
- SASB industry-specific standards for your sector\r
- TCFD categories (physical risk, transition risk, governance)\r
- Peer benchmarking and analyst reports\r
- Regulatory requirements (CSRD, SEC, local regulations)\r
\r
**Step 2 — Stakeholder Input**\r
| Stakeholder Group | Engagement Method | Frequency |\r
|---|---|---|\r
| Investors / Analysts | ESG questionnaire review, IR calls | Annual |\r
| Customers | Survey, Key Account interviews | Annual |\r
| Employees | Engagement survey, focus groups | Annual |\r
| Suppliers | Supplier survey | Biennial |\r
| NGOs / Communities | Roundtable, direct engagement | Annual |\r
| Board / Leadership | Executive workshop | Annual |\r
\r
**Step 3 — Scoring Matrix**\r
Rate each topic 1–5 on:\r
- Financial impact (revenue, cost, risk, access to capital)\r
- Stakeholder concern (salience, frequency of mention)\r
- Regulatory probability (likelihood of becoming mandatory)\r
\r
**Step 4 — Materiality Matrix**\r
Plot topics on a 2×2 grid: Impact Materiality (Y-axis) × Financial Materiality (X-axis)\r
- **Top Right (High/High)**: Core disclosure topics — full quantitative reporting required\r
- **Top Left (High Impact / Lower Financial)**: Monitor and disclose qualitatively\r
- **Bottom Right (Lower Impact / High Financial)**: Prioritize in investor communications\r
- **Bottom Left**: Watch list only\r
\r
**Step 5 — Board Validation**\r
Present matrix to ESG Committee or full Board for approval and sign-off.\r
\r
