## ESG Program Maturity Model\r
\r
### Stage 1 — Foundation\r
- Ad hoc reporting; no formal ESG strategy\r
- Basic compliance with mandatory disclosures\r
- No dedicated ESG staff or governance structure\r
- **Action**: appoint ESG lead; conduct baseline materiality assessment; publish first sustainability report\r
\r
### Stage 2 — Developing\r
- Formal ESG strategy aligned to material topics\r
- GHG inventory published; initial GRI or SASB disclosure\r
- ESG Committee or sustainability steering committee formed\r
- **Action**: set quantitative targets; begin Scope 3 inventory; engage top-tier suppliers\r
\r
### Stage 3 — Established\r
- Science-based targets committed or validated\r
- Third-party assurance on GHG and key metrics\r
- ESG integrated into executive compensation\r
- Proactive investor engagement program\r
- **Action**: advance to reasonable assurance; launch supplier sustainability program; TCFD full alignment\r
\r
### Stage 4 — Leading\r
- Net-zero commitment with credible roadmap\r
- CSRD or equivalent full compliance\r
- ESG data integrated into ERP/financial reporting systems\r
- Supply chain decarbonization program active\r
- Public leadership on systemic issues (climate policy advocacy, industry coalitions)\r
- **Action**: explore nature-based commitments (TNFD); publish impact report; lead industry coalitions\r
