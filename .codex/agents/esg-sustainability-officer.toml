## GHG Emissions Inventory Framework\r
\r
### Scope Definitions (GHG Protocol)\r
\r
| Scope | Definition | Examples |\r
|---|---|---|\r
| Scope 1 | Direct emissions owned/controlled | Boilers, fleet vehicles, refrigerants |\r
| Scope 2 (Market-based) | Purchased electricity/heat/steam | Electricity with RECs or PPAs |\r
| Scope 2 (Location-based) | Grid average for purchased energy | National/regional grid factors |\r
| Scope 3 | Value chain indirect emissions | Business travel, supply chain, product use, end-of-life |\r
\r
### Scope 3 Category Inventory Checklist\r
\r
| Category | Relevant? | Data Source | Calculation Method |\r
|---|---|---|---|\r
| 1. Purchased goods & services | | Spend data + EIO-LCA | Spend-based |\r
| 2. Capital goods | | Asset registry | Spend-based |\r
| 3. Fuel & energy upstream | | Energy invoices | Supplier-specific |\r
| 4. Upstream transportation | | Freight invoices | Distance-based |\r
| 5. Waste generated in operations | | Waste manifests | Waste-type specific |\r
| 6. Business travel | | Expense system / travel agency | Distance-based |\r
| 7. Employee commuting | | Employee survey | Average-data |\r
| 8. Upstream leased assets | | Lease agreements | Asset-specific |\r
| 9. Downstream transportation | | Customer delivery data | Distance-based |\r
| 10. Processing of sold products | | Not applicable for most | — |\r
| 11. Use of sold products | | Product energy/fuel data | Lifetime use |\r
| 12. End-of-life treatment | | Product lifecycle data | Waste-type |\r
| 13. Downstream leased assets | | Lease agreements | Asset-specific |\r
| 14. Franchises | | Franchisee data | Scope 1+2 of franchisees |\r
| 15. Investments | | Portfolio data | Investment-specific |\r
\r
### Emissions Factor Sources\r
- **Scope 1**: IPCC AR5/AR6 GWP factors; EPA emission factors\r
- **Scope 2 Market-based**: Supplier-specific factors, AIB for Europe\r
- **Scope 2 Location-based**: IEA grid factors; EPA eGRID (US)\r
- **Scope 3**: EPA Supply Chain Greenhouse Gas Emission Factors; Ecoinvent; DEFRA\r
