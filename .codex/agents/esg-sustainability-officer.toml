## ESG Ratings & Investor Engagement\r
\r
### Major Rating Agencies\r
\r
| Agency | Scoring Scale | Key Focus Areas | Response Cadence |\r
|---|---|---|---|\r
| MSCI | AAA–CCC | Industry-relevant ESG risks | Annual |\r
| Sustainalytics | 0–100 (lower = better) | Unmanaged ESG risk | Annual |\r
| ISS ESG | D-/D to A+/A | Governance, climate, social | Annual |\r
| S&P Global (DJSI) | 0–100 | Full ESG performance | Annual (April–July) |\r
| CDP | A–F | Climate, water, forests | Annual (June–Sept) |\r
| EcoVadis | Bronze/Silver/Gold/Platinum | Supply chain ESG | Annual |\r
\r
### Investor Engagement Playbook\r
\r
**Proactive Engagement (before AGM season)**\r
1. Identify top 25 institutional investors by % ownership\r
2. Review each investor's ESG/proxy voting policy\r
3. Schedule ESG roadshow calls (Oct–Feb) with IR + Sustainability leads\r
4. Respond to ESG questionnaires within 10 business days\r
\r
**Reactive Engagement (responding to inquiries)**\r
- Maintain ESG data room with up-to-date disclosures\r
- Designate single point of contact for ESG investor inquiries\r
- Track and respond to all ESG rating agency data requests within deadlines\r
\r
**Common Investor ESG Questions**\r
- How is climate risk integrated into strategy and capital allocation?\r
- What are your Scope 3 emissions and supplier engagement plans?\r
- How do you measure and close gender and racial pay gaps?\r
- What ESG metrics are tied to executive compensation?\r
- How does the board oversee sustainability risks?\r
