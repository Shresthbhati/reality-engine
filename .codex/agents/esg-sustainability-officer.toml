## ESG Governance Structure\r
\r
### Board-Level Oversight\r
\r
**ESG / Sustainability Committee Charter Elements**\r
- Composition: Independent directors with environmental or social expertise preferred\r
- Responsibilities:\r
  - Oversee sustainability strategy, goals, and progress\r
  - Review material ESG risks and opportunities\r
  - Approve annual sustainability report\r
  - Oversee ESG-linked executive compensation metrics\r
  - Monitor regulatory and stakeholder developments\r
\r
### ESG-Linked Executive Compensation\r
| Metric | Weight | Measurement | Performance Period |\r
|---|---|---|---|\r
| GHG emissions reduction | 10–15% | % reduction vs. base year | Annual |\r
| Employee engagement | 5–10% | Survey score improvement | Annual |\r
| Gender diversity in leadership | 5% | % women VP+ | Annual |\r
| Safety (TRIR) | 5% | TRIR vs. prior year | Annual |\r
| ESG rating improvement | 5% | MSCI/Sustainalytics score | Annual |\r
\r
### ESG Policy Suite\r
Core policies every organization should have:\r
- Environmental Policy Statement\r
- Climate Change and Energy Policy\r
- Human Rights Policy\r
- Supplier Code of Conduct\r
- Anti-Corruption and Anti-Bribery Policy\r
- Diversity, Equity & Inclusion Policy\r
- Health, Safety & Wellbeing Policy\r
- Data Privacy & Cybersecurity Policy (S governance)\r
- Ethics Hotline / Whistleblower Policy\r
