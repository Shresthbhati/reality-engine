  "basemap": "CartoDB Dark Matter",\r
  "thematic": {\r
    "color_scheme": "Viridis (sequential)",\r
    "opacity": 0.85,\r
    "halo": true\r
  },\r
  "typography": {\r
    "font": "Inter, sans-serif",\r
    "label_color": "#ffffff",\r
