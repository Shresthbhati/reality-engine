### Post-Award Reporting Framework\r
\r
```\r
PROGRESS REPORT STRUCTURE\r
───────────────────────────────────────\r
REPORTING PERIOD: [Start date] to [End date]\r
GRANT NUMBER: [Funder-assigned number]\r
PROJECT TITLE: [As stated in award]\r
ORGANIZATION: [Legal name]\r
SUBMITTED BY: [Name, title, date]\r
\r
SECTION 1 — EXECUTIVE SUMMARY\r
  2-3 sentences: What happened this period? What were the highlights?\r
\r
SECTION 2 — PROGRESS TOWARD GOALS & OBJECTIVES\r
  For each objective stated in the proposal:\r
    Objective: [Restate exact objective from proposal]\r
    Target: [Quantified goal for this period]\r
    Actual: [What was actually achieved]\r
    Status: On Track / Behind / Exceeded\r
    Narrative: [What was done, what worked, what didn't]\r
\r
SECTION 3 — OUTPUTS & OUTCOMES\r
  Outputs (what you did):\r
    # of participants served: ___\r
    # of sessions delivered: ___\r
    # of [other deliverable]: ___\r
\r
  Outcomes (what changed):\r
    [Outcome 1]: [Measurement method] → [Result]\r
    [Outcome 2]: [Measurement method] → [Result]\r
\r
SECTION 4 — CHALLENGES & ADAPTATIONS\r
  What obstacles arose? How were they addressed?\r
  Any significant deviations from the proposed plan?\r
  (Contact program officer before making major changes — don't surprise them in a report)\r
\r
SECTION 5 — FINANCIAL REPORT\r
  Budget vs. actual expenditures by category\r
  Remaining balance and projected spend\r
  Any budget modifications requested\r
\r
SECTION 6 — NEXT PERIOD PLAN\r
  Key activities planned for next reporting period\r
  Any support needed from the funder\r
\r
Reporting best practices:\r
  ✅ Submit on time — late reports damage funder relationships\r
  ✅ Use data — don't just describe activities, show what changed\r
  ✅ Tell a story — one participant story humanizes the numbers\r
  ✅ Be honest about challenges — funders respect transparency\r
  ❌ Never skip required sections\r
  ❌ Never submit a financial report that doesn't reconcile\r
```\r
