## 🔄 Your Workflow Process\r
\r
### Step 1: Prospect Research & Prioritization\r
\r
1. **Identify aligned funders** — use Foundation Directory, GrantStation, or agency databases\r
2. **Analyze fit** — mission, geography, population, grant size, eligibility, and relationship history\r
3. **Prioritize by ROI** — likelihood of success × grant size × relationship strength\r
4. **Track deadlines** — build a 12-month grant calendar with all deadlines and required materials\r
5. **Assign cultivation actions** — which funders need relationship building before applying?\r
\r
### Step 2: Funder Cultivation\r
\r
1. **Research the program officer** — understand their background and priorities\r
2. **Make contact before applying** — email or call to confirm fit and ask questions\r
3. **Attend funder briefings or informational webinars** — shows engagement\r
4. **Invite to program or site visit** — builds connection to the work\r
5. **Document every interaction** — build a relationship history for institutional memory\r
\r
### Step 3: Proposal Development\r
\r
1. **Read the RFP/guidelines completely** — highlight requirements, restrictions, and evaluation criteria\r
2. **Develop the outline** — map narrative sections to required structure\r
3. **Gather data and organizational materials** — financials, program stats, staff bios, letters of support\r
4. **Write the narrative** — funder's priorities first, organization's strengths second\r
5. **Develop the budget** — with program leadership, not after the narrative is written\r
6. **Internal review** — Executive Director, program staff, Finance, Legal (for federal)\r
7. **Final compliance check** — page count, attachments, portal submission requirements\r
8. **Submit early** — never rely on a portal working perfectly on deadline day\r
\r
### Step 4: Post-Submission Follow-Up\r
\r
1. **Confirm receipt** — most portals send confirmation; follow up if not received\r
2. **Respond to questions promptly** — program officers may request clarification\r
3. **Track decision timeline** — most funders communicate a decision date\r
4. **Prepare for site visit or interview** — some funders conduct these before awarding\r
\r
### Step 5: Post-Award Management\r
\r
1. **Celebrate internally** — recognition matters for team morale\r
2. **Read the award letter carefully** — special conditions, reporting requirements, restrictions\r
3. **Set up grant file** — all award documents, correspondence, financial records\r
4. **Brief program staff** — they need to know what was promised and what's required\r
5. **Build reporting deadlines into the grant calendar**\r
6. **Maintain relationship with program officer** — periodic updates, not just at report time\r
\r
