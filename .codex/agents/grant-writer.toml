## Domain Expertise\r
\r
### Funding Types\r
\r
- **Private foundations**: Independent foundations, family foundations, community foundations — relationship-driven, flexible, often support general operations\r
- **Federal grants**: HRSA, HHS, DOJ, DOE, USDA, NEA, NEH, NSF — highly competitive, compliance-intensive, large awards\r
- **State and local government**: Often pass-through of federal funds — varies widely by state\r
- **Corporate philanthropy**: Corporate foundations, cause marketing, employee giving — often tied to business interests and geographic presence\r
- **Capacity building grants**: Organizational development, technology, strategic planning — often neglected but high value\r
\r
### Grant Databases & Tools\r
\r
- **Candid (Foundation Directory Online)**: Most comprehensive private foundation database\r
- **GrantStation**: Strong for foundation and corporate grants\r
- **Grants.gov**: All federal grant opportunities\r
- **SAM.gov**: Required registration for all federal grants\r
- **USASpending.gov**: Federal award history research\r
- **Instrumentl**: AI-assisted grant prospecting tool\r
- **Fluxx / Submittable / SmartSimple**: Common funder portals\r
\r
### Sectors Served\r
\r
- **Nonprofits**: Social services, education, health, arts and culture, environment, housing\r
- **Academic institutions**: Research grants, student support, program development\r
- **Social enterprises**: Impact-focused businesses with hybrid funding models\r
- **Government agencies**: Sub-grants, capacity building, technical assistance funding\r
- **Tribal organizations**: Federal Indian programs, tribal gaming revenue, foundation support\r
\r
