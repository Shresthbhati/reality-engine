### Letter of Inquiry (LOI) Framework\r
\r
```\r
LOI STRUCTURE (typically 1-3 pages)\r
───────────────────────────────────────\r
Para 1 — THE HOOK (what problem you're solving)\r
  Lead with the problem or need — not the organization.\r
  Use data to establish the scale and urgency of the issue.\r
  Connect the problem to the funder's stated priorities.\r
  Example: "Each year in [geography], [X number] of [population]\r
  face [specific problem], resulting in [consequence]. Despite\r
  [existing resources], [gap] remains unaddressed."\r
\r
Para 2 — YOUR SOLUTION (what you do and why it works)\r
  Describe the program or project in plain language.\r
  Explain what makes your approach distinctive or effective.\r
  Reference any evidence base, model, or proven practice.\r
  "Our [program name] addresses this gap by [approach].\r
  Unlike existing services, we [distinctive element].\r
  This approach is grounded in [evidence/model/practice]."\r
\r
Para 3 — YOUR TRACK RECORD (why you can do this)\r
  Establish organizational credibility — years of experience,\r
  population served, prior outcomes, relevant expertise.\r
  "Over [X] years, [Organization] has [accomplishment].\r
  Our team includes [relevant expertise]. Last year, we\r
  served [X people] with [Y outcome]."\r
\r
Para 4 — THE REQUEST (what you're asking for)\r
  State the funding amount and grant period clearly.\r
  Name the specific use of funds at a high level.\r
  Connect the investment to measurable outcomes.\r
  "We are requesting $[amount] over [period] to [purpose].\r
  This investment will enable us to [outcome] for [population]."\r
\r
Para 5 — THE CLOSE (why this funder, why now)\r
  Reference alignment with the funder's priorities specifically.\r
  Express genuine interest in partnership.\r
  Invite dialogue.\r
  "Given [Funder]'s commitment to [stated priority], we believe\r
  there is strong alignment with our work. We welcome the\r
  opportunity to discuss how this partnership might advance\r
  our shared goals."\r
\r
LOI checklist:\r
  □ Stays within page limit\r
  □ Uses funder's language and priority terminology\r
  □ Includes specific data on the problem\r
  □ States the funding ask clearly\r
  □ No jargon or internal acronyms\r
  □ Compelling opening sentence\r
  □ Does NOT include budget detail (save for full proposal)\r
```\r
\r
### Full Proposal Framework\r
\r
```\r
PROPOSAL NARRATIVE STRUCTURE\r
───────────────────────────────────────\r
SECTION 1 — EXECUTIVE SUMMARY (1 page)\r
  Write this last.\r
  □ Organization name and mission (1 sentence)\r
  □ The problem being addressed (2 sentences)\r
  □ The proposed solution (2-3 sentences)\r
  □ The funding request ($X over Y period)\r
  □ Expected outcomes (2-3 bullets)\r
  □ Geographic scope and target population\r
\r
SECTION 2 — STATEMENT OF NEED\r
  □ Define the problem with current, credible data\r
  □ Local data is more compelling than national statistics\r
  □ Describe who is affected and how\r
  □ Explain why existing resources are insufficient\r
  □ Connect the need to the funder's stated priorities\r
  Sources: Census, CDC, local needs assessments, peer-reviewed research\r
  Avoid: Anecdote without data; data without human context\r
\r
SECTION 3 — PROGRAM DESCRIPTION\r
  □ Goals: broad statements of intended change\r
  □ Objectives: specific, measurable, time-bound outcomes (SMART)\r
  □ Activities: what you will do, when, and with whom\r
  □ Theory of change: how do activities lead to outcomes?\r
  □ Population served: who, how many, how selected\r
  □ Timeline: program milestones across the grant period\r
  □ Partners: who else is involved and what is their role?\r
  Logic model format:\r
    Inputs → Activities → Outputs → Short-term outcomes → Long-term outcomes\r
\r
SECTION 4 — ORGANIZATIONAL CAPACITY\r
  □ Mission alignment with proposed work\r
  □ Relevant program history and track record\r
  □ Key staff qualifications (by role, not necessarily by name)\r
  □ Fiscal management capacity\r
  □ Partnerships and community relationships\r
  □ Accreditations, certifications, or recognition\r
\r
SECTION 5 — EVALUATION PLAN\r
  □ How will you know if the program worked?\r
  □ What data will you collect and how?\r
  □ Who is responsible for data collection and analysis?\r
  □ How will findings be used to improve the program?\r
  □ External evaluator (if required or appropriate)\r
  Outcome measurement types:\r
    Output: # of people served, # of sessions delivered\r
    Short-term outcome: knowledge gained, behavior change\r
    Long-term outcome: system-level change, sustained impact\r
\r
SECTION 6 — SUSTAINABILITY PLAN\r
  □ How will the program continue after the grant period?\r
  □ Other funding sources being pursued\r
  □ Earned revenue potential (if applicable)\r
  □ Organizational commitment to the program long-term\r
  Avoid: "We will apply for more grants" — funders see through this\r
\r
SECTION 7 — BUDGET NARRATIVE\r
  (See Budget Narrative Framework below)\r
```\r
\r
### Budget Narrative Framework\r
\r
```\r
BUDGET NARRATIVE STRUCTURE\r
───────────────────────────────────────\r
PERSONNEL\r
  [Position Title]: [% FTE] × $[annual salary] × [grant period] = $[total]\r
  Justification: [Why this role is necessary for this program specifically]\r
\r
  Example:\r
  "Program Coordinator (0.5 FTE): $55,000 annual salary × 0.5 FTE ×\r
  12 months = $27,500. This position will manage participant enrollment,\r
  maintain program records, coordinate with partner agencies, and\r
  support program delivery for all 150 participants."\r
\r
FRINGE BENEFITS\r
  [% of salaries] × [total salaries] = $[total]\r
  Justification: "Fringe calculated at [X]%, consistent with our\r
  negotiated rate, including FICA, health insurance, and retirement."\r
\r
CONSULTANTS / CONTRACTORS\r
  [Name or role]: $[rate] × [hours/days] = $[total]\r
  Justification: [Why a contractor vs. employee; specific deliverable]\r
\r
SUPPLIES & MATERIALS\r
  Itemize: [Item] × [quantity] × [unit cost] = $[total]\r
  Justification: [Why needed for this program]\r
\r
TRAVEL\r
  [Purpose]: [# trips] × [# people] × $[cost per trip] = $[total]\r
  Use GSA per diem rates for federal proposals.\r
\r
INDIRECT COSTS (OVERHEAD)\r
  [Negotiated rate or de minimis 10% MTDC] × [direct costs] = $[total]\r
  If funder caps indirect: "The funder's indirect cap of [X]% has\r
  been applied. Our negotiated rate is [Y]%; the [difference]% will\r
  be contributed as organizational match."\r
\r
MATCH / COST SHARE (if required)\r
  Document source, amount, and whether cash or in-kind.\r
  In-kind must be valued at fair market rate.\r
\r
Budget narrative rules:\r
  ✅ Every line item in the budget has a corresponding narrative explanation\r
  ✅ All calculations are shown explicitly\r
  ✅ Costs are reasonable and customary for the region and sector\r
  ✅ Narrative and budget numbers match exactly\r
  ❌ Never include unallowable costs (alcohol, lobbying, fines)\r
  ❌ Never pad indirect costs or line items\r
```\r
