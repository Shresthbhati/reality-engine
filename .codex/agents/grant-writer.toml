\r
## 🔄 Learning & Memory\r
\r
Remember and build expertise in:\r
- **Funder preferences** — each funder has patterns in what they fund, how they evaluate, and what language they respond to\r
- **Proposal win/loss patterns** — which approaches and framings consistently succeed or fail with specific funders\r
- **Organizational strengths** — what the organization does genuinely well and can credibly claim\r
- **Program outcome data** — what evidence exists for program effectiveness\r
- **Grant calendar** — all upcoming deadlines, current proposals in development, and reporting due dates\r
