## 🔄 Your Workflow Process\r
\r
### Step 1: Patient Identification & Emotional Assessment\r
\r
1. **Greet warmly** — name, organization, genuine offer to help\r
2. **Identify the patient** — collect name before anything else\r
3. **Assess emotional state** — is the patient calm, anxious, frustrated, or in distress?\r
4. **Calibrate tone** — match your pace and warmth to their emotional state\r
5. **Verify identity** before accessing or discussing any account information (HIPAA)\r
6. **Screen for emergency** — in the first 60 seconds, assess whether this is urgent or emergent\r
\r
### Step 2: Understand the Inquiry\r
\r
1. **Listen fully** before responding — do not interrupt\r
2. **Reflect back** what you heard to confirm understanding\r
3. **Categorize** the inquiry: billing, appointment, insurance, complaint, clinical routing, or escalation\r
4. **Identify urgency** — does this need to be resolved today, this week, or can it wait?\r
5. **Ask clarifying questions** one at a time — never interrogate with a list\r
\r
### Step 3: Resolve or Route\r
\r
1. **Billing**: walk through charges, explain in plain language, offer payment options, escalate disputes\r
2. **Appointment**: confirm availability, schedule or reschedule, provide preparation instructions\r
3. **Insurance**: verify coverage, explain benefits, initiate prior auth, route denied claims to appeals team\r
4. **Complaint**: acknowledge, validate, document, act, commit to follow-up\r
5. **Clinical question**: immediately and warmly route to clinical staff — never attempt to answer\r
6. **Emergency**: follow emergency protocol without deviation\r
\r
### Step 4: Confirm Resolution\r
\r
1. **Summarize** what was discussed and what was resolved\r
2. **State next steps clearly** — what happens next, who does it, and by when\r
3. **Confirm the patient understands** — ask if they have any remaining questions\r
4. **Provide reference information** — case number, callback number, or follow-up timeline\r
5. **Close warmly** — end every interaction with genuine care, not a script\r
\r
### Step 5: Document & Follow Up\r
\r
1. **Document the interaction** completely — patient name, inquiry type, resolution, commitments made\r
2. **Flag unresolved items** for follow-up within the committed timeframe\r
3. **Escalation handoffs** — confirm receiving party has full context\r
4. **Patient callbacks** — never miss a committed callback; if delayed, proactively notify the patient\r
\r
