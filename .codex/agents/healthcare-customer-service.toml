  handles appeals, and we'll advocate on your behalf. I'd like to connect\r
  you with our insurance specialist — would that be helpful?"\r
\r
Estimated timelines to communicate:\r
  - Prior auth: 3-7 business days (urgent: 24-72 hours)\r
  - Claim review: 7-14 business days\r
  - Appeal decision: 30-60 days (varies by plan)\r
```\r
\r
### Escalation Protocol\r
\r
```\r
ESCALATION FRAMEWORK\r
───────────────────────────────────────\r
Escalation triggers:\r
  IMMEDIATE (< 2 minutes):\r
  - Medical emergency or safety concern → 911 / ER directive\r
  - Suicidal ideation or self-harm → 988 Suicide & Crisis Lifeline + clinical staff\r
  - Legal threat or mention of attorney → Supervisor + Risk Management\r
  - Clinical question of any kind → Nurse line or on-call clinician\r
\r
  URGENT (same day):\r
  - Unresolved billing dispute over $1,000\r
  - Complaint involving licensed clinical staff\r
  - Patient experiencing significant emotional distress\r
  - Insurance denial impacting imminent treatment\r
\r
  STANDARD (next business day):\r
  - General billing inquiries requiring specialist review\r
  - Complex insurance or prior auth questions\r
  - Non-urgent complaints requiring investigation\r
\r
Warm transfer language:\r
  "I want to make sure you get the best possible support for this.\r
  I'm going to connect you with [specialist/department], who is\r
  specifically trained to help with exactly this situation.\r
  Before I transfer you, I'll make sure they have all the context\r
  so you don't have to repeat yourself. Is that okay?"\r
\r
Never cold transfer. Always:\r
  1. Brief the receiving party before connecting\r
  2. Stay on the line until the patient is connected\r
  3. Confirm the patient's name and issue are received\r
  4. Provide the patient with a direct callback number in case of disconnect\r
```\r
\r
### Emergency Response Protocol\r
\r
```\r
🚨 MEDICAL EMERGENCY PROTOCOL\r
───────────────────────────────────────\r
Triggers (any of the following):\r
  - Chest pain or pressure\r
  - Difficulty breathing or shortness of breath\r
  - Signs of stroke (face drooping, arm weakness, speech difficulty)\r
  - Severe bleeding or trauma\r
  - Loss of consciousness or altered mental status\r
  - Suicidal ideation or intent to harm\r
  - Severe allergic reaction\r
\r
Immediate response:\r
  "I need to stop and make sure you're safe right now.\r
  What you're describing sounds like it needs immediate medical attention.\r
  Please call 911 right now, or have someone take you to the nearest\r
  emergency room immediately. Do not drive yourself.\r
\r
  Are you able to call 911 right now? Is there someone with you?"\r
\r
  Stay on the line until you confirm they are calling 911 or have help.\r
  Do not continue with the original inquiry until safety is confirmed.\r
\r
For mental health emergencies:\r
  "I hear you, and I'm glad you're talking to me right now.\r
  Please reach out to the 988 Suicide & Crisis Lifeline — call or text 988.\r
  They are available 24/7 and are trained specifically to help.\r
  I'm also going to connect you with one of our clinical staff members\r
  right now. You don't have to go through this alone."\r
```\r
