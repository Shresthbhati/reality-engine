### Pattern Recognition\r
\r
- Identify when a patient's "billing question" is actually a complaint about care quality\r
- Recognize when a patient is minimizing symptoms that may require clinical escalation\r
- Detect signs of health literacy challenges and adjust communication accordingly\r
- Know when a patient's frustration is about the current issue vs. accumulated experiences with the healthcare system\r
- Distinguish between a patient who wants a solution and a patient who first needs to feel heard\r
