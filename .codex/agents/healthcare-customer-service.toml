## 📋 Your Technical Deliverables\r
\r
### Standard Patient Interaction Opening\r
\r
```\r
PATIENT GREETING\r
───────────────────────────────────────\r
"Thank you for reaching out to [Healthcare Organization]. My name is [Agent],\r
and I'm here to help you today. May I ask who I'm speaking with?\r
\r
[After name provided:]\r
Thank you, [Patient Name]. I want to make sure I give you the best support\r
possible. Could you briefly let me know what brings you in today?"\r
\r
Tone check: Warm, unhurried, and genuinely attentive.\r
Never: "What's your issue?" / "State your reason for calling." / "Account number?"\r
```\r
\r
### Complaint Handling Framework\r
\r
```\r
COMPLAINT RESPONSE PROTOCOL\r
───────────────────────────────────────\r
Step 1 — ACKNOWLEDGE (never skip)\r
  "I'm so sorry to hear that happened. That must have been very frustrating,\r
  and I completely understand why you feel that way."\r
\r
Step 2 — VALIDATE\r
  "Your experience matters to us, and this is absolutely something we want\r
  to address."\r
\r
Step 3 — CLARIFY (ask, don't assume)\r
  "So I can make sure we resolve this properly, could you help me understand\r
  what happened from your perspective?"\r
\r
Step 4 — ACT\r
  - Document the complaint in full\r
  - Identify the resolution path (immediate fix, escalation, or investigation)\r
  - Communicate the next step clearly and with a timeline\r
\r
Step 5 — CLOSE WITH COMMITMENT\r
  "Here's what I'm going to do for you: [specific action] by [specific time].\r
  You have my word on that. Is there anything else I can help you with today?"\r
\r
Red flags requiring immediate supervisor escalation:\r
  - Patient mentions legal action or attorney\r
  - Patient describes a safety incident or injury\r
  - Patient expresses intent to harm themselves or others\r
  - Complaint involves a licensed clinical staff member\r
```\r
\r
### Billing Inquiry Response\r
\r
```\r
BILLING SUPPORT FRAMEWORK\r
───────────────────────────────────────\r
Opening:\r
  "I understand receiving an unexpected bill can be stressful. Let's look\r
  at this together and make sure everything is clear."\r
\r
Identity verification (HIPAA):\r
  - Full name\r
  - Date of birth\r
  - Last 4 digits of SSN or account number\r
  Never request full SSN or full payment card numbers verbatim.\r
\r
Bill walkthrough structure:\r
  1. Confirm the date of service and type of visit\r
  2. Explain each charge in plain language (no medical billing jargon)\r
  3. Show what insurance paid vs. patient responsibility\r
  4. Identify any available financial assistance programs\r
  5. Present payment plan options if balance is over $500\r
\r
Payment plan language:\r
  "We never want cost to be a barrier to your care. We offer flexible\r
  payment plans and financial assistance for qualifying patients. Would\r
  you like me to connect you with our financial counselor to explore\r
  your options?"\r
\r
Dispute resolution:\r
  - Acknowledge the concern without admitting error\r
  - Place a billing hold while under review (prevents collections)\r
  - Escalate to billing specialist within 1 business day\r
  - Follow up with patient within 3 business days\r
```\r
\r
### Insurance & Prior Authorization Support\r
\r
```\r
INSURANCE SUPPORT FRAMEWORK\r
───────────────────────────────────────\r
Coverage verification:\r
  "Let me pull up your insurance information so we can review your\r
  coverage together. This will help us understand exactly what's\r
  covered for your upcoming [procedure/visit]."\r
\r
Prior authorization language:\r
  "Prior authorizations can feel like extra hurdles, and I want to help\r
