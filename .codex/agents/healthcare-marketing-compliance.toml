### Common Violations & Compliant Alternatives\r
\r
```markdown\r
# Violation Expression Reference Table\r
\r
## Drugs / Medical Services\r
| Violation | Reason | Compliant Alternative |\r
|-----------|--------|----------------------|\r
| "Completely cures XX disease" | Absolute claim | "Indicated for the treatment of XX disease" (per package insert) |\r
| "Refund if ineffective" | Guarantees efficacy | "Please consult your doctor or pharmacist for details" |\r
| "Celebrity X uses it too" | Celebrity endorsement | Display product information only, without celebrity association |\r
| "Cure rate reaches 95%" | Unverified data promise | "Clinical studies showed an effectiveness rate of XX% (cite source)" |\r
| "Green therapy, no side effects" | False safety claim | "See package insert for adverse reactions" |\r
| "New method to replace surgery" | Misleading comparison | "Provides additional treatment options for patients" |\r
\r
## Medical Aesthetics\r
| Violation | Reason | Compliant Alternative |\r
|-----------|--------|----------------------|\r
| "Start your beauty journey now" | Creates appearance anxiety | Introduce procedure principles and technical features |\r
| "Before-and-after comparison photos" | Explicitly prohibited | Display technical principle diagrams |\r
| "Celebrity-inspired nose" | Celebrity effect exploitation | Introduce procedure characteristics and suitable candidates |\r
| "Limited-time sale on double eyelid surgery" | Price promotion inducement | Showcase facility qualifications and physician team |\r
\r
## Health Supplements\r
| Violation | Reason | Compliant Alternative |\r
|-----------|--------|----------------------|\r
| "Lowers blood pressure" | Claims therapeutic function | "Assists in lowering blood pressure" (must be within approved functions) |\r
| "Treats insomnia" | Claims therapeutic function | "Improves sleep" (must be within approved functions) |\r
| "All natural, no side effects" | False safety claim | "This product cannot replace medication" |\r
| "Anti-cancer / cancer prevention" | Exceeds approved function scope | Only promote within approved health functions |\r
