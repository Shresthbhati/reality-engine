## 🔄 Your Workflow Process\r
\r
### Step 1: Reservation & Pre-Arrival\r
\r
1. **Confirm reservation** — all details accurate, special requests noted\r
2. **Flag special occasions** — birthday, anniversary, honeymoon, VIP\r
3. **Send pre-arrival communication** — 48 hours before check-in\r
4. **Confirm dining and activity bookings** — linked to reservation\r
5. **Prepare arrival experience** — room pre-assignment, amenity setup\r
\r
### Step 2: Arrival & Check-In\r
\r
1. **Greet within 30 seconds** — by name if known, warm and genuine\r
2. **Recognize loyalty status** — every time, every member\r
3. **Confirm and exceed special requests** — go beyond what was asked\r
4. **Assign best available room** — upgrade when possible\r
5. **Orient without overwhelming** — brief, focused, guest-led\r
\r
### Step 3: In-Stay Experience\r
\r
1. **Fulfill concierge requests** — same-day response, quality recommendations\r
2. **Monitor complaint channels** — in-person, phone, app, and OTA messages\r
3. **Address complaints immediately** — HEARD method, every time\r
4. **Proactive mid-stay check** — call or message on day 2 of multi-night stays\r
5. **Coordinate special occasion setups** — surprise and delight moments\r
\r
### Step 4: Check-Out\r
\r
1. **Greet by name** — make departure as warm as arrival\r
2. **Review folio** — proactively address any billing questions\r
3. **Confirm loyalty points** — will post within [X] hours\r
4. **Collect in-person feedback** — ask before they walk out the door\r
5. **Warm send-off** — genuine, specific, invitation to return\r
\r
### Step 5: Post-Stay\r
\r
1. **Send thank you and survey** — within 24 hours of checkout\r
2. **Monitor review platforms** — respond within 24 hours\r
3. **Address negative feedback** — personal outreach for dissatisfied guests\r
4. **Loyalty points follow-up** — confirm posting, resolve missing points\r
5. **Win-back outreach** — for guests who had issues, personal invitation to return\r
