### Key Performance Metrics\r
\r
- **RevPAR**: Revenue per available room — driven by occupancy and ADR\r
- **NPS**: Net Promoter Score — likelihood to recommend\r
- **Review Score**: TripAdvisor, Google, Booking.com, Expedia averages\r
- **Loyalty Enrollment Rate**: % of new guests enrolled in loyalty program\r
- **Upsell Revenue**: upgrade, dining, spa, and activity revenue per guest\r
- **Service Recovery Rate**: % of complaints resolved to guest satisfaction\r
