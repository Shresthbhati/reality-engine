### Complaint Resolution Framework\r
\r
```\r
SERVICE RECOVERY PROTOCOL\r
───────────────────────────────────────\r
The HEARD Method:\r
  H — Hear the guest out completely. Do not interrupt.\r
  E — Empathize genuinely. "I completely understand why\r
      that's frustrating."\r
  A — Apologize sincerely. "I'm truly sorry this happened."\r
  R — Resolve the issue — immediately if possible.\r
  D — Delight with something extra — go beyond what's expected.\r
\r
STEP 1: LISTEN\r
  Let the guest finish completely before responding.\r
  Take notes if needed.\r
  Never: Interrupt, explain, or defend during the guest's account.\r
  Body language: Nodding, open posture, full attention.\r
\r
STEP 2: ACKNOWLEDGE & APOLOGIZE\r
  "I am so sorry this happened during your stay. That is\r
  absolutely not the experience we want you to have, and\r
  I completely understand your frustration."\r
\r
  Never: "I apologize for any inconvenience." (hollow phrase)\r
  Never: "That's not our policy." (before offering a solution)\r
  Always: Acknowledge the specific issue — not a generic apology.\r
\r
STEP 3: TAKE OWNERSHIP\r
  "Let me personally take care of this for you right now."\r
\r
  Never: "That's not my department."\r
  Never: "I'll have someone look into that."\r
  Always: Own the resolution even if someone else caused the issue.\r
\r
STEP 4: RESOLVE IMMEDIATELY\r
  Noise complaint: Move the guest to another room immediately.\r
  Cleanliness issue: Send housekeeping within 15 minutes.\r
  Maintenance issue: Send engineering within 15 minutes.\r
  Billing error: Correct on the spot — no "we'll look into it."\r
  Missing amenity: Deliver within 15 minutes.\r
  Restaurant complaint: Comp the item or the meal — manager decision.\r
\r
STEP 5: RECOVER BEYOND THE PROBLEM\r
  Standard recovery options (match to severity):\r
  🟢 Minor: Sincere apology + small gesture (amenity, points)\r
  🟡 Moderate: Apology + room amenity + points/discount\r
  🔴 Major: Apology + significant compensation + manager follow-up\r
  🚨 Severe: Apology + comp night + general manager contact\r
\r
  Recovery gesture ideas:\r
  - Complimentary room upgrade\r
  - Amenity delivery (bottle of wine, dessert, fresh flowers)\r
  - Loyalty points (specify amount)\r
  - Discount on current or future stay\r
  - Complimentary meal or room service\r
  - Late checkout\r
\r
STEP 6: FOLLOW UP\r
  "I'm going to personally follow up with you [this evening /\r
  tomorrow morning] to make sure everything is to your\r
  satisfaction. Is [time] a good time to reach you?"\r
\r
  Follow-up is not optional. If you commit to it — do it.\r
\r
DOCUMENTATION\r
  Document every complaint:\r
  - Guest name and room number\r
  - Nature of complaint\r
  - Time reported and time resolved\r
  - Resolution provided\r
  - Recovery compensation offered\r
  - Follow-up completed\r
  - Guest satisfaction at resolution\r
```\r
