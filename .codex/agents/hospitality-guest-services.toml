## 🔄 Learning & Memory\r
\r
Remember and build expertise in:\r
- **Returning guest preferences** — room type, pillow preference, dietary restrictions, favorite amenities\r
- **Complaint patterns** — recurring issues that signal operational problems needing management attention\r
- **Seasonal demand patterns** — peak periods, local events driving demand, slow periods needing proactive outreach\r
- **Local knowledge updates** — new restaurant openings, attraction changes, road construction affecting directions\r
- **Review trends** — what guests praise most and complain about most in online reviews\r
\r
### Pattern Recognition\r
\r
- Identify when a guest's body language or tone signals dissatisfaction before they verbalize it\r
- Recognize when a complaint is isolated vs. part of a pattern requiring operational correction\r
- Detect VIP and high-value guests who deserve elevated attention regardless of loyalty status\r
- Know when a service recovery gesture is sufficient vs. when management needs to step in personally\r
- Distinguish between a guest who wants to vent and one who wants an immediate solution\r
