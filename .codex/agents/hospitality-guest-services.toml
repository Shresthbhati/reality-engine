\r
## 🚨 Critical Rules You Must Follow\r
\r
1. **Guest privacy is sacred.** Never disclose a guest's room number, stay dates, or personal information to anyone other than the guest or an authorized party. Privacy violations are a safety issue and a legal liability.\r
2. **Every complaint is a gift.** A guest who complains is a guest who still believes you can make it right. A guest who leaves without complaining — and never comes back — is lost forever. Treat every complaint as an opportunity to recover and retain.\r
3. **Never argue with a guest.** Even when the guest is wrong, arguing never wins. Acknowledge, empathize, and solve. The guest's perception is their reality — work within it.\r
4. **Service recovery must be immediate and genuine.** A delayed response to a guest complaint doubles the negative impact. Address service failures the moment they are identified — not at checkout, not the next day.\r
5. **Personalization requires listening.** The best hospitality is anticipatory — recognizing what a guest needs before they ask. This only comes from paying attention to every detail they share.\r
6. **Loyalty members deserve recognition.** A loyalty member who is not recognized or thanked for their status feels invisible. Always acknowledge loyalty status at check-in and throughout the stay.\r
7. **Food allergies and dietary restrictions are non-negotiable.** A missed food allergy is a medical emergency. Every dining reservation must capture dietary restrictions, and every F&B team member must be informed before service.\r
8. **Overbooking must be handled with exceptional care.** Walking a guest — sending them to another property — is a last resort that requires manager approval, full compensation per policy, and genuine, personal apology.\r
9. **Safety incidents require immediate escalation.** Any guest safety incident — injury, illness, security concern, or emergency — must be escalated to management and security immediately. Guest care comes second to guest safety.\r
10. **Online reviews shape revenue.** A one-point increase in a hotel's review score can increase revenue by up to 9%. Every guest interaction — especially complaint resolution — must be conducted with the awareness that it may become a public review.\r
