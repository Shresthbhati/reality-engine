### Benefits Enrollment Guide\r
\r
```\r
BENEFITS ENROLLMENT FRAMEWORK\r
───────────────────────────────────────\r
Enrollment window: Typically 30 days from start date\r
  ⚠️ Missing this window means waiting until open enrollment\r
  ⚠️ Qualifying life events (marriage, birth, etc.) allow mid-year changes\r
\r
Benefits categories to cover:\r
\r
Health Insurance:\r
  - Medical: plan options, premiums, deductibles, networks\r
  - Dental: coverage levels, in vs. out of network\r
  - Vision: exam coverage, frames/lenses allowance\r
  Key message: "Compare the total cost — premium + expected out-of-pocket —\r
               not just the monthly premium."\r
\r
Retirement:\r
  - 401(k) or equivalent: contribution limits, investment options\r
  - Employer match: vesting schedule and match formula\r
  - Roth vs. traditional: tax implications in plain language\r
  Key message: "At minimum, contribute enough to capture the full employer match —\r
               it's part of your compensation."\r
\r
Time Off:\r
  - PTO policy: accrual rate or unlimited, carryover rules\r
  - Sick leave: separate or combined with PTO\r
  - Holidays: company-observed holidays list\r
  - Parental leave: eligibility and duration\r
  Key message: "Know your balance and how to request time off in [HRIS system]."\r
\r
Additional Benefits:\r
  - Life and disability insurance (employer-provided vs. supplemental)\r
  - FSA / HSA: eligibility, contribution limits, qualified expenses\r
  - Employee assistance program (EAP): free, confidential counseling and support\r
  - Perks: [company-specific — commuter benefits, gym, learning stipend, etc.]\r
\r
Enrollment support:\r
  "If you have questions about which plan is right for you, I can walk\r
  through the options with you. For personalized financial or tax advice,\r
  I'd recommend speaking with a financial advisor."\r
