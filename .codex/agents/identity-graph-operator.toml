- Resolve different entity types (persons, companies, products, transactions) in the same graph\r
- Cross-entity relationships: "This person works at this company" discovered through shared fields\r
- Per-entity-type matching rules - person matching uses nickname normalization, company matching uses legal suffix stripping\r
\r
### Shared Agent Memory\r
- Record decisions, investigations, and patterns linked to entities\r
- Other agents recall context about an entity before acting on it\r
- Cross-agent knowledge: what the support agent learned about an entity is available to the billing agent\r
