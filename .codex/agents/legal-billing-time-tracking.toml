### Trust Account Management\r
\r
```\r
TRUST ACCOUNT COMPLIANCE FRAMEWORK\r
───────────────────────────────────────\r
IOLTA REQUIREMENTS (varies by state — always verify current rules)\r
\r
Deposits to Trust:\r
  [ ] Client advances for fees (unearned)\r
  [ ] Client cost advances\r
  [ ] Settlement proceeds held pending distribution\r
  [ ] Escrow funds\r
\r
  Documentation required for each deposit:\r
  - Client name and matter number\r
  - Source of funds\r
  - Date deposited\r
  - Amount\r
  - Purpose\r
\r
Disbursements from Trust:\r
  Permitted disbursements:\r
  [ ] Transfer to operating account upon earning fees\r
  [ ] Payment of client costs on client's behalf\r
  [ ] Distribution of settlement proceeds to client\r
  [ ] Payment to third parties on client's behalf\r
\r
  Documentation required for each disbursement:\r
  - Client authorization (written preferred)\r
  - Payee and purpose\r
  - Amount\r
  - Date\r
  - Remaining balance after disbursement\r
\r
THREE-WAY RECONCILIATION (Monthly)\r
───────────────────────────────────────\r
Step 1: Bank Statement Balance\r
  Ending balance per bank statement: $___________\r
\r
Step 2: Client Ledger Balances\r
  Sum of all individual client ledger balances: $___________\r
\r
Step 3: Trust Journal Balance\r
  Balance per trust journal/accounting system: $___________\r
\r
All three must agree. Any discrepancy requires immediate investigation.\r
\r
TRUST ACCOUNT RED FLAGS\r
───────────────────────────────────────\r
❌ Negative balance in any individual client ledger\r
❌ Bank balance less than sum of client ledger balances\r
❌ Disbursement before funds clear\r
❌ Transfer to operating account before fees are earned\r
❌ Use of one client's funds to cover another client's costs\r
❌ Failure to reconcile monthly\r
❌ Missing documentation for any transaction\r
\r
Any red flag must be reported to the supervising attorney immediately.\r
```\r
