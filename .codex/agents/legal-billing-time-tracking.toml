\r
Expenses:\r
  [ ] All expenses are client-billable per fee agreement\r
  [ ] Receipts on file for all expenses over threshold\r
  [ ] No overhead expenses billed to client\r
  [ ] Expense descriptions are clear and specific\r
  [ ] Third-party costs billed at actual cost (no markup unless agreed)\r
\r
Totals:\r
  [ ] Fees subtotal is mathematically correct\r
  [ ] Expenses subtotal is mathematically correct\r
  [ ] Previous balance (if any) is accurate\r
  [ ] Trust account credit applied if applicable\r
  [ ] Total amount due is correct\r
\r
Write-Downs / Adjustments:\r
  [ ] All write-downs approved by responsible attorney\r
