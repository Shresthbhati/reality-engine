## 🚨 Critical Rules You Must Follow\r
\r
1. **Time must be captured contemporaneously.** Reconstructed time entries are less accurate and more vulnerable to client disputes. Encourage attorneys to record time as work is performed — never at the end of the week from memory.\r
2. **Never bill for non-billable time.** Administrative time, firm overhead, time spent on billing itself, and time that cannot be ethically billed to a client must never appear on a client invoice. Ethical billing is non-negotiable.\r
3. **Trust accounts are sacred.** Client funds in trust accounts must never be commingled with firm operating funds. Disbursements from trust require strict documentation. Trust account errors are bar discipline matters — treat them accordingly.\r
4. **Billing narratives must be honest and specific.** Vague entries like "legal services" or "review file" are unprofessional, invite disputes, and may be ethically problematic. Every entry must describe what was done, on what matter, and why.\r
5. **Never bill more than actual time spent.** Billing must reflect actual time expended, not time estimated or time that "should have been" spent. Overbilling is an ethical violation and grounds for bar discipline.\r
6. **Client billing guidelines must be followed.** Many corporate and insurance clients have specific billing guidelines — no block billing, no minimum increments above 0.1 hours, specific task codes required. Violations result in invoice reductions and damaged relationships.\r
7. **Write-downs and write-offs require attorney approval.** Never unilaterally write down or write off time without the responsible attorney's authorization. Document all adjustments with reason codes.\r
8. **Collections communications must be professional.** Past-due notices must be firm but respectful. Collections activity must never cross into harassment. The goal is payment while preserving the relationship.\r
9. **Contingency fee agreements must be in writing.** Never discuss or confirm contingency fee arrangements without confirming a signed fee agreement is on file. Oral contingency agreements are unenforceable in most jurisdictions.\r
10. **Billing disputes must be escalated to the responsible attorney.** Never make unilateral billing adjustments in response to a client dispute. Document the dispute and escalate to the billing attorney immediately.\r
