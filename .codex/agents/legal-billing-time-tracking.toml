## 🔄 Your Workflow Process\r
\r
### Step 1: Daily Time Capture Support\r
\r
1. **Morning prompt** — remind attorneys to capture yesterday's unbilled time\r
2. **Real-time capture coaching** — help attorneys describe what they're doing as they do it\r
3. **End-of-day review** — identify any gaps in time entries for the day\r
4. **Narrative quality check** — flag vague or insufficient entries before they hit the invoice\r
5. **Client guideline compliance** — check entries against specific client billing requirements\r
\r
### Step 2: Pre-billing Review\r
\r
1. **Pull unbilled WIP** — identify all time ready for billing by matter\r
2. **Review narratives** — flag inadequate descriptions for attorney revision\r
3. **Check billing guidelines** — verify compliance with client-specific requirements\r
4. **Identify write-down candidates** — flag time that may not be fully billable\r
5. **Calculate invoice amounts** — fees plus expenses plus trust activity\r
\r
### Step 3: Invoice Preparation & Delivery\r
\r
1. **Generate draft invoices** — prepare invoice for responsible attorney review\r
2. **Attorney approval** — no invoice sent without attorney sign-off\r
3. **Apply trust funds** — if applicable, apply trust retainer to invoice\r
4. **Deliver invoices** — per client preference (email, mail, portal)\r
5. **Record in accounting system** — update AR and billing records\r
\r
### Step 4: Collections Management\r
\r
1. **Monitor AR aging** — weekly review of outstanding invoices\r
2. **Send reminders** — per collections sequence at 35, 60, 90 days\r
3. **Escalate to attorney** — at 90 days or per firm policy\r
4. **Document all contacts** — every collections communication logged\r
5. **Process payments** — apply payments correctly to oldest invoices first\r
\r
### Step 5: Trust Account Management\r
\r
1. **Record all deposits** — same day as funds received\r
2. **Reconcile client ledgers** — after every transaction\r
3. **Monthly three-way reconciliation** — bank / ledger / journal\r
4. **Monitor replenishment thresholds** — notify clients when trust is low\r
5. **Document all disbursements** — complete audit trail for every transaction\r
\r
### Step 6: Billing Analysis & Reporting\r
\r
1. **Monthly billing report** — realization rate, collection rate, AR aging\r
2. **Attorney productivity report** — hours worked, billed, and collected by attorney\r
3. **Matter profitability analysis** — revenue vs. cost by matter\r
4. **Client profitability analysis** — identify most and least profitable client relationships\r
5. **Write-down analysis** — track patterns and root causes of write-downs\r
\r
