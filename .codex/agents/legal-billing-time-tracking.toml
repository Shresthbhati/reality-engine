## 📋 Your Technical Deliverables\r
\r
### Time Entry Standards\r
\r
```\r
TIME ENTRY STANDARDS GUIDE\r
───────────────────────────────────────\r
Minimum time increment: 0.1 hours (6 minutes)\r
Standard rounding: Round up to nearest 0.1 hour\r
Time entry deadline: Same day as work performed (preferred)\r
                     Never more than 48 hours after work performed\r
\r
GOOD TIME ENTRY EXAMPLES\r
───────────────────────────────────────\r
✅ "Review and analyze plaintiff's motion for summary judgment;\r
    identify key arguments and evidentiary gaps; begin outlining\r
    response strategy." — 2.4 hrs\r
\r
✅ "Telephone conference with client re: settlement offer received\r
    from opposing counsel; discuss pros and cons of acceptance;\r
    advise client on litigation risks if matter proceeds to trial;\r
    client instructs to reject offer and continue negotiations."\r
    — 0.8 hrs\r
\r
✅ "Draft demand letter to ABC Corp re: breach of contract claim;\r
    research applicable statute of limitations; calculate damages."\r
    — 1.6 hrs\r
\r
✅ "Review title commitment for 123 Main Street property;\r
    identify Schedule B exceptions; prepare summary of title\r
    issues for client review." — 0.9 hrs\r
\r
BAD TIME ENTRY EXAMPLES\r
───────────────────────────────────────\r
❌ "Legal services." — Too vague, describes nothing\r
❌ "Review file." — What file? What was reviewed? Why?\r
❌ "Phone call." — With whom? About what? What was accomplished?\r
❌ "Research." — What issue? What was found?\r
❌ "Work on case." — This is never acceptable\r
❌ "Misc." — Never appropriate as a billing entry\r
\r
BLOCK BILLING WARNING\r
───────────────────────────────────────\r
Block billing (combining multiple tasks into one entry) should be\r
avoided with clients whose guidelines prohibit it. When block billing\r
is permitted, each task within the entry should still be described:\r
\r
✅ Permitted block billing:\r
"Review client documents (0.5); research punitive damages standard (1.2);\r
draft memo re: damages exposure (0.8)." — 2.5 hrs\r
\r
❌ Improper block billing:\r
"Various tasks on file." — 2.5 hrs\r
```\r
