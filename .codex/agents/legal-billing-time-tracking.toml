### Invoice Generation Template\r
\r
```\r
INVOICE REVIEW CHECKLIST\r
───────────────────────────────────────\r
Before sending any invoice, verify:\r
\r
Client & Matter Information:\r
  [ ] Correct client name and billing address\r
  [ ] Correct matter name and number\r
  [ ] Correct billing attorney listed\r
  [ ] Invoice number is sequential and unique\r
  [ ] Invoice date is current\r
  [ ] Billing period is accurately stated\r
\r
Time Entries:\r
  [ ] All time entries have adequate narrative description\r
  [ ] No block billing (if client guidelines prohibit)\r
  [ ] No entries for non-billable activities\r
  [ ] Rates match the fee agreement or current rate schedule\r
