### High-Risk Clause Library\r
\r
```\r
COMMON HIGH-RISK CLAUSES TO FLAG\r
───────────────────────────────────────\r
\r
INDEMNIFICATION\r
  Red flags:\r
  - Unilateral indemnification (only one party indemnifies)\r
  - Unlimited indemnification scope (no carve-outs)\r
  - Indemnification for indemnitee's own negligence\r
  - Third-party claims included without limitation\r
  Market standard: Mutual, limited to direct damages,\r
                   carve-out for gross negligence/willful misconduct\r
\r
LIABILITY LIMITATION\r
  Red flags:\r
  - No limitation of liability clause (unlimited exposure)\r
  - Cap below contract value\r
  - Exclusion of direct damages (over-broad)\r
  - Carve-outs that swallow the cap\r
  Market standard: Cap at 12 months of fees paid,\r
                   mutual, excludes gross negligence/IP/confidentiality\r
\r
TERMINATION\r
  Red flags:\r
  - No termination for convenience right for our client\r
  - Termination for convenience only for the other party\r
  - Excessive notice periods\r
  - No cure period for breach\r
  - Termination triggers that are too broad or vague\r
  Market standard: Mutual termination for convenience (30-90 days notice),\r
                   30-day cure period for material breach\r
\r
INTELLECTUAL PROPERTY\r
  Red flags:\r
  - Work for hire language for independent contractors\r
  - Broad IP assignment including pre-existing IP\r
  - No license back to creator for pre-existing IP\r
  - Ambiguous ownership of jointly developed IP\r
  Market standard: License to use (not ownership transfer) for\r
                   pre-existing IP; clear ownership of new IP\r
\r
AUTO-RENEWAL\r
  Red flags:\r
  - Short notice window to prevent renewal (under 30 days)\r
  - Auto-renewal for long terms (over 1 year)\r
  - No cap on price increases at renewal\r
  - Buried in definitions or general terms\r
  Market standard: 30-90 day notice window, clear notification\r
                   requirement, reasonable renewal terms\r
\r
NON-COMPETE / RESTRICTIVE COVENANTS\r
  Red flags:\r
  - Overly broad geographic scope\r
  - Excessive duration (over 1-2 years)\r
  - Broad definition of competitive activity\r
  - No geographic limitation\r
  Jurisdiction note: Non-competes are unenforceable in California,\r
                     North Dakota, Oklahoma, and Minnesota. Heavily\r
                     restricted in many other states. Always flag\r
                     for jurisdiction-specific review.\r
\r
GOVERNING LAW / DISPUTE RESOLUTION\r
  Red flags:\r
  - Unfavorable governing law (other party's home state)\r
  - Mandatory arbitration with unfavorable rules\r
  - Class action waiver (may be unenforceable)\r
  - Exclusive jurisdiction in inconvenient venue\r
  - No fee-shifting provision in attorney's fees clause\r
  Market standard: Mutual agreement on neutral jurisdiction,\r
                   clear dispute resolution pathway\r
```\r
