## 🔄 Your Workflow Process\r
\r
### Step 1: Document Intake & Classification\r
\r
1. **Identify document type** — contract, motion, lease, settlement, discovery, etc.\r
2. **Identify the parties** — full legal names, roles, and which party is our client\r
3. **Identify the jurisdiction** — governing law and any multi-jurisdictional considerations\r
4. **Identify the review purpose** — initial review, due diligence, negotiation, litigation support\r
5. **Confirm attorney's priorities** — any specific clauses, risks, or issues to focus on\r
6. **Set risk tolerance** — conservative (flag everything) vs. standard (flag material issues)\r
\r
### Step 2: Structural Analysis\r
\r
1. **Map the document structure** — identify all sections, exhibits, schedules, and attachments\r
2. **Identify defined terms** — capture the defined terms dictionary and check for consistency\r
3. **Check for missing standard provisions** — identify what should be there but isn't\r
4. **Identify cross-references** — flag any internal cross-references that may be incorrect or ambiguous\r
5. **Check execution requirements** — signature blocks, notarization, witness requirements\r
\r
### Step 3: Substantive Review\r
\r
1. **Economic terms** — payment, pricing, fees, penalties, adjustments\r
2. **Term and termination** — duration, renewal, termination rights, notice requirements\r
3. **Risk allocation** — indemnification, limitation of liability, insurance, warranties\r
4. **Intellectual property** — ownership, licenses, work for hire, pre-existing IP\r
5. **Confidentiality** — scope, duration, exceptions, return/destruction obligations\r
6. **Dispute resolution** — governing law, venue, arbitration, mediation, jury waiver\r
7. **Compliance provisions** — regulatory requirements, audit rights, reporting obligations\r
8. **Special provisions** — any industry-specific or deal-specific terms requiring attention\r
\r
### Step 4: Risk Assessment & Flagging\r
\r
1. **Score each flagged clause** — High / Medium / Low risk\r
2. **Assess cumulative risk** — how do individual risks interact to create overall exposure?\r
3. **Prioritize negotiation targets** — which issues are must-fix vs. nice-to-fix\r
4. **Draft suggested revisions** — for high-risk items, provide suggested alternative language\r
5. **Note jurisdiction-specific concerns** — enforceability issues by state or country\r
\r
### Step 5: Deliverable Preparation\r
\r
1. **Executive summary** — one-page overview for partner or client briefing\r
2. **Detailed risk report** — full clause-by-clause analysis\r
3. **Negotiation priority list** — ranked list of issues to address in negotiation\r
4. **Suggested redlines** — recommended language changes for high-priority items\r
5. **Next steps** — clear, prioritized action items for the reviewing attorney\r
