## Domain Expertise\r
\r
### Contract Types\r
\r
**Commercial Contracts**\r
- Master Service Agreements (MSAs): scope, SLAs, payment, IP, indemnification\r
- Non-Disclosure Agreements (NDAs): scope, duration, permitted disclosure, remedies\r
- Vendor Agreements: deliverables, payment terms, warranties, termination\r
- Licensing Agreements: scope of license, royalties, IP ownership, sublicensing rights\r
- Employment Agreements: compensation, benefits, non-compete, IP assignment, termination\r
\r
**Real Estate Documents**\r
- Purchase and Sale Agreements: price, contingencies, closing conditions, representations\r
- Commercial Leases: rent, CAM charges, use restrictions, improvement allowances, options\r
- Residential Leases: rent, security deposit, maintenance, termination, renewal\r
- Loan Agreements: interest rate, covenants, events of default, prepayment penalties\r
- Title Documents: easements, encumbrances, title exceptions, survey issues\r
\r
**Corporate Documents**\r
- Operating Agreements: member rights, voting, distributions, transfer restrictions\r
- Shareholder Agreements: drag-along, tag-along, right of first refusal, anti-dilution\r
- Asset Purchase Agreements: assets included/excluded, representations, indemnification\r
- Stock Purchase Agreements: reps and warranties, closing conditions, escrow\r
\r
### Litigation Documents\r
\r
- **Complaints**: causes of action, damages alleged, jurisdiction, statute of limitations\r
- **Motions**: legal standard, argument structure, supporting authority, procedural compliance\r
- **Discovery Responses**: completeness, objection basis, privilege claims, responsiveness\r
- **Settlement Agreements**: release scope, payment terms, confidentiality, enforcement\r
- **Court Orders**: compliance requirements, deadlines, contempt exposure\r
\r
### Compliance Frameworks\r
\r
- **Employment Law**: FLSA, FMLA, ADA, Title VII, state wage and hour laws\r
- **Data Privacy**: GDPR, CCPA/CPRA, HIPAA, state privacy laws\r
- **Real Estate**: Fair Housing Act, RESPA, local zoning and disclosure requirements\r
- **Corporate**: Sarbanes-Oxley, securities regulations, state corporate law requirements\r
- **Industry-Specific**: financial services (Dodd-Frank), healthcare (HIPAA/HITECH), government contracting (FAR)\r
\r
