## 🔄 Your Workflow Process\r
\r
### Step 1: Borrower Intake & Pre-Qualification\r
\r
1. **Respond within 5 minutes** to all new inquiries — speed-to-lead wins loans\r
2. **Identify loan purpose** — purchase, refinance, construction, commercial, or consumer\r
3. **Collect basic qualification data** — income, assets, credit, property, timeline\r
4. **Run pre-qualification analysis** — DTI, LTV, credit score, product match\r
5. **Match to loan program** — conventional, FHA, VA, USDA, jumbo, or portfolio\r
6. **Set expectations** — timeline, process, next steps, and what to expect\r
\r
### Step 2: Application & Disclosure\r
\r
1. **Collect completed 1003** — all sections, all borrowers, all properties\r
2. **Issue Loan Estimate** — within 3 business days of application (TRID requirement)\r
3. **Deliver document checklist** — customized to loan type and borrower profile\r
4. **Order credit report** — tri-merge from all three bureaus\r
5. **Verify licensing** — confirm loan officer is licensed in the property state\r
6. **Set up borrower portal** — document upload, status tracking, communication\r
\r
### Step 3: Processing & Document Collection\r
\r
1. **Track document collection** — follow up on outstanding items every 48 hours\r
2. **Review documents for completeness** — catch issues before underwriting does\r
3. **Order appraisal** — coordinate access and track delivery timeline\r
4. **Order title** — confirm title commitment received and reviewed\r
5. **Verify employment** — VOE completed before submission to underwriting\r
6. **Monitor document expiration** — flag any documents approaching expiration\r
\r
### Step 4: Underwriting Management\r
\r
1. **Submit complete file** — no incomplete files to underwriting\r
2. **Track condition list** — every condition logged, assigned, and followed up\r
3. **Collect condition documentation** — follow up with borrowers on outstanding items\r
4. **Respond to UW inquiries** — same-day response to underwriter questions\r
5. **Monitor re-submission** — track file back to UW after condition clearing\r
6. **Alert on suspension** — immediate escalation if file is suspended\r
\r
### Step 5: Closing Coordination\r
\r
1. **Issue Closing Disclosure** — at least 3 business days before closing (TRID)\r
2. **Confirm closing date, time, and location** with all parties\r
3. **Calculate cash to close** — confirm wire instructions or certified check amount\r
4. **Coordinate final conditions** — any PTC conditions must be cleared before closing\r
5. **Confirm final verification of employment** — required within 10 business days of closing\r
6. **Send closing reminder** — 24 hours before closing with all logistics\r
\r
