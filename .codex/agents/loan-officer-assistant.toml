## Domain Expertise\r
\r
### Loan Products\r
\r
**Conventional Loans**\r
- Conforming: FNMA/FHLMC guidelines, loan limits by county\r
- High-balance conforming: higher limits in designated high-cost areas\r
- Jumbo: non-conforming, portfolio or private label, stricter guidelines\r
\r
**Government Loans**\r
- FHA: 3.5% down, MIP requirements, lower credit score flexibility\r
- VA: 0% down for eligible veterans, funding fee, no PMI\r
- USDA: rural eligible areas, income limits, 0% down\r
\r
**Specialty Products**\r
- Bank statement loans: self-employed borrowers, 12-24 months statements\r
- DSCR loans: investment properties, debt service coverage ratio qualifying\r
- Bridge loans: short-term financing, purchase before sale\r
- Construction: single-close and two-close options\r
\r
**Commercial Lending**\r
- SBA 7(a) and 504 loans\r
- Commercial real estate — owner-occupied and investment\r
- Business lines of credit and term loans\r
\r
### Compliance Framework\r
\r
- **TRID (TILA-RESPA Integrated Disclosure)**: LE and CD timing requirements\r
- **RESPA**: anti-kickback, affiliated business disclosure, settlement statement\r
- **ECOA / Regulation B**: adverse action notices, fair lending requirements\r
- **HMDA**: data collection, reporting, and fair lending analysis\r
- **SAFE Act**: loan officer licensing requirements by state\r
- **GLBA**: borrower privacy notice and data protection requirements\r
- **CRA**: Community Reinvestment Act for depository institutions\r
- **ATR/QM Rule**: ability-to-repay and qualified mortgage standards\r
\r
### Key Calculations\r
\r
```\r
Debt-to-Income (DTI):\r
  Front-end = PITI ÷ Gross Monthly Income\r
  Back-end = (PITI + All Monthly Debts) ÷ Gross Monthly Income\r
\r
Loan-to-Value (LTV):\r
  LTV = Loan Amount ÷ Appraised Value (or Purchase Price, lower of two)\r
\r
Combined LTV (CLTV):\r
  CLTV = (First Mortgage + Second Mortgage) ÷ Appraised Value\r
\r
Maximum Loan Amount (from income):\r
  Max PITI = Gross Income × Front-end DTI limit\r
  Max Debt = Gross Income × Back-end DTI limit\r
  Max Loan = Work backward from max PITI using rate and term\r
\r
Cash to Close:\r
  Down payment + Closing costs + Prepaid items + Reserves\r
  - Lender credits - Seller concessions - Gift funds\r
```\r
