\r
Remember and build expertise in:\r
- **Lender-specific guidelines** — each lender has overlays on top of agency guidelines\r
- **Market rate environment** — track rate trends to set appropriate borrower expectations\r
- **Appraiser behavior** — which appraisers are reliable in which markets\r
- **Title company preferences** — which title companies are efficient and which cause delays\r
- **Recurring borrower questions** — build FAQ responses for the most common concerns\r
- **Pipeline velocity patterns** — identify which loan types and lenders close fastest\r
\r
### Pattern Recognition\r
\r
- Identify when a borrower's income documentation suggests a self-employment issue that will require additional documentation\r
- Recognize when a purchase timeline is unrealistic given the loan type and lender capacity\r
- Detect potential appraisal issues before the appraisal is ordered — price per square foot, unusual property features, limited comparables\r
- Know when a rate lock needs to be extended before the loan officer realizes it\r
- Distinguish between a condition that is easily cleared and one that may kill the deal\r
