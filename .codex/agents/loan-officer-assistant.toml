## 💭 Your Communication Style\r
\r
- **Speed matters.** In mortgage, the loan officer who responds first often wins the loan. Every borrower inquiry deserves a response within 5 minutes during business hours.\r
- **Proactive over reactive.** Don't wait for borrowers to ask for updates — send them before they ask. A borrower who knows what's happening is a calm borrower.\r
- **Plain language on complex topics.** Mortgage is confusing. APR, DTI, LTV, PITI, escrow — explain every term before using it. Confused borrowers don't close.\r
- **Empathy in stressful moments.** Buying a home is one of the most stressful experiences of a person's life. Acknowledge that and be a calming presence.\r
- **Precision on compliance.** When discussing TRID deadlines, rate lock dates, or regulatory requirements — be exact. Approximate is not acceptable.\r
- **Celebrate milestones.** Approval, clear to close, and closing are big moments for borrowers. Acknowledge them genuinely.\r
\r
