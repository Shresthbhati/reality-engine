### graphd Core Architecture\r
```typescript\r
// Example graphd server structure\r
interface GraphDaemon {\r
  // LSP Client Management\r
  lspClients: Map<string, LanguageClient>;\r
  \r
  // Graph State\r
  graph: {\r
    nodes: Map<NodeId, GraphNode>;\r
    edges: Map<EdgeId, GraphEdge>;\r
    index: SymbolIndex;\r
  };\r
  \r
  // API Endpoints\r
  httpServer: {\r
    '/graph': () => GraphResponse;\r
    '/nav/:symId': (symId: string) => NavigationResponse;\r
    '/stats': () => SystemStats;\r
  };\r
  \r
  // WebSocket Events\r
  wsServer: {\r
    onConnection: (client: WSClient) => void;\r
    emitDiff: (diff: GraphDiff) => void;\r
  };\r
  \r
  // File Watching\r
  watcher: {\r
    onFileChange: (path: string) => void;\r
    onGitCommit: (hash: string) => void;\r
  };\r
}\r
\r
// Graph Schema Types\r
interface GraphNode {\r
  id: string;        // "file:src/foo.ts" or "sym:foo#method"\r
  kind: 'file' | 'module' | 'class' | 'function' | 'variable' | 'type';\r
  file?: string;     // Parent file path\r
  range?: Range;     // LSP Range for symbol location\r
  detail?: string;   // Type signature or brief description\r
}\r
\r
interface GraphEdge {\r
  id: string;        // "edge:uuid"\r
  source: string;    // Node ID\r
  target: string;    // Node ID\r
  type: 'contains' | 'imports' | 'extends' | 'implements' | 'calls' | 'references';\r
  weight?: number;   // For importance/frequency\r
}\r
```\r
\r
### LSP Client Orchestration\r
```typescript\r
// Multi-language LSP orchestration\r
class LSPOrchestrator {\r
  private clients = new Map<string, LanguageClient>();\r
  private capabilities = new Map<string, ServerCapabilities>();\r
  \r
  async initialize(projectRoot: string) {\r
    // TypeScript LSP\r
    const tsClient = new LanguageClient('typescript', {\r
      command: 'typescript-language-server',\r
      args: ['--stdio'],\r
      rootPath: projectRoot\r
    });\r
    \r
    // PHP LSP (Intelephense or similar)\r
    const phpClient = new LanguageClient('php', {\r
      command: 'intelephense',\r
      args: ['--stdio'],\r
      rootPath: projectRoot\r
    });\r
    \r
    // Initialize all clients in parallel\r
    await Promise.all([\r
      this.initializeClient('typescript', tsClient),\r
      this.initializeClient('php', phpClient)\r
    ]);\r
  }\r
  \r
  async getDefinition(uri: string, position: Position): Promise<Location[]> {\r
    const lang = this.detectLanguage(uri);\r
    const client = this.clients.get(lang);\r
    \r
    if (!client || !this.capabilities.get(lang)?.definitionProvider) {\r
      return [];\r
    }\r
    \r
    return client.sendRequest('textDocument/definition', {\r
      textDocument: { uri },\r
      position\r
    });\r
  }\r
}\r
```\r
\r
### Graph Construction Pipeline\r
```typescript\r
// ETL pipeline from LSP to graph\r
class GraphBuilder {\r
  async buildFromProject(root: string): Promise<Graph> {\r
    const graph = new Graph();\r
    \r
    // Phase 1: Collect all files\r
    const files = await glob('**/*.{ts,tsx,js,jsx,php}', { cwd: root });\r
    \r
    // Phase 2: Create file nodes\r
    for (const file of files) {\r
      graph.addNode({\r
        id: `file:${file}`,\r
        kind: 'file',\r
        path: file\r
      });\r
    }\r
    \r
    // Phase 3: Extract symbols via LSP\r
    const symbolPromises = files.map(file => \r
      this.extractSymbols(file).then(symbols => {\r
        for (const sym of symbols) {\r
          graph.addNode({\r
            id: `sym:${sym.name}`,\r
            kind: sym.kind,\r
            file: file,\r
            range: sym.range\r
          });\r
          \r
          // Add contains edge\r
          graph.addEdge({\r
            source: `file:${file}`,\r
            target: `sym:${sym.name}`,\r
            type: 'contains'\r
          });\r
        }\r
      })\r
    );\r
    \r
    await Promise.all(symbolPromises);\r
    \r
    // Phase 4: Resolve references and calls\r
    await this.resolveReferences(graph);\r
    \r
    return graph;\r
  }\r
}\r
```\r
