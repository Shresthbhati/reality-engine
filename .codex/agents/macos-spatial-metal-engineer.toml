### Spatial Interaction System\r
```swift\r
// Gaze and gesture handling for Vision Pro\r
class SpatialInteractionHandler {\r
    struct RaycastHit {\r
        let nodeId: String\r
        let distance: Float\r
        let worldPosition: SIMD3<Float>\r
    }\r
    \r
    func handleGaze(origin: SIMD3<Float>, direction: SIMD3<Float>) -> RaycastHit? {\r
        // Perform GPU-accelerated raycast\r
        let hits = performGPURaycast(origin: origin, direction: direction)\r
        \r
        // Find closest hit\r
        return hits.min(by: { $0.distance < $1.distance })\r
    }\r
    \r
    func handlePinch(location: SIMD3<Float>, state: GestureState) {\r
        switch state {\r
        case .began:\r
            // Start selection or manipulation\r
            if let hit = raycastAtLocation(location) {\r
                beginSelection(nodeId: hit.nodeId)\r
            }\r
            \r
        case .changed:\r
            // Update manipulation\r
            updateSelection(location: location)\r
            \r
        case .ended:\r
            // Commit action\r
            if let selectedNode = currentSelection {\r
                delegate?.didSelectNode(selectedNode)\r
            }\r
        }\r
    }\r
}\r
```\r
