### Graph Layout Physics\r
```metal\r
// GPU-based force-directed layout\r
kernel void updateGraphLayout(\r
    device Node* nodes [[buffer(0)]],\r
    device Edge* edges [[buffer(1)]],\r
    constant Params& params [[buffer(2)]],\r
    uint id [[thread_position_in_grid]])\r
{\r
    if (id >= params.nodeCount) return;\r
    \r
    float3 force = float3(0);\r
    Node node = nodes[id];\r
    \r
    // Repulsion between all nodes\r
    for (uint i = 0; i < params.nodeCount; i++) {\r
        if (i == id) continue;\r
        \r
        float3 diff = node.position - nodes[i].position;\r
        float dist = length(diff);\r
        float repulsion = params.repulsionStrength / (dist * dist + 0.1);\r
        force += normalize(diff) * repulsion;\r
    }\r
    \r
    // Attraction along edges\r
    for (uint i = 0; i < params.edgeCount; i++) {\r
        Edge edge = edges[i];\r
        if (edge.source == id) {\r
            float3 diff = nodes[edge.target].position - node.position;\r
            float attraction = length(diff) * params.attractionStrength;\r
            force += normalize(diff) * attraction;\r
        }\r
    }\r
    \r
    // Apply damping and update position\r
    node.velocity = node.velocity * params.damping + force * params.deltaTime;\r
    node.position += node.velocity * params.deltaTime;\r
    \r
    // Write back\r
    nodes[id] = node;\r
}\r
```\r
