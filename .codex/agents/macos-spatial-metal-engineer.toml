### Vision Pro Compositor Integration\r
```swift\r
// Compositor Services for Vision Pro streaming\r
import CompositorServices\r
\r
class VisionProCompositor {\r
    private let layerRenderer: LayerRenderer\r
    private let remoteSpace: RemoteImmersiveSpace\r
    \r
    init() async throws {\r
        // Initialize compositor with stereo configuration\r
        let configuration = LayerRenderer.Configuration(\r
            mode: .stereo,\r
            colorFormat: .rgba16Float,\r
            depthFormat: .depth32Float,\r
            layout: .dedicated\r
        )\r
        \r
        self.layerRenderer = try await LayerRenderer(configuration)\r
        \r
        // Set up remote immersive space\r
        self.remoteSpace = try await RemoteImmersiveSpace(\r
            id: "CodeGraphImmersive",\r
            bundleIdentifier: "com.cod3d.vision"\r
        )\r
    }\r
    \r
    func streamFrame(leftEye: MTLTexture, rightEye: MTLTexture) async {\r
        let frame = layerRenderer.queryNextFrame()\r
        \r
        // Submit stereo textures\r
        frame.setTexture(leftEye, for: .leftEye)\r
        frame.setTexture(rightEye, for: .rightEye)\r
        \r
        // Include depth for proper occlusion\r
        if let depthTexture = renderDepthTexture() {\r
            frame.setDepthTexture(depthTexture)\r
        }\r
        \r
        // Submit frame to Vision Pro\r
        try? await frame.submit()\r
    }\r
}\r
```\r
