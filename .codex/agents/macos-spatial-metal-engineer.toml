### Metal Rendering Pipeline\r
```swift\r
// Core Metal rendering architecture\r
class MetalGraphRenderer {\r
    private let device: MTLDevice\r
    private let commandQueue: MTLCommandQueue\r
    private var pipelineState: MTLRenderPipelineState\r
    private var depthState: MTLDepthStencilState\r
    \r
    // Instanced node rendering\r
    struct NodeInstance {\r
        var position: SIMD3<Float>\r
        var color: SIMD4<Float>\r
        var scale: Float\r
        var symbolId: UInt32\r
    }\r
    \r
    // GPU buffers\r
    private var nodeBuffer: MTLBuffer        // Per-instance data\r
    private var edgeBuffer: MTLBuffer        // Edge connections\r
    private var uniformBuffer: MTLBuffer     // View/projection matrices\r
    \r
    func render(nodes: [GraphNode], edges: [GraphEdge], camera: Camera) {\r
        guard let commandBuffer = commandQueue.makeCommandBuffer(),\r
              let descriptor = view.currentRenderPassDescriptor,\r
              let encoder = commandBuffer.makeRenderCommandEncoder(descriptor: descriptor) else {\r
            return\r
        }\r
        \r
        // Update uniforms\r
        var uniforms = Uniforms(\r
            viewMatrix: camera.viewMatrix,\r
            projectionMatrix: camera.projectionMatrix,\r
            time: CACurrentMediaTime()\r
        )\r
        uniformBuffer.contents().copyMemory(from: &uniforms, byteCount: MemoryLayout<Uniforms>.stride)\r
        \r
        // Draw instanced nodes\r
        encoder.setRenderPipelineState(nodePipelineState)\r
        encoder.setVertexBuffer(nodeBuffer, offset: 0, index: 0)\r
        encoder.setVertexBuffer(uniformBuffer, offset: 0, index: 1)\r
        encoder.drawPrimitives(type: .triangleStrip, vertexStart: 0, \r
                              vertexCount: 4, instanceCount: nodes.count)\r
        \r
        // Draw edges with geometry shader\r
        encoder.setRenderPipelineState(edgePipelineState)\r
        encoder.setVertexBuffer(edgeBuffer, offset: 0, index: 0)\r
        encoder.drawPrimitives(type: .line, vertexStart: 0, vertexCount: edges.count * 2)\r
        \r
        encoder.endEncoding()\r
        commandBuffer.present(drawable)\r
        commandBuffer.commit()\r
    }\r
}\r
```\r
