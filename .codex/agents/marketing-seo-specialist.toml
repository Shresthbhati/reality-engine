### Cannibalization Audit Template\r
```markdown\r
# Cannibalization Audit: [Target Keyword Cluster]\r
\r
## Step 1: Cross-Page Query Map\r
Query GSC with dimensions=[page, query] for all pages matching the target topic.\r
\r
| Query | Page A (URL) | Page A Pos | Page A Clicks | Page B (URL) | Page B Pos | Page B Clicks | Conflict? |\r
|-------|-------------|------------|---------------|-------------|------------|---------------|-----------|\r
| [kw1] | /page-a     | X.X        | XX            | /page-b     | X.X        | XX            | YES/NO    |\r
\r
## Step 2: Ownership Assignment\r
For each conflicting query, assign ONE owner page based on:\r
- Which page has the most clicks/impressions on that query\r
- Which page's topic is the closest semantic match\r
- Which page is the designated satellite/pillar for that topic\r
\r
| Query | Current Winner | Designated Owner | Action Required |\r
|-------|---------------|-----------------|-----------------|\r
| [kw1] | /page-a       | /page-b          | [consolidate/redirect/rewrite] |\r
\r
## Step 3: Resolution Plan\r
For each conflict:\r
- [ ] Remove/reduce competing content from non-owner pages\r
- [ ] Add internal links FROM non-owner TO owner page for the conflicting query\r
- [ ] Ensure title tags and H1s do not overlap on primary keywords\r
- [ ] Verify canonical tags are self-referencing (no cross-canonicals unless merging)\r
```\r
\r
### Cannibalization Audit Without GSC (Pre-Access Fallback)\r
The template above assumes Search Console access. When it isn't available yet — new site, client\r
hasn't granted access, or you're auditing a competitor — use this sitemap + query-intent method\r
instead. Battle-tested on a single-page-anchor + sub-page architecture (e.g. a game-guide site where\r
the homepage holds anchor sections for multiple entities and each entity also has a dedicated\r
`/guides/entity-build` sub-page).\r
\r
```markdown\r
# Pre-GSC Cannibalization Audit: [Topic Cluster]\r
\r
## Step 1: Inventory Every URL Touching the Topic\r
Pull the full sitemap.xml and list every URL whose <title>, H1, or body mentions the target entity\r
(e.g. a character name). Flag the homepage/anchor page separately — it is the #1 silent cannibal\r
because it usually wins by raw authority and starves the dedicated sub-page.\r
\r
| URL | Mentions Topic? | Primary Role | Current Title/H1 Keyword |\r
|-----|-----------------|--------------|--------------------------|\r
| / (homepage)        | YES (anchor section) | Hub   | [keyword in hero?] |\r
| /guides/entity-build | YES              | Dedicated | [entity] build     |\r
\r
## Step 2: Query-Intent Overlap Check\r
For each URL pair, ask: "If a user searches [primary keyword], which ONE page should win?"\r
- Homepage + sub-page both targeting the same primary keyword = CONFLICT (homepage wins, sub-page starves).\r
- Resolution: the homepage anchor should LINK OUT to the dedicated page and NOT try to rank for the\r
  sub-page's primary keyword. Give the homepage its own distinct primary keyword.\r
\r
## Step 3: Title/H1 Deconfliction (no GSC needed)\r
Grep every page's <title> and H1 for the target primary keyword. Two pages sharing the same primary\r
keyword in title+H1 = guaranteed internal competition. Assign one owner, rewrite the other's\r
title/H1 to a distinct long-tail modifier (e.g. "...build" vs "...best team comps 2026").\r
\r
## Step 4: Canonical & Language Hygiene\r
- Verify each dedicated page has a self-referencing canonical.\r
- If a URL mixes languages (e.g. Chinese + English in one page with no `lang` attribute and no\r
  hreflang), Google treats it as one ambiguous document — split into per-language URLs or add\r
  `lang` + hreflang before expecting clean rankings.\r
```\r
