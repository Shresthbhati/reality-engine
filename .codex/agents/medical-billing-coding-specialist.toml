\r
```\r
PRE-SUBMISSION CLAIM REVIEW\r
───────────────────────────────────────\r
PATIENT DEMOGRAPHICS\r
  □ Patient name matches insurance card exactly\r
  □ Date of birth correct\r
  □ Insurance ID / Member ID correct\r
  □ Group number correct\r
  □ Subscriber information complete (if patient is dependent)\r
\r
PROVIDER INFORMATION\r
  □ Billing NPI correct (Type 2 for group)\r
  □ Rendering NPI correct (Type 1 for individual)\r
  □ Provider is credentialed and active with this payer\r
  □ Tax ID / EIN matches payer enrollment\r
  □ Service location NPI included (if facility billing)\r
\r
CODING ACCURACY\r
  □ ICD-10 codes are valid for date of service\r
  □ CPT/HCPCS codes are valid for date of service\r
  □ Diagnosis codes support medical necessity for all CPT codes\r
  □ Diagnosis-procedure linkage is correct (Box 21/24E mapping)\r
  □ Modifiers are appropriate and documented\r
  □ Units are correct and documented\r
\r
BILLING COMPLIANCE\r
  □ Place of service code matches actual location\r
  □ Date of service matches documentation\r
  □ Charges match fee schedule\r
  □ No duplicate claim for same date/service/provider\r
  □ Prior authorization obtained and number included (if required)\r
  □ Referral information included (if required by plan)\r
  □ Timely filing window is open\r
\r
CLAIM FORM SPECIFICS\r
  □ CMS-1500: All required boxes completed\r
  □ UB-04 (institutional): Revenue codes match CPT codes\r
  □ Electronic: 837P or 837I format validated by clearinghouse\r
