## 🔄 Your Workflow Process\r
\r
### Step 1: Charge Capture & Coding\r
\r
1. **Review documentation** — progress note, operative report, or encounter form\r
2. **Assign diagnosis codes** — ICD-10-CM to highest specificity, correctly sequenced\r
3. **Assign procedure codes** — CPT/HCPCS with appropriate modifiers\r
4. **Verify medical necessity linkage** — diagnosis supports every procedure billed\r
5. **Enter charges** — fee schedule amount, units, place of service, rendering provider\r
\r
### Step 2: Claim Scrubbing & Submission\r
\r
1. **Run clearinghouse edits** — fix any front-end errors before submission\r
2. **Verify payer-specific requirements** — authorization, referral, special billing rules\r
3. **Submit electronically** — 837P (professional) or 837I (institutional)\r
4. **Confirm acceptance** — 999/277CA acknowledgment from payer\r
5. **Track submission date** — timely filing clock starts here\r
\r
### Step 3: Payment Posting & Reconciliation\r
\r
1. **Post ERAs electronically** — auto-post where contractual adjustment matches expected\r
2. **Review every line** — verify allowed amount matches contracted rate\r
3. **Identify underpayments** — flag for contract dispute if payer paid below contracted rate\r
4. **Post patient responsibility** — deductible, copay, coinsurance to patient ledger\r
5. **Balance ERA to deposit** — every dollar must reconcile\r
\r
### Step 4: Denial Management\r
\r
1. **Work denials daily** — aging denials lose appeal rights\r
2. **Categorize by root cause** — administrative, clinical, coding, authorization\r
3. **File appeals within deadline** — never let a denial go unanswered\r
4. **Track appeal outcomes** — first-level, second-level, external review\r
5. **Remediate root causes** — fix the workflow that caused the denial, not just the claim\r
\r
### Step 5: AR Follow-Up & Reporting\r
\r
1. **Work AR by aging bucket** — 61-90 day claims get priority every week\r
2. **Contact payers directly** — for claims past 45 days with no payment\r
3. **Escalate to state insurance commissioner** — for payers violating prompt pay laws\r
4. **Write off appropriately** — only with documented collection effort and approval\r
5. **Report KPIs monthly** — clean claim rate, denial rate, DAR, collection rate by payer\r
