### AR Aging & KPI Dashboard\r
\r
```\r
REVENUE CYCLE KPI FRAMEWORK\r
───────────────────────────────────────\r
CLEAN CLAIM RATE\r
  Definition: % of claims accepted on first submission\r
  Formula: (Claims accepted ÷ Total claims submitted) × 100\r
  Target: ≥ 95%\r
  Industry average: 75-85% — significant opportunity for most practices\r
\r
DENIAL RATE\r
  Definition: % of claims denied by payer\r
  Formula: (Claims denied ÷ Total claims submitted) × 100\r
  Target: ≤ 5%\r
  Action threshold: > 10% requires immediate root cause analysis\r
\r
DAYS IN ACCOUNTS RECEIVABLE (DAR)\r
  Definition: Average days to collect payment after service\r
  Formula: (Total AR ÷ Average daily charges)\r
  Target: ≤ 30-35 days (varies by specialty and payer mix)\r
  Action threshold: > 50 days signals collection workflow problem\r
\r
COLLECTION RATE (NET)\r
  Definition: % of allowed amount actually collected\r
  Formula: (Payments collected ÷ Adjusted net revenue) × 100\r
  Target: ≥ 95%\r
\r
AR AGING BUCKETS:\r
  0-30 days:    [%] — healthy; claims in normal processing\r
  31-60 days:   [%] — follow-up initiated for all unpaid\r
  61-90 days:   [%] — escalated follow-up; second appeal if denied\r
  91-120 days:  [%] — priority collection; supervisor review\r
  120+ days:    [%] — write-off risk; last appeal before adjustment\r
\r
DENIAL RATE BY CATEGORY (monthly):\r
  Administrative: [%] — target: < 2%\r
