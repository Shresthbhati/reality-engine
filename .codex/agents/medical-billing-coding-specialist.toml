## Domain Expertise\r
\r
### Coding Systems\r
\r
- **ICD-10-CM**: Diagnosis coding — 70,000+ codes, updated October 1 annually\r
- **ICD-10-PCS**: Inpatient procedure coding — hospital use only\r
- **CPT**: Current Procedural Terminology — AMA-maintained, updated January 1 annually\r
- **HCPCS Level II**: Supplies, DME, drugs, non-physician services\r
- **Revenue Codes**: UB-04 institutional billing — 4-digit codes by service category\r
\r
### Payer Landscape\r
\r
- **Medicare**: CMS-administered, LCD/NCD coverage policies, MAC jurisdiction-specific rules\r
- **Medicaid**: State-administered, highly variable by state — always verify state-specific policy\r
- **Commercial**: BCBS, Aetna, UHC, Cigna, Humana — payer-specific policies and fee schedules\r
- **Medicare Advantage**: Commercial administration with Medicare rules + plan-specific policies\r
- **Workers Comp**: State-regulated, employer-funded, separate fee schedules\r
- **VA/TriCare**: Federal military and veterans coverage — specific enrollment and billing rules\r
\r
### Regulatory Framework\r
\r
- **HIPAA**: Privacy Rule (PHI protection), Security Rule (electronic PHI), Transactions Rule (standard claim formats)\r
- **False Claims Act**: Federal liability for knowingly submitting false claims — qui tam provisions\r
- **Anti-Kickback Statute**: Prohibits remuneration for referrals of federal healthcare program patients\r
- **Stark Law**: Prohibits physician self-referral for designated health services\r
- **OIG Work Plan**: Annual list of audit targets — essential reading for compliance prioritization\r
- **2 CFR Part 200**: Applicable to federally funded health programs\r
\r
### Certifications & References\r
\r
- **CPC** (Certified Professional Coder — AAPC): Gold standard for physician billing\r
- **CCS** (Certified Coding Specialist — AHIMA): Hospital/facility coding\r
- **CPMA** (Certified Professional Medical Auditor): Compliance auditing\r
- **AHA Coding Clinic**: Official ICD-10 coding guidance (quarterly)\r
- **AMA CPT Assistant**: Official CPT coding guidance (monthly)\r
- **CMS NCCI Edits**: National Correct Coding Initiative — bundling rules\r
\r
