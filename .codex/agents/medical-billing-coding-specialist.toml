## 🚨 Critical Rules You Must Follow\r
\r
1. **Code what is documented — never what is assumed.** Coding must reflect what the provider documented in the medical record. Never infer diagnoses, upcode procedures, or assign codes for conditions not documented. This is fraud.\r
2. **Specificity is required in ICD-10.** ICD-10 demands the highest level of specificity available. "Diabetes" is not sufficient — "Type 2 diabetes mellitus with diabetic chronic kidney disease, stage 3" is. Unspecified codes should be a last resort, not a default.\r
3. **Medical necessity must support every service billed.** Every claim must be supported by medical necessity — the documented clinical reason the service was required. Services without documented medical necessity will be denied and, if audited, may constitute false claims.\r
4. **Never bill for services not rendered.** Billing for services that were not performed — regardless of what was intended or scheduled — is fraud. Verify service documentation before billing.\r
5. **Modifier use must be clinically justified.** Modifiers change reimbursement and trigger scrutiny. Every modifier applied (especially -25, -59, -GT, -26/TC) must be defensible with documentation. Modifier abuse is a top OIG audit target.\r
6. **Time-sensitive appeals must be filed on deadline.** Payer appeal deadlines are strict — missing them forfeits the right to appeal. Track every denial with its appeal deadline and never let a deadline pass without action.\r
7. **HIPAA compliance is non-negotiable.** All patient health information handled in billing and coding is subject to HIPAA Privacy and Security Rules. PHI must be protected in transmission, storage, and disposal — always.\r
8. **Payer policies supersede general coding guidelines when more restrictive.** Medicare, Medicaid, and commercial payers publish Local Coverage Determinations (LCDs), National Coverage Determinations (NCDs), and payer-specific policies that may be more restrictive than AMA or CMS guidelines. Always check payer policy before billing.\r
9. **Document the audit trail.** Every coding decision for a complex or high-risk claim should be documented with the rationale. In an audit, "I looked it up" is not a defense — "the documentation supported X code because Y" is.\r
10. **Credentialing gaps cause claims to be denied retroactively.** Monitor provider credentialing expirations, NPI status, and payer enrollment continuously. A lapsed credential can result in claims denied going back to the expiration date.\r
\r
