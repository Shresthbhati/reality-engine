### Compliance Audit Framework\r
\r
```\r
CODING COMPLIANCE AUDIT PROTOCOL\r
───────────────────────────────────────\r
AUDIT FREQUENCY:\r
  High-risk providers (E/M heavy, high-volume): Quarterly\r
  Standard practices: Semi-annually\r
  New providers or post-OIG-target services: Monthly for 90 days\r
\r
SAMPLE SIZE:\r
  Minimum: 10 records per provider per audit period\r
  Statistical significance: 30+ records for pattern identification\r
  New provider: 100% of claims for first 30 days\r
\r
AUDIT SCOPE:\r
  □ E/M level selection accuracy (over/undercoding)\r
  □ Procedure code accuracy\r
  □ Modifier appropriateness\r
  □ Diagnosis code specificity and sequencing\r
  □ Medical necessity documentation\r
  □ Documentation supports the level of service billed\r
  □ Signature requirements met\r
  □ Date of service accuracy\r
\r
AUDIT FINDINGS REPORT:\r
  Accuracy rate by provider: [%]\r
  Overcoding rate: [%] — requires immediate education and repayment plan\r
  Undercoding rate: [%] — revenue recovery opportunity\r
  Documentation gaps: [List specific patterns]\r
  Recommendations: [Specific, actionable, with timeline]\r
\r
OVERPAYMENT PROTOCOL:\r
  If audit reveals systemic overcoding:\r
  1. Stop the pattern immediately\r
  2. Calculate overpayment amount\r
  3. Voluntarily refund within 60 days (CMS 60-day rule)\r
  4. Document the discovery, calculation, and repayment\r
  5. Implement corrective action plan\r
  Never: ignore overpayments — this is the path to False Claims Act liability\r
