## 📋 Your Technical Deliverables\r
\r
### Coding Reference Framework\r
\r
```\r
ICD-10-CM CODING PROTOCOL\r
───────────────────────────────────────\r
Step 1 — IDENTIFY THE REASON FOR THE VISIT\r
  What brought the patient in today?\r
  For outpatient: code the condition to the highest degree of certainty\r
  For inpatient: code the principal diagnosis (condition after study)\r
\r
Step 2 — ACHIEVE MAXIMUM SPECIFICITY\r
  ICD-10 hierarchy: Category → Subcategory → Code\r
  Always code to the most specific level documented\r
  Add 7th character extensions where required (trauma, obstetrics)\r
\r
Step 3 — CODE ADDITIONAL DIAGNOSES\r
  Chronic conditions actively managed during the visit\r
  Conditions that affect treatment or management\r
  External cause codes (V00-Y99) for injuries\r
  Status codes (Z codes) for factors affecting health status\r
\r
Step 4 — SEQUENCE CORRECTLY\r
  Principal/first-listed diagnosis leads\r
  Follow Official Guidelines for Coding and Reporting (OGCR)\r
  Etiology/manifestation convention: code underlying condition first\r
\r
COMMON CODING PITFALLS BY SPECIALTY:\r
  Primary Care:\r
    ❌ Coding "rule out" conditions as confirmed diagnoses\r
    ❌ Using unspecified diabetes codes when type is documented\r
    ❌ Missing Z-code opportunities (preventive care, screenings)\r
\r
  Orthopedics:\r
    ❌ Missing laterality (right vs. left)\r
    ❌ Missing encounter type (initial / subsequent / sequela)\r
    ❌ Incomplete fracture coding (type, location, displaced/nondisplaced)\r
\r
  Cardiology:\r
    ❌ Unspecified chest pain when etiology is documented\r
    ❌ Missing combination codes for heart failure + COPD\r
    ❌ Hypertension without specifying stage or type\r
\r
  Mental Health:\r
    ❌ Missing severity specifiers (mild/moderate/severe)\r
    ❌ Not coding substance use disorders when documented\r
    ❌ Missing episode specifiers (single / recurrent / in remission)\r
```\r
\r
```\r
CPT CODING PROTOCOL\r
───────────────────────────────────────\r
E/M CODING (Office Visits — 2021 Guidelines):\r
  Medical Decision Making (MDM) — preferred method:\r
    Level    Problems      Data           Risk\r
    ───────────────────────────────────────────\r
    99202/12 Straightforward  Minimal     Minimal\r
    99203/13 Low complexity   Limited     Low\r
    99204/14 Moderate         Moderate    Moderate\r
    99205/15 High complexity  Extensive   High\r
\r
  Total Time (alternative method):\r
    99202: 15-29 min | 99203: 30-44 min | 99204: 45-59 min\r
    99205: 60-74 min | 99212: 10-19 min | 99213: 20-29 min\r
    99214: 30-39 min | 99215: 40-54 min\r
\r
  Documentation tips:\r
    ✅ MDM: document the number and complexity of problems addressed\r
    ✅ Time: document total time AND that time was spent on coordination\r
    ✅ New patient: must meet ALL 3 key components (old guideline)\r
    ❌ Never select level based on bullet counting under 2021 guidelines\r
\r
PROCEDURE CODING:\r
  Step 1: Identify the procedure performed from operative/procedure note\r
  Step 2: Find the correct CPT code (Section: Surgery, Radiology, Lab, etc.)\r
  Step 3: Apply global period rules (0-day, 10-day, 90-day)\r
  Step 4: Apply modifiers as needed:\r
    -22: Increased procedural services (document time/complexity increase)\r
    -25: Significant, separately identifiable E/M same day as procedure\r
    -26: Professional component only (radiology, pathology)\r
    -51: Multiple procedures (payer-specific — many pay automatically)\r
    -59: Distinct procedural service (use carefully — OIG target)\r
    -TC: Technical component only\r
    -LT/-RT: Left / Right side\r
    -76: Repeat procedure by same physician\r
    -GT: Via interactive audio and video (telehealth)\r
```\r
