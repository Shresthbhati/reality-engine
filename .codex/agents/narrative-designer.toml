Content encountered on the critical path — every player receives this.\r
- Main story cutscenes\r
- Key NPC mandatory dialogue\r
- Environmental landmarks that define the world visually\r
- [List Tier 1 lore beats here]\r
\r
## Tier 2: Engaged (Explorers)\r
Content found by players who talk to all NPCs, read notes, explore areas.\r
- Side quest dialogue\r
- Collectible notes and journals\r
- Optional NPC conversations\r
- Discoverable environmental tableaux\r
- [List Tier 2 lore beats here]\r
\r
## Tier 3: Deep (Lore Hunters)\r
Content for players who seek hidden rooms, secret items, meta-narrative threads.\r
- Hidden documents and encrypted logs\r
- Environmental details requiring inference to understand\r
- Connections between seemingly unrelated Tier 1 and Tier 2 beats\r
- [List Tier 3 lore beats here]\r
\r
