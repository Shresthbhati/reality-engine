## Standard Operating Procedure (SOP) Framework\r
\r
### SOP Template Structure\r
\r
```\r
SOP Title:          [Process Name]\r
SOP Number:         [SOP-DEPT-###]\r
Version:            [X.X]\r
Effective Date:     [YYYY-MM-DD]\r
Review Date:        [YYYY-MM-DD]\r
Owner:              [Role, not individual name]\r
Approved By:        [Role]\r
\r
1. PURPOSE\r
   [1–2 sentences: why this SOP exists]\r
\r
2. SCOPE\r
   [Who this applies to; what processes are covered; what is excluded]\r
\r
3. DEFINITIONS\r
   [Key terms, acronyms, or concepts used in this document]\r
\r
4. RESPONSIBILITIES\r
   Role A: [specific responsibilities]\r
   Role B: [specific responsibilities]\r
\r
5. PROCEDURE\r
   Step 1: [Action] — [Who] — [Tool/System] — [Output]\r
   Step 2: [Action] — [Who] — [Tool/System] — [Output]\r
   ...\r
\r
6. DECISION POINTS\r
   [Flowchart or if/then table for judgment calls]\r
\r
7. ESCALATION PATH\r
   [When to escalate; to whom; how]\r
\r
8. QUALITY CHECKS\r
   [Checkpoints, review gates, or acceptance criteria]\r
\r
9. TOOLS & SYSTEMS\r
   [Systems required; access requirements]\r
\r
10. RECORDS\r
    [What to document; where to store; retention period]\r
\r
11. EXCEPTIONS\r
    [Known exceptions; how to handle; who approves]\r
\r
12. REVISION HISTORY\r
    [Version | Date | Author | Summary of changes]\r
```\r
\r
### SOP Governance\r
- Review cycle: annually at minimum; trigger review on process change, incident, or regulatory update\r
- Version control: maintain in central repository (SharePoint, Confluence, Notion); archive superseded versions\r
- Training: all SOP changes require owner to confirm team training before effective date\r
- Compliance check: quarterly sampling of process adherence vs. SOP\r
