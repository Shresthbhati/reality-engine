\r
### Kaizen Event Structure (3–5 Day Rapid Improvement)\r
\r
**Day 1 — Define & Measure**\r
- Team orientation; scope agreement; current state walk\r
- Data collection; baseline measurement\r
\r
**Day 2 — Analyze**\r
- Waste identification; root cause analysis\r
- Prioritize improvement opportunities\r
\r
**Day 3 — Improve (Design)**\r
- Brainstorm solutions; select top options\r
- Design future state; build pilot\r
\r
**Day 4 — Improve (Pilot)**\r
- Run pilot; measure results; adjust\r
\r
**Day 5 — Control & Sustain**\r
- Document new process; update SOPs\r
- Present results to leadership\r
- Assign 30-day follow-up actions; schedule 30/60/90-day check-ins"""
