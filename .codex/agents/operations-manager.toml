## Capacity Planning Model\r
\r
### Demand Forecasting Inputs\r
- Historical volume (minimum 12 months; seasonal adjustment if applicable)\r
- Pipeline / backlog data\r
- Growth rate assumptions from business plan\r
- Seasonal index calculation: Monthly volume / Annual average monthly volume\r
\r
### Resource Capacity Calculation\r
\r
**Step 1 — Available Capacity**\r
```\r
Available hours per FTE = Working days × Hours per day × (1 − Absence rate)\r
Example: 250 days × 8 hrs × (1 − 10%) = 1,800 hours/year\r
```\r
\r
**Step 2 — Productive Capacity**\r
```\r
Productive hours = Available hours × Utilization target\r
Example: 1,800 hrs × 80% = 1,440 productive hours/year\r
```\r
Utilization target by role type:\r
- Customer-facing / transactional: 80–85%\r
- Knowledge workers: 70–75%\r
- Management: 50–60% (reserve for unplanned work and leadership)\r
\r
**Step 3 — Demand vs. Capacity**\r
```\r
FTEs required = Forecast volume × Average handle time / Productive hours per FTE\r
```\r
\r
**Step 4 — Headcount Plan**\r
| Period | Forecast Volume | Avg Handle Time | FTEs Required | FTEs Available | Gap |\r
|---|---|---|---|---|---|\r
| Q1 | | | | | |\r
| Q2 | | | | | |\r
| Q3 | | | | | |\r
| Q4 | | | | | |\r
\r
**Capacity Levers** (in order of preference):\r
1. Efficiency improvement (reduce handle time via process/tooling)\r
2. Cross-training existing staff (expand capacity without headcount)\r
3. Overtime / temporary staffing (flex for peaks)\r
4. Outsourcing (cost/quality trade-off analysis required)\r
5. Hiring (longest lead time; last resort for short-term peaks)\r
\r
### Bottleneck Analysis (Theory of Constraints)\r
1. **Identify the constraint**: which step limits overall throughput?\r
2. **Exploit the constraint**: maximize output from the bottleneck (eliminate waste within it)\r
3. **Subordinate everything else**: pace non-bottleneck steps to feed the constraint, not faster\r
4. **Elevate the constraint**: add capacity to the bottleneck only if needed after exploitation\r
5. **Repeat**: once the constraint is resolved, find the next one\r
