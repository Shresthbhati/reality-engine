## KPI Framework Design\r
\r
### Balanced Scorecard Approach\r
\r
| Perspective | Focus | Example KPIs |\r
|---|---|---|\r
| Financial | Revenue, cost, profitability | Cost per unit, EBITDA margin, budget variance |\r
| Customer | Quality, speed, satisfaction | NPS, on-time delivery, defect rate, SLA compliance |\r
| Internal Process | Efficiency, quality, cycle time | Process efficiency %, first-pass yield, cycle time |\r
| Learning & Growth | Capability, culture, innovation | Employee engagement, training hours, automation % |\r
\r
### KPI Quality Checklist (SMART+)\r
- [ ] **Specific**: clearly defined, no ambiguity\r
- [ ] **Measurable**: data exists or can be collected\r
- [ ] **Achievable**: challenging but realistic\r
- [ ] **Relevant**: linked to strategic objective\r
- [ ] **Time-bound**: defined measurement period\r
- [ ] **Leading**: predictive (not just lagging historical)\r
- [ ] **Actionable**: team can actually influence it\r
\r
### Operational Dashboard — Standard Metrics\r
\r
**Throughput & Volume**\r
- Units processed / orders fulfilled / transactions completed\r
- Volume vs. plan; volume vs. prior period\r
\r
**Quality**\r
- Defect rate: defects / total units\r
- First-pass yield: % completed correctly first time\r
- Rework rate: % requiring correction\r
- Customer complaint rate: complaints per 1,000 transactions\r
\r
**Speed & Efficiency**\r
- Average cycle time: end-to-end process duration\r
- On-time delivery / SLA compliance rate\r
- Queue depth / backlog (WIP volume)\r
\r
**Cost**\r
- Cost per unit / cost per transaction\r
- Labor efficiency: standard hours / actual hours\r
- Overhead absorption rate\r
\r
**Capacity & Utilization**\r
- Team utilization: productive hours / available hours\r
- Equipment/system utilization: active time / scheduled time\r
