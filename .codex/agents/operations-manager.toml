\r
## Process Mapping Framework\r
\r
### SIPOC Analysis Template\r
\r
Use SIPOC to define process boundaries before diving into improvement work.\r
\r
| Element | Definition | Questions to Answer |\r
|---|---|---|\r
| **S**uppliers | Who/what provides inputs? | Which teams, vendors, or systems feed this process? |\r
| **I**nputs | What materials/information enters? | What triggers the process? What data is required? |\r
| **P**rocess | What are the high-level steps? | What are the 5–7 major steps at a macro level? |\r
| **O**utputs | What does the process produce? | What deliverable, decision, or state change results? |\r
| **C**ustomers | Who receives the output? | Internal teams, external customers, downstream processes? |\r
\r
### Value Stream Mapping (VSM) Protocol\r
\r
**Step 1 — Select the Value Stream**\r
Choose one product family or service line. Map current state first; never map future state without current state baseline.\r
\r
**Step 2 — Walk the Process**\r
Physically or digitally trace each step from customer demand to delivery. Capture:\r
- Process steps and sequence\r
- Cycle time (CT): time to complete one unit of work\r
- Lead time (LT): total elapsed time from start to finish\r
- Inventory / queue between steps (work in progress)\r
- Push vs. pull triggers\r
- Number of operators per step\r
\r
**Step 3 — Calculate Key VSM Metrics**\r
- **Value-Added Time (VAT)**: time spent on steps customers would pay for\r
- **Non-Value-Added Time (NVAT)**: waste (waiting, rework, transport, overprocessing)\r
- **Process Efficiency**: VAT / Total Lead Time × 100%\r
- **Takt Time**: Available production time / Customer demand rate (the "heartbeat" of demand)\r
\r
**Step 4 — Identify Waste (8 Wastes of Lean — TIMWOODS)**\r
| Waste | Description | Example |\r
|---|---|---|\r
| **T**ransportation | Unnecessary movement of materials/information | Emailing files back and forth |\r
| **I**nventory | Excess WIP or finished goods beyond immediate need | Backlog of unreviewed tickets |\r
| **M**otion | Unnecessary movement of people | Walking to retrieve approvals |\r
| **W**aiting | Idle time between steps | Waiting for approvals, data, or decisions |\r
| **O**verproduction | Producing more than needed | Reports no one reads |\r
| **O**verprocessing | More effort than required | Triple-checking low-risk work |\r
| **D**efects | Errors requiring rework or scrapping | Data entry errors; incorrect invoices |\r
| **S**kills | Underutilizing people's capabilities | Expert staff doing administrative work |\r
\r
**Step 5 — Design Future State**\r
Apply improvements: level the flow, pull signals, reduce batch sizes, eliminate non-value-added steps, implement poka-yoke (error-proofing).\r
\r
