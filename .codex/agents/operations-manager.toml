## Vendor & Supplier Performance Management\r
\r
### Vendor Scorecard (Quarterly Review)\r
\r
| Category | Metric | Weight | Target | Score (1–5) | Weighted Score |\r
|---|---|---|---|---|---|\r
| Quality | Defect / error rate | 25% | <1% | | |\r
| Delivery | On-time delivery rate | 25% | >98% | | |\r
| Responsiveness | Avg response time to issues | 20% | <4 hours | | |\r
| Cost | Cost vs. contract; cost trend | 15% | ≤budget | | |\r
| Relationship | Communication; proactivity | 15% | Meets expectations | | |\r
| **Total** | | 100% | | | |\r
\r
**Score Interpretation**:\r
- 4.0–5.0: Strategic partner; consider preferred status\r
- 3.0–3.9: Satisfactory; monitor closely\r
- 2.0–2.9: Development plan required; 90-day improvement plan\r
- <2.0: Immediate escalation; contingency sourcing activated\r
\r
### SLA Governance Cycle\r
1. **Define**: SLAs agreed in contract with clear measurement methodology\r
2. **Monitor**: Real-time or periodic tracking against SLA thresholds\r
3. **Report**: Monthly scorecard shared with vendor\r
4. **Review**: Quarterly business review (QBR) with vendor leadership\r
5. **Remediate**: Formal corrective action plan for breaches >2 consecutive periods\r
6. **Incentivize**: Service credits for breaches; bonus terms for sustained excellence\r
\r
