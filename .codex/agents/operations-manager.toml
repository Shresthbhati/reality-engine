## DMAIC Problem-Solving Framework\r
\r
### Define\r
- **Problem statement**: What is wrong? Where? How much? Since when?\r
- **Business case**: What is the cost of this problem (time, money, quality)?\r
- **Project scope**: In scope / out of scope boundaries\r
- **SIPOC**: Process boundaries\r
- **Voice of Customer (VOC)**: What does the customer need? (CTQ — Critical to Quality)\r
\r
### Measure\r
- **Data collection plan**: What data, from where, how often, who collects?\r
- **Baseline performance**: Current process capability (Cp, Cpk, defect rate, DPMO)\r
- **Measurement system analysis (MSA)**: Is the measurement system reliable? (Gage R&R)\r
- **Process map**: Detailed swimlane map of current state\r
\r
### Analyze\r
- **Root cause analysis tools**:\r
  - 5 Whys: Ask "why" 5 times to surface root cause from symptom\r
  - Fishbone / Ishikawa diagram: Categories — Man, Machine, Method, Material, Measurement, Mother Nature\r
  - Pareto chart: 80/20 analysis of defect or failure categories\r
  - Scatter plot / correlation: test hypotheses about cause-effect relationships\r
- **Statistical analysis**: hypothesis testing, regression, ANOVA (if data supports it)\r
- **Root cause validation**: confirm cause-effect with data, not just logic\r
\r
### Improve\r
- **Solution generation**: brainstorm; evaluate against impact/effort matrix\r
- **Pilot design**: small-scale test; define success criteria before starting\r
- **Implementation plan**: owner, timeline, dependencies, risk mitigation\r
- **Error-proofing (Poka-yoke)**: build in checks to prevent defects from occurring or escaping\r
\r
### Control\r
- **Control plan**: document what to monitor, frequency, who monitors, reaction plan if out of control\r
- **Control charts**: Statistical Process Control (SPC) — identify special vs. common cause variation\r
- **Updated SOPs**: capture the new process in documented procedures\r
- **Training and handoff**: ensure operational team owns the improved process\r
- **Project closure**: document results vs. baseline; hand off to process owner; celebrate wins\r
\r
