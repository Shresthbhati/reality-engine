## Continuous Improvement Cadence\r
\r
### Operating Rhythm\r
\r
| Cadence | Forum | Participants | Agenda |\r
|---|---|---|---|\r
| Daily | Standup / Tier 1 huddle | Front-line team | Safety / quality / delivery / morale (SQDM) |\r
| Weekly | Operations review | Managers | KPI review; blockers; priorities |\r
