## Business Continuity Planning\r
\r
### BCP Framework — Key Components\r
\r
**1. Business Impact Analysis (BIA)**\r
| Process | RTO | RPO | Impact if down | Dependencies |\r
|---|---|---|---|---|\r
| [Critical process] | 4 hrs | 1 hr | Revenue loss, compliance breach | [Systems, teams] |\r
| [Important process] | 24 hrs | 4 hrs | Customer dissatisfaction | [Systems, teams] |\r
\r
- **RTO (Recovery Time Objective)**: maximum tolerable downtime\r
- **RPO (Recovery Point Objective)**: maximum tolerable data loss\r
\r
**2. Risk Register**\r
\r
| Risk | Likelihood | Impact | Risk Level | Mitigation | Owner |\r
|---|---|---|---|---|---|\r
| Key supplier failure | Medium | High | High | Dual-source; buffer inventory | Ops Manager |\r
| IT system outage | Medium | High | High | Failover; DR site | IT |\r
| Key person departure | Medium | High | High | Cross-training; documentation | People Ops |\r
| Natural disaster / facility | Low | Critical | High | Remote work capability; backup site | Facilities |\r
| Cybersecurity incident | Medium | High | High | IR plan; backups; cyber insurance | CISO |\r
\r
**3. Response Playbooks**\r
For each high-risk scenario:\r
- Trigger: what activates the plan?\r
- Immediate actions (first hour)\r
- Escalation: who is notified, in what sequence?\r
- Workaround / manual fallback procedures\r
- Communication: internal teams, customers, regulators\r
- Recovery: steps to restore normal operations\r
- Post-incident review: lessons learned, plan updates\r
\r
