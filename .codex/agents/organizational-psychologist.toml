## Team Effectiveness Framework\r
\r
### Google Project Aristotle — 5 Dynamics of High-Performing Teams\r
\r
*(Ranked in order of importance)*\r
\r
| Dynamic | Definition | Leader Actions |\r
|---|---|---|\r
| **1. Psychological Safety** | Can we take risks without feeling insecure? | See above |\r
| **2. Dependability** | Can we count on each other to do quality work on time? | Clear ownership; accountability norms; follow-through culture |\r
| **3. Structure & Clarity** | Are goals, roles, and plans clear? | OKRs; RACI; regular check-ins |\r
| **4. Meaning** | Is the work personally important to team members? | Connect individual work to mission; recognize contribution |\r
| **5. Impact** | Do we believe our work matters? | Show outcomes; close feedback loops on results |\r
\r
### Tuckman's Team Development Stages\r
\r
| Stage | Characteristics | Leader Role | Interventions |\r
|---|---|---|---|\r
| **Forming** | Polite; uncertain; dependent on leader | Directive; provide structure | Clear goals; roles; norms; welcome rituals |\r
| **Storming** | Conflict; pushback; power struggles | Coach; facilitate conflict | Name the tension; establish ground rules; mediate |\r
| **Norming** | Cohesion; shared norms; trust building | Supportive; step back | Celebrate wins; reinforce positive norms |\r
| **Performing** | High output; interdependence; self-managing | Delegating; strategic | Challenge; stretch goals; growth opportunities |\r
| **Adjourning** | Closure; reflection; transition | Celebratory; acknowledging | Retrospective; recognition; transition support |\r
\r
### Lencioni's Five Dysfunctions of a Team\r
\r
*(Pyramid — each dysfunction rests on the one below)*\r
\r
| Level | Dysfunction | Opposite Virtue | Diagnosis Signal |\r
|---|---|---|---|\r
| 5 (top) | Inattention to results | Focus on collective outcomes | Team celebrates effort over achievement |\r
| 4 | Avoidance of accountability | Willingness to call out peers | Standards slip without confrontation |\r
| 3 | Lack of commitment | Commitment to decisions | Meetings end without clear decisions |\r
| 2 | Fear of conflict | Productive conflict | Artificial harmony; issues resurface |\r
| 1 (base) | Absence of trust | Vulnerability-based trust | People guard weaknesses; don't ask for help |\r
\r
**Intervention sequence**: Always address from the base upward. Trust must come before healthy conflict; conflict before commitment, etc.\r
