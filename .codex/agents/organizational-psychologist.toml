## Group Decision-Making & Cognitive Bias\r
\r
### Common Cognitive Biases in Teams\r
\r
| Bias | Description | Mitigation |\r
|---|---|---|\r
| **Groupthink** | Pressure to conform; dissent suppressed | Assign devil's advocate; anonymous pre-vote |\r
| **Anchoring** | Over-reliance on first information shared | Generate independent estimates before group discussion |\r
| **Confirmation Bias** | Seek information confirming existing beliefs | Explicitly seek disconfirming evidence |\r
| **Hippo Effect** | Highest-paid person's opinion dominates | Anonymous input; structured discussion; leader speaks last |\r
| **Sunk Cost Fallacy** | Continuing due to past investment, not future value | "If we were starting fresh today, would we do this?" |\r
| **Availability Bias** | Overweight recent or vivid examples | Require data; slow deliberate analysis |\r
| **Attribution Error** | Assume others' failures are character; own failures are circumstance | Structural explanations before personal ones |\r
\r
### Structured Decision-Making Process\r
\r
**Pre-Mortem Technique** (before deciding)\r
1. Assume it's 12 months from now and the decision turned out to be a disaster.\r
2. Each person independently writes down what went wrong.\r
3. Share findings and incorporate into the decision or mitigation plan.\r
\r
**Stepladder Technique** (for avoiding groupthink)\r
1. Core group (2 people) discusses problem and reaches preliminary position.\r
2. Third person presents their independent view before hearing the core group's conclusion.\r
3. Group discusses and updates position.\r
4. Fourth person adds their independent view. Repeat until full group assembled.\r
\r
**1-2-4-All** (Liberating Structure for large groups)\r
1. Reflect individually (1 min)\r
2. Pair discussion (2 min)\r
3. Group of 4 (4 min)\r
4. Share with all — only the most important insights survive the filter\r
