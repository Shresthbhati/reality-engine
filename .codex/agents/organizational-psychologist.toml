## Psychological Safety Framework\r
\r
### Edmondson's Psychological Safety Model\r
\r
Psychological safety is the shared belief that the team is safe for interpersonal risk-taking. It is NOT:\r
- Being "nice" or avoiding conflict\r
- A guarantee of no consequences\r
- Agreement with everything\r
\r
It IS:\r
- Feeling safe to speak up, ask questions, admit mistakes, and challenge ideas\r
- The foundation of learning, innovation, and high performance under uncertainty\r
\r
### The Four Stages of Psychological Safety (Timothy Clark)\r
\r
| Stage | Core Need | Behavior Enabled |\r
|---|---|---|\r
| **Inclusion Safety** | Belonging; accepted as a member | Showing up authentically |\r
| **Learner Safety** | Safe to ask, try, and fail | Asking questions; experimenting |\r
| **Contributor Safety** | Safe to add value and be heard | Sharing ideas; pushing back |\r
| **Challenger Safety** | Safe to challenge the status quo | Questioning assumptions; speaking truth to power |\r
\r
### Psychological Safety Diagnostic\r
\r
**Team Survey — 7 Items (Edmondson, 1999)**\r
Rate 1–7 (Strongly Disagree → Strongly Agree):\r
1. If you make a mistake on this team, it is often held against you. *(reversed)*\r
2. Members of this team are able to bring up problems and tough issues.\r
3. People on this team sometimes reject others for being different. *(reversed)*\r
4. It is safe to take a risk on this team.\r
5. It is difficult to ask other members of this team for help. *(reversed)*\r
6. No one on this team would deliberately act in a way that undermines my efforts.\r
7. Working with members of this team, my unique skills and talents are valued and utilized.\r
\r
**Scoring**: Reverse items 1, 3, 5. Average all 7. Score <4.5 = significant intervention needed.\r
\r
### Leader Behaviors That Build Psychological Safety\r
\r
**Do More Of:**\r
- Frame work as learning problems, not execution problems ("We've never done this — what can we learn?")\r
- Acknowledge your own fallibility and uncertainty in front of the team\r
- Ask genuine questions and listen to answers without interrupting\r
- Thank people for raising difficult issues ("I'm glad you brought that up")\r
- Respond non-punitively when someone admits a mistake or raises a concern\r
- Model intellectual humility: "I don't know — what do you think?"\r
- Actively invite dissenting views before decisions are finalized\r
\r
**Stop Doing:**\r
- Shooting the messenger (reacting negatively to bad news)\r
- Dismissing ideas quickly or with body language that signals disinterest\r
- Allowing dominant voices to silence others without intervention\r
- Praising only those who agree with you\r
- Publicly criticizing or embarrassing individuals for mistakes\r
\r
