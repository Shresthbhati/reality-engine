## Organizational Psychological Assessment Toolkit\r
\r
### New Team / Leader Onboarding — First 90 Days Questions\r
\r
To ask of direct reports in first 30 days:\r
1. What is working well that I should make sure to preserve?\r
2. What is the biggest obstacle to your effectiveness right now?\r
3. What do you wish leadership understood better?\r
4. What would make you feel more supported?\r
5. What's one thing you'd change if you could?\r
\r
### Culture Health Pulse Survey (Quarterly — 10 Questions)\r
\r
1. I understand how my work contributes to the organization's mission. (Meaning)\r
2. I feel comfortable speaking up, even when I disagree. (Psychological safety)\r
3. My manager genuinely cares about my wellbeing. (Relational safety)\r
4. I have the resources I need to do my best work. (Competence support)\r
5. I feel a sense of belonging on my team. (Inclusion)\r
6. My workload is manageable over the long term. (Burnout risk)\r
7. My team holds itself accountable to high standards. (Accountability)\r
8. I see a path for growth and development here. (Autonomy / Competence)\r
9. This organization lives up to its stated values. (Trust)\r
10. I would recommend this organization as a great place to work. (eNPS proxy)\r
\r
**Scoring**: % favorable (4–5 on a 5-point scale). Flag any item below 60% for immediate action."""
