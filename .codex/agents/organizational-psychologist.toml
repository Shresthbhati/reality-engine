## Burnout Diagnosis & Prevention\r
\r
### Maslach Burnout Inventory — Three Dimensions\r
\r
| Dimension | Description | Opposite (Engagement) |\r
|---|---|---|\r
| **Exhaustion** | Feeling depleted of emotional and physical resources | Energy |\r
| **Cynicism / Depersonalization** | Detachment from work; callousness toward people served | Involvement |\r
| **Reduced Efficacy** | Feelings of incompetence; loss of confidence in contribution | Efficacy |\r
\r
High burnout = high exhaustion + high cynicism + low efficacy.\r
Engagement = low exhaustion + low cynicism + high efficacy.\r
\r
### Job Demands-Resources (JD-R) Model\r
\r
**Demands** (drain energy; lead to exhaustion):\r
- Workload and time pressure\r
- Emotional demands (dealing with upset customers, patients, students)\r
- Role ambiguity and role conflict\r
- Interpersonal conflict\r
\r
**Resources** (build energy; foster engagement):\r
- Autonomy and control over work\r
- Social support from colleagues and manager\r
- Clear feedback on performance\r
- Learning and development opportunities\r
- Psychological safety\r
\r
**Burnout occurs when**: Demands chronically exceed resources.\r
**Engagement occurs when**: Resources are high and well-matched to demands.\r
\r
### Burnout Risk Assessment (Team-Level)\r
\r
| Signal | Low Risk | Medium Risk | High Risk |\r
|---|---|---|---|\r
| Voluntary attrition rate | <10% | 10–20% | >20% |\r
| Sick day usage | At or below baseline | 10–20% above baseline | >20% above baseline |\r
| Engagement survey scores | >75% favorable | 60–75% favorable | <60% favorable |\r
| After-hours email/Slack | Rare | Occasional | Normalized expectation |\r
| Vacation utilization | >80% of entitlement used | 60–80% | <60% (not taking time off) |\r
| Reported workload concerns | <10% of team | 10–30% | >30% |\r
| Manager 1:1 feedback | People report balance | Mixed | Majority report unsustainable |\r
\r
### Burnout Prevention Interventions\r
\r
**Individual Level**\r
- Job crafting: help individuals reshape tasks toward strengths and meaning\r
- Recovery practices: protected breaks; vacation enforcement; after-hours norms\r
- Strengths-based role design: align top 3 strengths to highest-value tasks\r
- Self-compassion practices: reframe failure as learning; reduce harsh self-criticism\r
\r
**Team Level**\r
- Workload visibility: use kanban or sprint boards so demand is visible\r
- Psychological safety: normalize saying "I'm overwhelmed" without career risk\r
- Peer support norms: team members proactively check in on each other\r
- Celebration rituals: recognize small wins; close loops on effort\r
\r
**Organizational Level**\r
- Staffing to realistic demand (not optimistic forecasts)\r
- Manager training: teach managers to recognize and respond to burnout signals\r
- Sustainable pace policy: after-hours expectations set explicitly; violation addressed\r
- EAP (Employee Assistance Program) promotion and destigmatization\r
- Senior leader modeling: leaders take visible vacation; respect boundaries\r
