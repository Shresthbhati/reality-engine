## Organizational Culture Assessment\r
\r
### Competing Values Framework (Quinn & Rohrbaugh)\r
\r
Four culture types defined by two axes:\r
- **Internal vs. External** focus\r
- **Stability vs. Flexibility** orientation\r
\r
| Quadrant | Culture Type | Emphasis | Strength | Shadow Side |\r
|---|---|---|---|---|\r
| Internal + Stability | **Hierarchy** | Control; process; efficiency | Consistency; reliability | Rigidity; innovation aversion |\r
| Internal + Flexibility | **Clan** | Collaboration; people; cohesion | Belonging; loyalty | Groupthink; conflict avoidance |\r
| External + Flexibility | **Adhocracy** | Innovation; agility; entrepreneurship | Creativity; speed | Chaos; burnout |\r
| External + Stability | **Market** | Competition; results; customer | Performance; accountability | Ruthlessness; short-termism |\r
\r
Most organizations have a dominant type and a secondary type. Culture conflicts often arise from two types pulling in opposite directions (e.g., Hierarchy vs. Adhocracy).\r
\r
### Culture Assessment Protocol\r
\r
**Step 1 — Artifact Analysis**\r
Observe: office layout, communication style, meeting norms, how decisions are made, how failure is treated, who gets promoted and why.\r
\r
**Step 2 — Espoused Values**\r
Review: stated values, company website, leadership communications, onboarding materials.\r
\r
**Step 3 — Assumptions (Edgar Schein)**\r
Uncover: what beliefs are taken for granted that drive behavior? (These are invisible until violated.)\r
Interview questions:\r
- "Tell me about a time someone was celebrated here. What did they do?"\r
- "Tell me about a time someone got in trouble. What had they done?"\r
- "How are decisions really made here?"\r
- "What happens when someone makes a mistake?"\r
- "What does it take to get ahead?"\r
\r
**Step 4 — Culture Gap Analysis**\r
Compare current culture to desired culture. Identify the 2–3 most critical cultural shifts required to enable strategy.\r
\r
**Step 5 — Culture Change Plan**\r
| Culture Lever | Current State | Target State | Intervention |\r
|---|---|---|---|\r
| Rituals | [What we celebrate/mourn] | [What we want to celebrate/mourn] | [New rituals] |\r
| Symbols | [Visible signals of culture] | [Desired signals] | [Changes] |\r
| Stories | [Founding myths; heroes] | [Stories that reinforce target culture] | [New stories to tell] |\r
| Systems | [How people are hired/promoted/rewarded] | [Aligned to target culture] | [System changes] |\r
| Behaviors | [What leaders do day-to-day] | [Leader behaviors that signal new culture] | [Leadership modeling] |\r
\r
Culture changes slowly. Expect 2–5 years for deep cultural transformation.\r
