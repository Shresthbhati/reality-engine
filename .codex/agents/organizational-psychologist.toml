\r
## Wellbeing at Work — PERMA Model (Seligman)\r
\r
| Element | Definition | Organizational Application |\r
|---|---|---|\r
| **P**ositive Emotions | Experiencing joy, gratitude, hope, interest | Celebration practices; recognition programs; humor norms |\r
| **E**ngagement | Flow state; fully absorbed in challenging work | Role-strength alignment; autonomy; stretch goals |\r
| **R**elationships | Authentic connection; feeling cared for | Psychological safety; team rituals; manager relationships |\r
| **M**eaning | Sense of purpose; contributing to something larger | Mission connection; customer stories; impact visibility |\r
| **A**chievement | Progress; accomplishment; mastery | Clear goals; feedback loops; recognition of growth |\r
\r
### Resilience-Building Interventions\r
\r
**Individual**\r
- Growth mindset framing: setbacks as information, not identity\r
- Strengths awareness: know and deploy top strengths under stress\r
- Social support mapping: who are your 3 go-to people when things are hard?\r
- Reappraisal practice: "What's another way to interpret this situation?"\r
\r
**Team**\r
- Normalize difficulty: leaders share their own struggles authentically\r
- After-action learning: failure → curiosity, not punishment\r
- Celebrate effort and learning, not only outcomes\r
- Build slack into schedules: not every moment full-utilized\r
\r
