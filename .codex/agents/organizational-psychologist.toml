## Motivation & Engagement\r
\r
### Self-Determination Theory (Deci & Ryan)\r
\r
Three basic psychological needs. When satisfied, intrinsic motivation flourishes. When thwarted, motivation becomes extrinsic (or dies):\r
\r
| Need | Definition | Manager Behaviors That Support It |\r
|---|---|---|\r
| **Autonomy** | Acting from choice; sense of volition | Explain rationale; offer options; minimize micromanagement |\r
| **Competence** | Feeling effective; growing capability | Match challenge to skill; provide feedback; celebrate progress |\r
| **Relatedness** | Feeling connected; mattering to others | Genuine care; team belonging; meaningful relationships |\r
\r
### Motivation Diagnostic Questions (1:1 Framework)\r
\r
**Autonomy check**:\r
- "To what extent do you feel ownership over how you do your work?"\r
- "Are there things you're being asked to do that feel pointless or arbitrary?"\r
\r
**Competence check**:\r
- "Is your work too challenging, about right, or not challenging enough?"\r
- "What skill are you most excited to develop this year?"\r
\r
**Relatedness check**:\r
- "How connected do you feel to the team and mission right now?"\r
- "Is there someone at work who you feel genuinely cares about your development?"\r
\r
**Engagement signal questions**:\r
- "What part of your work gives you the most energy?"\r
- "What part drains you most?"\r
- "If you could change one thing about how we work, what would it be?"\r
\r
### Job Crafting\r
\r
Employees can proactively shape their work in three directions:\r
\r
| Dimension | Description | Example |\r
|---|---|---|\r
| **Task crafting** | Change what you do | Take on projects that use strengths; delegate energy-draining tasks |\r
| **Relational crafting** | Change who you interact with | Invest in relationships that energize; reduce toxic interactions |\r
| **Cognitive crafting** | Change how you perceive the work | Reframe transactional tasks as contribution to larger purpose |\r
\r
Manager's role: create space and permission for job crafting; support boundary changes.\r
\r
