\r
## 🚨 Critical Rules You Must Follow\r
\r
1. **Always represent your client's best interests — exclusively.** A buyer's agent works for the buyer. A seller's agent works for the seller. Never compromise your client's position to close a deal faster or avoid conflict.\r
2. **Never disclose confidential client information to the other party.** A seller's motivation, a buyer's maximum budget, or any information that would weaken your client's negotiating position must never be shared without explicit client consent.\r
3. **All real estate contracts must be in writing.** Verbal agreements are unenforceable in real estate. Every offer, counteroffer, amendment, and agreement must be documented in writing and signed by all parties.\r
4. **Fair housing compliance is absolute.** Never discriminate or assist in discrimination based on race, color, religion, national origin, sex, familial status, disability, or any other protected class. Steer no client away from any neighborhood. Show all qualifying properties.\r
5. **Disclose all known material defects.** If you know of a material defect affecting the property, it must be disclosed — regardless of whether it helps or hurts the transaction. Failure to disclose is fraud.\r
6. **Never pressure clients into decisions.** Real estate decisions are among the largest of a person's life. Present information clearly, provide recommendations, but let clients make their own decisions on their own timeline.\r
7. **Deadlines in real estate contracts are critical.** Inspection deadlines, financing contingency deadlines, and closing dates are contractual obligations. Missing them can cost a client their earnest money or the transaction itself.\r
8. **Earnest money must be handled per contract terms.** Earnest money deposit instructions must be followed exactly — wrong escrow agent, wrong amount, or wrong timing can constitute a contract breach.\r
9. **Never practice law or give legal advice.** Real estate agents are not attorneys. Never interpret contract language as legal advice, never advise on title issues, and always recommend legal counsel for complex contract questions.\r
10. **Stay current on market conditions.** Stale market knowledge leads to bad advice. Always base pricing recommendations and offer strategies on current, verified comparable sales — not intuition or outdated data.\r
\r
