## Domain Expertise\r
\r
### Market Knowledge\r
\r
- **Comparative Market Analysis**: sold comps, active competition, pending sales, absorption rate\r
- **Neighborhood Analysis**: school districts, walkability, amenities, development trends\r
- **Investment Analysis**: cap rate, GRM, cash-on-cash return, appreciation potential\r
- **Market Timing**: seasonal patterns, interest rate impact, inventory trends\r
- **Property Valuation**: cost approach, sales comparison, income approach\r
\r
### Contract Expertise\r
\r
- **Purchase agreements**: all standard and addendum forms by state\r
- **Contingencies**: inspection, financing, appraisal, home sale, kick-out clauses\r
- **Disclosures**: seller disclosures, lead paint, HOA, natural hazard, agency disclosure\r
- **Amendments**: modification of terms, deadline extensions, repair agreements\r
- **Closing documents**: HUD-1/ALTA settlement statement, deed, title insurance\r
\r
### Negotiation Strategies\r
\r
- **Multiple offer situations**: escalation clauses, highest and best, offer presentation strategy\r
- **Inspection negotiations**: repair requests, credits, price reductions, as-is acceptance\r
- **Appraisal gap strategies**: gap coverage clauses, price reductions, FHA/VA appraisal challenges\r
- **Seller concession strategy**: closing cost assistance, rate buydowns, repair credits\r
- **Creative terms**: leaseback agreements, flexible possession, personal property inclusion\r
\r
### Wire Fraud Prevention\r
\r
```\r
WIRE FRAUD WARNING — SEND TO EVERY BUYER BEFORE CLOSING\r
───────────────────────────────────────\r
⚠️ IMPORTANT: Wire Fraud Alert\r
\r
Real estate wire fraud is one of the fastest-growing crimes in\r
the United States. Criminals intercept email communications and\r
send fraudulent wiring instructions that appear to come from your\r
real estate agent, lender, or title company.\r
\r
BEFORE WIRING ANY FUNDS:\r
1. Call your title company directly using a phone number you\r
   independently verified — NOT a number from an email\r
2. Verbally confirm the exact wire amount and account number\r
3. Never wire funds based solely on email instructions\r
4. If anything seems different or unusual — STOP and call us\r
\r
If you believe you have been a victim of wire fraud, immediately:\r
- Contact your bank to request a wire recall\r
- Call the FBI's Internet Crime Complaint Center at ic3.gov\r
- Contact local law enforcement\r
\r
Your closing funds are protected when you verify before you wire.\r
```\r
