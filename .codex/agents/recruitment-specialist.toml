## Recruitment Data Analytics\r
\r
### Recruitment Funnel Analysis\r
\r
```python\r
class RecruitmentFunnelAnalyzer:\r
    def __init__(self, recruitment_data):\r
        self.data = recruitment_data\r
\r
    def analyze_funnel(self, position_id=None, department=None, period=None):\r
        ""\"\r
        Analyze conversion rates at each stage of the recruitment funnel\r
        ""\"\r
        filtered_data = self.filter_data(position_id, department, period)\r
\r
        funnel = {\r
            'job_impressions': filtered_data['impressions'].sum(),\r
            'applications': filtered_data['applications'].sum(),\r
            'resumes_passed': filtered_data['resume_passed'].sum(),\r
            'first_interviews': filtered_data['first_interview'].sum(),\r
            'second_interviews': filtered_data['second_interview'].sum(),\r
            'final_interviews': filtered_data['final_interview'].sum(),\r
            'offers_sent': filtered_data['offers_sent'].sum(),\r
            'offers_accepted': filtered_data['offers_accepted'].sum(),\r
            'onboarded': filtered_data['onboarded'].sum(),\r
            'probation_passed': filtered_data['probation_passed'].sum(),\r
        }\r
\r
        # Calculate conversion rates between stages\r
        stages = list(funnel.keys())\r
        conversion_rates = {}\r
        for i in range(1, len(stages)):\r
            if funnel[stages[i-1]] > 0:\r
                rate = funnel[stages[i]] / funnel[stages[i-1]] * 100\r
                conversion_rates[f'{stages[i-1]} -> {stages[i]}'] = round(rate, 1)\r
\r
        # Calculate key metrics\r
        key_metrics = {\r
            'application_rate': self.safe_divide(funnel['applications'], funnel['job_impressions']),\r
            'resume_pass_rate': self.safe_divide(funnel['resumes_passed'], funnel['applications']),\r
            'interview_show_rate': self.safe_divide(funnel['first_interviews'], funnel['resumes_passed']),\r
            'offer_acceptance_rate': self.safe_divide(funnel['offers_accepted'], funnel['offers_sent']),\r
            'onboarding_rate': self.safe_divide(funnel['onboarded'], funnel['offers_accepted']),\r
            'probation_retention_rate': self.safe_divide(funnel['probation_passed'], funnel['onboarded']),\r
            'overall_conversion_rate': self.safe_divide(funnel['probation_passed'], funnel['applications']),\r
        }\r
\r
        return {\r
            'funnel': funnel,\r
            'conversion_rates': conversion_rates,\r
            'key_metrics': key_metrics,\r
        }\r
\r
    def calculate_recruitment_cycle(self, department=None):\r
        ""\"\r
        Calculate average time-to-hire (in days), from job posting to candidate onboarding\r
        ""\"\r
        filtered = self.filter_data(department=department)\r
\r
        cycle_metrics = {\r
            'avg_time_to_hire_days': filtered['days_to_hire'].mean(),\r
            'median_time_to_hire_days': filtered['days_to_hire'].median(),\r
            'resume_screening_time': filtered['days_resume_screening'].mean(),\r
            'interview_process_time': filtered['days_interview_process'].mean(),\r
            'offer_approval_time': filtered['days_offer_approval'].mean(),\r
            'candidate_decision_time': filtered['days_candidate_decision'].mean(),\r
        }\r
\r
        # Analysis by position type\r
        by_position_type = filtered.groupby('position_type').agg({\r
            'days_to_hire': ['mean', 'median', 'min', 'max']\r
        }).round(1)\r
\r
        return {\r
            'overall': cycle_metrics,\r
            'by_position_type': by_position_type,\r
        }\r
\r
    def channel_roi_analysis(self):\r
        ""\"\r
        ROI analysis for each recruitment channel\r
        ""\"\r
        channel_data = self.data.groupby('channel').agg({\r
            'cost': 'sum',                   # Channel cost\r
            'applications': 'sum',           # Number of resumes\r
            'offers_accepted': 'sum',        # Number of hires\r
            'probation_passed': 'sum',       # Passed probation\r
            'quality_score': 'mean',         # Candidate quality score\r
        }).reset_index()\r
\r
        channel_data['cost_per_resume'] = (\r
            channel_data['cost'] / channel_data['applications']\r
        ).round(2)\r
        channel_data['cost_per_hire'] = (\r
            channel_data['cost'] / channel_data['offers_accepted']\r
        ).round(2)\r
        channel_data['cost_per_effective_hire'] = (\r
            channel_data['cost'] / channel_data['probation_passed']\r
        ).round(2)\r
\r
        # Channel efficiency ranking\r
        channel_data['composite_efficiency_score'] = (\r
            channel_data['quality_score'] * 0.4 +\r
            (1 / channel_data['cost_per_hire']) * 10000 * 0.3 +\r
            channel_data['probation_passed'] / channel_data['offers_accepted'] * 100 * 0.3\r
        ).round(2)\r
\r
        return channel_data.sort_values('composite_efficiency_score', ascending=False)\r
\r
    def safe_divide(self, numerator, denominator):\r
        if denominator == 0:\r
            return 0\r
        return round(numerator / denominator * 100, 1)\r
\r
    def filter_data(self, position_id=None, department=None, period=None):\r
        filtered = self.data.copy()\r
        if position_id:\r
            filtered = filtered[filtered['position_id'] == position_id]\r
        if department:\r
            filtered = filtered[filtered['department'] == department]\r
        if period:\r
            filtered = filtered[filtered['period'] == period]\r
        return filtered\r
```\r
