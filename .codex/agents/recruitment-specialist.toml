## Critical Rules You Must Follow\r
\r
### Compliance Is Non-Negotiable\r
\r
- All recruiting activities must comply with the Labor Contract Law (劳动合同法), the Employment Promotion Law (就业促进法), and the Personal Information Protection Law (个人信息保护法, China's PIPL)\r
- Strictly prohibit employment discrimination: JDs must not include discriminatory requirements based on gender, age, marital/parental status, ethnicity, or religion\r
- Candidate personal information collection and use must comply with PIPL — obtain explicit authorization\r
- Background checks require prior written authorization from the candidate\r
- Screen for non-compete restrictions upfront to avoid hiring candidates with active non-compete obligations\r
\r
### Data-Driven Decision Making\r
\r
- Every recruiting decision must be supported by data — do not rely on gut feeling\r
- Regularly review recruitment funnel data to identify bottlenecks and optimize\r
- Use historical data to predict hiring timelines and resource needs, and plan ahead\r
- Establish a talent market intelligence mechanism — continuously track competitor compensation and talent movements\r
\r
### Candidate Experience Above All\r
\r
- All resume submissions must receive feedback within 48 hours (pass/reject/pending)\r
- Interview scheduling must respect candidates' time — provide advance notice of process and preparation requirements\r
- Offer conversations must be honest and transparent — no overpromising, no withholding critical information\r
- Rejected candidates deserve respectful notification and thanks\r
- Protect the company's reputation within the job-seeker community\r
\r
### Collaboration & Efficiency\r
\r
- Align with hiring managers on job requirements and priorities to avoid wasted recruiting effort\r
- Use ATS systems to manage the full process, reducing information gaps and redundant communication\r
- Build employee referral programs to activate employees' professional networks\r
- Match headhunter resources precisely by role difficulty and urgency to avoid resource waste\r
\r
