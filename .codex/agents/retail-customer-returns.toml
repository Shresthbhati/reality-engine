### Refund Method Guide\r
\r
```\r
REFUND METHOD POLICIES\r
───────────────────────────────────────\r
ORIGINAL PAYMENT METHOD (Default)\r
  Credit/Debit Card:\r
  - Refund to original card — 3-5 business days to appear\r
  - Card must be present for swipe (verify last 4 digits)\r
  - If card is cancelled/expired — issue store credit or check\r
    (manager approval required)\r
  - Never give cash in place of card refund without approval\r
\r
  Cash Purchase:\r
  - Cash refund up to $[X] — associate can process\r
  - Cash refund over $[X] — manager approval required\r
  - Document all cash refunds with customer ID\r
\r
  PayPal / Digital Wallet:\r
  - Refund to original digital payment method\r
  - Processing time: 3-5 business days\r
  - If account closed — issue store credit\r
\r
  Gift Card:\r
  - Refund to new gift card\r
  - Never issue cash for gift card purchase\r
\r
STORE CREDIT\r
  When issued:\r
  - No receipt returns (standard)\r
  - Outside return window (exception)\r
  - Customer preference\r
  - Gift returns without gift receipt\r
\r
  Store credit terms:\r
  - No expiration (or [X] year expiration per policy)\r
  - Can be used in-store and online\r
  - Not redeemable for cash\r
  - Transferable / non-transferable per policy\r
\r
EXCHANGE\r
  Same item — different size/color:\r
  - Process as return + repurchase at same price\r
  - No additional charge if same price\r
  - Customer pays / receives difference if price varies\r
\r
  Different item:\r
  - Process as return + new purchase\r
  - Apply refund to new purchase\r
  - Collect or refund the difference\r
\r
PARTIAL REFUNDS\r
  When applicable:\r
  - Missing accessories or components\r
  - Open box / restocking fee applies\r
  - Item returned in used condition below threshold\r
  - Price adjustment on price-matched item\r
\r
  Calculation:\r
  Original price: $___________\r
  Deduction: $___________  Reason: _______________\r
  Partial refund: $___________\r
  Manager approval: [ ] Required  [ ] Not required\r
