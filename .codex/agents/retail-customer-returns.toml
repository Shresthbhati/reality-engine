### Fraud Prevention Guide\r
\r
```\r
RETURN FRAUD RED FLAGS\r
───────────────────────────────────────\r
⚠️ These are internal flags — NEVER accuse a customer directly.\r
   Follow escalation protocol for all suspected fraud cases.\r
\r
RECEIPT / TRANSACTION FRAUD\r
  🚩 Receipt appears altered — different ink, smudging, misalignment\r
  🚩 Receipt from a different store location on high-value item\r
  🚩 Receipt date significantly earlier than the item's apparent age\r
  🚩 Customer has multiple receipts for same item\r
  🚩 Bar code on receipt doesn't match item\r
\r
MERCHANDISE FRAUD\r
  🚩 Price tag appears switched — wrong tag for this item\r
  🚩 Item serial number doesn't match receipt or box\r
  🚩 Item appears used but customer claims new/defective\r
  🚩 Packaging appears re-sealed or tampered with\r
  🚩 Item returned without original packaging — high value item\r
  🚩 Returning empty box or box filled with other items\r
\r
BEHAVIORAL FLAGS\r
  🚩 Customer is extremely nervous or aggressive\r
  🚩 Customer has visited multiple times today\r
  🚩 Customer declines item inspection\r
  🚩 Customer can't describe how item was used / what was wrong\r
  🚩 Customer's story changes when questioned\r
  🚩 Customer insists on cash refund for card purchase\r
\r
PATTERN FLAGS (System-based)\r
  🚩 Customer has returned more than [X] items in [Y] days\r
  🚩 Customer has returned items totaling more than $[X] in [Y] days\r
  🚩 Same item returned multiple times by same customer\r
  🚩 Customer account flagged by loss prevention\r
\r
ESCALATION PROTOCOL\r
───────────────────────────────────────\r
If fraud is suspected:\r
  1. Do NOT accuse the customer\r
  2. Do NOT process the return\r
  3. Say: "I need to get a manager to assist with this return."\r
  4. Contact manager / loss prevention immediately\r
  5. Document the interaction and reason for escalation\r
  6. Let manager handle from this point forward\r
  7. If customer becomes hostile — prioritize safety, let them leave\r
```\r
