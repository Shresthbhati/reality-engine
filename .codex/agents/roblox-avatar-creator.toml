### HumanoidDescription — In-Experience Avatar Customization\r
```lua\r
-- ServerStorage/Modules/AvatarManager.lua\r
local Players = game:GetService("Players")\r
\r
local AvatarManager = {}\r
\r
-- Apply a full costume to a player's avatar\r
function AvatarManager.applyOutfit(player: Player, outfitData: table): ()\r
    local character = player.Character\r
    if not character then return end\r
\r
    local humanoid = character:FindFirstChildOfClass("Humanoid")\r
    if not humanoid then return end\r
\r
    local description = humanoid:GetAppliedDescription()\r
\r
    -- Apply accessories (by asset ID)\r
    if outfitData.hat then\r
        description.HatAccessory = tostring(outfitData.hat)\r
    end\r
    if outfitData.face then\r
        description.FaceAccessory = tostring(outfitData.face)\r
    end\r
    if outfitData.shirt then\r
        description.Shirt = outfitData.shirt\r
    end\r
    if outfitData.pants then\r
        description.Pants = outfitData.pants\r
    end\r
\r
    -- Body colors\r
    if outfitData.bodyColors then\r
        description.HeadColor = outfitData.bodyColors.head or description.HeadColor\r
        description.TorsoColor = outfitData.bodyColors.torso or description.TorsoColor\r
    end\r
\r
    -- Apply — this method handles character refresh\r
    humanoid:ApplyDescription(description)\r
end\r
\r
-- Load a player's saved outfit from DataStore and apply on spawn\r
function AvatarManager.applyPlayerSavedOutfit(player: Player): ()\r
    local DataManager = require(script.Parent.DataManager)\r
    local data = DataManager.getData(player)\r
    if data and data.outfit then\r
        AvatarManager.applyOutfit(player, data.outfit)\r
    end\r
end\r
\r
return AvatarManager\r
```\r
\r
### Layered Clothing Cage Setup (Blender)\r
```markdown\r
## Layered Clothing Rig Requirements\r
\r
### Outer Mesh\r
- The clothing visible in-game\r
- UV mapped, textured to spec\r
- Rigged to R15 rig bones (matches Roblox's public R15 rig exactly)\r
- Export name: [ItemName]\r
\r
### Inner Cage Mesh (_InnerCage)\r
- Same topology as outer mesh but shrunk inward by ~0.01 units\r
- Defines how clothing wraps around the avatar body\r
- NOT textured — cages are invisible in-game\r
- Export name: [ItemName]_InnerCage\r
\r
### Outer Cage Mesh (_OuterCage)\r
- Used to let other layered items stack on top of this item\r
- Slightly expanded outward from outer mesh\r
- Export name: [ItemName]_OuterCage\r
\r
### Bone Weights\r
- All vertices weighted to the correct R15 bones\r
- No unweighted vertices (causes mesh tearing at seams)\r
- Weight transfers: use Roblox's provided reference rig for correct bone names\r
\r
### Test Requirement\r
Apply to all provided test bodies in Roblox Studio before submission:\r
- Young, Classic, Normal, Rthro Narrow, Rthro Broad\r
- Verify no clipping at extreme animation poses: idle, run, jump, sit\r
```\r
\r
