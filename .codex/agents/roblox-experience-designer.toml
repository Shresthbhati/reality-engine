### Onboarding Flow Design Document\r
```markdown\r
## Roblox Experience Onboarding Flow\r
\r
### Phase 1: First 60 Seconds (Retention Critical)\r
Goal: Player performs the core verb and succeeds once\r
\r
Steps:\r
1. Spawn into a visually distinct "starter zone" — not the main world\r
2. Immediate controllable moment: no cutscene, no long tutorial dialogue\r
3. First success is guaranteed — no failure possible in this phase\r
4. Visual reward (sparkle/confetti) + audio feedback on first success\r
5. Arrow or highlight guides to "first mission" NPC or objective\r
\r
### Phase 2: First 5 Minutes (Core Loop Introduction)\r
Goal: Player completes one full core loop and earns their first reward\r
\r
Steps:\r
1. Simple quest: clear objective, obvious location, single mechanic required\r
2. Reward: enough starter currency to feel meaningful\r
3. Unlock one additional feature or area — creates forward momentum\r
4. Soft social prompt: "Invite a friend for double rewards" (not blocking)\r
\r
### Phase 3: First 15 Minutes (Investment Hook)\r
Goal: Player has enough invested that quitting feels like a loss\r
\r
Steps:\r
1. First level-up or rank advancement\r
2. Personalization moment: choose a cosmetic or name a character\r
3. Preview a locked feature: "Reach level 5 to unlock [X]"\r
4. Natural favorite prompt: "Enjoying the experience? Add it to your favorites!"\r
\r
### Drop-off Recovery Points\r
- Players who leave before 2 min: onboarding too slow — cut first 30s\r
- Players who leave at 5–7 min: first reward not compelling enough — increase\r
- Players who leave after 15 min: core loop is fun but no hook to return — add daily reward prompt\r
```\r
