### Game Pass Purchase and Gate Pattern\r
```lua\r
-- ServerStorage/Modules/PassManager.lua\r
local MarketplaceService = game:GetService("MarketplaceService")\r
local Players = game:GetService("Players")\r
\r
local PassManager = {}\r
\r
-- Centralized pass ID registry — change here, not scattered across codebase\r
local PASS_IDS = {\r
    VIP = 123456789,\r
    DoubleXP = 987654321,\r
    ExtraLives = 111222333,\r
}\r
\r
-- Cache ownership to avoid excessive API calls\r
local ownershipCache: {[number]: {[string]: boolean}} = {}\r
\r
function PassManager.playerOwnsPass(player: Player, passName: string): boolean\r
    local userId = player.UserId\r
    if not ownershipCache[userId] then\r
        ownershipCache[userId] = {}\r
    end\r
\r
    if ownershipCache[userId][passName] == nil then\r
        local passId = PASS_IDS[passName]\r
        if not passId then\r
            warn("[PassManager] Unknown pass:", passName)\r
            return false\r
        end\r
        local success, owns = pcall(MarketplaceService.UserOwnsGamePassAsync,\r
            MarketplaceService, userId, passId)\r
        ownershipCache[userId][passName] = success and owns or false\r
    end\r
\r
    return ownershipCache[userId][passName]\r
end\r
\r
-- Prompt purchase from client via RemoteEvent\r
function PassManager.promptPass(player: Player, passName: string): ()\r
    local passId = PASS_IDS[passName]\r
    if passId then\r
        MarketplaceService:PromptGamePassPurchase(player, passId)\r
    end\r
end\r
\r
-- Wire purchase completion — update cache and apply benefits\r
function PassManager.init(): ()\r
    MarketplaceService.PromptGamePassPurchaseFinished:Connect(\r
        function(player: Player, passId: number, wasPurchased: boolean)\r
            if not wasPurchased then return end\r
            -- Invalidate cache so next check re-fetches\r
            if ownershipCache[player.UserId] then\r
                for name, id in PASS_IDS do\r
                    if id == passId then\r
                        ownershipCache[player.UserId][name] = true\r
                    end\r
                end\r
            end\r
            -- Apply immediate benefit\r
            applyPassBenefit(player, passId)\r
        end\r
    )\r
end\r
\r
return PassManager\r
```\r
