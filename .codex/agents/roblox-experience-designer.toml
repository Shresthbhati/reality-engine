### Daily Reward System\r
```lua\r
-- ServerStorage/Modules/DailyRewardSystem.lua\r
local DataStoreService = game:GetService("DataStoreService")\r
\r
local DailyRewardSystem = {}\r
local rewardStore = DataStoreService:GetDataStore("DailyRewards_v1")\r
\r
-- Reward ladder — index = day streak\r
local REWARD_LADDER = {\r
    {coins = 50,  item = nil},        -- Day 1\r
    {coins = 75,  item = nil},        -- Day 2\r
    {coins = 100, item = nil},        -- Day 3\r
    {coins = 150, item = nil},        -- Day 4\r
    {coins = 200, item = nil},        -- Day 5\r
    {coins = 300, item = nil},        -- Day 6\r
    {coins = 500, item = "badge_7day"}, -- Day 7 — week streak bonus\r
}\r
\r
local SECONDS_IN_DAY = 86400\r
\r
function DailyRewardSystem.claimReward(player: Player): (boolean, any)\r
    local key = "daily_" .. player.UserId\r
    local success, data = pcall(rewardStore.GetAsync, rewardStore, key)\r
    if not success then return false, "datastore_error" end\r
\r
    data = data or {lastClaim = 0, streak = 0}\r
    local now = os.time()\r
    local elapsed = now - data.lastClaim\r
\r
    -- Already claimed today\r
    if elapsed < SECONDS_IN_DAY then\r
        return false, "already_claimed"\r
    end\r
\r
    -- Streak broken if > 48 hours since last claim\r
    if elapsed > SECONDS_IN_DAY * 2 then\r
        data.streak = 0\r
    end\r
\r
    data.streak = (data.streak % #REWARD_LADDER) + 1\r
    data.lastClaim = now\r
\r
    local reward = REWARD_LADDER[data.streak]\r
\r
    -- Save updated streak\r
    local saveSuccess = pcall(rewardStore.SetAsync, rewardStore, key, data)\r
    if not saveSuccess then return false, "save_error" end\r
\r
    return true, reward\r
end\r
\r
return DailyRewardSystem\r
```\r
