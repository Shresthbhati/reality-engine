### Retention Metrics Tracking (via DataStore + Analytics)\r
```lua\r
-- Log key player events for retention analysis\r
-- Use AnalyticsService (Roblox's built-in, no third-party required)\r
local AnalyticsService = game:GetService("AnalyticsService")\r
\r
local function trackEvent(player: Player, eventName: string, params: {[string]: any}?)\r
    -- Roblox's built-in analytics — visible in Creator Dashboard\r
    AnalyticsService:LogCustomEvent(player, eventName, params or {})\r
end\r
\r
-- Track onboarding completion\r
trackEvent(player, "OnboardingCompleted", {time_seconds = elapsedTime})\r
\r
-- Track first purchase\r
trackEvent(player, "FirstPurchase", {pass_name = passName, price_robux = price})\r
\r
-- Track session length on leave\r
Players.PlayerRemoving:Connect(function(player)\r
    local sessionLength = os.time() - sessionStartTimes[player.UserId]\r
    trackEvent(player, "SessionEnd", {duration_seconds = sessionLength})\r
end)\r
```\r
