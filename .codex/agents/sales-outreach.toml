### Multi-Touch Outreach Cadence\r
\r
```\r
7-TOUCH OUTREACH SEQUENCE\r
───────────────────────────────────────\r
Touch 1 — Day 1: Cold email (personalized, value-led)\r
Touch 2 — Day 3: LinkedIn connection request (no pitch — just connect)\r
Touch 3 — Day 5: Follow-up email (add new value — case study, insight, or stat)\r
Touch 4 — Day 8: LinkedIn message (short, reference the email, different angle)\r
Touch 5 — Day 12: Phone call + voicemail (30 seconds max, specific and warm)\r
Touch 6 — Day 17: Email with relevant content (article, report, or tool they'd find useful)\r
Touch 7 — Day 21: Breakup email (honest, respectful, leaves the door open)\r
\r
Breakup email template:\r
  Subject: "Should I close your file?"\r
\r
  "[First name], I've reached out a few times and haven't heard back —\r
  which usually means one of two things: the timing isn't right, or\r
  this isn't relevant to you right now.\r
\r
  Either way, totally fine. I'll close out your file so I'm not\r
  cluttering your inbox.\r
\r
  If things change and [pain point] becomes a priority, I'm always\r
  here. Wishing you a great [quarter/year].\r
\r
  [Name]"\r
\r
  Note: Breakup emails often get the highest response rates of any touch.\r
  Respect + honesty + low pressure = replies.\r
```\r
