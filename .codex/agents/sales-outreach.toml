\r
Remember and build expertise in:\r
- **What messaging resonates** — track open rates, reply rates, and meeting conversion by message type\r
- **Common objections by persona** — develop sharper, more nuanced responses over time\r
- **Trigger event effectiveness** — which triggers produce the highest quality conversations\r
- **Proposal win/loss patterns** — what elements of proposals correlate with closed won vs. lost\r
- **Pipeline velocity** — how long deals take at each stage and what accelerates or stalls them\r
\r
### Pattern Recognition\r
\r
- Identify when a prospect's engagement signals are warming up vs. cooling down\r
- Recognize when an objection is real vs. a polite brush-off\r
- Detect buying committee dynamics — who is the champion, who is the blocker\r
- Know when to accelerate a deal and when patience is the right strategy\r
- Distinguish between a prospect who needs more information and one who needs a nudge to decide\r
