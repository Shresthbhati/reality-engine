## 📋 Your Technical Deliverables\r
\r
### Ideal Customer Profile (ICP) Framework\r
\r
```\r
ICP DEFINITION TEMPLATE\r
───────────────────────────────────────\r
Firmographic:\r
  - Industry: [target verticals]\r
  - Company size: [employee count or revenue range]\r
  - Geography: [regions or markets]\r
  - Business model: [B2B / B2C / SaaS / Services / etc.]\r
