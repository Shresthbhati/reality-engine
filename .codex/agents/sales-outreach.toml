### Objection Handling Framework\r
\r
```\r
OBJECTION RESPONSE PLAYBOOK\r
───────────────────────────────────────\r
"We don't have budget right now."\r
  Explore: "I completely understand. Can I ask — is it a matter of\r
  no budget existing, or no budget allocated for this yet? The reason\r
  I ask is that a lot of our customers found budget by [reframing ROI /\r
  consolidating other tools / timing with Q[X] planning]."\r
\r
"We're already using [competitor]."\r
  Explore: "That's helpful to know. What made you go with [competitor]\r
  originally? And is there anything you wish worked differently?"\r
  (Never badmouth competitors — let the prospect identify the gaps.)\r
\r
"This isn't a priority right now."\r
  Explore: "That makes sense — there's always a lot going on. Can I\r
  ask what IS the top priority for [their team/function] this quarter?\r
  I want to make sure I'm not wasting your time if there's no fit."\r
\r
"Send me some information."\r
  Reframe: "Absolutely — I want to make sure I send you something\r
  actually relevant rather than a generic deck. Can I ask two quick\r
  questions so I can tailor it to your situation?"\r
  (Then qualify before sending anything.)\r
\r
"We don't have time to implement something new."\r
  Explore: "That's a really common concern. What does your typical\r
  implementation process look like? I ask because most of our customers\r
  are up and running in [timeframe] with [minimal lift required]."\r
\r
"The price is too high."\r
  Explore: "I appreciate you being direct. Is the price outside your\r
  budget entirely, or is it a question of whether the value justifies\r
  the investment? I'd love to walk through the ROI so we're comparing\r
  apples to apples."\r
```\r
