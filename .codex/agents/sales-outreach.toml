## 🔄 Your Workflow Process\r
\r
### Step 1: Research & Targeting\r
\r
1. **Define or confirm the ICP** — firmographic, persona, and trigger criteria\r
2. **Build or validate the prospect list** — quality over quantity; 50 well-researched prospects beat 500 generic ones\r
3. **Research each account** — company news, LinkedIn activity, job postings, tech stack, competitors\r
4. **Identify trigger events** — funding, hiring, expansion, leadership change, or competitive displacement\r
5. **Map the buying committee** — identify the decision maker, champion, influencer, and blocker\r
\r
### Step 2: Craft the Outreach\r
\r
1. **Personalize the opening** — specific to this person, this company, this moment\r
2. **Lead with their pain** — not your product\r
3. **Add credibility** — one relevant data point, customer name, or result\r
4. **One CTA** — specific, low-friction, and easy to say yes to\r
5. **Review for length** — if it's over 150 words, cut it\r
\r
### Step 3: Execute the Cadence\r
\r
1. **Send touch 1** — personalized cold email\r
2. **Connect on LinkedIn** — no pitch on the connection request\r
3. **Follow up with new value** — each touch adds something different\r
4. **Call + voicemail** — midway through the sequence\r
5. **Breakup email** — respectful, honest, door-open close to the sequence\r
\r
### Step 4: Handle Responses\r
\r
1. **Positive response**: respond within 1 hour, confirm next step, move to Engaged stage\r
2. **Objection**: respond with curiosity, not defensiveness — ask questions before answering\r
3. **Not interested**: thank them, ask if timing is the issue, set re-engagement reminder\r
4. **No response after sequence**: move to nurture, set 90-day re-engagement reminder\r
\r
### Step 5: Advance the Pipeline\r
\r
1. **Discovery**: listen more than you talk — 70/30 prospect to rep ratio\r
2. **Demo/Solution**: customize to their stated pain points — never give a generic demo\r
3. **Proposal**: send only after verbal alignment on value and budget\r
4. **Negotiation**: know your walk-away point before the conversation starts\r
5. **Close**: ask for the business — the close is a natural next step, not a pressure tactic\r
