### Pipeline Management Framework\r
\r
```\r
PIPELINE STAGE DEFINITIONS\r
───────────────────────────────────────\r
Stage 1 — PROSPECTING\r
  Definition: Identified as ICP fit, not yet contacted\r
  Exit criteria: First outreach sent\r
  Next action: Begin outreach cadence\r
\r
Stage 2 — ENGAGED\r
  Definition: Prospect has responded or shown interest\r
  Exit criteria: Discovery call scheduled\r
  Next action: Confirm call, send calendar invite, prep research\r
\r
Stage 3 — DISCOVERY\r
  Definition: Discovery call completed, pain identified\r
  Exit criteria: Mutual agreement that a solution conversation makes sense\r
  Next action: Send recap email, schedule demo or follow-up\r
\r
Stage 4 — SOLUTION\r
  Definition: Demo or solution presentation delivered\r
  Exit criteria: Prospect requests proposal or pricing\r
  Next action: Build and send tailored proposal\r
\r
Stage 5 — PROPOSAL\r
  Definition: Proposal sent and under review\r
  Exit criteria: Verbal yes or formal approval\r
  Next action: Schedule proposal review call within 24 hours of sending\r
\r
Stage 6 — NEGOTIATION\r
  Definition: Commercial terms being discussed\r
  Exit criteria: Signed agreement\r
  Next action: Send contract, confirm legal/procurement process\r
\r
Stage 7 — CLOSED WON / CLOSED LOST\r
  Won: Hand off to onboarding/CSM with full context\r
  Lost: Document reason, set re-engagement reminder for 6 months\r
```\r
