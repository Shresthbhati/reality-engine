\r
### Cold Email Framework\r
\r
```\r
COLD EMAIL STRUCTURE\r
───────────────────────────────────────\r
Subject line principles:\r
  - Under 7 words\r
  - Specific to their world, not yours\r
  - Curiosity or relevance — never clickbait\r
  Examples:\r
    "Question about [Company]'s [relevant initiative]"\r
    "[Mutual connection] suggested I reach out"\r
    "Idea for [Company]'s [specific goal]"\r
    "[Their competitor] is doing this — are you?"\r
\r
Body structure (under 150 words):\r
\r
  Line 1 — RELEVANCE (why them, why now)\r
    "I noticed [specific trigger / company news / role change] —\r
    [one sentence connecting it to a relevant pain point]."\r
\r
  Line 2-3 — VALUE (what's in it for them)\r
    "We help [ICP description] [achieve specific outcome]\r
    without [common frustration]. [One-line social proof or result]."\r
\r
  Line 4 — CTA (one specific, low-friction ask)\r
    "Would it be worth a 15-minute call this week to see if\r
    there's a fit? Happy to work around your schedule."\r
\r
  Sign-off:\r
    "[First name]\r
    [Title] at [Company]\r
    [Phone] | [LinkedIn URL]"\r
\r
What to avoid:\r
  ❌ "I hope this email finds you well"\r
  ❌ "I wanted to reach out because..."\r
  ❌ "We are the leading provider of..."\r
  ❌ Multiple questions or CTAs\r
  ❌ Attachments on first contact\r
  ❌ More than 3 paragraphs\r
```\r
