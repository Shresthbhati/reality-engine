### Dependency Vulnerability Management\r
```python\r
#!/usr/bin/env python3\r
""\"\r
Dependency security scanner integration for CI/CD pipelines.\r
Wraps multiple SCA tools and enforces organizational policy.\r
""\"\r
\r
import json\r
import subprocess\r
import sys\r
from dataclasses import dataclass\r
from enum import Enum\r
from pathlib import Path\r
\r
\r
class Severity(Enum):\r
    CRITICAL = "critical"\r
    HIGH = "high"\r
    MEDIUM = "medium"\r
    LOW = "low"\r
\r
\r
@dataclass\r
class VulnFinding:\r
    package: str\r
    version: str\r
    severity: Severity\r
    cve: str\r
    fixed_version: str\r
    description: str\r
    exploitable: bool = False\r
\r
\r
class DependencyScanner:\r
    ""\"Unified dependency scanning with policy enforcement.""\"\r
\r
    # SLA: max days to remediate by severity\r
    REMEDIATION_SLA = {\r
        Severity.CRITICAL: 7,\r
        Severity.HIGH: 30,\r
        Severity.MEDIUM: 90,\r
        Severity.LOW: 180,\r
    }\r
\r
    # Known false positives or accepted risks (with justification)\r
    SUPPRESSED = {\r
        "CVE-2023-XXXXX": "Not exploitable in our configuration — validated by AppSec team 2024-01-15",\r
    }\r
\r
    def scan_npm(self, project_path: Path) -> list[VulnFinding]:\r
        ""\"Scan Node.js dependencies using npm audit.""\"\r
        result = subprocess.run(\r
            ["npm", "audit", "--json", "--production"],\r
            cwd=project_path, capture_output=True, text=True\r
        )\r
        findings = []\r
        if result.stdout:\r
            audit = json.loads(result.stdout)\r
            for vuln_id, vuln in audit.get("vulnerabilities", {}).items():\r
                findings.append(VulnFinding(\r
                    package=vuln_id,\r
                    version=vuln.get("range", "unknown"),\r
                    severity=Severity(vuln.get("severity", "low")),\r
                    cve=vuln.get("via", [{}])[0].get("url", "N/A") if vuln.get("via") else "N/A",\r
                    fixed_version=vuln.get("fixAvailable", {}).get("version", "N/A")\r
                        if isinstance(vuln.get("fixAvailable"), dict) else "N/A",\r
                    description=vuln.get("via", [{}])[0].get("title", "")\r
                        if isinstance(vuln.get("via", [None])[0], dict) else str(vuln.get("via", "")),\r
                ))\r
        return findings\r
\r
    def scan_python(self, project_path: Path) -> list[VulnFinding]:\r
        ""\"Scan Python dependencies using pip-audit.""\"\r
        result = subprocess.run(\r
            ["pip-audit", "--format=json", "--desc"],\r
            cwd=project_path, capture_output=True, text=True\r
        )\r
        findings = []\r
        if result.stdout:\r
            for vuln in json.loads(result.stdout):\r
                findings.append(VulnFinding(\r
                    package=vuln["name"],\r
                    version=vuln["version"],\r
                    severity=Severity.HIGH,  # pip-audit doesn't always provide severity\r
                    cve=vuln.get("id", "N/A"),\r
                    fixed_version=vuln.get("fix_versions", ["N/A"])[0],\r
                    description=vuln.get("description", ""),\r
                ))\r
        return findings\r
\r
    def enforce_policy(self, findings: list[VulnFinding]) -> tuple[bool, list[str]]:\r
        ""\"\r
        Apply organizational policy to scan results.\r
        Returns (pass/fail, list of policy violations).\r
        ""\"\r
        violations = []\r
        for f in findings:\r
            # Skip suppressed CVEs\r
            if f.cve in self.SUPPRESSED:\r
                continue\r
\r
            # Critical and High with known fix = must block\r
            if f.severity in (Severity.CRITICAL, Severity.HIGH) and f.fixed_version != "N/A":\r
                violations.append(\r
                    f"BLOCKED: {f.package}@{f.version} has {f.severity.value} "\r
                    f"vulnerability {f.cve} — fix available: {f.fixed_version}"\r
                )\r
\r
            # Critical without fix = warn but allow (with tracking)\r
            elif f.severity == Severity.CRITICAL and f.fixed_version == "N/A":\r
                violations.append(\r
                    f"WARNING: {f.package}@{f.version} has CRITICAL vulnerability "\r
                    f"{f.cve} with no fix available — track for remediation"\r
                )\r
\r
        passed = not any("BLOCKED" in v for v in violations)\r
        return passed, violations\r
\r
\r
def main():\r
    scanner = DependencyScanner()\r
    project = Path(".")\r
\r
    # Detect project type and scan\r
    findings = []\r
    if (project / "package.json").exists():\r
        findings.extend(scanner.scan_npm(project))\r
    if (project / "requirements.txt").exists() or (project / "pyproject.toml").exists():\r
        findings.extend(scanner.scan_python(project))\r
\r
    # Enforce policy\r
    passed, violations = scanner.enforce_policy(findings)\r
\r
    for v in violations:\r
        print(v)\r
\r
    print(f"\\nTotal findings: {len(findings)}")\r
    print(f"Policy violations: {len(violations)}")\r
    print(f"Result: {'PASS' if passed else 'FAIL'}")\r
\r
    sys.exit(0 if passed else 1)\r
\r
\r
if __name__ == "__main__":\r
    main()\r
```\r
