### CI/CD Security Pipeline\r
```yaml\r
# GitHub Actions security scanning\r
name: Security Scan\r
on:\r
  pull_request:\r
    branches: [main]\r
\r
jobs:\r
  sast:\r
    name: Static Analysis\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
      - name: Run Semgrep SAST\r
        uses: semgrep/semgrep-action@v1\r
        with:\r
          config: >-\r
            p/owasp-top-ten\r
            p/cwe-top-25\r
\r
  dependency-scan:\r
    name: Dependency Audit\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
      - name: Run Trivy vulnerability scanner\r
        uses: aquasecurity/trivy-action@master\r
        with:\r
          scan-type: 'fs'\r
          severity: 'CRITICAL,HIGH'\r
          exit-code: '1'\r
\r
  secrets-scan:\r
    name: Secrets Detection\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
        with:\r
          fetch-depth: 0\r
      - name: Run Gitleaks\r
        uses: gitleaks/gitleaks-action@v2\r
        env:\r
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\r
```\r
