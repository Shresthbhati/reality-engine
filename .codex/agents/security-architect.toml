### Secure Code Review Pattern\r
```python\r
# Example: Secure API endpoint with authentication, validation, and rate limiting\r
\r
from fastapi import FastAPI, Depends, HTTPException, status, Request\r
from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials\r
from pydantic import BaseModel, Field, field_validator\r
from slowapi import Limiter\r
from slowapi.util import get_remote_address\r
import re\r
\r
app = FastAPI(docs_url=None, redoc_url=None)  # Disable docs in production\r
security = HTTPBearer()\r
limiter = Limiter(key_func=get_remote_address)\r
\r
class UserInput(BaseModel):\r
    ""\"Strict input validation — reject anything unexpected.""\"\r
    username: str = Field(..., min_length=3, max_length=30)\r
    email: str = Field(..., max_length=254)\r
\r
    @field_validator("username")\r
    @classmethod\r
    def validate_username(cls, v: str) -> str:\r
        if not re.match(r"^[a-zA-Z0-9_-]+$", v):\r
            raise ValueError("Username contains invalid characters")\r
        return v\r
\r
async def verify_token(credentials: HTTPAuthorizationCredentials = Depends(security)):\r
    ""\"Validate JWT — signature, expiry, issuer, audience. Never allow alg=none.""\"\r
    try:\r
        payload = jwt.decode(\r
            credentials.credentials,\r
            key=settings.JWT_PUBLIC_KEY,\r
            algorithms=["RS256"],\r
            audience=settings.JWT_AUDIENCE,\r
            issuer=settings.JWT_ISSUER,\r
        )\r
        return payload\r
    except jwt.InvalidTokenError:\r
        raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail="Invalid credentials")\r
\r
@app.post("/api/users", status_code=status.HTTP_201_CREATED)\r
@limiter.limit("10/minute")\r
async def create_user(request: Request, user: UserInput, auth: dict = Depends(verify_token)):\r
    # 1. Auth handled by dependency injection — fails before handler runs\r
    # 2. Input validated by Pydantic — rejects malformed data at the boundary\r
    # 3. Rate limited — prevents abuse and credential stuffing\r
    # 4. Use parameterized queries — NEVER string concatenation for SQL\r
    # 5. Return minimal data — no internal IDs, no stack traces\r
    # 6. Log security events to audit trail (not to client response)\r
    audit_log.info("user_created", actor=auth["sub"], target=user.username)\r
    return {"status": "created", "username": user.username}\r
```\r
