### Kubernetes Network Policy (Zero Trust Pod-to-Pod)\r
```yaml\r
# Default deny all traffic — explicit allow only\r
apiVersion: networking.k8s.io/v1\r
kind: NetworkPolicy\r
metadata:\r
  name: default-deny-all\r
  namespace: production\r
spec:\r
  podSelector: {}\r
  policyTypes:\r
    - Ingress\r
    - Egress\r
\r
---\r
# Allow frontend → backend API only on port 8080\r
apiVersion: networking.k8s.io/v1\r
kind: NetworkPolicy\r
metadata:\r
  name: allow-frontend-to-api\r
  namespace: production\r
spec:\r
  podSelector:\r
    matchLabels:\r
      app: backend-api\r
  policyTypes:\r
    - Ingress\r
  ingress:\r
    - from:\r
        - podSelector:\r
            matchLabels:\r
              app: frontend\r
      ports:\r
        - protocol: TCP\r
          port: 8080\r
\r
---\r
# Allow backend API → database on port 5432\r
apiVersion: networking.k8s.io/v1\r
kind: NetworkPolicy\r
metadata:\r
  name: allow-api-to-database\r
  namespace: production\r
spec:\r
  podSelector:\r
    matchLabels:\r
      app: postgres\r
  policyTypes:\r
    - Ingress\r
  ingress:\r
    - from:\r
        - podSelector:\r
            matchLabels:\r
              app: backend-api\r
      ports:\r
        - protocol: TCP\r
          port: 5432\r
\r
---\r
# Allow DNS egress for all pods (required for service discovery)\r
apiVersion: networking.k8s.io/v1\r
kind: NetworkPolicy\r
metadata:\r
  name: allow-dns-egress\r
  namespace: production\r
spec:\r
  podSelector: {}\r
  policyTypes:\r
    - Egress\r
  egress:\r
    - to:\r
        - namespaceSelector:\r
            matchLabels:\r
              kubernetes.io/metadata.name: kube-system\r
          podSelector:\r
            matchLabels:\r
              k8s-app: kube-dns\r
      ports:\r
        - protocol: UDP\r
          port: 53\r
        - protocol: TCP\r
          port: 53\r
```\r
\r
### CI/CD Pipeline Security (GitHub Actions with OIDC)\r
```yaml\r
# Secure deployment pipeline — no long-lived credentials\r
name: Deploy to AWS\r
on:\r
  push:\r
    branches: [main]\r
\r
permissions:\r
  id-token: write   # Required for OIDC federation\r
  contents: read\r
\r
jobs:\r
  security-scan:\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      # Scan IaC for misconfigurations\r
      - name: Checkov — Infrastructure Policy Check\r
        uses: bridgecrewio/checkov-action@v12\r
        with:\r
          directory: ./terraform\r
          framework: terraform\r
          soft_fail: false  # Fail the pipeline on policy violations\r
          output_format: sarif\r
\r
      # Scan for leaked secrets\r
      - name: Gitleaks — Secret Detection\r
        uses: gitleaks/gitleaks-action@v2\r
        env:\r
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\r
\r
      # Scan container images\r
      - name: Trivy — Container Vulnerability Scan\r
        uses: aquasecurity/trivy-action@master\r
        with:\r
          image-ref: ${{ env.IMAGE_TAG }}\r
          format: sarif\r
          severity: CRITICAL,HIGH\r
          exit-code: 1  # Fail on critical/high vulnerabilities\r
\r
  deploy:\r
    needs: security-scan\r
    runs-on: ubuntu-latest\r
    environment: production  # Requires manual approval\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      # OIDC federation — no AWS access keys stored as secrets\r
      - name: Configure AWS Credentials\r
        uses: aws-actions/configure-aws-credentials@v4\r
        with:\r
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-deploy\r
          aws-region: us-east-1\r
          role-session-name: github-${{ github.run_id }}\r
\r
      - name: Terraform Apply\r
        run: |\r
          cd terraform\r
          terraform init -backend-config=prod.hcl\r
          terraform plan -out=tfplan\r
          terraform apply tfplan\r
```\r
