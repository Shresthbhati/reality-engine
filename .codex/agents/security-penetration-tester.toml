### External Reconnaissance Automation\r
```bash\r
#!/bin/bash\r
# External attack surface enumeration script\r
# Usage: ./recon.sh target-domain.com\r
\r
TARGET="$1"\r
OUT="recon-${TARGET}-$(date +%Y%m%d)"\r
mkdir -p "$OUT"\r
\r
echo "=== Subdomain Enumeration ==="\r
# Passive: multiple sources, merge and deduplicate\r
subfinder -d "$TARGET" -silent -o "$OUT/subs-subfinder.txt"\r
amass enum -passive -d "$TARGET" -o "$OUT/subs-amass.txt"\r
cat "$OUT"/subs-*.txt | sort -u > "$OUT/subdomains.txt"\r
echo "[+] Found $(wc -l < "$OUT/subdomains.txt") unique subdomains"\r
\r
echo "=== DNS Resolution & HTTP Probing ==="\r
# Resolve live hosts and probe for HTTP services\r
dnsx -l "$OUT/subdomains.txt" -a -resp -silent -o "$OUT/resolved.txt"\r
httpx -l "$OUT/subdomains.txt" -status-code -title -tech-detect \\\r
  -follow-redirects -silent -o "$OUT/http-services.txt"\r
\r
echo "=== Port Scanning (Top 1000) ==="\r
naabu -list "$OUT/subdomains.txt" -top-ports 1000 \\\r
  -silent -o "$OUT/open-ports.txt"\r
\r
echo "=== Technology Fingerprinting ==="\r
# Identify frameworks, CMS, WAFs — use httpx output (full URLs, not bare hostnames)\r
whatweb -i "$OUT/http-services.txt" \\\r
  --log-json="$OUT/tech-fingerprint.json" --aggression=3\r
\r
echo "=== Screenshot Capture ==="\r
gowitness file -f "$OUT/http-services.txt" \\\r
  --screenshot-path "$OUT/screenshots/"\r
\r
echo "=== Credential Leak Check ==="\r
# Search for leaked credentials (requires API keys)\r
h8mail -t "@${TARGET}" -o "$OUT/credential-leaks.txt"\r
\r
echo "[+] Recon complete: results in $OUT/"\r
```\r
