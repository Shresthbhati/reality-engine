### Active Directory Attack Chain Playbook\r
```markdown\r
# Active Directory Penetration Testing Playbook\r
\r
## Phase 1: Initial Access & Foothold\r
- [ ] LLMNR/NBT-NS poisoning with Responder — capture NTLMv2 hashes on the wire\r
- [ ] Password spraying against discovered accounts (3 attempts max per lockout window)\r
- [ ] Kerberos AS-REP roasting — extract hashes for accounts with pre-auth disabled\r
- [ ] Check for public-facing services with default/weak credentials\r
- [ ] Test VPN/RDP endpoints for credential stuffing from breach databases\r
\r
## Phase 2: Enumeration (Post-Foothold)\r
- [ ] BloodHound collection — map all AD relationships, trusts, and attack paths\r
- [ ] Enumerate SPNs for Kerberoastable service accounts\r
- [ ] Identify Group Policy Preferences (GPP) passwords in SYSVOL\r
- [ ] Map local admin access across workstations and servers\r
- [ ] Find shares with sensitive data: \\\\server\\backup, \\\\server\\IT, password files\r
\r
## Phase 3: Privilege Escalation\r
- [ ] Kerberoast high-value SPNs — crack service account hashes offline\r
- [ ] Abuse misconfigured ACLs: GenericAll, GenericWrite, WriteDACL on users/groups\r
- [ ] Exploit unconstrained delegation — compromise servers to capture TGTs\r
- [ ] Resource-based constrained delegation (RBCD) attack if write access to computer objects\r
- [ ] Print Spooler abuse (PrinterBug) to coerce authentication from DCs\r
\r
## Phase 4: Lateral Movement\r
- [ ] Pass-the-Hash (PtH) with captured NTLM hashes — no cracking needed\r
- [ ] Overpass-the-Hash — request Kerberos TGT from NTLM hash for stealth\r
- [ ] WinRM/PSRemoting to systems where current user has admin access\r
- [ ] DCOM lateral movement as alternative to PsExec (less monitored)\r
- [ ] Pivot through jump hosts and citrix to reach segmented networks\r
\r
## Phase 5: Domain Compromise\r
- [ ] DCSync — replicate domain controller to extract all password hashes\r
- [ ] Golden Ticket — forge TGTs with krbtgt hash for persistent access\r
- [ ] Diamond Ticket — modify legitimate TGTs for harder detection\r
- [ ] Skeleton Key — patch LSASS on DC for master password backdoor\r
- [ ] Shadow Credentials — abuse msDS-KeyCredentialLink for persistence\r
\r
## Evidence Collection Requirements\r
For each step:\r
- Screenshot of command and output\r
- Timestamp (UTC)\r
- Source IP → target IP\r
- Tool used and exact command\r
- Hash/credential obtained (redacted in final report)\r
