### Detection-as-Code CI/CD Pipeline\r
```yaml\r
# GitHub Actions: Detection Rule CI/CD Pipeline\r
name: Detection Engineering Pipeline\r
\r
on:\r
  pull_request:\r
    paths: ['detections/**/*.yml']\r
  push:\r
    branches: [main]\r
    paths: ['detections/**/*.yml']\r
\r
jobs:\r
  validate:\r
    name: Validate Sigma Rules\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - name: Install sigma-cli\r
        run: pip install sigma-cli pySigma-backend-splunk pySigma-backend-microsoft365defender\r
\r
      - name: Validate Sigma syntax\r
        run: |\r
          find detections/ -name "*.yml" -exec sigma check {} \\;\r
\r
      - name: Check required fields\r
        run: |\r
          # Every rule must have: title, id, level, tags (ATT&CK), falsepositives\r
          for rule in detections/**/*.yml; do\r
            for field in title id level tags falsepositives; do\r
              if ! grep -q "^${field}:" "$rule"; then\r
                echo "ERROR: $rule missing required field: $field"\r
                exit 1\r
              fi\r
            done\r
          done\r
\r
      - name: Verify ATT&CK mapping\r
        run: |\r
          # Every rule must map to at least one ATT&CK technique\r
          for rule in detections/**/*.yml; do\r
            if ! grep -q "attack\\.t[0-9]" "$rule"; then\r
              echo "ERROR: $rule has no ATT&CK technique mapping"\r
              exit 1\r
            fi\r
          done\r
\r
  compile:\r
    name: Compile to Target SIEMs\r
    needs: validate\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - name: Install sigma-cli with backends\r
        run: |\r
          pip install sigma-cli \\\r
            pySigma-backend-splunk \\\r
            pySigma-backend-microsoft365defender \\\r
            pySigma-backend-elasticsearch\r
\r
      - name: Compile to Splunk\r
        run: |\r
          sigma convert -t splunk -p sysmon \\\r
            detections/**/*.yml > compiled/splunk/rules.conf\r
\r
      - name: Compile to Sentinel KQL\r
        run: |\r
          sigma convert -t microsoft365defender \\\r
            detections/**/*.yml > compiled/sentinel/rules.kql\r
\r
      - name: Compile to Elastic EQL\r
        run: |\r
          sigma convert -t elasticsearch \\\r
            detections/**/*.yml > compiled/elastic/rules.ndjson\r
\r
      - uses: actions/upload-artifact@v4\r
        with:\r
          name: compiled-rules\r
          path: compiled/\r
\r
  test:\r
    name: Test Against Sample Logs\r
    needs: compile\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - name: Run detection tests\r
        run: |\r
          # Each rule should have a matching test case in tests/\r
          for rule in detections/**/*.yml; do\r
            rule_id=$(grep "^id:" "$rule" | awk '{print $2}')\r
            test_file="tests/${rule_id}.json"\r
            if [ ! -f "$test_file" ]; then\r
              echo "WARN: No test case for rule $rule_id ($rule)"\r
            else\r
              echo "Testing rule $rule_id against sample data..."\r
              python scripts/test_detection.py \\\r
                --rule "$rule" --test-data "$test_file"\r
            fi\r
          done\r
\r
  deploy:\r
    name: Deploy to SIEM\r
    needs: test\r
    if: github.ref == 'refs/heads/main'\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/download-artifact@v4\r
        with:\r
          name: compiled-rules\r
\r
      - name: Deploy to Splunk\r
        run: |\r
          # Push compiled rules via Splunk REST API\r
          curl -k -u "${{ secrets.SPLUNK_USER }}:${{ secrets.SPLUNK_PASS }}" \\\r
            https://${{ secrets.SPLUNK_HOST }}:8089/servicesNS/admin/search/saved/searches \\\r
            -d @compiled/splunk/rules.conf\r
\r
      - name: Deploy to Sentinel\r
        run: |\r
          # Deploy via Azure CLI\r
          az sentinel alert-rule create \\\r
            --resource-group ${{ secrets.AZURE_RG }} \\\r
            --workspace-name ${{ secrets.SENTINEL_WORKSPACE }} \\\r
            --alert-rule @compiled/sentinel/rules.kql\r
```\r
