### Threat Hunt Playbook\r
```markdown\r
# Threat Hunt: Credential Access via LSASS\r
\r
## Hunt Hypothesis\r
Adversaries with local admin privileges are dumping credentials from LSASS\r
process memory using tools like Mimikatz, ProcDump, or direct ntdll calls,\r
and our current detections are not catching all variants.\r
\r
## MITRE ATT&CK Mapping\r
- **T1003.001** — OS Credential Dumping: LSASS Memory\r
- **T1003.003** — OS Credential Dumping: NTDS\r
\r
## Data Sources Required\r
- Sysmon Event ID 10 (ProcessAccess) — LSASS access with suspicious rights\r
- Sysmon Event ID 7 (ImageLoaded) — DLLs loaded into LSASS\r
- Sysmon Event ID 1 (ProcessCreate) — Process creation with LSASS handle\r
\r
## Hunt Queries\r
\r
### Query 1: Direct LSASS Access (Sysmon Event 10)\r
```\r
index=windows sourcetype=WinEventLog:Sysmon EventCode=10\r
  TargetImage="*\\\\lsass.exe"\r
  GrantedAccess IN ("0x1010", "0x1038", "0x1fffff", "0x1410")\r
  NOT SourceImage IN (\r
    "*\\\\csrss.exe", "*\\\\lsm.exe", "*\\\\wmiprvse.exe",\r
    "*\\\\svchost.exe", "*\\\\MsMpEng.exe"\r
  )\r
| stats count by SourceImage GrantedAccess Computer User\r
| sort - count\r
```\r
\r
### Query 2: Suspicious Modules Loaded into LSASS\r
```\r
index=windows sourcetype=WinEventLog:Sysmon EventCode=7\r
  Image="*\\\\lsass.exe"\r
  NOT ImageLoaded IN ("*\\\\Windows\\\\System32\\\\*", "*\\\\Windows\\\\SysWOW64\\\\*")\r
| stats count values(ImageLoaded) as SuspiciousModules by Computer\r
```\r
\r
## Expected Outcomes\r
- **True positive indicators**: Non-system processes accessing LSASS with\r
  high-privilege access masks, unusual DLLs loaded into LSASS\r
- **Benign activity to baseline**: Security tools (EDR, AV) accessing LSASS\r
  for protection, credential providers, SSO agents\r
\r
## Hunt-to-Detection Conversion\r
If hunt reveals true positives or new access patterns:\r
1. Create a Sigma rule covering the discovered technique variant\r
2. Add the benign tools found to the allowlist\r
3. Submit rule through detection-as-code pipeline\r
4. Validate with atomic red team test T1003.001\r
```\r
\r
