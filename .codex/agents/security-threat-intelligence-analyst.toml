### IOC Enrichment & Correlation Script\r
```python\r
#!/usr/bin/env python3\r
""\"\r
IOC enrichment pipeline.\r
Takes raw indicators and enriches with context from multiple sources.\r
""\"\r
\r
import json\r
import re\r
import uuid\r
from dataclasses import dataclass, field\r
from datetime import datetime, timezone\r
from enum import Enum\r
from ipaddress import ip_address, ip_network\r
\r
\r
class IOCType(Enum):\r
    IPV4 = "ipv4"\r
    IPV6 = "ipv6"\r
    DOMAIN = "domain"\r
    URL = "url"\r
    SHA256 = "sha256"\r
    SHA1 = "sha1"\r
    MD5 = "md5"\r
    EMAIL = "email"\r
\r
\r
class TLP(Enum):\r
    CLEAR = "TLP:CLEAR"\r
    GREEN = "TLP:GREEN"\r
    AMBER = "TLP:AMBER"\r
    AMBER_STRICT = "TLP:AMBER+STRICT"\r
    RED = "TLP:RED"\r
\r
\r
@dataclass\r
class IOC:\r
    ""\"Represents an enriched Indicator of Compromise.""\"\r
    value: str\r
    ioc_type: IOCType\r
    first_seen: datetime\r
    last_seen: datetime\r
    confidence: float  # 0.0 to 1.0\r
    tlp: TLP = TLP.AMBER\r
    tags: list[str] = field(default_factory=list)\r
    context: dict = field(default_factory=dict)\r
    related_iocs: list[str] = field(default_factory=list)\r
    mitre_techniques: list[str] = field(default_factory=list)\r
    source: str = ""\r
\r
    def to_stix(self) -> dict:\r
        ""\"Convert to STIX 2.1 indicator object.""\"\r
        pattern_map = {\r
            IOCType.IPV4: f"[ipv4-addr:value = '{self.value}']",\r
            IOCType.DOMAIN: f"[domain-name:value = '{self.value}']",\r
            IOCType.SHA256: f"[file:hashes.'SHA-256' = '{self.value}']",\r
            IOCType.URL: f"[url:value = '{self.value}']",\r
        }\r
        return {\r
            "type": "indicator",\r
            "spec_version": "2.1",\r
            "id": f"indicator--{uuid.uuid5(uuid.NAMESPACE_URL, self.value)}",\r
            "created": self.first_seen.isoformat(),\r
            "modified": self.last_seen.isoformat(),\r
            "name": f"{self.ioc_type.value}: {self.value}",\r
            "pattern": pattern_map.get(self.ioc_type, f"[artifact:payload_bin = '{self.value}']"),\r
            "pattern_type": "stix",\r
            "valid_from": self.first_seen.isoformat(),\r
            "confidence": int(self.confidence * 100),\r
            "labels": self.tags,\r
        }\r
\r
\r
class IOCClassifier:\r
    ""\"Classify and validate raw indicator strings.""\"\r
\r
    PRIVATE_RANGES = [\r
        ip_network("10.0.0.0/8"),\r
        ip_network("172.16.0.0/12"),\r
        ip_network("192.168.0.0/16"),\r
        ip_network("127.0.0.0/8"),\r
    ]\r
\r
    @staticmethod\r
    def classify(value: str) -> IOCType | None:\r
        ""\"Determine the type of an indicator.""\"\r
        value = value.strip().lower()\r
\r
        # Hash detection by length and character set\r
        if re.match(r'^[a-f0-9]{64}$', value):\r
            return IOCType.SHA256\r
        if re.match(r'^[a-f0-9]{40}$', value):\r
            return IOCType.SHA1\r
        if re.match(r'^[a-f0-9]{32}$', value):\r
            return IOCType.MD5\r
\r
        # URL\r
        if re.match(r'^https?://', value):\r
            return IOCType.URL\r
\r
        # Email\r
        if re.match(r'^[^@]+@[^@]+\\.[^@]+$', value):\r
            return IOCType.EMAIL\r
\r
        # IP address\r
        try:\r
            addr = ip_address(value)\r
            return IOCType.IPV6 if addr.version == 6 else IOCType.IPV4\r
        except ValueError:\r
            pass\r
\r
        # Domain (simple validation)\r
        if re.match(r'^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z]{2,})+$', value):\r
            return IOCType.DOMAIN\r
\r
        return None\r
\r
    @classmethod\r
    def is_private_ip(cls, value: str) -> bool:\r
        ""\"Check if an IP is in private/reserved ranges.""\"\r
        try:\r
            addr = ip_address(value)\r
            return any(addr in net for net in cls.PRIVATE_RANGES)\r
        except ValueError:\r
            return False\r
\r
\r
class IOCEnrichmentPipeline:\r
    ""\"\r
    Pipeline for enriching IOCs with context from multiple sources.\r
    Extend with API integrations for VirusTotal, OTX, Shodan, etc.\r
    ""\"\r
\r
    def __init__(self):\r
        self.classifier = IOCClassifier()\r
        self.enriched: list[IOC] = []\r
\r
    def ingest(self, raw_indicators: list[str], source: str, tlp: TLP = TLP.AMBER) -> list[IOC]:\r
        ""\"Classify, validate, and enrich a list of raw indicators.""\"\r
        now = datetime.now(timezone.utc)\r
        results = []\r
\r
        for raw in raw_indicators:\r
            ioc_type = self.classifier.classify(raw)\r
            if ioc_type is None:\r
                continue  # Skip unrecognized indicators\r
\r
            # Skip private IPs\r
            if ioc_type in (IOCType.IPV4, IOCType.IPV6):\r
                if self.classifier.is_private_ip(raw):\r
                    continue\r
\r
            ioc = IOC(\r
                value=raw.strip().lower(),\r
                ioc_type=ioc_type,\r
                first_seen=now,\r
                last_seen=now,\r
                confidence=0.5,  # Default medium confidence\r
                tlp=tlp,\r
                source=source,\r
            )\r
\r
            # Enrich based on type\r
            ioc = self._enrich(ioc)\r
            results.append(ioc)\r
\r
        self.enriched.extend(results)\r
        return results\r
\r
    def _enrich(self, ioc: IOC) -> IOC:\r
        ""\"\r
        Enrich an IOC with context.\r
        Override this method to add API integrations.\r
        ""\"\r
        # Example: tag known malicious infrastructure patterns\r
        if ioc.ioc_type == IOCType.DOMAIN:\r
            if any(tld in ioc.value for tld in ['.xyz', '.top', '.buzz', '.click']):\r
                ioc.tags.append("suspicious-tld")\r
                ioc.confidence = min(ioc.confidence + 0.1, 1.0)\r
\r
        if ioc.ioc_type == IOCType.IPV4:\r
            # Flag hosting providers commonly used for C2\r
            ioc.context["geo_lookup_needed"] = True\r
\r
        return ioc\r
\r
    def export_stix_bundle(self) -> dict:\r
        ""\"Export all enriched IOCs as a STIX 2.1 bundle.""\"\r
        return {\r
            "type": "bundle",\r
            "id": f"bundle--{uuid.uuid4()}",\r
            "objects": [ioc.to_stix() for ioc in self.enriched],\r
        }\r
\r
    def export_csv(self) -> str:\r
        ""\"Export IOCs as CSV for SIEM ingestion.""\"\r
        lines = ["indicator,type,confidence,tags,first_seen,source"]\r
        for ioc in self.enriched:\r
            lines.append(\r
                f"{ioc.value},{ioc.ioc_type.value},{ioc.confidence},"\r
                f"{';'.join(ioc.tags)},{ioc.first_seen.isoformat()},{ioc.source}"\r
            )\r
        return "\\n".join(lines)\r
\r
\r
# Usage:\r
# pipeline = IOCEnrichmentPipeline()\r
# iocs = pipeline.ingest(\r
#     ["203.0.113.42", "evil-domain.xyz", "d7a8fbb307d7809469..."],\r
#     source="phishing-campaign-2024-01",\r
#     tlp=TLP.AMBER\r
# )\r
# print(pipeline.export_csv())\r
```\r
