### Sigma Detection Rules\r
```yaml\r
# Sigma Rule: Kerberoasting via Service Ticket Request\r
# Detects mass TGS requests indicative of Kerberoasting attacks\r
\r
title: Potential Kerberoasting Activity\r
id: a3f5b2d1-4e7c-8a9b-1234-567890abcdef\r
status: stable\r
level: high\r
description: |\r
  Detects when a single user requests an unusually high number of Kerberos\r
  service tickets (TGS) with RC4 encryption within a short time window.\r
  This pattern is characteristic of Kerberoasting, where an attacker\r
  requests service tickets to crack service account passwords offline.\r
author: Threat Intelligence Analyst\r
date: 2024/01/15\r
modified: 2024/06/01\r
references:\r
  - https://attack.mitre.org/techniques/T1558/003/\r
tags:\r
  - attack.credential_access\r
  - attack.t1558.003\r
logsource:\r
  product: windows\r
  service: security\r
detection:\r
  selection:\r
    EventID: 4769              # Kerberos Service Ticket Operation\r
    TicketEncryptionType: '0x17'  # RC4-HMAC (weak, targeted by Kerberoasting)\r
    Status: '0x0'              # Success\r
  filter_machine_accounts:\r
    ServiceName|endswith: '$'   # Exclude machine account tickets\r
  filter_krbtgt:\r
    ServiceName: 'krbtgt'       # Exclude TGT renewals\r
  condition: selection and not filter_machine_accounts and not filter_krbtgt | count(ServiceName) by TargetUserName > 10\r
  timeframe: 5m\r
falsepositives:\r
  - Vulnerability scanners that enumerate SPNs\r
  - Monitoring tools that query multiple services\r
  - Service account health checks (should use AES, not RC4)\r
\r
---\r
# Sigma Rule: Suspicious PowerShell Download Cradle\r
\r
title: PowerShell Download Cradle Execution\r
id: b4c6d3e2-5f8a-9b0c-2345-678901bcdef0\r
status: stable\r
level: high\r
description: |\r
  Detects common PowerShell download cradle patterns used by threat actors\r
  for initial payload delivery. Covers Net.WebClient, Invoke-WebRequest,\r
  Invoke-Expression combinations, and encoded command variants.\r
author: Threat Intelligence Analyst\r
date: 2024/01/15\r
references:\r
  - https://attack.mitre.org/techniques/T1059/001/\r
  - https://attack.mitre.org/techniques/T1105/\r
tags:\r
  - attack.execution\r
  - attack.t1059.001\r
  - attack.defense_evasion\r
  - attack.t1027\r
logsource:\r
  product: windows\r
  category: process_creation\r
detection:\r
  selection_powershell:\r
    Image|endswith:\r
      - '\\powershell.exe'\r
      - '\\pwsh.exe'\r
  selection_download_patterns:\r
    CommandLine|contains:\r
      - 'Net.WebClient'\r
      - 'DownloadString'\r
      - 'DownloadFile'\r
      - 'DownloadData'\r
      - 'Invoke-WebRequest'\r
      - 'iwr '\r
      - 'wget '\r
      - 'curl '\r
      - 'Start-BitsTransfer'\r
  selection_execution_patterns:\r
    CommandLine|contains:\r
      - 'Invoke-Expression'\r
      - 'iex '\r
      - 'IEX('\r
      - '| iex'\r
  selection_encoded:\r
    CommandLine|contains:\r
      - '-enc '\r
      - '-EncodedCommand'\r
      - '-e '\r
      - 'FromBase64String'\r
  condition: selection_powershell and\r
    (\r
      (selection_download_patterns and selection_execution_patterns) or\r
      (selection_download_patterns and selection_encoded) or\r
      (selection_encoded and selection_execution_patterns)\r
    )\r
falsepositives:\r
  - Legitimate software installation scripts\r
  - System management tools (SCCM, Intune)\r
  - Developer tooling that downloads dependencies\r
```\r
