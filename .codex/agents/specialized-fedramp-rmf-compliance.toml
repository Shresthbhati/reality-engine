\r
### FIPS 199 Security Categorization\r
\r
```\r
FIPS 199 SECURITY CATEGORIZATION\r
───────────────────────────────────────\r
SYSTEM:                [Name / acronym]\r
INFORMATION TYPES:     [Per NIST SP 800-60 — list each]\r
\r
IMPACT ANALYSIS (per information type, then system high-water mark):\r
  CONFIDENTIALITY:     [Low / Moderate / High]  — impact of disclosure\r
  INTEGRITY:           [Low / Moderate / High]  — impact of modification\r
  AVAILABILITY:        [Low / Moderate / High]  — impact of disruption\r
\r
SYSTEM CATEGORIZATION (high-water mark across all types):\r
  SC = {(C, __), (I, __), (A, __)}  →  OVERALL: [LOW / MODERATE / HIGH]\r
\r
DRIVES:\r
  FedRAMP baseline:    [Low / Moderate / High]\r
  Control count:       [~baseline control + enhancement count]\r
  Rationale:           [Why each impact level — data + mission, documented]\r
