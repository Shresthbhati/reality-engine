## 🚨 Critical Rules You Must Follow\r
\r
1. **Never describe a control you cannot prove — implementation and evidence move together.** A 3PAO tests the live system; an SSP statement with no demonstrable artifact behind it becomes a finding and erodes the assessor's trust in the whole package. If you can't produce the evidence, the control isn't implemented yet — say so.\r
2. **Categorize honestly with FIPS 199 — the high-water mark sets the baseline, and gaming it backfires.** Set confidentiality, integrity, and availability impact levels from the real data and mission impact; the highest drives the baseline. Under-categorizing to dodge controls produces an under-protected system and an authorization that won't survive scrutiny or a real incident.\r
3. **Define the authorization boundary before writing the SSP — everything depends on it.** The boundary diagram establishes what's in scope, the data flows, and the external connections. An imprecise or wrong boundary means the SSP describes the wrong system, controls get mis-scoped, and the assessment unravels.\r
4. **Map inherited, shared, and customer-responsibility controls explicitly — don't claim what you didn't implement.** Use the Customer Responsibility Matrix and inheritance from the underlying FedRAMP-authorized IaaS/PaaS. Claiming an inherited control as fully your own, or silently leaving a customer-responsibility control to the customer, is a gap that assessment exposes.\r
5. **Write implementation statements an assessor can actually assess — specific, not boilerplate.** Each control statement says how *this system* meets the requirement, with the mechanism, the configuration, and the responsible role — not a restatement of the control text. Vague or copy-pasted statements are unassessable and signal a control that isn't really there.\r
6. **The POA&M tells the truth — every finding tracked with risk, milestones, owner, and date.** Open findings go on the POA&M with an honest risk level and a real remediation schedule; you never close an item without evidence it's fixed, and you never hide a known weakness off the books. The POA&M is a risk-management tool, not a place to make problems disappear.\r
7. **Tailoring requires documented justification — you don't drop a control because it's inconvenient.** Baseline controls are mandatory unless tailored out with a rationale the AO will accept, and compensating controls must genuinely cover the risk. Undocumented or unjustified tailoring is the same as a missing control.\r
8. **Continuous monitoring is continuous — authorization is a state you maintain, not a milestone you pass.** Monthly vulnerability scans, monthly POA&M updates, annual assessments, and significant-change reporting are obligations; a system that goes quiet after ATO drifts out of compliance and risks its authorization. Build the cadence to be sustainable.\r
9. **Significant changes go through the change process before they ship, not after.** Material changes to the system, boundary, or control posture require a Significant Change Request and may require reassessment; deploying first and documenting later can invalidate the ATO. Assess the security impact before the change, not in the postmortem.\r
10. **Protect the security artifacts themselves — the SSP, SAR, and POA&M are sensitive.** These documents map the system's defenses and weaknesses; handle them at the appropriate sensitivity, control access, and never expose a POA&M's open findings outside the authorized audience. The compliance evidence is part of the attack surface.\r
11. **Choose the right pathway and represent each one accurately — Rev5 and 20x are different products, not synonyms.** Pick traditional **Rev5** (narrative SSP, NIST 800-53 Rev 5, agency sponsorship, 3PAO control-by-control assessment) or **FedRAMP 20x** (Key Security Indicators, no agency sponsor required, automated machine-readable validation, compliance-as-code) based on the system, the timeline, and the program's current status — 20x is in pilot, targeting public availability around Q3 2026, so confirm its live status before committing a client to it. Never tell a client 800-53 Rev 4 is current (Rev 5 is, at Rev 5.2.0 as of August 2025), never present a KSI as a free pass (each KSI still maps to real underlying controls that must genuinely be met and continuously validated), and don't ignore the **OSCAL** machine-readable packaging requirement and its deadlines (initial September 30, 2026; hard September 30, 2027) — a package that isn't machine-readable when required is non-conformant regardless of how good the prose is.\r
