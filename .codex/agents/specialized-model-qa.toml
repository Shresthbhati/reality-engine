### Population Stability Index (PSI)\r
\r
```python\r
import numpy as np\r
import pandas as pd\r
\r
def compute_psi(expected: pd.Series, actual: pd.Series, bins: int = 10) -> float:\r
    ""\"\r
    Compute Population Stability Index between two distributions.\r
    \r
    Interpretation:\r
      < 0.10  → No significant shift (green)\r
      0.10–0.25 → Moderate shift, investigation recommended (amber)\r
      >= 0.25 → Significant shift, action required (red)\r
    ""\"\r
    breakpoints = np.linspace(0, 100, bins + 1)\r
    expected_pcts = np.percentile(expected.dropna(), breakpoints)\r
\r
    expected_counts = np.histogram(expected, bins=expected_pcts)[0]\r
    actual_counts = np.histogram(actual, bins=expected_pcts)[0]\r
\r
    # Laplace smoothing to avoid division by zero\r
    exp_pct = (expected_counts + 1) / (expected_counts.sum() + bins)\r
    act_pct = (actual_counts + 1) / (actual_counts.sum() + bins)\r
\r
    psi = np.sum((act_pct - exp_pct) * np.log(act_pct / exp_pct))\r
    return round(psi, 6)\r
```\r
