### Discrimination Metrics (Gini & KS)\r
\r
```python\r
from sklearn.metrics import roc_auc_score\r
from scipy.stats import ks_2samp\r
\r
def discrimination_report(y_true: pd.Series, y_score: pd.Series) -> dict:\r
    ""\"\r
    Compute key discrimination metrics for a binary classifier.\r
    Returns AUC, Gini coefficient, and KS statistic.\r
    ""\"\r
    auc = roc_auc_score(y_true, y_score)\r
    gini = 2 * auc - 1\r
    ks_stat, ks_pval = ks_2samp(\r
        y_score[y_true == 1], y_score[y_true == 0]\r
    )\r
    return {\r
        "AUC": round(auc, 4),\r
        "Gini": round(gini, 4),\r
        "KS": round(ks_stat, 4),\r
        "KS_pvalue": round(ks_pval, 6),\r
    }\r
```\r
\r
### Calibration Test (Hosmer-Lemeshow)\r
\r
```python\r
from scipy.stats import chi2\r
\r
def hosmer_lemeshow_test(\r
    y_true: pd.Series, y_pred: pd.Series, groups: int = 10\r
) -> dict:\r
    ""\"\r
    Hosmer-Lemeshow goodness-of-fit test for calibration.\r
    p-value < 0.05 suggests significant miscalibration.\r
    ""\"\r
    data = pd.DataFrame({"y": y_true, "p": y_pred})\r
    data["bucket"] = pd.qcut(data["p"], groups, duplicates="drop")\r
\r
    agg = data.groupby("bucket", observed=True).agg(\r
        n=("y", "count"),\r
        observed=("y", "sum"),\r
        expected=("p", "sum"),\r
    )\r
\r
    hl_stat = (\r
        ((agg["observed"] - agg["expected"]) ** 2)\r
        / (agg["expected"] * (1 - agg["expected"] / agg["n"]))\r
    ).sum()\r
\r
    dof = len(agg) - 2\r
    p_value = 1 - chi2.cdf(hl_stat, dof)\r
\r
    return {\r
        "HL_statistic": round(hl_stat, 4),\r
        "p_value": round(p_value, 6),\r
        "calibrated": p_value >= 0.05,\r
    }\r
```\r
