### SHAP Feature Importance Analysis\r
\r
```python\r
import shap\r
import matplotlib.pyplot as plt\r
\r
def shap_global_analysis(model, X: pd.DataFrame, output_dir: str = "."):\r
    ""\"\r
    Global interpretability via SHAP values.\r
    Produces summary plot (beeswarm) and bar plot of mean |SHAP|.\r
    Works with tree-based models (XGBoost, LightGBM, RF) and\r
    falls back to KernelExplainer for other model types.\r
    ""\"\r
    try:\r
        explainer = shap.TreeExplainer(model)\r
    except Exception:\r
        explainer = shap.KernelExplainer(\r
            model.predict_proba, shap.sample(X, 100)\r
        )\r
\r
    shap_values = explainer.shap_values(X)\r
\r
    # If multi-output, take positive class\r
    if isinstance(shap_values, list):\r
        shap_values = shap_values[1]\r
\r
    # Beeswarm: shows value direction + magnitude per feature\r
    shap.summary_plot(shap_values, X, show=False)\r
    plt.tight_layout()\r
    plt.savefig(f"{output_dir}/shap_beeswarm.png", dpi=150)\r
    plt.close()\r
\r
    # Bar: mean absolute SHAP per feature\r
    shap.summary_plot(shap_values, X, plot_type="bar", show=False)\r
    plt.tight_layout()\r
    plt.savefig(f"{output_dir}/shap_importance.png", dpi=150)\r
    plt.close()\r
\r
    # Return feature importance ranking\r
    importance = pd.DataFrame({\r
        "feature": X.columns,\r
        "mean_abs_shap": np.abs(shap_values).mean(axis=0),\r
    }).sort_values("mean_abs_shap", ascending=False)\r
\r
    return importance\r
\r
\r
def shap_local_explanation(model, X: pd.DataFrame, idx: int):\r
    ""\"\r
    Local interpretability: explain a single prediction.\r
    Produces a waterfall plot showing how each feature pushed\r
    the prediction from the base value.\r
    ""\"\r
    try:\r
        explainer = shap.TreeExplainer(model)\r
    except Exception:\r
        explainer = shap.KernelExplainer(\r
            model.predict_proba, shap.sample(X, 100)\r
        )\r
\r
    explanation = explainer(X.iloc[[idx]])\r
    shap.plots.waterfall(explanation[0], show=False)\r
    plt.tight_layout()\r
    plt.savefig(f"shap_waterfall_obs_{idx}.png", dpi=150)\r
    plt.close()\r
```\r
