### Partial Dependence Plots (PDP)\r
\r
```python\r
from sklearn.inspection import PartialDependenceDisplay\r
\r
def pdp_analysis(\r
    model,\r
    X: pd.DataFrame,\r
    features: list[str],\r
    output_dir: str = ".",\r
    grid_resolution: int = 50,\r
):\r
    ""\"\r
    Partial Dependence Plots for top features.\r
    Shows the marginal effect of each feature on the prediction,\r
    averaging out all other features.\r
    \r
    Use for:\r
    - Verifying monotonic relationships where expected\r
    - Detecting non-linear thresholds the model learned\r
    - Comparing PDP shapes across train vs. OOT for stability\r
    ""\"\r
    for feature in features:\r
        fig, ax = plt.subplots(figsize=(8, 5))\r
        PartialDependenceDisplay.from_estimator(\r
            model, X, [feature],\r
            grid_resolution=grid_resolution,\r
            ax=ax,\r
        )\r
        ax.set_title(f"Partial Dependence - {feature}")\r
        fig.tight_layout()\r
        fig.savefig(f"{output_dir}/pdp_{feature}.png", dpi=150)\r
        plt.close(fig)\r
\r
\r
def pdp_interaction(\r
    model,\r
    X: pd.DataFrame,\r
    feature_pair: tuple[str, str],\r
    output_dir: str = ".",\r
):\r
    ""\"\r
    2D Partial Dependence Plot for feature interactions.\r
    Reveals how two features jointly affect predictions.\r
    ""\"\r
    fig, ax = plt.subplots(figsize=(8, 6))\r
    PartialDependenceDisplay.from_estimator(\r
        model, X, [feature_pair], ax=ax\r
    )\r
    ax.set_title(f"PDP Interaction - {feature_pair[0]} × {feature_pair[1]}")\r
    fig.tight_layout()\r
    fig.savefig(\r
        f"{output_dir}/pdp_interact_{'_'.join(feature_pair)}.png", dpi=150\r
    )\r
    plt.close(fig)\r
```\r
\r
### Variable Stability Monitor\r
\r
```python\r
def variable_stability_report(\r
    df: pd.DataFrame,\r
    date_col: str,\r
    variables: list[str],\r
    psi_threshold: float = 0.25,\r
) -> pd.DataFrame:\r
    ""\"\r
    Monthly stability report for model features.\r
    Flags variables exceeding PSI threshold vs. the first observed period.\r
    ""\"\r
    periods = sorted(df[date_col].unique())\r
    baseline = df[df[date_col] == periods[0]]\r
\r
    results = []\r
    for var in variables:\r
        for period in periods[1:]:\r
            current = df[df[date_col] == period]\r
            psi = compute_psi(baseline[var], current[var])\r
            results.append({\r
                "variable": var,\r
                "period": period,\r
                "psi": psi,\r
                "flag": "🔴" if psi >= psi_threshold else (\r
                    "🟡" if psi >= 0.10 else "🟢"\r
                ),\r
            })\r
\r
    return pd.DataFrame(results).pivot_table(\r
        index="variable", columns="period", values="psi"\r
    ).round(4)\r
```\r
