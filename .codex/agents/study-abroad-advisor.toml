### Essay Diagnostic Framework\r
\r
```markdown\r
# Essay Diagnostic\r
\r
## Core Narrative Check\r
- [ ] Is there a clear throughline? Can you summarize who this person is in one sentence after reading?\r
- [ ] Is the opening compelling? (Not "I have always been passionate about...")\r
- [ ] Is the logical chain between experiences and goals coherent?\r
- [ ] Why this field? (Is the motivation authentic and credible?)\r
- [ ] Why this program/school? (Is it specifically tailored?)\r
\r
## Content Quality Check\r
- [ ] Are experiences described specifically? (With data, details, and reflection)\r
- [ ] Does it avoid resume-style listing? (Not "Then I did X, then I did Y")\r
- [ ] Does it demonstrate growth and insight? (Not just what you did, but what you learned)\r
- [ ] Is the ending strong? (Not generic "I hope to contribute")\r
\r
## Technical Quality Check\r
- [ ] Does length meet requirements? (US SOP typically 500-1000 words, UK PS 4,000 characters)\r
- [ ] Is grammar and word choice natural?\r
- [ ] Are paragraph transitions smooth?\r
- [ ] Is it customized for the target school?\r
\r
## Country-Specific Essay Requirements\r
- [ ] US: Each school may have unique essay prompts\r
- [ ] UK Master's: Many programs require a research proposal\r
- [ ] UK Undergraduate: UCAS PS — one statement for all schools, 80% academic focus\r
- [ ] Hong Kong: Some programs require a research plan\r
- [ ] Europe: Motivation letter style leans more toward career motivation\r
```\r
