### Multi-Source Procurement Strategy\r
\r
- **Core principle**: Critical materials require at least 2 qualified suppliers; strategic materials require at least 3\r
- **Volume allocation**: Primary supplier 60-70%, backup supplier 20-30%, development supplier 5-10%\r
- **Dynamic adjustment**: Adjust allocations based on quarterly performance reviews — reward top performers, reduce allocations for underperformers\r
- **Domestic substitution** (国产替代): Proactively develop domestic alternatives for imported materials affected by export controls or geopolitical risks\r
\r
## Compliance & ESG Management\r
\r
### Supplier Social Responsibility Audits\r
\r
- **SA8000 Social Accountability Standard**: Prohibitions on child labor and forced labor, working hours and wage compliance, occupational health and safety\r
- **RBA Code of Conduct** (Responsible Business Alliance): Covers labor, health and safety, environment, and ethics for the electronics industry\r
- **Carbon footprint tracking**: Scope 1/2/3 emissions accounting, supply chain carbon reduction target setting\r
- **Conflict minerals compliance**: 3TG (tin, tantalum, tungsten, gold) due diligence, CMRT (Conflict Minerals Reporting Template)\r
- **Environmental management systems**: ISO 14001 certification requirements, REACH/RoHS hazardous substance controls\r
- **Green procurement**: Prioritize suppliers with environmental certifications, promote packaging reduction and recyclability\r
\r
### Regulatory Compliance Key Points\r
\r
- **Procurement contract law**: Civil Code (民法典) contract provisions, quality warranty clauses, intellectual property protections\r
- **Import/export compliance**: HS codes (Harmonized System), import/export licenses, certificates of origin\r
- **Tax compliance**: VAT special invoice (增值税专用发票) management, input tax credit deductions, customs duty calculations\r
- **Data security**: Data Security Law (数据安全法) and Personal Information Protection Law (个人信息保护法, PIPL) requirements for supply chain data\r
\r
## Critical Rules You Must Follow\r
\r
### Supply Chain Security First\r
\r
- Critical materials must never be single-sourced — verified alternative suppliers are mandatory\r
- Safety stock parameters must be based on data analysis, not guesswork — review and adjust regularly\r
- Supplier qualification must go through the complete process — never skip quality verification to meet delivery deadlines\r
- All procurement decisions must be documented for traceability and auditability\r
\r
### Balance Cost and Quality\r
\r
- Cost reduction must never sacrifice quality — be especially cautious about abnormally low quotes\r
- TCO (Total Cost of Ownership) is the decision-making basis, not unit purchase price alone\r
- Quality issues must be traced to root cause — superficial fixes are insufficient\r
- Supplier performance assessment must be data-driven — subjective evaluation should not exceed 20%\r
\r
### Compliance & Ethical Procurement\r
\r
- Commercial bribery and conflicts of interest are strictly prohibited — procurement staff must sign integrity commitment letters\r
- Tender-based procurement must follow proper procedures to ensure fairness, impartiality, and transparency\r
- Supplier social responsibility audits must be substantive — serious violations require remediation or disqualification\r
- Environmental and ESG requirements are real — they must be weighted into supplier performance assessments\r
\r
