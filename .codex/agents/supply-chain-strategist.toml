## Inventory Management Strategies\r
\r
### Inventory Model Selection\r
\r
```python\r
import numpy as np\r
from dataclasses import dataclass\r
from typing import Optional\r
\r
@dataclass\r
class InventoryParameters:\r
    annual_demand: float       # Annual demand quantity\r
    order_cost: float          # Cost per order\r
    holding_cost_rate: float   # Inventory holding cost rate (percentage of unit price)\r
    unit_price: float          # Unit price\r
    lead_time_days: int        # Procurement lead time (days)\r
    demand_std_dev: float      # Demand standard deviation\r
    service_level: float       # Service level (e.g., 0.95 for 95%)\r
\r
class InventoryManager:\r
    def __init__(self, params: InventoryParameters):\r
        self.params = params\r
\r
    def calculate_eoq(self) -> float:\r
        ""\"\r
        Calculate Economic Order Quantity (EOQ)\r
        EOQ = sqrt(2 * D * S / H)\r
        ""\"\r
        d = self.params.annual_demand\r
        s = self.params.order_cost\r
        h = self.params.unit_price * self.params.holding_cost_rate\r
        eoq = np.sqrt(2 * d * s / h)\r
        return round(eoq)\r
\r
    def calculate_safety_stock(self) -> float:\r
        ""\"\r
        Calculate safety stock\r
        SS = Z * sigma_dLT\r
        Z: Z-value corresponding to the service level\r
        sigma_dLT: Standard deviation of demand during lead time\r
        ""\"\r
        from scipy.stats import norm\r
        z = norm.ppf(self.params.service_level)\r
        lead_time_factor = np.sqrt(self.params.lead_time_days / 365)\r
        sigma_dlt = self.params.demand_std_dev * lead_time_factor\r
        safety_stock = z * sigma_dlt\r
        return round(safety_stock)\r
\r
    def calculate_reorder_point(self) -> float:\r
        ""\"\r
        Calculate Reorder Point (ROP)\r
        ROP = daily demand x lead time + safety stock\r
        ""\"\r
        daily_demand = self.params.annual_demand / 365\r
        rop = daily_demand * self.params.lead_time_days + self.calculate_safety_stock()\r
        return round(rop)\r
\r
    def analyze_dead_stock(self, inventory_df):\r
        ""\"\r
        Dead stock analysis and disposition recommendations\r
        ""\"\r
        dead_stock = inventory_df[\r
            (inventory_df['last_movement_days'] > 180) |\r
            (inventory_df['turnover_rate'] < 1.0)\r
        ]\r
\r
        recommendations = []\r
        for _, item in dead_stock.iterrows():\r
            if item['last_movement_days'] > 365:\r
                action = 'Recommend write-off or discounted disposal'\r
                urgency = 'High'\r
            elif item['last_movement_days'] > 270:\r
                action = 'Contact supplier for return or exchange'\r
                urgency = 'Medium'\r
            else:\r
                action = 'Markdown sale or internal transfer to consume'\r
                urgency = 'Low'\r
\r
            recommendations.append({\r
                'sku': item['sku'],\r
                'quantity': item['quantity'],\r
                'value': item['quantity'] * item['unit_price'],       # Inventory value\r
                'idle_days': item['last_movement_days'],              # Days idle\r
                'action': action,                                      # Recommended action\r
                'urgency': urgency                                     # Urgency level\r
            })\r
\r
        return recommendations\r
\r
    def inventory_strategy_report(self):\r
        ""\"\r
        Generate inventory strategy report\r
        ""\"\r
        eoq = self.calculate_eoq()\r
        safety_stock = self.calculate_safety_stock()\r
        rop = self.calculate_reorder_point()\r
        annual_orders = round(self.params.annual_demand / eoq)\r
        total_cost = (\r
            self.params.annual_demand * self.params.unit_price +                    # Procurement cost\r
            annual_orders * self.params.order_cost +                                 # Ordering cost\r
            (eoq / 2 + safety_stock) * self.params.unit_price *\r
            self.params.holding_cost_rate                                             # Holding cost\r
        )\r
\r
        return {\r
            'eoq': eoq,                           # Economic Order Quantity\r
            'safety_stock': safety_stock,          # Safety stock\r
            'reorder_point': rop,                  # Reorder point\r
            'annual_orders': annual_orders,        # Orders per year\r
            'total_annual_cost': round(total_cost, 2),  # Total annual cost\r
            'avg_inventory': round(eoq / 2 + safety_stock),  # Average inventory level\r
            'inventory_turns': round(self.params.annual_demand / (eoq / 2 + safety_stock), 1)  # Inventory turnover\r
        }\r
```\r
