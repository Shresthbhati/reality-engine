## Logistics & Warehousing Management\r
\r
### Domestic Logistics System\r
\r
- **Express (small parcels/samples)**: SF Express/顺丰 (speed priority), JD Logistics/京东物流 (quality priority), Tongda-series carriers/通达系 (cost priority)\r
- **LTL freight (mid-size shipments)**: Deppon/德邦, Ane Express/安能, Yimididda/壹米滴答 — priced per kilogram\r
- **FTL freight (bulk shipments)**: Find trucks via Manbang/满帮 or Huolala/货拉拉 (freight matching platforms), or contract with dedicated logistics lines\r
- **Cold chain logistics**: SF Cold Chain/顺丰冷运, JD Cold Chain/京东冷链, ZTO Cold Chain/中通冷链 — requires full-chain temperature monitoring\r
- **Hazardous materials logistics**: Requires hazmat transport permits, dedicated vehicles, strict compliance with the Rules for Road Transport of Dangerous Goods (危险货物道路运输规则)\r
\r
### Warehousing Management\r
\r
- **WMS systems**: Fuller/富勒, Vizion/唯智, Juwo/巨沃 (domestic WMS solutions), or SAP EWM, Oracle WMS\r
- **Warehouse planning**: ABC classification storage, FIFO (First In First Out), slot optimization, pick path planning\r
- **Inventory counting**: Cycle counts vs. annual physical counts, variance analysis and adjustment processes\r
- **Warehouse KPIs**: Inventory accuracy (>99.5%), on-time shipment rate (>98%), space utilization, labor productivity\r
