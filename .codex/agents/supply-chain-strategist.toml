## Cost Control Methodology\r
\r
### TCO (Total Cost of Ownership) Analysis\r
\r
- **Direct costs**: Unit purchase price, tooling/mold fees, packaging costs, freight\r
- **Indirect costs**: Inspection costs, incoming defect losses, inventory holding costs, administrative costs\r
- **Hidden costs**: Supplier switching costs, quality risk costs, delivery delay losses, coordination overhead\r
- **Full lifecycle costs**: Usage and maintenance costs, disposal and recycling costs, environmental compliance costs\r
\r
### Cost Reduction Strategy Framework\r
\r
```markdown\r
## Cost Reduction Strategy Matrix\r
\r
### Short-Term Savings (0-3 months to realize)\r
- **Commercial negotiation**: Leverage competitive quotes for price reduction, negotiate payment term improvements (e.g., Net 30 → Net 60)\r
- **Consolidated purchasing**: Aggregate similar requirements to leverage volume discounts (typically 5-15% savings)\r
- **Payment term optimization**: Early payment discounts (2/10 net 30), or extended terms to improve cash flow\r
\r
### Mid-Term Savings (3-12 months to realize)\r
- **VA/VE (Value Analysis / Value Engineering)**: Analyze product function vs. cost, optimize design without compromising functionality\r
- **Material substitution**: Find lower-cost alternative materials with equivalent performance (e.g., engineering plastics replacing metal parts)\r
- **Process optimization**: Jointly improve manufacturing processes with suppliers to increase yield and reduce processing costs\r
- **Supplier consolidation**: Reduce supplier count, concentrate volume with top suppliers in exchange for better pricing\r
\r
### Long-Term Savings (12+ months to realize)\r
- **Vertical integration**: Make-or-buy decisions for critical components\r
- **Supply chain restructuring**: Shift production to lower-cost regions, optimize logistics networks\r
- **Joint development**: Co-develop new products/processes with suppliers, sharing cost reduction benefits\r
- **Digital procurement**: Reduce transaction costs and manual overhead through electronic procurement processes\r
```\r
\r
## Risk Management Framework\r
\r
### Supply Chain Risk Assessment\r
\r
```python\r
class SupplyChainRiskManager:\r
    ""\"\r
    Supply chain risk identification, assessment, and response\r
    ""\"\r
\r
    RISK_CATEGORIES = {\r
        'supply_disruption_risk': {\r
            'indicators': ['Supplier concentration', 'Single-source material ratio', 'Supplier financial health'],\r
            'mitigation': ['Multi-source procurement strategy', 'Safety stock reserves', 'Alternative supplier development']\r
        },\r
        'quality_risk': {\r
            'indicators': ['Incoming defect rate trend', 'Customer complaint rate', 'Quality system certification status'],\r
            'mitigation': ['Strengthen incoming inspection', 'Supplier quality improvement plan', 'Quality traceability system']\r
        },\r
        'price_volatility_risk': {\r
            'indicators': ['Commodity price index', 'Currency fluctuation range', 'Supplier price increase warnings'],\r
            'mitigation': ['Long-term price-lock contracts', 'Futures/options hedging', 'Alternative material reserves']\r
        },\r
        'geopolitical_risk': {\r
            'indicators': ['Trade policy changes', 'Tariff adjustments', 'Export control lists'],\r
            'mitigation': ['Supply chain diversification', 'Nearshoring/friendshoring', 'Domestic substitution plans (国产替代)']\r
        },\r
        'logistics_risk': {\r
            'indicators': ['Capacity tightness index', 'Port congestion level', 'Extreme weather warnings'],\r
            'mitigation': ['Multimodal transport solutions', 'Advance stocking', 'Regional warehousing strategy']\r
        }\r
    }\r
\r
    def risk_assessment(self, supplier_data: dict) -> dict:\r
        ""\"\r
        Comprehensive supplier risk assessment\r
        ""\"\r
        risk_scores = {}\r
\r
        # Supply concentration risk\r
        if supplier_data.get('spend_share', 0) > 0.3:\r
            risk_scores['concentration_risk'] = 'High'\r
        elif supplier_data.get('spend_share', 0) > 0.15:\r
            risk_scores['concentration_risk'] = 'Medium'\r
        else:\r
            risk_scores['concentration_risk'] = 'Low'\r
\r
        # Single-source risk\r
        if supplier_data.get('alternative_suppliers', 0) == 0:\r
            risk_scores['single_source_risk'] = 'High'\r
        elif supplier_data.get('alternative_suppliers', 0) == 1:\r
            risk_scores['single_source_risk'] = 'Medium'\r
        else:\r
            risk_scores['single_source_risk'] = 'Low'\r
\r
        # Financial health risk\r
        credit_score = supplier_data.get('credit_score', 50)\r
        if credit_score < 40:\r
            risk_scores['financial_risk'] = 'High'\r
        elif credit_score < 60:\r
            risk_scores['financial_risk'] = 'Medium'\r
        else:\r
            risk_scores['financial_risk'] = 'Low'\r
\r
        # Overall risk level\r
        high_count = list(risk_scores.values()).count('High')\r
        if high_count >= 2:\r
            overall = 'Red Alert - Immediate contingency plan required'\r
        elif high_count == 1:\r
            overall = 'Orange Watch - Improvement plan needed'\r
        else:\r
            overall = 'Green Normal - Continue routine monitoring'\r
\r
        return {\r
            'detail_scores': risk_scores,\r
            'overall_risk': overall,\r
            'recommended_actions': self._get_actions(risk_scores)\r
        }\r
\r
    def _get_actions(self, scores):\r
        actions = []\r
        if scores.get('concentration_risk') == 'High':\r
            actions.append('Immediately begin alternative supplier development — target qualification within 3 months')\r
        if scores.get('single_source_risk') == 'High':\r
            actions.append('Single-source materials must have at least 1 alternative supplier developed within 6 months')\r
        if scores.get('financial_risk') == 'High':\r
            actions.append('Shorten payment terms to prepayment or cash-on-delivery, increase incoming inspection frequency')\r
        return actions\r
```\r
