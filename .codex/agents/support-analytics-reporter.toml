### Customer Segmentation Analysis\r
```python\r
import pandas as pd\r
import numpy as np\r
from sklearn.cluster import KMeans\r
import matplotlib.pyplot as plt\r
import seaborn as sns\r
\r
# Customer Lifetime Value and Segmentation\r
def customer_segmentation_analysis(df):\r
    ""\"\r
    Perform RFM analysis and customer segmentation\r
    ""\"\r
    # Calculate RFM metrics\r
    current_date = df['date'].max()\r
    rfm = df.groupby('customer_id').agg({\r
        'date': lambda x: (current_date - x.max()).days,  # Recency\r
        'order_id': 'count',                               # Frequency\r
        'revenue': 'sum'                                   # Monetary\r
    }).rename(columns={\r
        'date': 'recency',\r
        'order_id': 'frequency', \r
        'revenue': 'monetary'\r
    })\r
    \r
    # Create RFM scores\r
    rfm['r_score'] = pd.qcut(rfm['recency'], 5, labels=[5,4,3,2,1])\r
    rfm['f_score'] = pd.qcut(rfm['frequency'].rank(method='first'), 5, labels=[1,2,3,4,5])\r
    rfm['m_score'] = pd.qcut(rfm['monetary'], 5, labels=[1,2,3,4,5])\r
    \r
    # Customer segments\r
    rfm['rfm_score'] = rfm['r_score'].astype(str) + rfm['f_score'].astype(str) + rfm['m_score'].astype(str)\r
    \r
    def segment_customers(row):\r
        if row['rfm_score'] in ['555', '554', '544', '545', '454', '455', '445']:\r
            return 'Champions'\r
        elif row['rfm_score'] in ['543', '444', '435', '355', '354', '345', '344', '335']:\r
            return 'Loyal Customers'\r
        elif row['rfm_score'] in ['553', '551', '552', '541', '542', '533', '532', '531', '452', '451']:\r
            return 'Potential Loyalists'\r
        elif row['rfm_score'] in ['512', '511', '422', '421', '412', '411', '311']:\r
            return 'New Customers'\r
        elif row['rfm_score'] in ['155', '154', '144', '214', '215', '115', '114']:\r
            return 'At Risk'\r
        elif row['rfm_score'] in ['155', '154', '144', '214', '215', '115', '114']:\r
            return 'Cannot Lose Them'\r
        else:\r
            return 'Others'\r
    \r
    rfm['segment'] = rfm.apply(segment_customers, axis=1)\r
    \r
    return rfm\r
\r
# Generate insights and recommendations\r
def generate_customer_insights(rfm_df):\r
    insights = {\r
        'total_customers': len(rfm_df),\r
        'segment_distribution': rfm_df['segment'].value_counts(),\r
        'avg_clv_by_segment': rfm_df.groupby('segment')['monetary'].mean(),\r
        'recommendations': {\r
            'Champions': 'Reward loyalty, ask for referrals, upsell premium products',\r
            'Loyal Customers': 'Nurture relationship, recommend new products, loyalty programs',\r
            'At Risk': 'Re-engagement campaigns, special offers, win-back strategies',\r
            'New Customers': 'Onboarding optimization, early engagement, product education'\r
        }\r
    }\r
    return insights\r
```\r
