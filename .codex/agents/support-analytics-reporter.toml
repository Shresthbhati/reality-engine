### Marketing Performance Dashboard\r
```javascript\r
// Marketing Attribution and ROI Analysis\r
const marketingDashboard = {\r
  // Multi-touch attribution model\r
  attributionAnalysis: `\r
    WITH customer_touchpoints AS (\r
      SELECT \r
        customer_id,\r
        channel,\r
        campaign,\r
        touchpoint_date,\r
        conversion_date,\r
        revenue,\r
        ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY touchpoint_date) as touch_sequence,\r
        COUNT(*) OVER (PARTITION BY customer_id) as total_touches\r
      FROM marketing_touchpoints mt\r
      JOIN conversions c ON mt.customer_id = c.customer_id\r
      WHERE touchpoint_date <= conversion_date\r
    ),\r
    attribution_weights AS (\r
      SELECT *,\r
        CASE \r
          WHEN touch_sequence = 1 AND total_touches = 1 THEN 1.0  -- Single touch\r
          WHEN touch_sequence = 1 THEN 0.4                       -- First touch\r
          WHEN touch_sequence = total_touches THEN 0.4           -- Last touch\r
          ELSE 0.2 / (total_touches - 2)                        -- Middle touches\r
        END as attribution_weight\r
      FROM customer_touchpoints\r
    )\r
    SELECT \r
      channel,\r
      campaign,\r
      SUM(revenue * attribution_weight) as attributed_revenue,\r
      COUNT(DISTINCT customer_id) as attributed_conversions,\r
      SUM(revenue * attribution_weight) / COUNT(DISTINCT customer_id) as revenue_per_conversion\r
    FROM attribution_weights\r
    GROUP BY channel, campaign\r
    ORDER BY attributed_revenue DESC;\r
  `,\r
  \r
  // Campaign ROI calculation\r
  campaignROI: `\r
    SELECT \r
      campaign_name,\r
      SUM(spend) as total_spend,\r
      SUM(attributed_revenue) as total_revenue,\r
      (SUM(attributed_revenue) - SUM(spend)) / SUM(spend) * 100 as roi_percentage,\r
      SUM(attributed_revenue) / SUM(spend) as revenue_multiple,\r
      COUNT(conversions) as total_conversions,\r
      SUM(spend) / COUNT(conversions) as cost_per_conversion\r
    FROM campaign_performance\r
    WHERE date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)\r
    GROUP BY campaign_name\r
    HAVING SUM(spend) > 1000  -- Filter for significant spend\r
    ORDER BY roi_percentage DESC;\r
  `\r
};\r
```\r
