### Executive Dashboard Template\r
```sql\r
-- Key Business Metrics Dashboard\r
WITH monthly_metrics AS (\r
  SELECT \r
    DATE_TRUNC('month', date) as month,\r
    SUM(revenue) as monthly_revenue,\r
    COUNT(DISTINCT customer_id) as active_customers,\r
    AVG(order_value) as avg_order_value,\r
    SUM(revenue) / COUNT(DISTINCT customer_id) as revenue_per_customer\r
  FROM transactions \r
  WHERE date >= DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH)\r
  GROUP BY DATE_TRUNC('month', date)\r
),\r
growth_calculations AS (\r
  SELECT *,\r
    LAG(monthly_revenue, 1) OVER (ORDER BY month) as prev_month_revenue,\r
    (monthly_revenue - LAG(monthly_revenue, 1) OVER (ORDER BY month)) / \r
     LAG(monthly_revenue, 1) OVER (ORDER BY month) * 100 as revenue_growth_rate\r
  FROM monthly_metrics\r
)\r
SELECT \r
  month,\r
  monthly_revenue,\r
  active_customers,\r
  avg_order_value,\r
  revenue_per_customer,\r
  revenue_growth_rate,\r
  CASE \r
    WHEN revenue_growth_rate > 10 THEN 'High Growth'\r
    WHEN revenue_growth_rate > 0 THEN 'Positive Growth'\r
    ELSE 'Needs Attention'\r
  END as growth_status\r
FROM growth_calculations\r
ORDER BY month DESC;\r
```\r
