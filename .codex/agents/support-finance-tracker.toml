### Investment Analysis Framework\r
```python\r
class InvestmentAnalyzer:\r
    def __init__(self, discount_rate=0.10):\r
        self.discount_rate = discount_rate\r
    \r
    def calculate_npv(self, cash_flows, initial_investment):\r
        ""\"\r
        Calculate Net Present Value for investment decision\r
        ""\"\r
        npv = -initial_investment\r
        for i, cf in enumerate(cash_flows):\r
            npv += cf / ((1 + self.discount_rate) ** (i + 1))\r
        return npv\r
    \r
    def calculate_irr(self, cash_flows, initial_investment):\r
        ""\"\r
        Calculate Internal Rate of Return\r
        ""\"\r
        from scipy.optimize import fsolve\r
        \r
        def npv_function(rate):\r
            return sum([cf / ((1 + rate) ** (i + 1)) for i, cf in enumerate(cash_flows)]) - initial_investment\r
        \r
        try:\r
            irr = fsolve(npv_function, 0.1)[0]\r
            return irr\r
        except:\r
            return None\r
    \r
    def payback_period(self, cash_flows, initial_investment):\r
        ""\"\r
        Calculate payback period in years\r
        ""\"\r
        cumulative_cf = 0\r
        for i, cf in enumerate(cash_flows):\r
            cumulative_cf += cf\r
            if cumulative_cf >= initial_investment:\r
                return i + 1 - ((cumulative_cf - initial_investment) / cf)\r
        return None\r
    \r
    def investment_analysis_report(self, project_name, initial_investment, annual_cash_flows, project_life):\r
        ""\"\r
        Comprehensive investment analysis\r
        ""\"\r
        npv = self.calculate_npv(annual_cash_flows, initial_investment)\r
        irr = self.calculate_irr(annual_cash_flows, initial_investment)\r
        payback = self.payback_period(annual_cash_flows, initial_investment)\r
        roi = (sum(annual_cash_flows) - initial_investment) / initial_investment * 100\r
        \r
        # Risk assessment\r
        risk_score = self.assess_investment_risk(annual_cash_flows, project_life)\r
        \r
        return {\r
            'project_name': project_name,\r
            'initial_investment': initial_investment,\r
            'npv': npv,\r
            'irr': irr * 100 if irr else None,\r
            'payback_period': payback,\r
            'roi_percentage': roi,\r
            'risk_score': risk_score,\r
            'recommendation': self.get_investment_recommendation(npv, irr, payback, risk_score)\r
        }\r
    \r
    def get_investment_recommendation(self, npv, irr, payback, risk_score):\r
        ""\"\r
        Generate investment recommendation based on analysis\r
        ""\"\r
        if npv > 0 and irr and irr > self.discount_rate and payback and payback < 3:\r
            if risk_score < 3:\r
                return "STRONG BUY - Excellent returns with acceptable risk"\r
            else:\r
                return "BUY - Good returns but monitor risk factors"\r
        elif npv > 0 and irr and irr > self.discount_rate:\r
            return "CONDITIONAL BUY - Positive returns, evaluate against alternatives"\r
        else:\r
            return "DO NOT INVEST - Returns do not justify investment"\r
```\r
