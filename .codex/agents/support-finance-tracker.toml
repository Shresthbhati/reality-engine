### Comprehensive Budget Framework\r
```sql\r
-- Annual Budget with Quarterly Variance Analysis\r
WITH budget_actuals AS (\r
  SELECT \r
    department,\r
    category,\r
    budget_amount,\r
    actual_amount,\r
    DATE_TRUNC('quarter', date) as quarter,\r
    budget_amount - actual_amount as variance,\r
    (actual_amount - budget_amount) / budget_amount * 100 as variance_percentage\r
  FROM financial_data \r
  WHERE fiscal_year = YEAR(CURRENT_DATE())\r
),\r
department_summary AS (\r
  SELECT \r
    department,\r
    quarter,\r
    SUM(budget_amount) as total_budget,\r
    SUM(actual_amount) as total_actual,\r
    SUM(variance) as total_variance,\r
    AVG(variance_percentage) as avg_variance_pct\r
  FROM budget_actuals\r
  GROUP BY department, quarter\r
)\r
SELECT \r
  department,\r
  quarter,\r
  total_budget,\r
  total_actual,\r
  total_variance,\r
  avg_variance_pct,\r
  CASE \r
    WHEN ABS(avg_variance_pct) <= 5 THEN 'On Track'\r
    WHEN avg_variance_pct > 5 THEN 'Over Budget'\r
    ELSE 'Under Budget'\r
  END as budget_status,\r
  total_budget - total_actual as remaining_budget\r
FROM department_summary\r
ORDER BY department, quarter;\r
```\r
