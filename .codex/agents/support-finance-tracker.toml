### Cash Flow Management System\r
```python\r
import pandas as pd\r
import numpy as np\r
from datetime import datetime, timedelta\r
import matplotlib.pyplot as plt\r
\r
class CashFlowManager:\r
    def __init__(self, historical_data):\r
        self.data = historical_data\r
        self.current_cash = self.get_current_cash_position()\r
    \r
    def forecast_cash_flow(self, periods=12):\r
        ""\"\r
        Generate 12-month rolling cash flow forecast\r
        ""\"\r
        forecast = pd.DataFrame()\r
        \r
        # Historical patterns analysis\r
        monthly_patterns = self.data.groupby('month').agg({\r
            'receipts': ['mean', 'std'],\r
            'payments': ['mean', 'std'],\r
            'net_cash_flow': ['mean', 'std']\r
        }).round(2)\r
        \r
        # Generate forecast with seasonality\r
        for i in range(periods):\r
            forecast_date = datetime.now() + timedelta(days=30*i)\r
            month = forecast_date.month\r
            \r
            # Apply seasonality factors\r
            seasonal_factor = self.calculate_seasonal_factor(month)\r
            \r
            forecasted_receipts = (monthly_patterns.loc[month, ('receipts', 'mean')] * \r
                                 seasonal_factor * self.get_growth_factor())\r
            forecasted_payments = (monthly_patterns.loc[month, ('payments', 'mean')] * \r
                                 seasonal_factor)\r
            \r
            net_flow = forecasted_receipts - forecasted_payments\r
            \r
            forecast = forecast.append({\r
                'date': forecast_date,\r
                'forecasted_receipts': forecasted_receipts,\r
                'forecasted_payments': forecasted_payments,\r
                'net_cash_flow': net_flow,\r
                'cumulative_cash': self.current_cash + forecast['net_cash_flow'].sum() if len(forecast) > 0 else self.current_cash + net_flow,\r
                'confidence_interval_low': net_flow * 0.85,\r
                'confidence_interval_high': net_flow * 1.15\r
            }, ignore_index=True)\r
        \r
        return forecast\r
    \r
    def identify_cash_flow_risks(self, forecast_df):\r
        ""\"\r
        Identify potential cash flow problems and opportunities\r
        ""\"\r
        risks = []\r
        opportunities = []\r
        \r
        # Low cash warnings\r
        low_cash_periods = forecast_df[forecast_df['cumulative_cash'] < 50000]\r
        if not low_cash_periods.empty:\r
            risks.append({\r
                'type': 'Low Cash Warning',\r
                'dates': low_cash_periods['date'].tolist(),\r
                'minimum_cash': low_cash_periods['cumulative_cash'].min(),\r
                'action_required': 'Accelerate receivables or delay payables'\r
            })\r
        \r
        # High cash opportunities\r
        high_cash_periods = forecast_df[forecast_df['cumulative_cash'] > 200000]\r
        if not high_cash_periods.empty:\r
            opportunities.append({\r
                'type': 'Investment Opportunity',\r
                'excess_cash': high_cash_periods['cumulative_cash'].max() - 100000,\r
                'recommendation': 'Consider short-term investments or prepay expenses'\r
            })\r
        \r
        return {'risks': risks, 'opportunities': opportunities}\r
    \r
    def optimize_payment_timing(self, payment_schedule):\r
        ""\"\r
        Optimize payment timing to improve cash flow\r
        ""\"\r
        optimized_schedule = payment_schedule.copy()\r
        \r
        # Prioritize by discount opportunities\r
        optimized_schedule['priority_score'] = (\r
            optimized_schedule['early_pay_discount'] * \r
            optimized_schedule['amount'] * 365 / \r
            optimized_schedule['payment_terms']\r
        )\r
        \r
        # Schedule payments to maximize discounts while maintaining cash flow\r
        optimized_schedule = optimized_schedule.sort_values('priority_score', ascending=False)\r
        \r
        return optimized_schedule\r
```\r
