### Infrastructure as Code Framework\r
```terraform\r
# AWS Infrastructure Configuration\r
terraform {\r
  required_version = ">= 1.0"\r
  backend "s3" {\r
    bucket = "company-terraform-state"\r
    key    = "infrastructure/terraform.tfstate"\r
    region = "us-west-2"\r
    encrypt = true\r
    dynamodb_table = "terraform-locks"\r
  }\r
}\r
\r
# Network Infrastructure\r
resource "aws_vpc" "main" {\r
  cidr_block           = "10.0.0.0/16"\r
  enable_dns_hostnames = true\r
  enable_dns_support   = true\r
  \r
  tags = {\r
    Name        = "main-vpc"\r
    Environment = var.environment\r
    Owner       = "infrastructure-team"\r
  }\r
}\r
\r
resource "aws_subnet" "private" {\r
  count             = length(var.availability_zones)\r
  vpc_id            = aws_vpc.main.id\r
  cidr_block        = "10.0.${count.index + 1}.0/24"\r
  availability_zone = var.availability_zones[count.index]\r
  \r
  tags = {\r
    Name = "private-subnet-${count.index + 1}"\r
    Type = "private"\r
  }\r
}\r
\r
resource "aws_subnet" "public" {\r
  count                   = length(var.availability_zones)\r
  vpc_id                  = aws_vpc.main.id\r
  cidr_block              = "10.0.${count.index + 10}.0/24"\r
  availability_zone       = var.availability_zones[count.index]\r
  map_public_ip_on_launch = true\r
  \r
  tags = {\r
    Name = "public-subnet-${count.index + 1}"\r
    Type = "public"\r
  }\r
}\r
\r
# Auto Scaling Infrastructure\r
resource "aws_launch_template" "app" {\r
  name_prefix   = "app-template-"\r
  image_id      = data.aws_ami.app.id\r
  instance_type = var.instance_type\r
  \r
  vpc_security_group_ids = [aws_security_group.app.id]\r
  \r
  user_data = base64encode(templatefile("${path.module}/user_data.sh", {\r
    app_environment = var.environment\r
  }))\r
  \r
  tag_specifications {\r
    resource_type = "instance"\r
    tags = {\r
      Name        = "app-server"\r
      Environment = var.environment\r
    }\r
  }\r
  \r
  lifecycle {\r
    create_before_destroy = true\r
  }\r
}\r
\r
resource "aws_autoscaling_group" "app" {\r
  name                = "app-asg"\r
  vpc_zone_identifier = aws_subnet.private[*].id\r
  target_group_arns   = [aws_lb_target_group.app.arn]\r
  health_check_type   = "ELB"\r
  \r
  min_size         = var.min_servers\r
  max_size         = var.max_servers\r
  desired_capacity = var.desired_servers\r
  \r
  launch_template {\r
    id      = aws_launch_template.app.id\r
    version = "$Latest"\r
  }\r
  \r
  # Auto Scaling Policies\r
  tag {\r
    key                 = "Name"\r
    value               = "app-asg"\r
    propagate_at_launch = false\r
  }\r
}\r
\r
# Database Infrastructure\r
resource "aws_db_subnet_group" "main" {\r
  name       = "main-db-subnet-group"\r
  subnet_ids = aws_subnet.private[*].id\r
  \r
  tags = {\r
    Name = "Main DB subnet group"\r
  }\r
}\r
\r
resource "aws_db_instance" "main" {\r
  allocated_storage      = var.db_allocated_storage\r
  max_allocated_storage  = var.db_max_allocated_storage\r
  storage_type          = "gp2"\r
  storage_encrypted     = true\r
  \r
  engine         = "postgres"\r
  engine_version = "13.7"\r
  instance_class = var.db_instance_class\r
  \r
  db_name  = var.db_name\r
  username = var.db_username\r
  password = var.db_password\r
  \r
  vpc_security_group_ids = [aws_security_group.db.id]\r
  db_subnet_group_name   = aws_db_subnet_group.main.name\r
  \r
  backup_retention_period = 7\r
  backup_window          = "03:00-04:00"\r
  maintenance_window     = "Sun:04:00-Sun:05:00"\r
  \r
  skip_final_snapshot = false\r
  final_snapshot_identifier = "main-db-final-snapshot-${formatdate("YYYY-MM-DD-hhmm", timestamp())}"\r
  \r
  performance_insights_enabled = true\r
  monitoring_interval         = 60\r
  monitoring_role_arn        = aws_iam_role.rds_monitoring.arn\r
  \r
  tags = {\r
    Name        = "main-database"\r
    Environment = var.environment\r
  }\r
}\r
```\r
