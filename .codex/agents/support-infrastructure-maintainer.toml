### Automated Backup and Recovery System\r
```bash\r
#!/bin/bash\r
# Comprehensive Backup and Recovery Script\r
\r
set -euo pipefail\r
\r
# Configuration\r
BACKUP_ROOT="/backups"\r
LOG_FILE="/var/log/backup.log"\r
RETENTION_DAYS=30\r
ENCRYPTION_KEY="/etc/backup/backup.key"\r
S3_BUCKET="company-backups"\r
# IMPORTANT: This is a template example. Replace with your actual webhook URL before use.\r
# Never commit real webhook URLs to version control.\r
NOTIFICATION_WEBHOOK="${SLACK_WEBHOOK_URL:?Set SLACK_WEBHOOK_URL environment variable}"\r
\r
# Logging function\r
log() {\r
    echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"\r
}\r
\r
# Error handling\r
handle_error() {\r
    local error_message="$1"\r
    log "ERROR: $error_message"\r
    \r
    # Send notification\r
    curl -X POST -H 'Content-type: application/json' \\\r
        --data "{\\"text\\":\\"🚨 Backup Failed: $error_message\\"}" \\\r
        "$NOTIFICATION_WEBHOOK"\r
    \r
    exit 1\r
}\r
\r
# Database backup function\r
backup_database() {\r
    local db_name="$1"\r
    local backup_file="${BACKUP_ROOT}/db/${db_name}_$(date +%Y%m%d_%H%M%S).sql.gz"\r
    \r
    log "Starting database backup for $db_name"\r
    \r
    # Create backup directory\r
    mkdir -p "$(dirname "$backup_file")"\r
    \r
    # Create database dump\r
    if ! pg_dump -h "$DB_HOST" -U "$DB_USER" -d "$db_name" | gzip > "$backup_file"; then\r
        handle_error "Database backup failed for $db_name"\r
    fi\r
    \r
    # Encrypt backup\r
    if ! gpg --cipher-algo AES256 --compress-algo 1 --s2k-mode 3 \\\r
             --s2k-digest-algo SHA512 --s2k-count 65536 --symmetric \\\r
             --passphrase-file "$ENCRYPTION_KEY" "$backup_file"; then\r
        handle_error "Database backup encryption failed for $db_name"\r
    fi\r
    \r
    # Remove unencrypted file\r
    rm "$backup_file"\r
    \r
    log "Database backup completed for $db_name"\r
    return 0\r
}\r
\r
# File system backup function\r
backup_files() {\r
    local source_dir="$1"\r
    local backup_name="$2"\r
    local backup_file="${BACKUP_ROOT}/files/${backup_name}_$(date +%Y%m%d_%H%M%S).tar.gz.gpg"\r
    \r
    log "Starting file backup for $source_dir"\r
    \r
    # Create backup directory\r
    mkdir -p "$(dirname "$backup_file")"\r
    \r
    # Create compressed archive and encrypt\r
    if ! tar -czf - -C "$source_dir" . | \\\r
         gpg --cipher-algo AES256 --compress-algo 0 --s2k-mode 3 \\\r
             --s2k-digest-algo SHA512 --s2k-count 65536 --symmetric \\\r
             --passphrase-file "$ENCRYPTION_KEY" \\\r
             --output "$backup_file"; then\r
        handle_error "File backup failed for $source_dir"\r
    fi\r
    \r
    log "File backup completed for $source_dir"\r
    return 0\r
}\r
\r
# Upload to S3\r
upload_to_s3() {\r
    local local_file="$1"\r
    local s3_path="$2"\r
    \r
    log "Uploading $local_file to S3"\r
    \r
    if ! aws s3 cp "$local_file" "s3://$S3_BUCKET/$s3_path" \\\r
         --storage-class STANDARD_IA \\\r
         --metadata "backup-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; then\r
        handle_error "S3 upload failed for $local_file"\r
    fi\r
    \r
    log "S3 upload completed for $local_file"\r
}\r
\r
# Cleanup old backups\r
cleanup_old_backups() {\r
    log "Starting cleanup of backups older than $RETENTION_DAYS days"\r
    \r
    # Local cleanup\r
    find "$BACKUP_ROOT" -name "*.gpg" -mtime +$RETENTION_DAYS -delete\r
    \r
    # S3 cleanup (lifecycle policy should handle this, but double-check)\r
    aws s3api list-objects-v2 --bucket "$S3_BUCKET" \\\r
        --query "Contents[?LastModified<='$(date -d "$RETENTION_DAYS days ago" -u +%Y-%m-%dT%H:%M:%SZ)'].Key" \\\r
        --output text | xargs -r -n1 aws s3 rm "s3://$S3_BUCKET/"\r
    \r
    log "Cleanup completed"\r
}\r
\r
# Verify backup integrity\r
verify_backup() {\r
    local backup_file="$1"\r
    \r
    log "Verifying backup integrity for $backup_file"\r
    \r
    if ! gpg --quiet --batch --passphrase-file "$ENCRYPTION_KEY" \\\r
             --decrypt "$backup_file" > /dev/null 2>&1; then\r
        handle_error "Backup integrity check failed for $backup_file"\r
    fi\r
    \r
    log "Backup integrity verified for $backup_file"\r
}\r
\r
# Main backup execution\r
main() {\r
    log "Starting backup process"\r
    \r
    # Database backups\r
    backup_database "production"\r
    backup_database "analytics"\r
    \r
    # File system backups\r
    backup_files "/var/www/uploads" "uploads"\r
    backup_files "/etc" "system-config"\r
    backup_files "/var/log" "system-logs"\r
    \r
    # Upload all new backups to S3\r
    find "$BACKUP_ROOT" -name "*.gpg" -mtime -1 | while read -r backup_file; do\r
        relative_path=$(echo "$backup_file" | sed "s|$BACKUP_ROOT/||")\r
        upload_to_s3 "$backup_file" "$relative_path"\r
        verify_backup "$backup_file"\r
    done\r
    \r
    # Cleanup old backups\r
    cleanup_old_backups\r
    \r
    # Send success notification\r
    curl -X POST -H 'Content-type: application/json' \\\r
        --data "{\\"text\\":\\"✅ Backup completed successfully\\"}" \\\r
        "$NOTIFICATION_WEBHOOK"\r
    \r
    log "Backup process completed successfully"\r
}\r
\r
# Execute main function\r
main "$@"\r
```\r
