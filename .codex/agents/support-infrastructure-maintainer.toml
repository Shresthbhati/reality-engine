### Comprehensive Monitoring System\r
```yaml\r
# Prometheus Monitoring Configuration\r
global:\r
  scrape_interval: 15s\r
  evaluation_interval: 15s\r
\r
rule_files:\r
  - "infrastructure_alerts.yml"\r
  - "application_alerts.yml"\r
  - "business_metrics.yml"\r
\r
scrape_configs:\r
  # Infrastructure monitoring\r
  - job_name: 'infrastructure'\r
    static_configs:\r
      - targets: ['localhost:9100']  # Node Exporter\r
    scrape_interval: 30s\r
    metrics_path: /metrics\r
    \r
  # Application monitoring\r
  - job_name: 'application'\r
    static_configs:\r
      - targets: ['app:8080']\r
    scrape_interval: 15s\r
    \r
  # Database monitoring\r
  - job_name: 'database'\r
    static_configs:\r
      - targets: ['db:9104']  # PostgreSQL Exporter\r
    scrape_interval: 30s\r
\r
# Critical Infrastructure Alerts\r
alerting:\r
  alertmanagers:\r
    - static_configs:\r
        - targets:\r
          - alertmanager:9093\r
\r
# Infrastructure Alert Rules\r
groups:\r
  - name: infrastructure.rules\r
    rules:\r
      - alert: HighCPUUsage\r
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80\r
        for: 5m\r
        labels:\r
          severity: warning\r
        annotations:\r
          summary: "High CPU usage detected"\r
          description: "CPU usage is above 80% for 5 minutes on {{ $labels.instance }}"\r
          \r
      - alert: HighMemoryUsage\r
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90\r
        for: 5m\r
        labels:\r
          severity: critical\r
        annotations:\r
          summary: "High memory usage detected"\r
          description: "Memory usage is above 90% on {{ $labels.instance }}"\r
          \r
      - alert: DiskSpaceLow\r
        expr: 100 - ((node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes) > 85\r
        for: 2m\r
        labels:\r
          severity: warning\r
        annotations:\r
          summary: "Low disk space"\r
          description: "Disk usage is above 85% on {{ $labels.instance }}"\r
          \r
      - alert: ServiceDown\r
        expr: up == 0\r
        for: 1m\r
        labels:\r
          severity: critical\r
        annotations:\r
          summary: "Service is down"\r
          description: "{{ $labels.job }} has been down for more than 1 minute"\r
```\r
