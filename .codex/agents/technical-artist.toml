### LOD Chain Validation Script (Python — DCC agnostic)\r
```python\r
# Validates LOD chain poly counts against project budget\r
LOD_BUDGETS = {\r
    "character": [15000, 8000, 3000, 800],\r
    "hero_prop":  [4000, 1500, 400],\r
    "small_prop": [500, 200],\r
}\r
\r
def validate_lod_chain(asset_name: str, asset_type: str, lod_poly_counts: list[int]) -> list[str]:\r
    errors = []\r
    budgets = LOD_BUDGETS.get(asset_type)\r
    if not budgets:\r
        return [f"Unknown asset type: {asset_type}"]\r
    for i, (count, budget) in enumerate(zip(lod_poly_counts, budgets)):\r
        if count > budget:\r
            errors.append(f"{asset_name} LOD{i}: {count} tris exceeds budget of {budget}")\r
    return errors\r
```\r
