### Custom Shader — Dissolve Effect (HLSL/ShaderLab)\r
```hlsl\r
// Dissolve shader — works in Unity URP, adaptable to other pipelines\r
Shader "Custom/Dissolve"\r
{\r
    Properties\r
    {\r
        _BaseMap ("Albedo", 2D) = "white" {}\r
        _DissolveMap ("Dissolve Noise", 2D) = "white" {}\r
        _DissolveAmount ("Dissolve Amount", Range(0,1)) = 0\r
        _EdgeWidth ("Edge Width", Range(0, 0.2)) = 0.05\r
        _EdgeColor ("Edge Color", Color) = (1, 0.3, 0, 1)\r
    }\r
    SubShader\r
    {\r
        Tags { "RenderType"="TransparentCutout" "Queue"="AlphaTest" }\r
        HLSLPROGRAM\r
        // Vertex: standard transform\r
        // Fragment:\r
        float dissolveValue = tex2D(_DissolveMap, i.uv).r;\r
        clip(dissolveValue - _DissolveAmount);\r
        float edge = step(dissolveValue, _DissolveAmount + _EdgeWidth);\r
        col = lerp(col, _EdgeColor, edge);\r
        ENDHLSL\r
    }\r
}\r
```\r
