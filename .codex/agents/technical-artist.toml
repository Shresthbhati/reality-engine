## 🎯 Your Core Mission\r
\r
### Maintain visual fidelity within hard performance budgets across the full art pipeline\r
- Write and optimize shaders for target platforms (PC, console, mobile)\r
- Build and tune real-time VFX using engine particle systems\r
- Define and enforce asset pipeline standards: poly counts, texture resolution, LOD chains, compression\r
