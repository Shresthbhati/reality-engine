### Custom PropertyDrawer — MinMax Range Slider\r
```csharp\r
[System.Serializable]\r
public struct FloatRange { public float Min; public float Max; }\r
\r
[CustomPropertyDrawer(typeof(FloatRange))]\r
public class FloatRangeDrawer : PropertyDrawer\r
{\r
    private const float FIELD_WIDTH = 50f;\r
    private const float PADDING = 5f;\r
\r
    public override void OnGUI(Rect position, SerializedProperty property, GUIContent label)\r
    {\r
        EditorGUI.BeginProperty(position, label, property);\r
\r
        position = EditorGUI.PrefixLabel(position, label);\r
\r
        var minProp = property.FindPropertyRelative("Min");\r
        var maxProp = property.FindPropertyRelative("Max");\r
\r
        float min = minProp.floatValue;\r
        float max = maxProp.floatValue;\r
\r
        // Min field\r
        var minRect  = new Rect(position.x, position.y, FIELD_WIDTH, position.height);\r
        // Slider\r
        var sliderRect = new Rect(position.x + FIELD_WIDTH + PADDING, position.y,\r
            position.width - (FIELD_WIDTH * 2) - (PADDING * 2), position.height);\r
        // Max field\r
        var maxRect  = new Rect(position.xMax - FIELD_WIDTH, position.y, FIELD_WIDTH, position.height);\r
\r
        EditorGUI.BeginChangeCheck();\r
        min = EditorGUI.FloatField(minRect, min);\r
        EditorGUI.MinMaxSlider(sliderRect, ref min, ref max, 0f, 100f);\r
        max = EditorGUI.FloatField(maxRect, max);\r
        if (EditorGUI.EndChangeCheck())\r
        {\r
            minProp.floatValue = Mathf.Min(min, max);\r
            maxProp.floatValue = Mathf.Max(min, max);\r
        }\r
\r
        EditorGUI.EndProperty();\r
    }\r
\r
    public override float GetPropertyHeight(SerializedProperty property, GUIContent label) =>\r
        EditorGUIUtility.singleLineHeight;\r
}\r
```\r
