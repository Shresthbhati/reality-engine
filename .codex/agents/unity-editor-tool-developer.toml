### Build Validation — Pre-Build Checks\r
```csharp\r
public class BuildValidationProcessor : IPreprocessBuildWithReport\r
{\r
    public int callbackOrder => 0;\r
\r
    public void OnPreprocessBuild(BuildReport report)\r
    {\r
        var errors = new List<string>();\r
\r
        // Check: no uncompressed textures in Resources folder\r
        foreach (var guid in AssetDatabase.FindAssets("t:Texture2D", new[] { "Assets/Resources" }))\r
        {\r
            var path = AssetDatabase.GUIDToAssetPath(guid);\r
            var importer = AssetImporter.GetAtPath(path) as TextureImporter;\r
            if (importer?.textureCompression == TextureImporterCompression.Uncompressed)\r
                errors.Add($"Uncompressed texture in Resources: {path}");\r
        }\r
\r
        // Check: no scenes with lighting not baked\r
        foreach (var scene in EditorBuildSettings.scenes)\r
        {\r
            if (!scene.enabled) continue;\r
            // Additional scene validation checks here\r
        }\r
\r
        if (errors.Count > 0)\r
        {\r
            string errorLog = string.Join("\\n", errors);\r
            throw new BuildFailedException($"Build Validation FAILED:\\n{errorLog}");\r
        }\r
\r
        Debug.Log("[BuildValidation] All checks passed.");\r
    }\r
}\r
```\r
