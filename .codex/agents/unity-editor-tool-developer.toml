### AssetPostprocessor — Texture Import Enforcer\r
```csharp\r
public class TextureImportEnforcer : AssetPostprocessor\r
{\r
    private const int MAX_RESOLUTION = 2048;\r
    private const string NORMAL_SUFFIX = "_N";\r
    private const string UI_PATH = "Assets/UI/";\r
\r
    void OnPreprocessTexture()\r
    {\r
        var importer = (TextureImporter)assetImporter;\r
        string path = assetPath;\r
\r
        // Enforce normal map type by naming convention\r
        if (System.IO.Path.GetFileNameWithoutExtension(path).EndsWith(NORMAL_SUFFIX))\r
        {\r
            if (importer.textureType != TextureImporterType.NormalMap)\r
            {\r
                importer.textureType = TextureImporterType.NormalMap;\r
                Debug.LogWarning($"[TextureImporter] Set '{path}' to Normal Map based on '_N' suffix.");\r
            }\r
        }\r
\r
        // Enforce max resolution budget\r
        if (importer.maxTextureSize > MAX_RESOLUTION)\r
        {\r
            importer.maxTextureSize = MAX_RESOLUTION;\r
            Debug.LogWarning($"[TextureImporter] Clamped '{path}' to {MAX_RESOLUTION}px max.");\r
        }\r
\r
        // UI textures: disable mipmaps and set point filter\r
        if (path.StartsWith(UI_PATH))\r
        {\r
            importer.mipmapEnabled = false;\r
            importer.filterMode = FilterMode.Point;\r
        }\r
\r
        // Set platform-specific compression\r
        var androidSettings = importer.GetPlatformTextureSettings("Android");\r
        androidSettings.overridden = true;\r
        androidSettings.format = importer.textureType == TextureImporterType.NormalMap\r
            ? TextureImporterFormat.ASTC_4x4\r
            : TextureImporterFormat.ASTC_6x6;\r
        importer.SetPlatformTextureSettings(androidSettings);\r
    }\r
}\r
```\r
