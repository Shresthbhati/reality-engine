### Server-Authoritative Player Controller\r
```csharp\r
public class PlayerController : NetworkBehaviour\r
{\r
    [SerializeField] private float _moveSpeed = 5f;\r
    [SerializeField] private float _reconciliationThreshold = 0.5f;\r
\r
    // Server-owned authoritative position\r
    private NetworkVariable<Vector3> _serverPosition = new NetworkVariable<Vector3>(\r
        readPerm: NetworkVariableReadPermission.Everyone,\r
        writePerm: NetworkVariableWritePermission.Server);\r
\r
    private Queue<InputPayload> _inputQueue = new();\r
    private Vector3 _clientPredictedPosition;\r
\r
    public override void OnNetworkSpawn()\r
    {\r
        if (!IsOwner) return;\r
        _clientPredictedPosition = transform.position;\r
    }\r
\r
    private void Update()\r
    {\r
        if (!IsOwner) return;\r
\r
        // Read input locally\r
        var input = new Vector2(Input.GetAxisRaw("Horizontal"), Input.GetAxisRaw("Vertical")).normalized;\r
\r
        // Client prediction: move immediately\r
        _clientPredictedPosition += new Vector3(input.x, 0, input.y) * _moveSpeed * Time.deltaTime;\r
        transform.position = _clientPredictedPosition;\r
\r
        // Send input to server\r
        SendInputServerRpc(input, NetworkManager.LocalTime.Tick);\r
    }\r
\r
    [ServerRpc]\r
    private void SendInputServerRpc(Vector2 input, int tick)\r
    {\r
        // Server simulates movement from this input\r
        Vector3 newPosition = _serverPosition.Value + new Vector3(input.x, 0, input.y) * _moveSpeed * Time.fixedDeltaTime;\r
\r
        // Server validates: is this physically possible? (anti-cheat)\r
        float maxDistancePossible = _moveSpeed * Time.fixedDeltaTime * 2f; // 2x tolerance for lag\r
        if (Vector3.Distance(_serverPosition.Value, newPosition) > maxDistancePossible)\r
        {\r
            // Reject: teleport attempt or severe desync\r
            _serverPosition.Value = _serverPosition.Value; // Force reconciliation\r
            return;\r
        }\r
\r
        _serverPosition.Value = newPosition;\r
    }\r
\r
    private void LateUpdate()\r
    {\r
        if (!IsOwner) return;\r
\r
        // Reconciliation: if client is far from server, snap back\r
        if (Vector3.Distance(transform.position, _serverPosition.Value) > _reconciliationThreshold)\r
        {\r
            _clientPredictedPosition = _serverPosition.Value;\r
            transform.position = _clientPredictedPosition;\r
        }\r
    }\r
}\r
```\r
