### Lobby + Matchmaking Integration\r
```csharp\r
public class LobbyManager : MonoBehaviour\r
{\r
    private Lobby _currentLobby;\r
    private const string KEY_MAP = "SelectedMap";\r
    private const string KEY_GAME_MODE = "GameMode";\r
\r
    public async Task<Lobby> CreateLobby(string lobbyName, int maxPlayers, string mapName)\r
    {\r
        var options = new CreateLobbyOptions\r
        {\r
            IsPrivate = false,\r
            Data = new Dictionary<string, DataObject>\r
            {\r
                { KEY_MAP, new DataObject(DataObject.VisibilityOptions.Public, mapName) },\r
                { KEY_GAME_MODE, new DataObject(DataObject.VisibilityOptions.Public, "Deathmatch") }\r
            }\r
        };\r
\r
        _currentLobby = await LobbyService.Instance.CreateLobbyAsync(lobbyName, maxPlayers, options);\r
        StartHeartbeat(); // Keep lobby alive\r
        return _currentLobby;\r
    }\r
\r
    public async Task<List<Lobby>> QuickMatchLobbies()\r
    {\r
        var queryOptions = new QueryLobbiesOptions\r
        {\r
            Filters = new List<QueryFilter>\r
            {\r
                new QueryFilter(QueryFilter.FieldOptions.AvailableSlots, "1", QueryFilter.OpOptions.GE)\r
            },\r
            Order = new List<QueryOrder>\r
            {\r
                new QueryOrder(false, QueryOrder.FieldOptions.Created)\r
            }\r
        };\r
        var response = await LobbyService.Instance.QueryLobbiesAsync(queryOptions);\r
        return response.Results;\r
    }\r
\r
    private async void StartHeartbeat()\r
    {\r
        while (_currentLobby != null)\r
        {\r
            await LobbyService.Instance.SendHeartbeatPingAsync(_currentLobby.Id);\r
            await Task.Delay(15000); // Every 15 seconds — Lobby times out at 30s\r
        }\r
    }\r
}\r
```\r
