### NetworkVariable Design Reference\r
```csharp\r
// State that persists and syncs to all clients on join → NetworkVariable\r
public NetworkVariable<int> PlayerHealth = new(100,\r
    NetworkVariableReadPermission.Everyone,\r
    NetworkVariableWritePermission.Server);\r
\r
// One-time events → ClientRpc\r
[ClientRpc]\r
public void OnHitClientRpc(Vector3 hitPoint, ClientRpcParams rpcParams = default)\r
{\r
    VFXManager.SpawnHitEffect(hitPoint);\r
}\r
\r
// Client sends action request → ServerRpc\r
[ServerRpc(RequireOwnership = true)]\r
public void RequestFireServerRpc(Vector3 aimDirection)\r
{\r
    if (!CanFire()) return; // Server validates\r
    PerformFire(aimDirection);\r
    OnFireClientRpc(aimDirection);\r
}\r
\r
// Avoid: setting NetworkVariable every frame\r
private void Update()\r
{\r
    // BAD: generates network traffic every frame\r
    // Position.Value = transform.position;\r
\r
    // GOOD: use NetworkTransform component or custom prediction instead\r
}\r
```\r
