\r
### Optimized Tick Architecture\r
```cpp\r
// ❌ AVOID: Blueprint tick for per-frame logic\r
// ✅ CORRECT: C++ tick with configurable rate\r
\r
AMyEnemy::AMyEnemy()\r
{\r
    PrimaryActorTick.bCanEverTick = true;\r
    PrimaryActorTick.TickInterval = 0.05f; // 20Hz max for AI, not 60+\r
}\r
\r
void AMyEnemy::Tick(float DeltaTime)\r
{\r
    Super::Tick(DeltaTime);\r
    // All per-frame logic in C++ only\r
    UpdateMovementPrediction(DeltaTime);\r
}\r
\r
// Use timers for low-frequency logic\r
void AMyEnemy::BeginPlay()\r
{\r
    Super::BeginPlay();\r
    GetWorldTimerManager().SetTimer(\r
        SightCheckTimer, this, &AMyEnemy::CheckLineOfSight, 0.2f, true);\r
}\r
```\r
\r
### Nanite Static Mesh Setup (Editor Validation)\r
```cpp\r
// Editor utility to validate Nanite compatibility\r
#if WITH_EDITOR\r
void UMyAssetValidator::ValidateNaniteCompatibility(UStaticMesh* Mesh)\r
{\r
    if (!Mesh) return;\r
\r
    // Nanite incompatibility checks\r
    if (Mesh->bSupportRayTracing && !Mesh->IsNaniteEnabled())\r
    {\r
        UE_LOG(LogMyGame, Warning, TEXT("Mesh %s: Enable Nanite for ray tracing efficiency"),\r
            *Mesh->GetName());\r
    }\r
\r
    // Log instance budget reminder for large meshes\r
    UE_LOG(LogMyGame, Log, TEXT("Nanite instance budget: 16M total scene limit. "\r
        "Current mesh: %s — plan foliage density accordingly."), *Mesh->GetName());\r
}\r
#endif\r
```\r
\r
### Smart Pointer Patterns\r
```cpp\r
// Non-UObject heap allocation — use TSharedPtr\r
TSharedPtr<FMyNonUObjectData> DataCache;\r
\r
// Non-owning UObject reference — use TWeakObjectPtr\r
TWeakObjectPtr<APlayerController> CachedController;\r
\r
// Accessing weak pointer safely\r
void AMyActor::UseController()\r
{\r
    if (CachedController.IsValid())\r
    {\r
        CachedController->ClientPlayForceFeedback(...);\r
    }\r
}\r
\r
// Checking UObject validity — always use IsValid()\r
void AMyActor::TryActivate(UMyComponent* Component)\r
{\r
    if (!IsValid(Component)) return;  // Handles null AND pending-kill\r
    Component->Activate();\r
}\r
```\r
