```\r
\r
### Landscape Material Architecture\r
```\r
Landscape Master Material: M_Landscape_Master\r
\r
Layer Stack (max 4 per blended region):\r
  Layer 0: Grass (base — always present, fills empty regions)\r
  Layer 1: Dirt/Path (replaces grass along worn paths)\r
  Layer 2: Rock (driven by slope angle — auto-blend > 35°)\r
  Layer 3: Snow (driven by height — above 800m world units)\r
\r
Blending Method: Runtime Virtual Texture (RVT)\r
  RVT Resolution: 2048×2048 per 4096m² grid cell\r
  RVT Format: YCoCg compressed (saves memory vs. RGBA)\r
\r
Auto-Slope Rock Blend:\r
  WorldAlignedBlend node:\r
    Input: Slope threshold = 0.6 (dot product of world up vs. surface normal)\r
    Above threshold: Rock layer at full strength\r
    Below threshold: Grass/Dirt gradient\r
\r
Auto-Height Snow Blend:\r
  Absolute World Position Z > [SnowLine parameter] → Snow layer fade in\r
  Blend range: 200 units above SnowLine for smooth transition\r
\r
Runtime Virtual Texture Output Volumes:\r
  Placed every 4096m² grid cell aligned to landscape components\r
  Virtual Texture Producer on Landscape: enabled\r
```\r
\r
### HLOD Layer Configuration\r
```markdown\r
## HLOD Layer: [Level Name] — HLOD0\r
\r
**Method**: Mesh Merge (fastest build, acceptable quality for > 500m)\r
**LOD Screen Size Threshold**: 0.01\r
**Draw Distance**: 50,000 cm (500m)\r
**Material Baking**: Enabled — 1024×1024 baked texture\r
\r
**Included Actor Types**:\r
- All StaticMeshActor in zone\r
- Exclusion: Nanite-enabled meshes (Nanite handles its own LOD)\r
- Exclusion: Skeletal meshes (HLOD does not support skeletal)\r
\r
**Build Settings**:\r
- Merge distance: 50cm (welds nearby geometry)\r
- Hard angle threshold: 80° (preserves sharp edges)\r
- Target triangle count: 5000 per HLOD mesh\r
\r
**Rebuild Trigger**: Any geometry addition or removal in HLOD coverage area\r
**Visual Validation**: Required at 600m, 1000m, and 2000m camera distances before milestone\r
```\r
\r
### PCG Forest Population Graph\r
```\r
PCG Graph: G_ForestPopulation\r
\r
Step 1: Surface Sampler\r
  Input: World Partition Surface\r
  Point density: 0.5 per 10m²\r
  Normal filter: angle from up < 25° (no steep slopes)\r
\r
Step 2: Attribute Filter — Biome Mask\r
  Sample biome density texture at world XY\r
  Density remap: biome mask value 0.0–1.0 → point keep probability\r
\r
Step 3: Exclusion\r
  Road spline buffer: 8m — remove points within road corridor\r
  Path spline buffer: 4m\r
  Water body: 2m from shoreline\r
  Hand-placed structure: 15m sphere exclusion\r
\r
Step 4: Poisson Disk Distribution\r
  Min separation: 3.0m — prevents unnatural clustering\r
\r
Step 5: Randomization\r
  Rotation: random Yaw 0–360°, Pitch ±2°, Roll ±2°\r
  Scale: Uniform(0.85, 1.25) per axis independently\r
\r
Step 6: Weighted Mesh Assignment\r
  40%: Oak_LOD0 (Nanite enabled)\r
  30%: Pine_LOD0 (Nanite enabled)\r
  20%: Birch_LOD0 (Nanite enabled)\r
  10%: DeadTree_LOD0 (non-Nanite — manual LOD chain)\r
\r
Step 7: Culling\r
  Cull distance: 80,000 cm (Nanite meshes — Nanite handles geometry detail)\r
  Cull distance: 30,000 cm (non-Nanite dead trees)\r
\r
Exposed Graph Parameters:\r
  - GlobalDensityMultiplier: 0.0–2.0 (designer tuning knob)\r
  - MinForestSeparation: 1.0–8.0m\r
  - RoadExclusionEnabled: bool\r
```\r
