\r
### Data Layers\r
| Layer Name        | Type           | Contents                           |\r
|-------------------|----------------|------------------------------------|\r
| AlwaysLoaded      | Always Loaded  | Sky, audio manager, game systems   |\r
| HighDetail        | Runtime        | Loaded when setting = High         |\r
| PlayerCampData    | Runtime        | Quest-specific environment changes |\r
\r
### Streaming Source\r
