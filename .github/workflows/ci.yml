name: CI

on:
  push:
    branches: ["main", "agent/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"   # nightly: slow tests only (job `slow`)
  workflow_dispatch:

jobs:
  core:
    name: Core Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── Install ────────────────────────────────────────────────────────────
      - name: Install package (editable)
        run: pip install -e ".[dev]"

      # ── Package check ──────────────────────────────────────────────────────
      - name: Verify console script is on PATH
        run: reality --help

      - name: Verify all 13 packages are importable
        run: |
          python -c "
          import engine, world_ir, provenance, events, evidence
          import reconstruction, perception, exporters, sdk, apps
          import uncertainty, worldstore, registration, trajectories
          print('All packages importable OK')
          "

      # ── Core tests ─────────────────────────────────────────────────────────
      - name: Run core test suite
        run: |
          pytest \
            tests/test_cli_vertical_slice.py \
            tests/test_vertical_slice_modules.py \
            tests/test_cli.py \
            tests/test_cli_compile.py \
            tests/test_evidence_session.py \
            tests/test_evidence_packages.py \
            tests/test_track_backend.py \
            tests/test_entity.py \
            tests/test_world_ir.py \
            tests/test_evidence_promote.py \
            tests/test_perception_interfaces.py \
            tests/test_mapping_spine_perception.py \
            tests/test_dense_pipeline.py \
            tests/test_dense_ingest.py \
            tests/test_dense_fusion_multisource.py \
            tests/test_calibration_transforms.py \
            tests/test_registration.py \
            tests/test_trajectory.py \
            tests/test_gltf_exporter.py \
            tests/test_blender_exporter.py \
            tests/test_usd_exporter.py \
            tests/test_export_reports.py \
            tests/test_export_pipeline_e2e.py \
            tests/test_world_store.py \
            tests/test_golden_path_api_to_glb.py \
            tests/test_edit_preservation_reprocess.py \
            tests/test_client_share_link.py \
            tests/test_design_options_finish_layer.py \
            tests/test_camera_views_and_renders.py \
            tests/test_usage_metering.py \
            tests/test_observability_job_logs.py \
            tests/test_furniture_commands_and_undo.py \
            tests/test_security_dast.py \
            tests/test_account_lifecycle.py \
            tests/test_s3_artifact_store.py \
            tests/test_durable_job_queue.py \
            tests/test_closed_windows.py \
            tests/scenarios/test_scenarios.py \
            tests/test_wall_fixtures_and_elevations.py \
            tests/test_non_rectangular_rooms.py \
            tests/test_surface_finishes.py \
            tests/test_measured_room_accuracy_report.py \
            tests/test_accuracy_report_adversarial.py \
            tests/test_world_accuracy_report.py \
            tests/test_ground_truth_schema.py \
            tests/test_run_measured_room_cli.py \
            tests/test_world_adoption_api.py \
            tests/test_task_13_2_dedup_and_session_grouping.py \
            tests/test_task_13_3_extended_ingestion.py \
            tests/test_multisheet_floorplan_pdf.py \
            tests/test_temporal_delta.py \
            tests/test_mep_topology.py \
            tests/test_refine_world_api.py \
            tests/test_backup_restore.py \
            tests/test_backup_durability.py \
            tests/test_backup_lifecycle.py \
            tests/test_job_lease_recovery.py \
            tests/test_real_specialist_executors.py \
            tests/test_ifc_roundtrip.py \
            tests/test_robust_depth_fusion.py \
            tests/test_room_mesh.py \
            tests/test_trajectory_interpolation.py \
            tests/test_activity_ownership.py \
            tests/test_token_hardening.py \
            tests/test_tenant_adversarial.py \
            tests/test_release_claims.py \
            tests/test_adoption_transaction.py \
            tests/test_stage_runner.py \
            tests/test_auth_hardening.py \
            tests/test_audit_security_gates.py \
            tests/test_model_licence_gate.py \
            tests/test_refinement_loop_b16.py \
            tests/test_material_takeoff_boq.py \
            tests/test_life_safety_compliance.py \
            tests/test_thermal_envelope_ashrae.py \
            tests/test_no_fake_backend_in_production.py \
            tests/test_clash_detection_bcf.py \
            tests/test_collab_telepresence.py \
            tests/test_section_elevation_drawings.py \
            tests/test_adversarial_security.py \
            tests/test_b03_unified_ontology.py \
            tests/test_support_planes.py \
            tests/test_world_compiler.py \
            tests/test_stage_artifacts.py \
            tests/test_stage_resume.py \
            tests/test_stage_checkpoints.py \
            tests/test_measured_room_dataset.py \
            tests/test_multiview_room_association.py \
            tests/test_multiview_finegrained_identity.py \
            tests/test_measurement_fusion.py \
            tests/test_robust_fusion_cycle3.py \
            tests/test_specialist_refinement_engines.py \
            tests/test_architectural_geometry_cycle3.py \
            tests/test_ifc_interoperability_cycle3.py \
            tests/test_vram_rtx4050_profile.py \
            tests/test_relations.py \
            tests/test_query_find.py \
            -v --tb=short

      # ── Broad test collection (no physics) ────────────────────────────────
      - name: Verify no collection errors in core suite
        run: pytest tests/ --collect-only -q 2>&1 | tail -20

      # ── Wheel build ────────────────────────────────────────────────────────
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Verify wheel top-level packages
        run: |
          python - <<'EOF'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("ERROR: No wheel found", file=sys.stderr); sys.exit(1)
          w = wheels[0]
          with zipfile.ZipFile(w) as z:
              names = {n.split("/")[0] for n in z.namelist() if not n.endswith(".dist-info/")}
          print(f"Wheel packages: {sorted(names)}")
          required = {"engine", "world_ir", "provenance", "events", "evidence",
                      "reconstruction", "perception", "exporters", "sdk", "apps",
                      "uncertainty", "worldstore", "registration", "trajectories"}
          missing = required - names
          if missing:
              print(f"ERROR: Missing packages in wheel: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"All {len(required)} required packages present in wheel ✓")
          EOF

      # ── CLI smoke test ─────────────────────────────────────────────────────
      - name: CLI smoke test (end-to-end ingest → compile → viewer)
        run: |
          # Run the vertical slice test which exercises the full CLI path
          pytest tests/test_cli_vertical_slice.py -v --tb=short

  # The core job above runs a hand-kept allowlist on three Python versions. THIS job runs EVERY test file (sharded), so a
  # test cannot be left out of CI by omission (tests/test_ci_full_coverage.py guards the workflow and the shard script).
  # `slow` tests run in the scheduled job below. Skips are reported and budgeted: a skipped test verifies nothing.
  full:
    name: Full Suite (shard ${{ matrix.shard }}/8)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package (editable)
        run: pip install -e ".[dev]"
      - name: Run this shard (every test file in it, slow tests excluded)
        run: |
          python scripts/ci_shard_tests.py --shard ${{ matrix.shard }} --of 8 > shard_files.txt
          echo "shard ${{ matrix.shard }}: $(wc -l < shard_files.txt) test files"
          pytest $(cat shard_files.txt) -m "not slow" -ra --tb=short --junitxml=junit.xml
      - name: Skip report (skips are not passes)
        if: always()
        run: python scripts/ci_skip_report.py junit.xml --max-skip-share 0.30

  fidelity-gate:
    name: Room Fidelity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      # F9: a change that makes the measured room worse fails CI. The baseline is the committed, reproducible
      # scorecard from the synthetic fixture (docs/reconstruction/ROOM_FIDELITY_BASELINE.md).
      - name: Fidelity scorecard regression gate
        run: |
          python scripts/room_fidelity_report.py \
            --baseline docs/reconstruction/room_fidelity_baseline.json \
            --fail-on-regression
      - name: Fidelity and dimension contract tests
        run: |
          pytest tests/test_room_fidelity_report.py tests/test_room_fidelity_fixture.py \
            tests/test_room_layout.py tests/test_dimension_state.py tests/test_scale_suggestion.py \
            tests/test_corrections.py tests/test_floorplan_export.py tests/test_room_surfaces.py \
            -q --tb=short

  lint:
    name: Lint & Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install lint tools
        run: pip install ruff mypy
      - name: Static analysis gate (controlled baseline, zero-exit removed)
        run: python scripts/ci_static_analysis_gate.py --fail-on-regression

  security:
    name: Security & Secret Scan (RE-SEC-000009)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (lint, typecheck, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Contract tests (view-model logic + sessions proxy)
        run: npm run test:contract
      - name: Build
        run: npm run build

  # Nightly only; never blocks PRs (not triggered by push/pull_request).
  slow:
    name: Slow Tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package (editable)
        run: pip install -e ".[dev]"
      - name: Run slow tests
        run: pytest tests/ -m slow -v --tb=short
