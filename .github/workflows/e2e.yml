name: E2E

on:
  push:
    branches: ["main", "agent/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1" # playwright.config.ts: bundled chromium, build+start UI, never reuse servers
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # The API (uvicorn apps.api.main:app) comes from the dev extra (includes the api extra).
      - name: Install Python package
        working-directory: .
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the API (:8100) then the UI (:3000), waits for readiness
      # (/api/health and /), runs global-setup to seed a world, then the specs.
      - name: Run Playwright smoke suite
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results/artifacts
          retention-days: 7
