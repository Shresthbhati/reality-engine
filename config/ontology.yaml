    mobility: fixed
    min_pixels: 2000
    attach: []

  - path: architecture/door
    label: Door
    components: ["opening", "leaf", "frame"]
    parent: null
    prompts: ["door", "doorway", "interior door"]
    geometry: "parametric:door"
    mobility: fixed
    min_pixels: 1200
    typical_dims_m: {w: [0.7, 1.2], d: [0.04, 0.15], h: [1.9, 2.4]}
    attach:
      - rests_on: architecture/floor
