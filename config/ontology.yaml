# REALITY ENGINE — ENTITY ONTOLOGY (v1)
# Specification: docs/blueprint/17_ONTOLOGY.md
version: "1.0.0"

classes:
  # ---- Architecture --------------------------------------------------------
  - path: architecture/wall
    label: Wall
    attributes:
      finish: ["paint", "tile", "stone", "wood", "plaster", "exposed", "unknown"]
    components: ["architecture/skirting", "envelope/cornice"]
    parent: null
    prompts: ["wall", "interior wall"]
    geometry: plane
    mobility: fixed
    min_pixels: 2000
    attach: []

  - path: architecture/floor
    label: Floor
    attributes:
      finish: ["paint", "tile", "stone", "wood", "plaster", "exposed", "unknown"]
    parent: null
    prompts: ["floor", "flooring", "hardwood floor", "tiled floor"]
    geometry: plane
    mobility: fixed
    min_pixels: 2000
    attach: []

  - path: architecture/ceiling
    label: Ceiling
    attributes:
      finish: ["paint", "tile", "stone", "wood", "plaster", "exposed", "unknown"]
