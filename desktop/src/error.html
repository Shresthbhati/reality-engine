<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Reality Engine - could not start</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; padding: 28px; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; background: #0b0f14; color: #e6edf3; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 8px 0; color: #9fb0c0; }
  pre { background: #131a22; border: 1px solid #243040; border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-word; color: #ffb4a8; }
  code { color: #e6edf3; }
  button { font: inherit; padding: 7px 14px; margin-right: 8px; border-radius: 6px; border: 1px solid #3b4d63; background: #1a2430; color: #e6edf3; cursor: pointer; }
  button:focus-visible { outline: 2px solid #5aa9ff; outline-offset: 2px; }
</style>
</head>
<body>
<h1>Reality Engine could not start</h1>
<p>One of its local services failed to come up. Nothing was changed on your data.</p>
<pre id="msg"></pre>
<p>Logs: <code id="logs"></code></p>
<p><button id="open">Open log folder</button><button id="quit">Quit</button></p>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("msg").textContent = q.get("message") || "Unknown error";
  document.getElementById("logs").textContent = q.get("logs") || "";
  document.getElementById("open").onclick = () => window.realityError.openLogs();
  document.getElementById("quit").onclick = () => window.realityError.quit();
</script>
</body>
</html>
