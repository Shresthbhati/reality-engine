version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: reality-engine-api:latest
    container_name: reality-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - STORAGE_ROOT=/data/reality/artifacts
      - DATABASE_URL=sqlite+aiosqlite:////data/reality/reality.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LOG_LEVEL=INFO
    volumes:
      - reality_data:/data/reality
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  studio:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: reality-studio-frontend:latest
    container_name: reality-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  reality_data:
    driver: local
