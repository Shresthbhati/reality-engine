- id: S5-23
  capability: "Unified multi-engine orchestration and evidence fusion into the canonical World"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "perception/engine_orchestrator.py dispatches every registered engine through one contract: availability probes decide what runs (an unavailable engine is recorded with its own reason and never executed), VRAM is only gated when CUDA exists, dependencies are Kahn-ordered and a dependent whose dependency did not succeed is skipped with dependency_unmet, per-engine timeout/cancellation/transient-retry, and output validation (invalid_output, never success). perception/engine_matrix_bridge.py imports real engine observations into the run's Evidence Matrix (EngineObservation + EvidenceContext + RunRecord, content-keyed idempotent, no calibration claimed) and apps/api/evidence_world_stage.py runs the pass BEFORE persist_world, records multi_engine_evidence.json and puts the lineage into world.metadata so a reloaded world keeps it. EXECUTED ON REAL PHOTOGRAPHS 2026-11-25 (datasets/south_building, 32 real images, RTX 4050 6 GB): all five registered engines succeeded -- grounding_dino 18.0s/1816MB/474 obs, sam2 10.4s/1567MB/474 obs, lightglue_aliked 7.4s/1368MB/31 pairs, sift 4.6s/8MB/31 pairs, depth_anything 3.5s/313MB/32 -- 1042 observations imported, 5 run records, and a 1024-entity world persisted whose multi_engine_evidence metadata matched the lineage file in a FRESH process. A timed-out engine is now drained (or its GPU quarantined) before the next engine starts, so two engines never share the 6 GB device. Still IMPL-UNVERIFIED: no ground truth scores any engine output, and no accuracy claim is made."
  tests: ["tests/test_unified_engine_orchestration.py", "tests/test_engine_matrix_bridge.py", "tests/test_two_view_geometry.py"]
  updated: "2026-11-25"
  next: "Score the engines on labelled data (blocked: no measured rooms, see RELEASE.md); the pair-graph pose work is S5-25 (rotation-only pose graph, reference-scored), and bundle adjustment over 3D points is still missing."

- id: S5-24
  capability: "Real-image two-view geometry and multi-view camera registration report"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "scripts/run_multi_engine_real_capture.py runs the matching engines on a real capture with camera intrinsics and reports measured keypoint/matches/inlier/Sampson/relative-pose statistics per pair, a camera connectivity graph, triangle cycle consistency and reference co-visibility coverage; it refuses a dataset whose own manifest says synthetic. Measured 2026-11-25 on datasets/south_building (32 real images, 61 sequential+skip2 pairs): lightglue_aliked 61/61 pairs verified (median 385 inliers, 0.572 inlier ratio, 0.128 px Sampson), sift 58/61 (median 17 inliers, 0.443, 0.038 px), one connected camera component, no isolated cameras. Independent COLMAP run: 22/32 cameras registered, rotation error vs the shipped reference model median 0.209 deg (max 0.504) after gauge alignment, sparse model classified partial. CORRECTED 2026-11-26: the earlier '27 of 28 cycles disagree' figure was a verification defect, not degeneracy -- the cycle residual composed the rotations in the wrong order and the pair intrinsics were the reference model's 3072x2304 calibration applied to 1024x768 images (principal point outside the image). With the closure angle(R_bc R_ab R_ac^T) and per-image rescaled intrinsics plus the SIMPLE_RADIAL k1 term, pair rotations agree with the reference model to a median 0.80 deg (48/59 within 2 deg, 6 genuinely wrong pairs beyond 30 deg) and the cycle residual is median 1.26 deg with 7/28 over 5 deg. NOT claimed: metric scale (no anchor), registration accuracy as survey accuracy, or a pose graph (S5-25)."
  tests: ["tests/test_two_view_geometry.py"]
  updated: "2026-11-25"
  next: "Extend the pair strategy beyond two strides to raise reference-pair coverage (41.5% measured); the pose graph is S5-25."

- id: S5-25
  capability: "Reference-scored pairwise rotations and rotation-only pose graph"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "perception/camera_pose_graph.py parses the reference COLMAP text model, scores every measured pair rotation against it (gauge-free: a relative rotation does not depend on the world frame), and solves a pose graph over the verified pairs: maximum-weight spanning forest (Kruskal by inliers), IRLS rotation averaging on SO(3) with Huber weights and one pinned root per component, edges over 5 deg rejected with their reason and the fit redone on the accepted edges, bridge edges reported because a part hinged on a single edge is unobservable. Measured 2026-11-26 on datasets/south_building (32 real images, 59 verified pairs): pair rotation error vs reference median 0.80 deg (mean 10.53, p95 90.03), 48/59 within 2 deg, 6 beyond 30 deg; pose graph 52/59 edges accepted, residual median 0.27 deg, 1 component, 4 bridges, 30 rotation-observable cameras and 2 named unobservable (P1180308, P1180332, every incident edge a bridge); per-camera rotation error 1.77-8.81 deg (median 6.4) for the 22-camera first sequence and 167-169 deg for the 10-camera second sequence, whose only link to the first is a single bridge pair (0225-0308, 52 inliers) that the reference model says is 176 deg wrong -- unobservable, not an accuracy result. Camera centres are WITHHELD: the non-negative translation solve reports status ambiguous (one baseline pinned at zero), so reference_comparison.centre_error_model_units is unavailable and no centre accuracy is claimed. NOT claimed: camera centres, bundle adjustment over 3D points (COLMAP's is 0.209 deg median), or any registration/mapping accuracy."
  tests: ["tests/test_camera_pose_graph.py", "tests/test_two_view_geometry.py"]
  updated: "2026-11-26"
  next: "Bundle adjustment over 3D points (the measured 6.4 deg drift is the cost of skipping it); fix the translation solve (baseline at zero, direction residual 0.99 -- add cheirality/3D-point constraints instead of directions only); widen the pair strategy so the second sequence gets a verifiable cycle instead of one wrong bridge."

- id: S5-26
  capability: "Day-6 depth backends: honest units, cross-view-consistent relative depth, invalid-pixel masks, recorded skips"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "docs/audits/DAY6_DEPTH_AUDIT.md. Five depth paths exist (DepthAnythingV2Backend relative, DepthAnythingV2MetricBackend, HeuristicDepthPriorBackend, engine depth_anything adapter, depth_midas_dpt); all three referenced HF checkpoints return 200 and both used ones load. Measured on two real south_building photographs (1024x768): the relative Small model's raw output is inverse depth (0.0-6.44, median 1.74/2.15) and Metric-Indoor-Small is 4.37-19.55 m (median ~10 m) -- metres, but an in-domain estimate with no ground truth here. FIXED 2026-11-26: (1) HeuristicDepthPriorBackend no longer claims metres -- unit='relative', quantity='depth', scale_state='relative', and metricize_relative_depth raises on a depth-like relative map instead of inverting it; (2) DepthAnythingV2Backend passes the raw model values through (a regression test pins 2/4/8 staying 2/4/8) and states quantity='inverse_depth', so views are comparable; (3) DepthMap carries valid_mask with NaN holes and an invalid_pixels count (shape-validated, frozen), populated by both Depth Anything backends and carried through metricization; (4) both Depth Anything backends and the heuristic backend record backend.skipped = [{evidence_id, reason}] instead of swallowing failures, and tests cover missing, undecodable and non-image items. Still open: fixed uncalibrated confidence values, MiDaS's per-image normalisation, and no depth benchmark (no ground-truth depth in the repo). No depth accuracy is claimed."
  tests: ["tests/test_depth_anything_backend.py", "tests/test_perception_interfaces.py", "tests/test_depth_to_points.py", "tests/test_metric_depth_task4_4.py"]
  updated: "2026-11-26"
  next: "Make confidence a measured quantity or drop it; decide whether to remove MiDaS's per-image normalisation (it feeds engine/pipeline/single_image.py with an INVERSE_DEPTH_OFFSET tuned for [0,1]); build a scale-and-shift-invariant proxy benchmark from the verified SfM points (SILog/delta on log-depth, no metric truth needed) so this item can leave IMPL-UNVERIFIED."
