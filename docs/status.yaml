- id: S5-22
  capability: "RERES: bounded evidence-driven refinement (platform side)"
  status: PARTIAL
  gate: G3
  evidence: "POST /api/worlds/{id}/refine runs the B16 priority loop under a hard iteration/time budget, commits a new version only if the world changed, tenant-scoped; engines plug in via engine/quality/refinement_engines.py. The loop no longer fabricates results: kinds with no engine are reported unavailable. Verified SYNTHETIC only. No specialist engine (detector re-run, SAM) is registered, so redetect_crop and segment are unavailable; GPU-aware scheduling, cost-calibrated priors and human review are not built."
  tests: ["tests/test_refine_world_api.py", "tests/test_refinement_loop_b16.py"]
  updated: "2026-11-18"
  next: "Register real engines (Gemini-owned: detector re-run, SAM 2); calibrate priors on measured outcomes; GPU memory awareness via ModelPool."
- id: S5-23
  capability: "Unified multi-engine orchestration and evidence fusion into the canonical World"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "perception/engine_orchestrator.py dispatches every registered engine through one contract: availability probes decide what runs (an unavailable engine is recorded with its own reason and never executed), VRAM is only gated when CUDA exists, dependencies are Kahn-ordered and a dependent whose dependency did not succeed is skipped with dependency_unmet, per-engine timeout/cancellation/transient-retry, and output validation (invalid_output, never success). perception/engine_matrix_bridge.py imports real engine observations into the run's Evidence Matrix (EngineObservation + EvidenceContext + RunRecord, content-keyed idempotent, no calibration claimed) and apps/api/evidence_world_stage.py runs the pass BEFORE persist_world, records multi_engine_evidence.json and puts the lineage into world.metadata so a reloaded world keeps it. EXECUTED ON REAL PHOTOGRAPHS 2026-11-25 (datasets/south_building, 32 real images, RTX 4050 6 GB): all five registered engines succeeded -- grounding_dino 18.0s/1816MB/474 obs, sam2 10.4s/1567MB/474 obs, lightglue_aliked 7.4s/1368MB/31 pairs, sift 4.6s/8MB/31 pairs, depth_anything 3.5s/313MB/32 -- 1042 observations imported, 5 run records, and a 1024-entity world persisted whose multi_engine_evidence metadata matched the lineage file in a FRESH process. A timed-out engine is now drained (or its GPU quarantined) before the next engine starts, so two engines never share the 6 GB device. Still IMPL-UNVERIFIED: no ground truth scores any engine output, and no accuracy claim is made."
  tests: ["tests/test_unified_engine_orchestration.py", "tests/test_engine_matrix_bridge.py", "tests/test_two_view_geometry.py"]
  updated: "2026-11-25"
  next: "Score the engines on labelled data (blocked: no measured rooms, see RELEASE.md); add a pose graph / bundle adjustment over the engine pair graph, which the measured 21 deg median cycle disagreement shows is required."

- id: S5-24
  capability: "Real-image two-view geometry and multi-view camera registration report"
  status: IMPL-UNVERIFIED
  gate: G1
  evidence: "scripts/run_multi_engine_real_capture.py runs the matching engines on a real capture with camera intrinsics and reports measured keypoint/matches/inlier/Sampson/relative-pose statistics per pair, a camera connectivity graph, triangle cycle consistency and reference co-visibility coverage; it refuses a dataset whose own manifest says synthetic. Measured 2026-11-25 on datasets/south_building (32 real images, 61 sequential+skip2 pairs): lightglue_aliked 61/61 pairs verified (median 385 inliers, 0.572 inlier ratio, 0.128 px Sampson), sift 58/61 (median 17 inliers, 0.443, 0.038 px), one connected camera component, no isolated cameras. Independent COLMAP run: 22/32 cameras registered, rotation error vs the shipped reference model median 0.209 deg (max 0.504) after gauge alignment, sparse model classified partial. NOT claimed: metric scale (no anchor), registration accuracy as survey accuracy, and a pose graph -- 27 of 28 triangles disagree by more than 5 deg, so the pairwise poses are not cycle-consistent."
  tests: ["tests/test_two_view_geometry.py"]
  updated: "2026-11-25"
  next: "Estimate a pose graph / bundle adjustment over the verified pairs and measure the resulting per-camera error against the reference model; extend the pair strategy beyond two strides to raise reference-pair coverage (41.5% measured)."
