[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-engine"
version = "0.1.0"
description = "Reality Engine core: evidence -> reconstruction -> WorldIR -> WorldStore -> viewer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# The application API service (apps/api) and every test that drives it. Mirrors apps/api/requirements.txt; kept
# here so `pip install -e ".[dev]"` (what CI runs) installs it -- without aiosqlite the API / reliability suites
# are skipped wholesale by pytest.importorskip("aiosqlite"), which is a silent loss of coverage, not a pass.
api = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0",   # [asyncio] pulls in greenlet, which the async engine needs
    "aiosqlite>=0.20.0",
    "python-multipart",
    "httpx",
]
# IFC export (exporters/ifc_bridge.py) needs IfcOpenShell; without it the API answers 501 for format=ifc. Declared so a clean
# `pip install -e ".[dev]"` exercises the IFC tests instead of silently skipping them.
export = ["ifcopenshell>=0.8"]
dev = ["pytest>=7.0", "pyyaml>=6.0", "ruff>=0.4", "mypy>=1.0", "pre-commit>=3.0", "reality-engine[api]", "reality-engine[export]"]
perception = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "segment-anything>=1.0"]
# colmap is a C++ binary (colmap/colmap), not a Python package.
# The CLI expects `colmap` on PATH. No PyPI package exists.

[project.scripts]
reality = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = [
    "engine*", "world_ir*", "provenance*", "events*",
    "evidence*", "reconstruction*", "perception*", "exporters*",
    "sdk*", "apps*", "uncertainty*", "worldstore*",
    "registration*", "trajectories*", "procedural*", "synthetic*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "canonical_interior: canonical two-storey interior fixture tests",
    "golden_loop: golden evidence-to-world loop tests",
    "slow: long-running test (real-model downloads, GPU); deselect with -m 'not slow'",
    "e2e: end-to-end vertical slice test",
    "integration: integration test across real modules",
    "physics: downstream physics/simulation test (requires reality-engine-child); excluded from core CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "UP006",  # use 'type' instead of 'Type' (keep 3.9 compat annotations)
    "UP007",  # use X | Y (keep 3.9 compat union annotations)
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Core packages only — perception extras are optional
ignore_missing_imports = true
