[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-engine"
version = "0.1.0"
description = "World Compiler + Universal Physics + Destruction + Disaster + Studio UI (foundation layer)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
perception = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "segment-anything>=1.0"]
colmap = ["colmap-cli>=4.2"]

[project.scripts]
reality = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = [
    "engine*", "world_ir*", "provenance*", "events*",
    "evidence*", "reconstruction*", "perception*", "exporters*",
    "sdk*", "apps*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
